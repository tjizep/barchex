  ta.addEventListener("input", e => { ta._code.paint(); if (!ta.disabled) codeTyped(ta, e); codeRemember(ta); });
  ta.addEventListener("scroll", () => { codeScroll(ta); codeAcPlace(ta); });
  for (const ev of ["keyup", "click", "focus"]) ta.addEventListener(ev, () => { codeStatus(ta); codeRemember(ta); });
  ta.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== ta) codeAcClose(ta); }, 120));
  P.gl.addEventListener("mousedown", e => {
    const row = e.target.closest(".gl > div");
    if (!row) return;
    e.preventDefault();
    codeGoto(ta, [...P.gl.children].indexOf(row) + 1);
  });
  P.ac.addEventListener("mousedown", e => {
    const it = e.target.closest(".it");
    e.preventDefault();
    if (it) { ta._code.ac.at = +it.dataset.i; codeAcAccept(ta); }
  });
  new ResizeObserver(() => codeScroll(ta)).observe(ta);
  // Remember the height only when it is the user dragging the corner: the
  // grip belongs to the box itself (everything inside it is covered by the
  // gutter and the text), so a pointerdown aimed at the box is a drag. A
  // window resize changes the height too and must not be saved.
  P.box.addEventListener("pointerdown", e => {
    if (e.target !== P.box) return;
    const start = P.box.offsetHeight;
    window.addEventListener("pointerup", () => {
      const h = Math.round(P.box.offsetHeight);
      if (h !== start) setAppSetting("editorHeight", String(h));
    }, { once: true });
  });
  if (!ta.disabled) ta.addEventListener("keydown", e => codeKey(ta, e));
  const view = name != null && codeViews.get(name);
  const base = ta.value;
  if (view && !ta.disabled && view.base === base && view.text !== base) {
    // unsaved edits over the same stored source: put them back, undoably
    codeInsert(ta, view.text, 0, base.length);
    toast("Unsaved edits restored — Ctrl+Z goes back to the stored copy");
  }
  ta._code.base = base;
  if (view) {
    ta.setSelectionRange(Math.min(view.start, ta.value.length), Math.min(view.end, ta.value.length));
    ta.scrollTop = view.top;
  }
}

function codeRemember(ta) {
  const c = ta._code;
  if (c.name == null || c.base == null) return;
  codeViews.set(c.name, { start: ta.selectionStart, end: ta.selectionEnd, top: ta.scrollTop,
                          base: c.base, text: ta.value });
}

function codeLineOf(v, pos) {
  let line = 1;
  for (let i = v.indexOf("\n"); i >= 0 && i < pos; i = v.indexOf("\n", i + 1)) line++;
  return line;
}

function codeGutter(ta) {
  const { P } = ta._code;
  const count = ta.value.split("\n").length;
  if (count !== ta._code.lines) {
    const rows = [];
    for (let i = 1; i <= count; i++) rows.push(`<div>${i}</div>`);
    P.gl.innerHTML = rows.join("");
    P.gl.parentElement.style.minWidth = `calc(${String(count).length + 3}ch)`;
    ta._code.lines = count;
    ta._code.curRow = null;
  }
  const line = codeLineOf(ta.value, ta.selectionStart);
  const row = P.gl.children[line - 1];
  if (ta._code.curRow !== row) {
    if (ta._code.curRow) ta._code.curRow.classList.remove("cur");
    if (row) row.classList.add("cur");
    ta._code.curRow = row;
  }
  [...P.gl.querySelectorAll(".bad")].forEach(r => { r.classList.remove("bad"); r.title = ""; });
  const er = ta._code.errLine && P.gl.children[ta._code.errLine - 1];
  if (er) { er.classList.add("bad"); er.title = ta._code.errMsg; }
}

function codeScroll(ta) {
  const { P } = ta._code;
  const x = ta.scrollLeft, y = ta.scrollTop;
  const lh = parseFloat(getComputedStyle(P.box).getPropertyValue("--lh")) || 19;
  const pad = parseFloat(getComputedStyle(P.box).getPropertyValue("--pad")) || 10;
  ta._code.lh = lh; ta._code.pad = pad;
  P.hl.style.transform = `translate(${-x}px, ${-y}px)`;
  P.gl.style.transform = `translateY(${-y}px)`;
  const line = codeLineOf(ta.value, ta.selectionStart);
  P.cur.style.top = (pad + (line - 1) * lh - y) + "px";
  P.cur.hidden = document.activeElement !== ta && ta.selectionStart === 0;
  P.err.hidden = !ta._code.errLine;
  if (ta._code.errLine) P.err.style.top = (pad + (ta._code.errLine - 1) * lh - y) + "px";
}

// the status line: position, what the name at the caret is, saved or not
function codeStatus(ta) {
  const c = ta._code;
  if (!c) return;
  const v = ta.value, s = ta.selectionStart;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const line = codeLineOf(v, s);
  const col = codeCol(v.slice(sol, s)) + 1;
  const st = c.P.status;
  st.querySelector(".pos").textContent = `Ln ${line}, Col ${col}` +
    (ta.selectionEnd > s ? ` (${ta.selectionEnd - s} selected)` : "");
  const hint = st.querySelector(".hint");
  if (c.errLine) {
    hint.className = "hint bad";
    hint.textContent = `line ${c.errLine}: ${c.errMsg}`;
  } else {
    hint.className = "hint";
    const e = codeHintAt(ta);
    hint.innerHTML = e ? `<b>${luauEsc(e.sig)}</b>${e.doc ? " — " + e.doc.replace(/<(?!\/?code>)[^>]*>/g, "") : ""}` : "";
    hint.title = hint.textContent;
  }
  st.querySelector(".mod").textContent = ta.disabled ? "read only" : v !== c.saved ? "● modified" : "";
  codeGutter(ta);
  codeScroll(ta);
}

// visual column, tabs expanded to the tab width
function codeCol(text) {
  const tw = tabWidth();
  let col = 0;
  for (const ch of text) col = ch === "\t" ? col + tw - (col % tw) : col + 1;
  return col;
}

// the call the caret is inside, or the name it is on, if the API knows it
function codeHintAt(ta) {
  const v = ta.value, s = ta.selectionStart;
  if (codeInStrOrCom(v, s)) return null;
  const locals = ta._code.locals;
  // the name under the caret first: barch.store.get|
  const word = /[A-Za-z_]\w*$/.exec(v.slice(Math.max(0, s - 200), s));
  const tail = /^\w*/.exec(v.slice(s, s + 100))[0];
  if (word || tail) {
    const upto = v.slice(Math.max(0, s - 400), s) + tail;
    const e = luauEntryOf(luauChain(upto), locals);
    if (e && e.sig) return e;
  }
  // otherwise the innermost open call: barch.store.range("a", |
  let depth = 0;
  for (let i = s - 1, lim = Math.max(0, s - 2000); i >= lim; i--) {
    const c = v[i];
    if (c === ")") depth++;
    else if (c === "(") {
      if (depth === 0) {
        const e = luauEntryOf(luauChain(v.slice(Math.max(0, i - 400), i)), locals);
        return e && e.sig ? e : null;
      }
      depth--;
    }
  }
  return null;
}

// is pos inside a string or a comment? Lexes the text before it.
function codeInStrOrCom(v, pos) {
  const toks = luauLex(v.slice(0, pos));
  const last = toks[toks.length - 1];
  if (!last || last[2] !== pos) return false;
  if (last[0] === "com" || last[0] === "hot") return !/\n$/.test(v.slice(last[1], pos));
  if (last[0] !== "str") return false;
  const t = v.slice(last[1], pos);
  // a closed short string ends at its quote; the caret after it is outside
  if (/^["'`]/.test(t)) return t.length < 2 || t[t.length - 1] !== t[0] || t[t.length - 2] === "\\";
  return !/\]=*\]$/.test(t);
}

// Replace [start, end) with text through the browser's own editing, so undo
// keeps it. setRangeText is the fallback where insertText is not supported.
function codeInsert(ta, text, start, end) {
  // execCommand edits whatever has focus, and only an edit it makes is undoable
  if (document.activeElement !== ta) ta.focus({ preventScroll: true });
  if (start != null) ta.setSelectionRange(start, end ?? start);
  ta._code.quiet = true;
  let done = false;
  // an empty insertText is not a reliable delete everywhere; "delete" is
  try { done = text ? document.execCommand("insertText", false, text)
                    : ta.selectionStart === ta.selectionEnd || document.execCommand("delete"); } catch (e) {}
  if (!done) {
    ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end");
    ta.dispatchEvent(new Event("input"));
  }
  ta._code.quiet = false;
}

// ---- keys ----

function codeKey(ta, e) {
  const c = ta._code, mod = e.ctrlKey || e.metaKey;
  if (c.ac) {
    const n = c.ac.items.length;
    if (e.key === "ArrowDown") { e.preventDefault(); c.ac.at = (c.ac.at + 1) % n; codeAcDraw(ta); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); c.ac.at = (c.ac.at - 1 + n) % n; codeAcDraw(ta); return; }
    if (e.key === "PageDown") { e.preventDefault(); c.ac.at = Math.min(n - 1, c.ac.at + 8); codeAcDraw(ta); return; }
    if (e.key === "PageUp") { e.preventDefault(); c.ac.at = Math.max(0, c.ac.at - 8); codeAcDraw(ta); return; }
    if ((e.key === "Enter" && !mod) || e.key === "Tab") { e.preventDefault(); codeAcAccept(ta); return; }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); codeAcClose(ta); return; }
  }
  if (e.key === "Escape") {
    // one Esc leaves the editor, the next closes the dialog; never both at once
    e.stopPropagation();
    ta.blur();
    return;
  }
  if (mod && (e.key === " " || e.code === "Space")) { e.preventDefault(); codeAcOpen(ta, true); return; }
  if (e.key === "Tab" && !mod && !e.altKey) { e.preventDefault(); insertFunctionTab(ta, e.shiftKey); return; }
  if (e.key === "Backspace" && !mod && !e.altKey && !e.shiftKey && codeBackIndent(ta)) { e.preventDefault(); return; }
  if (e.key === "Enter" && !mod && !e.shiftKey && !e.altKey && !e.isComposing) { e.preventDefault(); codeEnter(ta); return; }
}

// what a line does to the indent of the one after it
function codeOpens(line) {
  const t = line.replace(/--.*$/, "")
    .replace(/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`/g, '""').trim();
  if (!t) return false;
  if (/^(else|elseif\b.*\bthen|repeat)$/.test(t) || /^elseif\b.*\bthen$/.test(t)) return true;
  let net = 0;
  for (const w of t.match(/\b(function|then|do|repeat|end|until)\b|[{}()]/g) || []) {
    if (w === "function" || w === "then" || w === "do" || w === "repeat" || w === "{" || w === "(") net++;
    else net--;
  }
  // `while x do` / `for … do` count do once; `elseif … then` starts dedented
  if (/^(elseif|else)\b/.test(t)) net++;
  return net > 0;
}

// Enter: the new line starts under the text of the line it came from, one step
// further in after a line that opens a block. A line left holding nothing but
// its indent is emptied rather than kept as trailing spaces.
function codeEnter(ta) {
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const eol = v.indexOf("\n", e) < 0 ? v.length : v.indexOf("\n", e);
  const before = v.slice(sol, s), after = v.slice(e, eol);
  const base = /^[ \t]*/.exec(before)[0];
  const indent = base + (codeOpens(before) ? tabUnit() : "");
  if (/[{(\[]\s*$/.test(before) && /^\s*[})\]]/.test(after)) {
    // between a bracket and its closer: the closer goes on a line of its own
    codeInsert(ta, "\n" + indent + "\n" + base, s, e);
    const at = ta.selectionStart - 1 - base.length;
    ta.setSelectionRange(at, at);
  } else {
    codeInsert(ta, "\n" + indent, before.trim() === "" ? sol : s, e);
  }
  codeScrollCaret(ta);
}

// Backspace with the caret in a line's leading spaces takes it back to the
// previous tab stop, one indent level, rather than one space at a time.
// Anything else - a selection, text before the caret - is the browser's.
function codeBackIndent(ta) {
  const v = ta.value, s = ta.selectionStart;
  if (s !== ta.selectionEnd || s === 0) return false;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const before = v.slice(sol, s);
  if (!before || !/^ +$/.test(before)) return false;
  const unit = tabUnit().length;
  const drop = before.length % unit || unit;
  codeInsert(ta, "", s - Math.min(drop, before.length), s);
  return true;
}

// keep the caret in view after an edit made from script
function codeScrollCaret(ta) {
  const c = ta._code, lh = c.lh || 19, pad = c.pad || 10;
  const y = pad + (codeLineOf(ta.value, ta.selectionStart) - 1) * lh;
  if (y < ta.scrollTop) ta.scrollTop = y - pad;
  else if (y + lh > ta.scrollTop + ta.clientHeight) ta.scrollTop = y + lh + pad - ta.clientHeight;
}

// After a keystroke: pull a closing word back to its block's indent, and open
// or refresh completion.
function codeTyped(ta, e) {
  const c = ta._code;
  if (c.quiet) return;
  const v = ta.value, s = ta.selectionStart;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const eol = v.indexOf("\n", s) < 0 ? v.length : v.indexOf("\n", s);
  const line = v.slice(sol, eol);
  if (e.inputType === "insertText" && e.data) {
    // `ending` after `end` was dedented: give the indent back
    if (c.dedent && c.dedent.sol === sol && /^\s*(end|else|until)\w/.test(line) && !/^\s*elseif\b/.test(line)) {
      const d = c.dedent; c.dedent = null;
      codeInsert(ta, d.removed, sol, sol);
      return;
    }
    if (!codeMaybeDedent(ta, e.data) && !(c.dedent && c.dedent.sol === sol)) c.dedent = null;
  }
  const typedWord = e.inputType === "insertText" && e.data && /[\w.:]$/.test(e.data);
  if (typedWord || (c.ac && /^delete/.test(e.inputType || ""))) codeAcOpen(ta, false);
  else codeAcClose(ta);
}

// the line so far is just a closing word (or bracket) that was finished by
// `last`: pull it back to its block's indent
function codeMaybeDedent(ta, last) {
  const v = ta.value, s = ta.selectionStart;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const eol = v.indexOf("\n", s) < 0 ? v.length : v.indexOf("\n", s);
  const mt = /^([ \t]*)(end|else|elseif|until|\}|\))$/.exec(v.slice(sol, s));
  if (!mt || v.slice(s, eol).trim() !== "" || (last && !mt[2].endsWith(last))) return false;
  codeDedent(ta, sol, mt[1]);
  return true;
}

function codeDedent(ta, sol, have) {
  const v = ta.value;
  // the nearest line above with something on it
  let p = sol - 1, prevLine = "";
  while (p > 0) {
    const ps = v.lastIndexOf("\n", p - 1) + 1;
    prevLine = v.slice(ps, p);
    if (prevLine.trim()) break;
    p = ps - 1;
  }
  const pi = /^[ \t]*/.exec(prevLine)[0];
  const unit = tabUnit();
  let want = codeOpens(prevLine) ? pi : pi.endsWith(unit) ? pi.slice(0, -unit.length) : pi.replace(/(\t| {1,8})$/, "");
  if (codeCol(have) <= codeCol(want)) return;
  const s = ta.selectionStart, e2 = ta.selectionEnd;
  codeInsert(ta, want, sol, sol + have.length);
  const shift = have.length - want.length;
  ta.setSelectionRange(s - shift, e2 - shift);
  ta._code.dedent = { sol, removed: have.slice(want.length) };
}

// ---- completion ----

function codeAcOpen(ta, forced) {
  const c = ta._code, v = ta.value, s = ta.selectionStart;
  if (ta.selectionEnd !== s || codeInStrOrCom(v, s)) { codeAcClose(ta); return; }
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const before = v.slice(Math.max(sol - 400, 0), s);
  const prefix = /[A-Za-z_]\w*$/.exec(before)?.[0] || "";
  const head = before.slice(0, before.length - prefix.length);
  const sep = /([.:])\s*$/.exec(head);
  let pool = [];
  if (sep && !/\.\.\s*$/.test(head)) {
    const segs = luauChain(head.slice(0, head.length - sep[0].length));
    const type = luauTypeOf(segs, c.locals);
    if (!type) { codeAcClose(ta); return; }
    const all = Object.entries(type.members).concat(type.dyn ? type.dyn() : []);
    const colon = sep[1] === ":";
    pool = all.filter(([, e]) => !!e.method === colon);
    if (!pool.length) pool = all;
    if (!pool.length) { codeAcClose(ta); return; }
  } else {
    if (!forced && prefix.length < 2) { codeAcClose(ta); return; }
    // a name straight after `local` or `function` is being made up, not looked up
    if (!forced && /\b(local|function)\s+$/.test(head)) { codeAcClose(ta); return; }
    const seen = new Set();
    for (const [n, e] of Object.entries(LUAU_TYPES._G.members)) { pool.push([n, e]); seen.add(n); }
    for (const k of LUAU_KW) { pool.push([k, { kind: "kw", sig: "" }]); seen.add(k); }
    // names already in the body
    const words = new Set(v.match(/\b[A-Za-z_]\w+\b/g) || []);
    for (const w of words) if (!seen.has(w) && w !== prefix)
      pool.push([w, { kind: "word", sig: c.locals[w] ? w + " : " + c.locals[w] : "" }]);
  }
  const lp = prefix.toLowerCase();
  const items = pool
    .filter(([n]) => n !== prefix || forced)
    .map(([n, e]) => {
      const ln = n.toLowerCase();
      const score = n.startsWith(prefix) ? 0 : ln.startsWith(lp) ? 1 : lp && ln.includes(lp) ? 2 : -1;
      return { n, e, score };
    })
    .filter(it => it.score >= 0)
    .sort((a, b) => a.score - b.score || (a.e.kind === "word") - (b.e.kind === "word") ||
                    (a.e.kind === "kw") - (b.e.kind === "kw") || a.n.localeCompare(b.n))
    .slice(0, 60);
  if (!items.length) { codeAcClose(ta); return; }
  const keep = c.ac && c.ac.items[c.ac.at] && items.findIndex(it => it.n === c.ac.items[c.ac.at].n);
  c.ac = { items, at: keep > 0 ? keep : 0, from: s - prefix.length, prefix };
  codeAcDraw(ta);
}

function codeAcDraw(ta) {
  const { P, ac } = ta._code;
  const K = { fn: ["ƒ", "fn"], mod: ["▣", "mod"], val: ["◆", "val"], kw: ["k", "kw"], word: ["·", ""] };
  const list = P.ac.querySelector(".list");
  list.innerHTML = ac.items.map((it, i) => {
    const [glyph, cls] = K[it.e.kind] || K.word;
    const pre = it.n.slice(0, ac.prefix.length), rest = it.n.slice(ac.prefix.length);
    const name = it.score === 0 && pre ? `<b>${luauEsc(pre)}</b>${luauEsc(rest)}` : luauEsc(it.n);
    const sig = it.e.sig && it.e.sig !== it.n ? (it.e.sig.includes("(") ? it.e.sig.slice(it.e.sig.indexOf("(")) : "") : "";
    return `<div class="it${i === ac.at ? " on" : ""}" data-i="${i}" role="option"><span class="k ${cls}">${glyph}</span>` +
           `<span class="n">${name}</span><span class="s">${luauEsc(sig)}</span></div>`;
  }).join("");
  const cur = ac.items[ac.at];
  const doc = P.ac.querySelector(".doc");
  doc.innerHTML = cur && cur.e.sig ? `<code>${luauEsc(cur.e.sig)}</code>${cur.e.doc ? "<br>" + cur.e.doc : ""}` : "";
  doc.hidden = !doc.innerHTML;
  P.ac.hidden = false;
  const on = list.children[ac.at];
  if (on) on.scrollIntoView({ block: "nearest" });
  codeAcPlace(ta);
}

function codeAcPlace(ta) {
  const c = ta._code;
  if (!c.ac) return;
  const { P } = c;
  const v = ta.value, s = c.ac.from;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const line = codeLineOf(v, s);
  const cw = c.cw || (c.cw = codeCharWidth(P.hl));
  const gutter = P.gl.parentElement.offsetWidth;
  const padX = parseFloat(getComputedStyle(ta).paddingLeft) || 14;
  const lh = c.lh || 19, pad = c.pad || 10;
  let x = gutter + padX + codeCol(v.slice(sol, s)) * cw - ta.scrollLeft - 24;
  let y = pad + line * lh - ta.scrollTop + 2;
  const boxH = P.box.clientHeight, boxW = P.box.clientWidth;
  const h = P.ac.offsetHeight;
  if (y + h > boxH && y - lh - h - 4 > 0) y = y - lh - h - 4;
  x = Math.max(4, Math.min(x, boxW - P.ac.offsetWidth - 4));
  P.ac.style.left = x + "px";
  P.ac.style.top = y + "px";
}

function codeCharWidth(pre) {
  const span = document.createElement("span");
  span.textContent = "x".repeat(100);
  span.style.visibility = "hidden";
  pre.appendChild(span);
  const w = span.getBoundingClientRect().width / 100;
  span.remove();
  return w || 7.5;
}

function codeAcAccept(ta) {
  const c = ta._code;
  if (!c.ac) return;
  const it = c.ac.items[c.ac.at];
  const from = c.ac.from, to = ta.selectionStart;
  const tail = /^\w*/.exec(ta.value.slice(to))[0];   // finishing a word mid-way replaces all of it
  codeAcClose(ta);
  if (it) { codeInsert(ta, it.n, from, to + tail.length); codeMaybeDedent(ta); }
  codeStatus(ta);
}

function codeAcClose(ta) {
  const c = ta._code;
  if (!c || !c.ac) return;
  c.ac = null;
  c.P.ac.hidden = true;
}

// ---- the --@barch header ----

// The function's own limits, `--@barch {"deadline_ms": 5000, "slice_insns": 200000}`,
// from the comments before the first token - the walk barch's read_function_meta
// makes (barch TODO 434). Answers null when there is none, or
// { start, end, obj, bad, block }: the line's range (with its newline), the
// parsed object, `bad` when it isn't a JSON object, and `block` for the
// --[[@barch ... ]] form, which the panel shows but leaves to the source.
function luauBarchHeader(src) {
  const n = src.length;
  let i = 0;
  const parse = (json, start, end, block) => {
    let obj = null;
    try { obj = JSON.parse(json); } catch (e) {}
    const bad = !obj || typeof obj !== "object" || Array.isArray(obj);
    return { start, end, obj: bad ? {} : obj, bad, block };
  };
  while (i < n) {
    const c = src[i];
    if (c === " " || c === "\t" || c === "\r" || c === "\n") { i++; continue; }
    if (!src.startsWith("--", i)) return null;
    const block = /^--\[(=*)\[/.exec(src.slice(i, i + 64));
    if (block) {
      const close = "]" + block[1] + "]";
      const e = src.indexOf(close, i + block[0].length);
      if (e < 0) return null;
      const body = src.slice(i + block[0].length, e);
      const at = /^\s*@barch/.exec(body);
      if (at) return parse(body.slice(at[0].length), i, e + close.length, true);
      i = e + close.length;
      continue;
    }
    let eol = src.indexOf("\n", i);
    if (eol < 0) eol = n;
    if (src.startsWith("--@barch", i)) {
      const sol = src.lastIndexOf("\n", i - 1) + 1;
      return parse(src.slice(i + 8, eol), /^[ \t]*$/.test(src.slice(sol, i)) ? sol : i,
                   eol < n ? eol + 1 : eol, false);
    }
    i = eol;
  }
  return null;
}

// ---- native code ----

// Where the `--!native` hot comment is, or null. Luau reads a hot comment only in
// the header - the comments before the first token - so this walks whitespace,
// line comments and --[[ block ]] comments from the top and stops at the first
// token. Same rule as wants_native in spacesapi.luau and in barch's
// compile_into (barch TODO 413), which is what makes the line the AOT switch.
function luauNativeMarker(src) {
  const n = src.length;
  let i = 0;
  while (i < n) {
    const c = src[i];
    if (c === " " || c === "\t" || c === "\r" || c === "\n") { i++; continue; }
    if (!src.startsWith("--", i)) return null;
    const block = /^--\[(=*)\[/.exec(src.slice(i, i + 64));
    if (block) {
      const close = "]" + block[1] + "]";
      const e = src.indexOf(close, i + block[0].length);
      if (e < 0) return null;
      i = e + close.length;
      continue;
    }
    let eol = src.indexOf("\n", i);
    if (eol < 0) eol = n;
    if (/^--!native[ \t\r]*$/.test(src.slice(i, eol))) {
      const sol = src.lastIndexOf("\n", i - 1) + 1;
      return { start: /^[ \t]*$/.test(src.slice(sol, i)) ? sol : i, end: eol < n ? eol + 1 : eol };
    }
    i = eol;
  }
  return null;
}

// ---- errors ----

// "ERR spaces:3: attempt to index nil" - the chunk is named after the space,
// so that prefix is what marks a line of this body rather than of a module it
// required. Anything with the shape is taken when the space name doesn't match.
function codeErrorLine(msg) {
  const text = String(msg || "");
  const re = /(?:^|[\s"'(\[])([\w.\-]*):(\d+):\s*/g;
  let mt, first = null;
  while ((mt = re.exec(text))) {
    const hit = { line: +mt[2], chunk: mt[1], msg: text.slice(mt.index + mt[0].length).trim() };
    if (typeof current !== "undefined" && hit.chunk === (current || "")) return hit;
    if (!first) first = hit;
  }
  return first;
}

function codeMarkError(msg) {
  const ta = document.getElementById("ev");
  if (!ta || !ta._code) return null;
  const hit = codeErrorLine(msg);
  if (!hit || hit.line < 1 || hit.line > ta.value.split("\n").length) { codeClearError(); return null; }
  ta._code.errLine = hit.line;
  ta._code.errMsg = hit.msg;
  codeStatus(ta);
  codeGoto(ta, hit.line, true);
  return hit;
}

function codeClearError() {
  const ta = document.getElementById("ev");
  if (!ta || !ta._code || !ta._code.errLine) return;
  ta._code.errLine = 0; ta._code.errMsg = "";
  codeStatus(ta);
}

// caret to the start of a line's text, scrolled into the middle if it was out
function codeGoto(ta, line, keepFocus) {
  if (typeof ta === "number") { line = ta; ta = document.getElementById("ev"); }
  if (!ta || !ta._code) return;
  const v = ta.value;
  let pos = 0;
  for (let i = 1; i < line; i++) { const nl = v.indexOf("\n", pos); if (nl < 0) break; pos = nl + 1; }
  pos += /^[ \t]*/.exec(v.slice(pos))[0].length;
  const c = ta._code, lh = c.lh || 19, pad = c.pad || 10;
  const y = pad + (line - 1) * lh;
  if (y < ta.scrollTop || y + lh > ta.scrollTop + ta.clientHeight)
    ta.scrollTop = Math.max(0, y - ta.clientHeight / 2);
  if (!keepFocus || document.activeElement === ta || !ta.disabled) {
    ta.focus({ preventScroll: true });
    ta.setSelectionRange(pos, pos);
  }
  codeStatus(ta);
}

// an error message with its line reference made into a link to that line
function codeErrorHtml(msg) {
  return esc(msg).replace(/(^|[\s(\[])([\w.\-]*:(\d+)):/, (all, lead, ref, n) =>
    `${lead}<a class="errline" onclick="codeGoto(${+n})" title="Go to line ${+n}">${ref}</a>:`);
}
</script>
<script>
// A read-only look at every key space, out of /api/admin/*. Everything here is a
// GET: the viewer never writes, which is why there is no confirm anywhere in it.
let spaces = [], current = null, tab = "keys";
let fsPath = "/", keyPrefix = "", keyMatch = "", fsMatch = "", fnMatch = "";
let gPath = "/";                       // where the graph tab is looking

// for a name that goes inside onclick='...': encodeURIComponent leaves ' alone
const enc = s => encodeURIComponent(s).replace(/'/g, "%27");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bytes = n => n == null ? "" :
  n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " kB" :
  (n / 1048576).toFixed(1) + " MB";
const num = n => (n ?? 0).toLocaleString();

async function api(path) {
  const r = await fetch("/api/admin/" + path);
  const out = await r.json().catch(() => ({ error: "not JSON — " + r.status }));
  if (r.status === 401) { openAuth(); throw new Error("unauthorized"); }
  return out;
}

async function boot() {
  // /api/admin/me answers for any signed-in user AND the local-admin guest
  // (no admin yet): it is the only /api/admin/* endpoint that does not
  // need a real session. Admins see the full viewer; everyone else gets
  // their name in the header plus the exit door, instead of a blank page.
  // me goes first: /spaces 401s for non-admins, and reading it first used
  // to throw boot() out before setUser() ever ran.
  const me = await api("me").catch(() => null);
  // Nobody is the admin yet. There is no guest and no way in, and the one
  // thing that helps is making the account - the first one made here becomes
  // the admin - so the form goes up at once rather than a refusal.
  if (me && me.needs_admin) {
    needsAdmin = true;
    isHere = !!me.here;
    setUser(null);
    spaces = []; current = null;
    document.getElementById("spaces").innerHTML = "";
    document.getElementById("pane").innerHTML =
      `<div class="notice">This server has no admin account yet.
       The first account made here becomes the admin.</div>`;
    openAuth("register");
    return;
  }
  needsAdmin = false;
  if (!me) {
    // not signed in: the sign-in panel is already up (api() opens it on a 401),
    // and what is behind it is not this browser's to look at any more
    setUser(null);
    spaces = []; current = null;
    document.getElementById("spaces").innerHTML = "";
    document.getElementById("pane").innerHTML =
      `<div class="empty" style="padding:60px 0">Signed out.</div>`;
    return;
  }
  isAdmin = !!me.admin;
  isHere = !!me.here;          // the browser is on the machine the server runs on
  document.getElementById("tab-console").hidden = !isAdmin;
  setUser(me.user);
  if (!isAdmin) {
    document.getElementById("pane").innerHTML =
      `<div class="notice">Signed in as ${esc((me.user || {}).email || "unknown")} — `
      + `an admin can promote this account from the Console tab:<br><code>SET admin/`
      + `${esc((me.user || {}).email || "you")} 1</code> in the <code>spaces</code> space.</div>`;
    return;
  }
  const out = await api("spaces").catch(() => null);
  if (!out) return;
  spaces = out.spaces || [];
  drawSpaces();
  // the biggest openable space, not the first non-empty one: landing on
  // `configuration` and its four keys is a poor first look at a server
  const open = spaces.filter(s => s.openable);
  current = (open.sort((a, b) => b.keys - a.keys)[0] || spaces[0]).name;
  open.sort((a, b) => spaces.indexOf(a) - spaces.indexOf(b));
  drawSpaces();
  draw();
}

// `configuration` holds every space's settings and the server's own; SPACESAPI
// refuses to drop it (space_rm), so it gets no minus to press
const UNDROPPABLE = ["configuration"];

function drawSpaces() {
  document.getElementById("spaces").innerHTML =
    `<div class="spaces-head">
      <h3>Spaces</h3>
      ${isAdmin ? `<button class="gear" title="Export or import every space"
        aria-label="Export or import every space"
        onclick="openTransferAll(event)">${ico("transfer")}</button>
      <button class="gear" title="Add a key space" aria-label="Add a key space"
        onclick="newSpace(event)">${ico("plus")}</button>` : ""}
    </div>` + spaces.map(s => `
      <a href="#" class="${s.name === current ? "on" : ""}${s.openable ? "" : " off"}"
         onclick="pickSpace(event, '${esc(s.name)}')">
        <span class="icon">${ico(s.files ? "folder" : "key")}</span>
        <span class="sname">${esc(s.name)}</span>
        <span class="count">${num(s.keys)}</span>
        ${isAdmin && s.openable ? `<button class="ib" title="Export or import ${esc(s.name)}"
          aria-label="Export or import ${esc(s.name)}"
          onclick="openTransfer(event,'${esc(enc(s.name))}')">${ico("transfer")}</button>
        ${UNDROPPABLE.includes(s.name) ? "" : `<button class="ib" title="Delete ${esc(s.name)}"
          aria-label="Delete ${esc(s.name)}"
          onclick="dropSpace(event,'${esc(enc(s.name))}')">${ico("minus")}</button>`}` : ""}
      </a>`).join("");
}

async function newSpace(ev) {
  if (ev) ev.preventDefault();
  const name = (prompt("Name of the new key space:") || "").trim();
  if (!name) return;
  if (!/^[A-Za-z0-9_]+$/.test(name))
    return toast("a space name is letters, digits and underscores", "warn");
  if (await write("space_add", { name })) {
    const out = await api("spaces").catch(() => null);
    if (out) spaces = out.spaces || [];
    current = name; fsPath = "/"; gPath = "/"; keyPrefix = ""; keyMatch = ""; fsMatch = ""; fnMatch = "";
    drawSpaces();
    draw();
  }
}

async function dropSpace(ev, name) {
  ev.preventDefault();
  ev.stopPropagation();
  name = decodeURIComponent(name);
  if (!confirm(`KSPACE DROP ${name}? This deletes the space and cannot be undone.`)) return;
  if (!await write("space_rm", { name })) return;
  const out = await api("spaces").catch(() => null);
  if (out) spaces = out.spaces || [];
  if (current === name) {
    const open = spaces.filter(s => s.openable);
    current = (open[0] || spaces[0] || {}).name || null;
  }
  drawSpaces();
  if (current) draw();
}

function pickSpace(ev, name) {
  ev.preventDefault();
  const s = spaces.find(x => x.name === name);
  if (!s || !s.openable) return;
  current = name; fsPath = "/"; gPath = "/"; keyPrefix = ""; keyMatch = ""; fsMatch = ""; fnMatch = "";
  drawSpaces();
  draw();
}

document.getElementById("tabs").onclick = ev => {
  const a = ev.target.closest("a[data-tab]");
  if (!a) return;
  ev.preventDefault();
  if (a.dataset.tab === "config") return openServer();     // a modal; the pane underneath is left alone
  if (a.dataset.tab === "console") return openConsole();
  tab = a.dataset.tab;
  [...document.querySelectorAll("#tabs a")].forEach(x => x.classList.toggle("on", x === a));
  draw();
};

function draw() {
  if (tab === "keys") return drawKeys();
  if (tab === "files") return drawFiles();
  if (tab === "graph") return drawGraph();
  if (tab === "functions") return drawFunctions();
  if (tab === "stats") return drawStats();
}

// ---- keys -----------------------------------------------------------------
//
// A window of PAGE keys at `offset`, and a slider over the whole range. The server
// jumps to the offset (`sp:range(lo, hi, limit, offset)`), so any position costs the
// same and the slider can be dragged rather than clicked through. The pane is built
// once and only the rows change, so the slider is never torn down under the thumb.

const PAGE = 25;
let isAdmin = false;     // the server decides; this only decides what to draw
let isHere = false;      // the browser is on the machine the server runs on
let needsAdmin = false;  // no admin account on this server yet, so make one
let keyTotal = 0, keyAt = 0, keyTimer = null, keySeq = 0;

async function drawKeys() {
  const pane = document.getElementById("pane");
  pane.innerHTML = head("keys") + `
    <div class="filter">
      <input id="prefix" placeholder="key prefix, e.g. street:LONG"
             value="${esc(keyPrefix)}" autocomplete="off">
      <input id="vmatch" placeholder="value glob, e.g. *sale* or ?ok"
             value="${esc(keyMatch)}" autocomplete="off">
      <button onclick="applyPrefix()">Filter</button>
      ${keyPrefix || keyMatch ? `<button onclick="keyPrefix='';keyMatch='';drawKeys()">Clear</button>` : ""}
      ${isAdmin ? `<button onclick="newKey()">${ico("key")} New key</button>` : ""}
    </div>
    <div class="slider" id="slider">
      <button onclick="slideBy(-1)" aria-label="Previous page">${ico("back")}</button>
      <input type="range" id="slide" min="0" max="0" value="0" step="1" aria-label="Position in the keys"
             oninput="slideTo(Number(this.value))">
      <button onclick="slideBy(1)" aria-label="Next page" style="transform:scaleX(-1)">${ico("back")}</button>
      <span id="slide-at"></span>
    </div>
    <div id="rows"><div class="empty" style="padding:40px 0">Walking…</div></div>`;
  for (const id of ["prefix", "vmatch"])
    document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") applyPrefix(); });
  keyAt = 0;
  const out = await loadKeys(true);
  if (!out) return;
  if (out.total == null && Array.isArray(out.keys) && out.keys.length) {
    document.getElementById("rows").innerHTML = `<div class="notice">This barchd ignores the range offset, so the
      slider cannot jump. Install the newer one and restart.</div>`;
    document.getElementById("slider").hidden = true;
    return;
  }
  keyTotal = out.total || 0;
  const r = document.getElementById("slide");
  r.max = Math.max(0, Math.ceil(keyTotal / PAGE) - 1);
  document.querySelector(".head .count").textContent =
    `${num(keyTotal)} keys${keyPrefix ? " under that prefix" : ""}${keyMatch ? ` with a value matching ${keyMatch}` : ""}${out.capped ? " (first 200,000 searched)" : ""}`;
  document.getElementById("slider").hidden = keyTotal <= PAGE;
  showKeys(out);
}

// one window; `first` also asks for the total
async function loadKeys(first) {
  const q = new URLSearchParams({ space: current, prefix: keyPrefix, limit: PAGE, offset: keyAt * PAGE });
  if (keyMatch) q.set("match", keyMatch);
  if (first) q.set("count", "1");
  const seq = ++keySeq;
  const out = await api("keys?" + q).catch(() => null);
  return seq === keySeq ? out : null;          // a later drag has already asked for another window
}

function showKeys(out) {
  const rows = Array.isArray(out.keys) ? out.keys : [];
  document.getElementById("rows").innerHTML = !rows.length
    ? `<div class="empty" style="padding:40px 0">No keys${keyPrefix ? " under that prefix" : ""}${keyMatch ? " matching that value" : ""}.</div>`
    : `<table class="keys"><tbody>${rows.map(r => `
        <tr onclick="openValue('${esc(enc(r.key))}')">
          <td class="k" title="${esc(r.key)}">${esc(r.key)}</td>
          <td class="kind">${esc(r.kind)}</td>
          <td class="sz">${r.size == null ? "" : bytes(r.size)}</td>
          <td class="v">${esc(r.value ?? "")}</td>
          ${isAdmin ? `<td class="act">${String(r.key).startsWith("fs:") ? "" : `<button class="ib" title="Delete ${esc(r.key)}"
            aria-label="Delete ${esc(r.key)}"
            onclick="dropKey(event,'${esc(enc(r.key))}')">${ico("minus")}</button>`}</td>` : ""}
        </tr>`).join("")}</tbody></table>`;
  const from = keyAt * PAGE + 1;
  document.getElementById("slide-at").textContent =
    rows.length ? `${num(from)}–${num(from + rows.length - 1)} of ${num(keyTotal)}` : "";
}

// While the thumb moves the label follows at once and the rows follow a moment
// later, so a fast drag asks for the windows it stops on, not every one it passes.
function slideTo(i) {
  keyAt = i;
  const from = i * PAGE + 1;
  document.getElementById("slide-at").textContent =
    `${num(from)}–${num(Math.min(from + PAGE - 1, keyTotal))} of ${num(keyTotal)}`;
  document.getElementById("slide").value = i;
  clearTimeout(keyTimer);
  keyTimer = setTimeout(async () => { const out = await loadKeys(false); if (out) showKeys(out); }, 60);
}
function slideBy(n) {
  const r = document.getElementById("slide");
  slideTo(Math.max(0, Math.min(Number(r.max), keyAt + n)));
}

function applyPrefix() {
  keyPrefix = document.getElementById("prefix").value.trim();
  keyMatch = document.getElementById("vmatch").value.trim();
  drawKeys();
}

// ---- writing (admins only; the server checks, this only decides what to draw) --

async function write(op, params, body, quiet) {
  const q = new URLSearchParams({ space: current, ...params });
  const r = await fetch("/api/admin/" + op + "?" + q, { method: "POST", body: body ?? "" });
  const out = await r.json().catch(() => ({ error: "not JSON — " + r.status }));
  if (out.error && !(quiet && (out.exists || out.notempty))) { toast(out.error, "warn"); return null; }
  return out;
}

// the value editor: new key, or an existing one. The file picker fills the text
// box from a text file, or is sent as the value as it is when it is not text.
function editKey(key, value, canEdit) {
  const fresh = key == null;
  return `<div class="editor">
    ${fresh ? `<input id="ek" placeholder="key name" autocomplete="off">` : ""}
    <textarea id="ev" rows="8" spellcheck="false" ${canEdit ? "" : "disabled"}
      placeholder="${canEdit ? "value" : "too large to edit here — upload a file to replace it"}">${esc(value ?? "")}</textarea>
    <div class="row">
      <input type="file" id="ef">
      <span class="fill"></span>
      <button class="primary" id="key-save" onclick="saveKey(${fresh ? "null" : `'${esc(enc(key))}'`})">Save</button>
      ${fresh ? "" : `<button id="key-del" onclick="removeKey('${esc(enc(key))}')">Delete</button>`}
    </div>
  </div>`;
}

// the `configuration` space is where every space's settings live, and an option
// changed on a space that already has data can make it unloadable
const careful = () => current === "configuration"
  ? "\n\nCAREFUL: this is the configuration space. A wrong value can stop a space from loading or change what the server runs." : "";
const carefulNote = () => careful().trim();

// Save writes and stays open, like the function editor: a write is undone by
// writing again, so it needs no confirm. The configuration space is the
// exception - a wrong value there can stop a space from loading - so Save
// asks for a second click there instead of a dialog.
async function saveKey(key) {
  key = key == null ? document.getElementById("ek").value.trim() : decodeURIComponent(key);
  if (!key) { toast("a key name is required", "warn"); document.getElementById("ek")?.focus(); return; }
  const file = document.getElementById("ef").files[0];
  const body = file || document.getElementById("ev").value;
  if (file && file.size > 512000) { toast("a value is at most 512 kB; that file is " + bytes(file.size), "warn"); return; }
  if (careful() && !armed(document.getElementById("key-save"), "Really set?", carefulNote())) return;
  if (await write("key_put", { key }, body)) {
    toast(`Saved ${key}`, "ok");
    document.getElementById("ef").value = "";
    drawKeys();
  }
}

// Delete asks with a second click, not a dialog
async function removeKey(key) {
  key = decodeURIComponent(key);
  if (!armed(document.getElementById("key-del"), "Really delete?", careful() ? carefulNote() : null)) return;
  if (await write("key_rm", { key })) { toast(`Deleted ${key}`, "ok"); shut(); drawKeys(); }
}

// the − on a row: the first click turns it red and says what the second does
async function dropKey(ev, key) {
  ev.preventDefault();
  ev.stopPropagation();
  key = decodeURIComponent(key);
  if (!armed(ev.currentTarget, null, `Click − again to delete ${key}${careful() ? " — " + carefulNote() : ""}`)) return;
  if (await write("key_rm", { key })) { toast(`Deleted ${key}`, "ok"); drawKeys(); }
}

function newKey() {
  show(`<div class="top"><h2>New key in ${esc(current)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox" data-key="">${editKey(null, "", true)}</div>`);
  document.getElementById("ek")?.focus();
}

async function uploadFiles(input) {
  const base = fsPath === "/" ? "" : fsPath;
  for (const f of input.files) {
    const path = base + "/" + f.name, params = { path, type: f.type || "" };
    // written if the name is free; if it is not, the server says so and only then is
    // the person asked - the warning is for a file that is really there
    let out = await write("file_put", params, f, true);
    if (out && out.exists) {
      if (!confirm(`${path} already exists in ${current}. Replace it with this ${bytes(f.size)} file?`)) continue;
      out = await write("file_put", { ...params, overwrite: "1" }, f);
    }
    if (!out) break;
  }
  input.value = "";
  drawFiles();
}

async function newFolder() {
  const name = prompt("New folder name (inside " + fsPath + "):");
  if (!name) return;
  if (name.includes("/")) return toast("a folder name cannot contain /", "warn");
  if (await write("dir_mk", { path: (fsPath === "/" ? "" : fsPath) + "/" + name })) drawFiles();
}

// the same call renames a file or a folder; the server moves name records only
async function renameFile(ev, path) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  const to = prompt("Rename to (a full path; the folder must exist):", path);
  if (!to || to === path) return;
  if (await write("file_mv", { path, to })) drawFiles();
}

async function deleteFile(ev, path, isDir) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  if (!isDir) {
    if (!confirm(`Delete ${path} from ${current}? This cannot be undone.`)) return;
    if (await write("file_rm", { path })) drawFiles();
    return;
  }
  // a folder goes only if it is empty; when it is not, say so and ask again
  if (!confirm(`Delete the folder ${path} from ${current}?`)) return;
  let out = await write("dir_rm", { path }, null, true);
  if (out && out.notempty) {
    if (!confirm(`${path} is not empty. Delete it and everything inside it? This cannot be undone.`)) return;
    out = await write("dir_rm", { path, recursive: "1" });
  }
  if (out) drawFiles();
}

async function openValue(key) {
  key = decodeURIComponent(key);
  const out = await api("value?space=" + encodeURIComponent(current) +
                        "&key=" + encodeURIComponent(key)).catch(() => null);
  if (!out) return;
  let body = out.value ?? "";
  try { body = JSON.stringify(JSON.parse(body), null, 2); } catch (e) {}
  const editable = isAdmin && out.kind === "key";
  show(`<div class="top"><h2>${esc(key)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox"${editable ? ` data-key="${esc(enc(key))}"` : ""}>
      <div class="meta">${esc(current)} · ${esc(out.kind)}${out.size != null ? " · " + bytes(out.size) : ""}${out.truncated ? " · truncated" : ""}</div>
      ${editable ? editKey(key, out.value ?? "", !out.truncated) : `<pre>${esc(body)}</pre>`}
    </div>`);
}

let fsTotal = 0, fsAt = 0, fsTimer = null, fsSeq = 0;

async function drawFiles() {
  const pane = document.getElementById("pane");
  const parts = fsPath.split("/").filter(Boolean);
  const crumbs = [`<a href="#" onclick="goPath(event,'%2F')">/</a>`].concat(
    parts.map((p, i) => `<a href="#" onclick="goPath(event,'${esc(enc("/" + parts.slice(0, i + 1).join("/")))}')">${esc(p)}</a>`));
  pane.innerHTML = head("file store") + `
    <div class="crumbs">${crumbs.join(" <span>/</span> ")}</div>
    <div class="filter">
      <input id="fmatch" placeholder="name glob, e.g. *.png or B00*" value="${esc(fsMatch)}" autocomplete="off">
      <button onclick="applyFsMatch()">Filter</button>
      ${fsMatch ? `<button onclick="fsMatch='';drawFiles()">Clear</button>` : ""}
    </div>
    ${isAdmin ? `<div class="filter"><label class="upload">Upload files here <input type="file" multiple onchange="uploadFiles(this)"></label>
        <span class="fill"></span><button onclick="newFolder()">${ico("folder")} New folder</button></div>` : ""}
    <div class="slider" id="slider" hidden>
      <button onclick="fsSlideBy(-1)" aria-label="Previous page">${ico("back")}</button>
      <input type="range" id="slide" min="0" max="0" value="0" step="1" aria-label="Position in the folder"
             oninput="fsSlideTo(Number(this.value))">
      <button onclick="fsSlideBy(1)" aria-label="Next page" style="transform:scaleX(-1)">${ico("back")}</button>
      <span id="slide-at"></span>
    </div>
    <div id="rows"><div class="empty" style="padding:40px 0">Walking…</div></div>`;
  document.getElementById("fmatch").addEventListener("keydown", e => { if (e.key === "Enter") applyFsMatch(); });
  fsAt = 0;
  const out = await loadFiles();
  if (!out) return;
  if (!out.files) {
    document.getElementById("rows").innerHTML =
      `<div class="empty" style="padding:40px 0">
         <b>${esc(current)}</b> has no file store — nothing has written one here.</div>`;
    return;
  }
  fsTotal = out.total || 0;
  document.getElementById("slide").max = Math.max(0, Math.ceil(fsTotal / PAGE) - 1);
  document.getElementById("slider").hidden = fsTotal <= PAGE;
  document.querySelector(".head .count").textContent =
    `${num(fsTotal)} ${fsTotal === 1 ? "entry" : "entries"}${out.dirs ? ` · ${num(out.dirs)} folders` : ""}`;
  showFiles(out);
}

function applyFsMatch() { fsMatch = document.getElementById("fmatch").value.trim(); drawFiles(); }

async function loadFiles() {
  const q = new URLSearchParams({ space: current, path: fsPath, limit: PAGE, offset: fsAt * PAGE });
  if (fsMatch) q.set("match", fsMatch);
  const seq = ++fsSeq;
  const out = await api("fs?" + q).catch(() => null);
  return seq === fsSeq ? out : null;           // a later drag has already asked for another window
}

function showFiles(out) {
  const entries = Array.isArray(out.entries) ? out.entries : [];
  const at = e => enc((fsPath === "/" ? "" : fsPath) + "/" + e.name);
  document.getElementById("rows").innerHTML = !entries.length
    ? `<div class="empty" style="padding:30px 0">${fsMatch ? "Nothing here matches that name." : "Empty."}</div>`
    : `<table class="keys"><tbody>${entries.map(e => `
      <tr onclick="${e.dir ? "goPath(event" : "openFile(event"},'${esc(at(e))}')">
        <td class="k" title="${esc(e.name)}">${ico(e.dir ? "folder" : "file")} ${esc(e.name)}${e.dir ? "/" : ""}</td>
        <td class="kind" title="${esc(e.type || "")}">${esc(e.type || (e.dir ? "dir" : ""))}</td>
        <td class="sz">${e.dir ? "" : bytes(e.size)}</td>
        <td class="v">${e.dir ? "" : "v" + esc(e.version ?? "")}</td>
        ${isAdmin ? `<td class="act">
          <button class="ib" title="Rename" aria-label="Rename ${esc(e.name)}"
                  onclick="renameFile(event,'${esc(at(e))}')">${ico("more")}</button>
          <button class="ib" title="Delete" aria-label="Delete ${esc(e.name)}"
                  onclick="deleteFile(event,'${esc(at(e))}', ${e.dir ? "true" : "false"})">${ico("minus")}</button></td>` : ""}
      </tr>`).join("")}</tbody></table>`;
  const from = fsAt * PAGE + 1;
  document.getElementById("slide-at").textContent =
    entries.length ? `${num(from)}–${num(from + entries.length - 1)} of ${num(fsTotal)}` : "";
}

// as for the keys: the label follows the thumb at once, the rows a moment later
function fsSlideTo(i) {
  fsAt = i;
  const from = i * PAGE + 1;
  document.getElementById("slide-at").textContent =
    `${num(from)}–${num(Math.min(from + PAGE - 1, fsTotal))} of ${num(fsTotal)}`;
  document.getElementById("slide").value = i;
  clearTimeout(fsTimer);
  fsTimer = setTimeout(async () => { const out = await loadFiles(); if (out) showFiles(out); }, 60);
}
function fsSlideBy(n) {
  const r = document.getElementById("slide");
  fsSlideTo(Math.max(0, Math.min(Number(r.max), fsAt + n)));
}

// What to show for a file, from its type column - and from the extension when the
// column is empty, which is how anything loaded without a type arrives.
const EXT_TYPES = { json: "application/json", md: "text/markdown", txt: "text/plain",
  html: "text/html", css: "text/css", js: "text/javascript", luau: "text/x-luau",
  lua: "text/x-luau", py: "text/x-python", sh: "text/x-shellscript", csv: "text/csv",
  xml: "application/xml", svg: "image/svg+xml", png: "image/png", jpg: "image/jpeg",
  jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp" };
const RAW_IMAGES = ["image/jpeg", "image/png", "image/gif", "image/webp"];

async function openFile(ev, path) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  const q = "space=" + encodeURIComponent(current) + "&path=" + encodeURIComponent(path);
  const out = await api("file?" + q).catch(() => null);
  if (!out) return;
  const ext = (path.split(".").pop() || "").toLowerCase();
  const type = out.type || EXT_TYPES[ext] || "";
  let shown;
  if (out.error) {
    shown = `<div class="notice">${esc(out.error)}</div>`;
  } else if (RAW_IMAGES.includes(type)) {
    shown = `<div class="filepic"><img alt="${esc(path)}" src="/api/admin/file?${q}&raw=1"></div>`;
  } else if (out.text != null) {
    let body = out.text;
    if (type.includes("json")) { try { body = JSON.stringify(JSON.parse(body), null, 2); } catch (e) {} }
    const luau = /luau|x-lua\b/.test(type) || ext === "luau" || ext === "lua";
    shown = luau ? `<pre class="code-ro">${luauHighlight(body)}</pre>` : `<pre>${esc(body)}</pre>`;
  } else {
    shown = `<div class="meta">binary — first ${Math.min(512, out.size || 0)} bytes</div><pre>${esc(out.hex || "")}</pre>`;
  }
  show(`<div class="top"><h2>${esc(path)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(current)} · ${esc(type || "unknown type")}${out.size != null ? " · " + bytes(out.size) : ""}${out.version != null ? " · v" + esc(out.version) : ""}${out.truncated ? " · truncated" : ""}</div>
      ${shown}
    </div>`);
}

function goPath(ev, path) { ev.preventDefault(); fsPath = decodeURIComponent(path || "%2F"); fsMatch = ""; drawFiles(); }


// ---- graph ------------------------------------------------------------------
//
// The same shape as the file store with the paths taken out: {parent, name, id}
// edges over a node table, so one node can hang under several parents and the
// same content answers at more than one path. That is what the id and refs
// columns are for - two rows with the same id are the same node, and refs says
// how many edges name it, so a leaf with refs 3 is in three places at once.
//
// Nothing here can walk key ranges the way Files does, because no path is
// stored: GRAPH LS resolves one level at a time, and it pages by offset with no
// total to slide over, so this has a next and a previous instead of a slider.

let gAt = 0, gSeq = 0, gMore = false, gNode = null;

async function drawGraph() {
  const pane = document.getElementById("pane");
  const parts = gPath.split("/").filter(Boolean);
  const crumbs = [`<a href="#" onclick="goNode(event,'%2F')">/</a>`].concat(
    parts.map((p, i) => `<a href="#" onclick="goNode(event,'${esc(enc("/" + parts.slice(0, i + 1).join("/")))}')">${esc(p)}</a>`));
  pane.innerHTML = head("graph store") + `
    <div class="crumbs">${crumbs.join(" <span>/</span> ")}</div>
    ${isAdmin ? `<div class="filter"><label class="upload">Add nodes here <input type="file" multiple onchange="uploadNodes(this)"></label>
        <span class="fill"></span>
        <button onclick="newNode()">${ico("folder")} New node</button>
        <button onclick="newLeaf()">${ico("file")} New leaf</button>
        <button onclick="linkNode()">${ico("link")} Link a node</button></div>` : ""}
    <div class="slider" id="gslider" hidden>
      <button onclick="gPageBy(-1)" aria-label="Previous page">${ico("back")}</button>
      <button onclick="gPageBy(1)" aria-label="Next page" style="transform:scaleX(-1)">${ico("back")}</button>
      <span id="gslide-at" style="flex:1"></span>
    </div>
    <div id="rows"><div class="empty" style="padding:40px 0">Walking…</div></div>`;
  gAt = 0;
  const out = await loadGraph();
  if (!out) return;
  if (!out.graph) {
    document.getElementById("rows").innerHTML =
      `<div class="empty" style="padding:40px 0">
         <b>${esc(current)}</b> has no graph — nothing has written one here.</div>`;
    return;
  }
  showGraph(out);
}

async function loadGraph() {
  const q = new URLSearchParams({ space: current, path: gPath, limit: PAGE, offset: gAt * PAGE });
  const seq = ++gSeq;
  const out = await api("graph?" + q).catch(() => null);
  if (out && out.error) { toast(out.error, "warn"); return null; }
  return seq === gSeq ? out : null;          // a later click has already asked for another page
}

function showGraph(out) {
  const entries = Array.isArray(out.entries) ? out.entries : [];
  gMore = !!out.more;
  gNode = out.node || null;
  const at = e => enc((gPath === "/" ? "" : gPath) + "/" + e.name);
  const where = gNode
    ? `node ${num(gNode.id)}${gNode.refs > 1 ? ` · ${num(gNode.refs)} edges in` : ""}`
    : "graph store";
  document.querySelector(".head .count").textContent =
    `${num(entries.length)}${gMore ? "+" : ""} ${entries.length === 1 ? "edge" : "edges"} · ${where}`;
  document.getElementById("rows").innerHTML = !entries.length
    ? `<div class="empty" style="padding:30px 0">Nothing under here.</div>`
    : `<table class="keys"><tbody>${entries.map(e => `
      <tr onclick="${e.dir ? "goNode(event" : "openNode(event"},'${esc(at(e))}')">
        <td class="k" title="${esc(e.name)}">${ico(e.dir ? "folder" : "file")} ${esc(e.name)}${e.dir ? "/" : ""}</td>
        <td class="kind" title="${esc(e.type || "")}">${esc(e.type || (e.dir ? "dir" : ""))}</td>
        <td class="sz">${e.dir ? "" : bytes(e.size)}</td>
        <td class="v" title="node ${esc(e.id)}, edge ${esc(e.edge)}${e.refs > 1 ? `, named by ${esc(e.refs)} edges` : ""}">
          #${esc(e.id)}${e.refs > 1 ? ` <span class="refs">×${esc(e.refs)}</span>` : ""}</td>
        ${isAdmin ? `<td class="act">
          <button class="ib" title="Move or rename" aria-label="Move ${esc(e.name)}"
                  onclick="moveNode(event,'${esc(at(e))}')">${ico("more")}</button>
          <button class="ib" title="${e.refs > 1 ? "Unlink here" : "Delete"}"
                  aria-label="${e.refs > 1 ? "Unlink" : "Delete"} ${esc(e.name)}"
                  onclick="dropNode(event,'${esc(at(e))}',${e.dir ? "true" : "false"},${Number(e.refs) || 1})">${ico("minus")}</button></td>` : ""}
      </tr>`).join("")}</tbody></table>`;
  const from = gAt * PAGE + 1;
  document.getElementById("gslider").hidden = gAt === 0 && !gMore;
  document.getElementById("gslide-at").textContent =
    entries.length ? `${num(from)}–${num(from + entries.length - 1)}${gMore ? "" : " of " + num(from + entries.length - 1)}` : "";
}

async function gPageBy(n) {
  const to = gAt + n;
  if (to < 0 || (n > 0 && !gMore)) return;
  gAt = to;
  const out = await loadGraph();
  if (out) showGraph(out);
}

function goNode(ev, path) { ev.preventDefault(); gPath = decodeURIComponent(path || "%2F"); gAt = 0; drawGraph(); }

async function openNode(ev, path) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  const q = "space=" + encodeURIComponent(current) + "&path=" + encodeURIComponent(path);
  const out = await api("node?" + q).catch(() => null);
  if (!out) return;
  if (out.error) return toast(out.error, "warn");
  const n = out.node || {};
  const ext = (path.split(".").pop() || "").toLowerCase();
  const type = out.type || EXT_TYPES[ext] || "";
  let shown;
  if (RAW_IMAGES.includes(type)) {
    shown = `<div class="filepic"><img alt="${esc(path)}" src="/api/admin/node?${q}&raw=1"></div>`;
  } else if (out.text != null) {
    let body = out.text;
    if (type.includes("json")) { try { body = JSON.stringify(JSON.parse(body), null, 2); } catch (e) {} }
    const luau = /luau|x-lua\b/.test(type) || ext === "luau" || ext === "lua";
    shown = luau ? `<pre class="code-ro">${luauHighlight(body)}</pre>` : `<pre>${esc(body)}</pre>`;
  } else if (out.hex != null) {
    shown = `<div class="meta">binary — first ${Math.min(512, out.size || 0)} bytes</div><pre>${esc(out.hex || "")}</pre>`;
  } else {
    shown = `<div class="empty" style="padding:20px 0">An interior node — open it from the list to see what hangs under it.</div>`;
  }
  // the node's own line: what a triple store knows that a path does not say
  const ids = `node ${esc(n.id)}${n.edge != null ? ` · edge ${esc(n.edge)}` : ""} · named by ${esc(n.refs)} ${n.refs === 1 ? "edge" : "edges"}`;
  show(`<div class="top"><h2>${esc(path)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(current)} · ${esc(ids)}</div>
      <div class="meta">${esc(type || (out.kind === "dir" ? "interior node" : "unknown type"))}${out.size != null ? " · " + bytes(out.size) : ""}${out.version != null ? " · v" + esc(out.version) : ""}${out.truncated ? " · truncated" : ""}</div>
      ${isAdmin ? `<div class="filter"><button onclick="linkNode(${Number(n.id) || 0})">${ico("link")} Link this node somewhere else</button></div>` : ""}
      ${shown}
    </div>`);
}

// ---- the graph, changed ------------------------------------------------------

async function newNode() {
  const name = (prompt("Name for the new node (interior)") || "").trim();
  if (!name) return;
  if (name.includes("/")) return toast("a name has no slashes in it — the path is where it goes", "warn");
  // a fresh key space has neither a graph store nor a file store: MKDIR is
  // what brings the graph into being, so a refusal naming the space means
  // the space itself is gone, not that the path is wrong
  const out = await write("graph_mkdir", { path: (gPath === "/" ? "" : gPath) + "/" + name });
  if (!out) return;                    // the server said why, in an alert
  if (out.ok) return drawGraph();
  toast(out.error || "could not make that node", "warn");
}

// A leaf typed here rather than uploaded: same graph_put the file input uses,
// with a text area for the body. The type comes from the extension when it is a
// text kind, so a .json/.md/.html leaf reads back as one; an image extension is
// ignored because what is being written is text.
function newLeaf() {
  show(`<div class="top"><h2>New leaf in ${esc(current)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">under <code>${esc(gPath)}</code> · no file needed</div>
      <div class="editor">
        <input id="nleaf-name" placeholder="name, e.g. note.txt" autocomplete="off">
        <textarea id="nleaf-body" rows="14" spellcheck="false" placeholder="leaf content"></textarea>
        <div class="row">
          <span class="fill"></span>
          <button class="primary" onclick="saveLeaf()">Create</button>
        </div>
      </div>
    </div>`);
}

async function saveLeaf() {
  const name = (document.getElementById("nleaf-name").value || "").trim();
  if (!name) { toast("a leaf name is required", "warn"); return; }
  if (name.includes("/")) { toast("a name has no slashes in it — the path is where it goes", "warn"); return; }
  const body = document.getElementById("nleaf-body").value;
  const ext = (name.split(".").pop() || "").toLowerCase();
  let type = EXT_TYPES[ext] || "text/plain";
  if (RAW_IMAGES.includes(type)) type = "text/plain";
  const path = (gPath === "/" ? "" : gPath) + "/" + name;
  // quiet: write() reports the failure itself; here we only handle the "exists"
  // answer, which comes back as data rather than an error
  const out = await write("graph_put", { path, type }, body, true);
  if (out && out.exists) {
    if (!confirm(`${path} is already there. Replace it?`)) return;
    if (!await write("graph_put", { path, type, overwrite: 1 }, body)) return;
  } else if (!out) {
    return;
  }
  toast(`Saved ${name}`, "ok");
  shut(); drawGraph();
}

// A path box that completes as it is typed, shared by Link and Move.
//
// Neither operation can be done from memory: Link needs a node to hang and a
// path to hang it at, Move needs a destination. So a box lists what is under
// the parent typed so far, puts the slash on when a directory is taken - and
// the next listing with it - and marks the names already in use, which the
// server would refuse anyway.
//
// One completer per box, each with its own listing cache, because the Link
// panel has two of them and they are looking at different places. A directory
// of more than 200 completes against the first 200 and the note says so.

const PC = {};                       // input id -> what that box is completing

function pathBox(id, value, label, hint) {
  return `<label>${esc(label)}
      <input id="${esc(id)}" autocomplete="off" spellcheck="false"
             value="${esc(value)}" placeholder="${esc(hint || "/teams/core/ada.json")}"></label>
    <div class="lk-list" id="${esc(id)}-list" hidden></div>`;
}

// took(row) is called with the row taken; submit() is what Enter does when no
// row is highlighted.
function pcStart(id, took, submit, focus) {
  PC[id] = { shown: [], pick: -1, seq: 0, cache: new Map(), took, submit };
  const box = document.getElementById(id);
  box.addEventListener("input", () => pcComplete(id));
  box.addEventListener("keydown", ev => pcKey(id, ev));
  box.addEventListener("focus", () => {
    for (const other of Object.keys(PC)) if (other !== id) pcHide(other);
    pcComplete(id);
  });
  if (focus) {
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
    pcComplete(id);
  }
}

function pcNote(msg) {
  const n = document.getElementById("pc-note");
  if (n) n.textContent = msg;
}

function pcHide(id) {
  const list = document.getElementById(id + "-list");
  if (list) list.hidden = true;
  if (PC[id]) PC[id].pick = -1;
}

const PC_HINT = "Tab or ↓ to complete a name.";

async function pcComplete(id) {
  const st = PC[id];
  const box = document.getElementById(id);
  if (!st || !box) return;
  const v = box.value;
  const cut = v.lastIndexOf("/");
  const parent = cut <= 0 ? "/" : v.slice(0, cut);
  const frag = v.slice(cut + 1).toLowerCase();
  if (!st.cache.has(parent)) {
    const seq = ++st.seq;
    const out = await api("graph?" + new URLSearchParams(
      { space: current, path: parent, limit: 200 })).catch(() => null);
    if (seq !== st.seq) return;                      // a later keystroke asked for another one
    st.cache.set(parent, !out || out.error || !out.graph ? null
      : { rows: Array.isArray(out.entries) ? out.entries : [], more: !!out.more });
  }
  const held = st.cache.get(parent);
  if (held === null) {
    pcHide(id);
    return pcNote(`${parent} is not a node in ${current}`);
  }
  st.shown = held.rows.filter(e => e.name.toLowerCase().startsWith(frag)).slice(0, 8);
  st.pick = -1;
  if (!st.shown.length) {
    pcHide(id);
    return pcNote(frag
      ? `nothing under ${parent} starts with that${held.more ? " (of the first 200)" : ""}`
      : `${parent} is empty`);
  }
  pcDraw(id);
  pcNote(held.more ? "the first 200 under this one" : PC_HINT);
}

function pcDraw(id) {
  const st = PC[id];
  const list = document.getElementById(id + "-list");
  list.hidden = false;
  list.innerHTML = st.shown.map((e, i) => `
    <div class="lk-row${i === st.pick ? " on" : ""}"
         onmousedown="event.preventDefault();pcTake('${esc(id)}',${i})">
      ${ico(e.dir ? "folder" : "file")}
      <span class="nm">${esc(e.name)}${e.dir ? "/" : ""}</span>
      <span class="id">#${esc(e.id)}${e.refs > 1 ? ` ×${esc(e.refs)}` : ""}</span>
      <span class="taken">${e.dir ? "" : "name taken"}</span>
    </div>`).join("");
}

// taking one: a directory keeps the path going, so it gets its slash and its
// listing at once; a leaf ends it. The panel is told which node it was.
function pcTake(id, i) {
  const st = PC[id];
  const e = st && st.shown[i];
  const box = document.getElementById(id);
  if (!e || !box) return;
  const cut = box.value.lastIndexOf("/");
  box.value = box.value.slice(0, cut + 1) + e.name + (e.dir ? "/" : "");
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);
  if (st.took) st.took(e, box.value);
  pcComplete(id);
}

function pcKey(id, ev) {
  const st = PC[id];
  if (!st) return;
  if (ev.key === "ArrowDown" || (ev.key === "Tab" && !ev.shiftKey)) {
    if (!st.shown.length) return;
    ev.preventDefault();
    if (ev.key === "Tab" && st.shown.length === 1) return pcTake(id, 0);
    st.pick = (st.pick + 1) % st.shown.length;
    pcDraw(id);
    return;
  }
  if (ev.key === "ArrowUp") {
    if (!st.shown.length) return;
    ev.preventDefault();
    st.pick = (st.pick - 1 + st.shown.length) % st.shown.length;
    pcDraw(id);
    return;
  }
  if (ev.key === "Enter") {
    ev.preventDefault();
    if (st.pick >= 0) return pcTake(id, st.pick);
    if (st.submit) st.submit();
  }
}

// a path from a box, or null with the reason said out loud
function pcWanted(id) {
  const path = (document.getElementById(id).value || "").trim();
  if (!path.startsWith("/")) { pcNote("the path is absolute: it starts at /"); return null; }
  if (path.endsWith("/")) { pcNote("the path needs a name at the end, not just a folder"); return null; }
  return path;
}

// LINK is the one a file store cannot do: a second edge onto a node that is
// already there, so the same content answers at two paths.
//
// Two boxes, because they are two different questions and one box could not
// answer both: walking the destination used to overwrite the id with whatever
// directory was stepped through, so a node picked first was gone by the time
// the path was finished. The top box finds the node - taking a row there fills
// the id in, and offers the same name under the path being browsed - and the
// bottom one says where the new edge goes.
function linkNode(id) {
  const here = gPath === "/" ? "" : gPath;
  show(`<div class="top"><h2>${ico("link")} Link a node</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(current)} · in ${esc(gPath)} · a second edge onto a node that is already there</div>
      <div class="linker">
        ${pathBox("lk-src", "/", "Node to link — find it by its path", "/today")}
        <label>Node id
          <input id="lk-id" autocomplete="off" spellcheck="false" inputmode="numeric"
                 value="${esc(id ? String(id) : "")}" placeholder="the # in the list, e.g. 5"></label>
        ${pathBox("lk-path", here + "/", "Path for the new edge", here + "/name")}
        <div class="row">
          <button class="primary" onclick="doLink()">${ico("link")} Link</button>
          <span class="lk-note" id="pc-note">${PC_HINT} Enter to link.</span>
        </div>
      </div>
    </div>`);
  // the source box fills the id, and proposes the same name under the path
  // being browsed while that box is still just the folder
  pcStart("lk-src", (e, value) => {
    document.getElementById("lk-id").value = e.id;
    const dest = document.getElementById("lk-path");
    if (dest.value === here + "/" || dest.value === "") dest.value = here + "/" + e.name;
    pcNote(`node ${e.id} · from ${value}`);
  }, doLink, !id);
  // the destination box does not touch the id: walking it is navigation
  pcStart("lk-path", null, doLink, !!id);
}

async function doLink() {
  const id = (document.getElementById("lk-id").value || "").trim();
  if (!/^\d+$/.test(id)) return pcNote("a node id is a number — the # column, or pick one above");
  const path = pcWanted("lk-path");
  if (path == null) return;
  if (!await write("graph_link", { id, path })) return;
  shut();
  const cut = path.lastIndexOf("/");
  gPath = cut <= 0 ? "/" : path.slice(0, cut);       // land where the new edge is
  gAt = 0;
  drawGraph();
}

// MV moves one edge. The node does not move - nothing about it changes - which
// is why this is the same box: the destination is a path like any other.
function moveNode(ev, path) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  show(`<div class="top"><h2>${ico("more")} Move</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(current)} · in ${esc(gPath)} · the edge moves, the node stays as it is</div>
      <div class="linker">
        <label>Moving<input value="${esc(path)}" readonly tabindex="-1"></label>
        ${pathBox("mv-to", path, "Move it to", path)}
        <div class="row">
          <button class="primary" onclick="doMove('${esc(enc(path))}')">${ico("more")} Move</button>
          <span class="lk-note" id="pc-note">${PC_HINT} Enter to move.</span>
        </div>
      </div>
    </div>`);
  pcStart("mv-to", e => {
    if (!e.dir) pcNote(`there is already a ${e.name} here — pick another name`);
  }, () => doMove(enc(path)), true);
}

async function doMove(from) {
  from = decodeURIComponent(from);
  const to = pcWanted("mv-to");
  if (to == null) return;
  if (to === from) { shut(); return; }
  if (!await write("graph_mv", { path: from, to })) return;
  shut();
  const cut = to.lastIndexOf("/");
  gPath = cut <= 0 ? "/" : to.slice(0, cut);
  gAt = 0;
  drawGraph();
}

// refs > 1 means the node is somewhere else too, so the honest offer is to take
// this edge away rather than to delete what is behind it.
async function dropNode(ev, path, isDir, refs) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  if (refs > 1) {
    if (!confirm(`${path} is named by ${refs} edges. Take this one away and leave the node?`)) return;
    if (await write("graph_unlink", { path })) drawGraph();
    return;
  }
  if (!confirm(`Delete ${path}${isDir ? " and everything under it" : ""}?`)) return;
  const out = await write("graph_rm", isDir ? { path, recursive: 1 } : { path }, null, true);
  if (out && out.notempty) {
    if (!confirm(`${path} is not empty. Delete it and everything under it?`)) return;
    if (!await write("graph_rm", { path, recursive: 1 })) return;
  } else if (!out) {
    return;
  }
  drawGraph();
}

async function uploadNodes(input) {
  const base = gPath === "/" ? "" : gPath;
  for (const f of input.files) {
    const path = base + "/" + f.name;
    const body = await f.arrayBuffer();
    let out = await write("graph_put", { path, type: f.type || "" }, body, true);
    if (out && out.exists) {
      if (!confirm(`${path} is already there. Replace it?`)) continue;
      out = await write("graph_put", { path, type: f.type || "", overwrite: 1 }, body);
    }
    if (!out) break;
  }
  input.value = "";
  drawGraph();
}

// ---- functions --------------------------------------------------------------
//
// KEYSF lists the stored functions in the space; they are not ordinary keys, so
// the Keys tab never shows them. GETF is the source. Admins SETF / REMF with
// RELOAD so every session picks the change up.

async function drawFunctions() {
  const pane = document.getElementById("pane");
  pane.innerHTML = head("functions") + `
    <div class="filter">
      <input id="fnmatch" placeholder="name glob, e.g. SHOP* or *API" value="${esc(fnMatch)}" autocomplete="off">
      <button onclick="applyFnMatch()">Filter</button>
      ${fnMatch ? `<button onclick="fnMatch='';drawFunctions()">Clear</button>` : ""}
      ${isAdmin ? `<button onclick="newFunction()">${ico("code")} New function</button>` : ""}
    </div>
    <div id="rows"><div class="empty" style="padding:40px 0">Reading…</div></div>`;
  document.getElementById("fnmatch").addEventListener("keydown", e => { if (e.key === "Enter") applyFnMatch(); });
  const out = await loadFunctions();
  if (!out) return;
  if (out.error) {
    document.getElementById("rows").innerHTML = `<div class="notice">${esc(out.error)}</div>`;
    return;
  }
  const rows = Array.isArray(out.functions) ? out.functions : [];
  document.querySelector(".head .count").textContent =
    `${num(out.total || rows.length)} ${(out.total || rows.length) === 1 ? "function" : "functions"}${fnMatch ? ` matching ${fnMatch}` : ""}`;
  document.getElementById("rows").innerHTML = !rows.length
    ? `<div class="empty" style="padding:40px 0">No functions${fnMatch ? " matching that name" : " in this space"}.</div>`
    : `<table class="keys"><tbody>${rows.map(r => `
        <tr onclick="openFunction('${esc(enc(r.name))}')">
          <td class="k" title="${esc(r.name)}">${esc(r.name)}</td>
          <td class="kind">${esc(r.kind || "luau")}${r.native ? `<br><span class="native" title="compiled to native code (--!native)">native</span>` : ""}</td>
          <td class="sz">${r.size == null ? "" : bytes(r.size)}</td>
          <td class="v">${esc(r.source ?? "")}</td>
        </tr>`).join("")}</tbody></table>`;
}

function applyFnMatch() {
  fnMatch = document.getElementById("fnmatch").value.trim();
  drawFunctions();
}

async function loadFunctions() {
  const q = new URLSearchParams({ space: current });
  if (fnMatch) q.set("match", fnMatch);
  return api("functions?" + q).catch(() => null);
}

// The settings a function carries in its own source: native code and its
// --@barch limits. A side panel beside the editor, opened by the gear next to
// Save, so the editor stays uncluttered; whether it is open is remembered.
function fnSide(source) {
  const open = appSetting("fnSide", "0") === "1";
  return `<aside class="fn-side" id="fn-side"${open ? "" : " hidden"} aria-label="Function settings">
    <h5>Function settings</h5>
    <label class="aot" title="Compile to native code (SETF … AOT). Kept as a --!native line at the top of the source, so it lasts through restarts and git sync.">
      <input type="checkbox" id="fn-aot" onchange="toggleNative(this.checked)"${luauNativeMarker(source ?? "") ? " checked" : ""}> Native (AOT)</label>
    <div class="sub">Compiled to machine code on Save.</div>
    <label class="lim">Deadline
      <input type="number" id="fn-deadline" min="1" step="1" inputmode="numeric" placeholder="default"
             onchange="setFnLimit('deadline_ms', this)"> ms</label>
    <div class="sub" id="fn-deadline-hint">Running time. Waiting on the network doesn't count; the wall ceiling, a multiple of this, does.</div>
    <label class="lim">Slice
      <input type="number" id="fn-slice" min="1" step="1" inputmode="numeric" placeholder="default"
             onchange="setFnLimit('slice_insns', this)"> insns</label>
    <div class="sub" id="fn-slice-hint">How many instructions run before the call gives its worker back.</div>
    <div class="sub bad" id="fn-hdr-note" hidden></div>
    <div class="sub">Kept in the source as <code>--@barch {…}</code> and applied on Save. Empty means the space's default.</div>
  </aside>`;
}

function editFunction(name, source, canEdit) {
  const fresh = name == null;
  return `<div class="editor">
    ${fresh ? `<input id="ek" placeholder="function name" autocomplete="off">` : ""}
    <div class="fn-body">
      <div class="fn-code">${codeEditor(source, canEdit ? `placeholder="Luau source"` : `disabled placeholder="too large to edit here"`)}</div>
      ${canEdit ? fnSide(source) : ""}
    </div>
    <div class="row">
      <input type="file" id="ef" accept=".luau,.lua,.txt" onchange="loadFunctionFile(this)" title="Load a file into the editor">
      <span class="fill"></span>
      ${canEdit ? `<button class="gear" id="fn-gear" title="Function settings: native code, deadline, slice" aria-label="Function settings"
              aria-controls="fn-side" aria-expanded="${appSetting("fnSide", "0") === "1"}" onclick="toggleFnSide()">${ico("gear")}</button>` : ""}
      <button class="primary" id="fn-save" onclick="saveFunction(${fresh ? "null" : `'${esc(enc(name))}'`})">Save</button>
      ${fresh ? "" : `<button id="fn-del" onclick="removeFunction('${esc(enc(name))}')">Delete</button>`}
    </div>
  </div>`;
}

// The Call box and its one-line terminal, shared by a stored function and one
// that is still being written. `e` is the escaped-encoded name, or null for a
// new function, whose name is still in the #ek box.
function callBlock(e, displayName) {
  const fresh = e == null;
  const arg = fresh ? "null" : `'${e}'`;
  return `<div class="fncall">
    <div class="row">
      <input id="call-args" placeholder="parameters, e.g. key or &quot;two words&quot; 'single quoted'" spellcheck="false" autocomplete="off" aria-label="Call parameters"
             onkeydown="if(event.key==='Enter')callFunction(${arg})">
      <button class="primary" onclick="callFunction(${arg})">${ico("play")} Call</button>
    </div>
    <pre class="cons-out" id="call-out" aria-live="polite"><span class="dim">CALLF ${fresh ? "&lt;name&gt;" : esc(displayName)} in ${esc(current)} as the web user.</span></pre>
  </div>`;
}

async function openFunction(name) {
  name = decodeURIComponent(name);
  const out = await api("function?space=" + encodeURIComponent(current) +
                        "&name=" + encodeURIComponent(name)).catch(() => null);
  if (!out) return;
  if (out.error) { toast(out.error, "warn"); return; }
  const shown = out.name || name;
  show(`<div class="top"><h2>${esc(shown)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox" data-fn="${esc(enc(shown))}">
      <div class="meta">${esc(current)} · ${esc(out.kind || "luau")}<span id="fn-native">${out.native ? " · native" : ""}</span>${out.size != null ? " · " + bytes(out.size) : ""}${out.truncated ? " · truncated" : ""}</div>
      ${isAdmin ? editFunction(shown, out.source ?? "", !out.truncated) : `<pre class="code-ro">${luauHighlight(out.source ?? "")}</pre>`}
      ${callBlock(esc(enc(shown)), shown)}
    </div>`);
  (callFunction._lastSaved ??= new Map()).set(shown, out.source ?? "");
  tabifyFunctionBody(current + "/" + shown);
  const ta = document.getElementById("ev");
  if (ta && ta._code) { ta._code.saved = out.source ?? ""; codeStatus(ta); }
}

// what Save and Call run: SETF with the body in the editor. Answers the
// server's reply; a refusal is shown by the caller, next to the code, rather
// than as a toast that is gone before the line number is read.
async function putFunction(name, body) {
  const q = new URLSearchParams({ space: current, name });
  const r = await fetch("/api/admin/function_put?" + q, { method: "POST", body });
  return r.json().catch(() => ({ error: "not JSON — " + r.status }));
}

// the save went through: the editor is clean, any old error mark is stale
function functionSaved(name, body) {
  (callFunction._lastSaved ??= new Map()).set(name, body);
  const ta = document.getElementById("ev");
  if (ta && ta._code) {
    ta._code.saved = body;
    if (ta._code.name != null && ta._code.name.endsWith("/")) codeViews.delete(ta._code.name);
    ta._code.name = current + "/" + name;
    ta._code.base = body;
    codeRemember(ta);
    const shown = document.getElementById("fn-native");
    if (shown) shown.textContent = luauNativeMarker(body) ? " · native" : "";
    codeClearError();
    codeStatus(ta);
  }
}

// SETF refused the body: mark the line it names and say why under the editor
function functionRefused(name, error) {
  const out = document.getElementById("call-out");
  const hit = codeMarkError(error);
  if (out) out.innerHTML = `<span class="dim">${esc(current)}&gt; SETF ${esc(name)}</span>\n` +
