    <div id="rows"><div class="empty" style="padding:40px 0">Walking…</div></div>`;
  gAt = 0;
  const out = await loadGraph();
  if (!out) return;
  if (!out.graph) {
    document.getElementById("rows").innerHTML =
      `<div class="empty" style="padding:40px 0">
         <b>${esc(current)}</b> has no graph — nothing has written one here.</div>`;
    return;
  }
  showGraph(out);
}

async function loadGraph() {
  const q = new URLSearchParams({ space: current, path: gPath, limit: PAGE, offset: gAt * PAGE });
  const seq = ++gSeq;
  const out = await api("graph?" + q).catch(() => null);
  if (out && out.error) { toast(out.error, "warn"); return null; }
  return seq === gSeq ? out : null;          // a later click has already asked for another page
}

function showGraph(out) {
  const entries = Array.isArray(out.entries) ? out.entries : [];
  gMore = !!out.more;
  gNode = out.node || null;
  const at = e => enc((gPath === "/" ? "" : gPath) + "/" + e.name);
  const where = gNode
    ? `node ${num(gNode.id)}${gNode.refs > 1 ? ` · ${num(gNode.refs)} edges in` : ""}`
    : "graph store";
  document.querySelector(".head .count").textContent =
    `${num(entries.length)}${gMore ? "+" : ""} ${entries.length === 1 ? "edge" : "edges"} · ${where}`;
  document.getElementById("rows").innerHTML = !entries.length
    ? `<div class="empty" style="padding:30px 0">Nothing under here.</div>`
    : `<table class="keys"><tbody>${entries.map(e => `
      <tr onclick="${e.dir ? "goNode(event" : "openNode(event"},'${esc(at(e))}')">
        <td class="k" title="${esc(e.name)}">${ico(e.dir ? "folder" : "file")} ${esc(e.name)}${e.dir ? "/" : ""}</td>
        <td class="kind" title="${esc(e.type || "")}">${esc(e.type || (e.dir ? "dir" : ""))}</td>
        <td class="sz">${e.dir ? "" : bytes(e.size)}</td>
        <td class="v" title="node ${esc(e.id)}, edge ${esc(e.edge)}${e.refs > 1 ? `, named by ${esc(e.refs)} edges` : ""}">
          #${esc(e.id)}${e.refs > 1 ? ` <span class="refs">×${esc(e.refs)}</span>` : ""}</td>
        ${isAdmin ? `<td class="act">
          <button class="ib" title="Move or rename" aria-label="Move ${esc(e.name)}"
                  onclick="moveNode(event,'${esc(at(e))}')">${ico("more")}</button>
          <button class="ib" title="${e.refs > 1 ? "Unlink here" : "Delete"}"
                  aria-label="${e.refs > 1 ? "Unlink" : "Delete"} ${esc(e.name)}"
                  onclick="dropNode(event,'${esc(at(e))}',${e.dir ? "true" : "false"},${Number(e.refs) || 1})">${ico("minus")}</button></td>` : ""}
      </tr>`).join("")}</tbody></table>`;
  const from = gAt * PAGE + 1;
  document.getElementById("gslider").hidden = gAt === 0 && !gMore;
  document.getElementById("gslide-at").textContent =
    entries.length ? `${num(from)}–${num(from + entries.length - 1)}${gMore ? "" : " of " + num(from + entries.length - 1)}` : "";
}

async function gPageBy(n) {
  const to = gAt + n;
  if (to < 0 || (n > 0 && !gMore)) return;
  gAt = to;
  const out = await loadGraph();
  if (out) showGraph(out);
}

function goNode(ev, path) { ev.preventDefault(); gPath = decodeURIComponent(path || "%2F"); gAt = 0; drawGraph(); }

async function openNode(ev, path) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  const q = "space=" + encodeURIComponent(current) + "&path=" + encodeURIComponent(path);
  const out = await api("node?" + q).catch(() => null);
  if (!out) return;
  if (out.error) return toast(out.error, "warn");
  const n = out.node || {};
  const ext = (path.split(".").pop() || "").toLowerCase();
  const type = out.type || EXT_TYPES[ext] || "";
  let shown;
  if (RAW_IMAGES.includes(type)) {
    shown = `<div class="filepic"><img alt="${esc(path)}" src="/api/admin/node?${q}&raw=1"></div>`;
  } else if (out.text != null) {
    let body = out.text;
    if (type.includes("json")) { try { body = JSON.stringify(JSON.parse(body), null, 2); } catch (e) {} }
    shown = `<pre>${esc(body)}</pre>`;
  } else if (out.hex != null) {
    shown = `<div class="meta">binary — first ${Math.min(512, out.size || 0)} bytes</div><pre>${esc(out.hex || "")}</pre>`;
  } else {
    shown = `<div class="empty" style="padding:20px 0">An interior node — open it from the list to see what hangs under it.</div>`;
  }
  // the node's own line: what a triple store knows that a path does not say
  const ids = `node ${esc(n.id)}${n.edge != null ? ` · edge ${esc(n.edge)}` : ""} · named by ${esc(n.refs)} ${n.refs === 1 ? "edge" : "edges"}`;
  show(`<div class="top"><h2>${esc(path)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(current)} · ${esc(ids)}</div>
      <div class="meta">${esc(type || (out.kind === "dir" ? "interior node" : "unknown type"))}${out.size != null ? " · " + bytes(out.size) : ""}${out.version != null ? " · v" + esc(out.version) : ""}${out.truncated ? " · truncated" : ""}</div>
      ${isAdmin ? `<div class="filter"><button onclick="linkNode(${Number(n.id) || 0})">${ico("link")} Link this node somewhere else</button></div>` : ""}
      ${shown}
    </div>`);
}

// ---- the graph, changed ------------------------------------------------------

async function newNode() {
  const name = (prompt("Name for the new node (interior)") || "").trim();
  if (!name) return;
  if (name.includes("/")) return toast("a name has no slashes in it — the path is where it goes", "warn");
  // a fresh key space has neither a graph store nor a file store: MKDIR is
  // what brings the graph into being, so a refusal naming the space means
  // the space itself is gone, not that the path is wrong
  const out = await write("graph_mkdir", { path: (gPath === "/" ? "" : gPath) + "/" + name });
  if (!out) return;                    // the server said why, in an alert
  if (out.ok) return drawGraph();
  toast(out.error || "could not make that node", "warn");
}

// A path box that completes as it is typed, shared by Link and Move.
//
// Neither operation can be done from memory: Link needs a node to hang and a
// path to hang it at, Move needs a destination. So a box lists what is under
// the parent typed so far, puts the slash on when a directory is taken - and
// the next listing with it - and marks the names already in use, which the
// server would refuse anyway.
//
// One completer per box, each with its own listing cache, because the Link
// panel has two of them and they are looking at different places. A directory
// of more than 200 completes against the first 200 and the note says so.

const PC = {};                       // input id -> what that box is completing

function pathBox(id, value, label, hint) {
  return `<label>${esc(label)}
      <input id="${esc(id)}" autocomplete="off" spellcheck="false"
             value="${esc(value)}" placeholder="${esc(hint || "/teams/core/ada.json")}"></label>
    <div class="lk-list" id="${esc(id)}-list" hidden></div>`;
}

// took(row) is called with the row taken; submit() is what Enter does when no
// row is highlighted.
function pcStart(id, took, submit, focus) {
  PC[id] = { shown: [], pick: -1, seq: 0, cache: new Map(), took, submit };
  const box = document.getElementById(id);
  box.addEventListener("input", () => pcComplete(id));
  box.addEventListener("keydown", ev => pcKey(id, ev));
  box.addEventListener("focus", () => {
    for (const other of Object.keys(PC)) if (other !== id) pcHide(other);
    pcComplete(id);
  });
  if (focus) {
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
    pcComplete(id);
  }
}

function pcNote(msg) {
  const n = document.getElementById("pc-note");
  if (n) n.textContent = msg;
}

function pcHide(id) {
  const list = document.getElementById(id + "-list");
  if (list) list.hidden = true;
  if (PC[id]) PC[id].pick = -1;
}

const PC_HINT = "Tab or ↓ to complete a name.";

async function pcComplete(id) {
  const st = PC[id];
  const box = document.getElementById(id);
  if (!st || !box) return;
  const v = box.value;
  const cut = v.lastIndexOf("/");
  const parent = cut <= 0 ? "/" : v.slice(0, cut);
  const frag = v.slice(cut + 1).toLowerCase();
  if (!st.cache.has(parent)) {
    const seq = ++st.seq;
    const out = await api("graph?" + new URLSearchParams(
      { space: current, path: parent, limit: 200 })).catch(() => null);
    if (seq !== st.seq) return;                      // a later keystroke asked for another one
    st.cache.set(parent, !out || out.error || !out.graph ? null
      : { rows: Array.isArray(out.entries) ? out.entries : [], more: !!out.more });
  }
  const held = st.cache.get(parent);
  if (held === null) {
    pcHide(id);
    return pcNote(`${parent} is not a node in ${current}`);
  }
  st.shown = held.rows.filter(e => e.name.toLowerCase().startsWith(frag)).slice(0, 8);
  st.pick = -1;
  if (!st.shown.length) {
    pcHide(id);
    return pcNote(frag
      ? `nothing under ${parent} starts with that${held.more ? " (of the first 200)" : ""}`
      : `${parent} is empty`);
  }
  pcDraw(id);
  pcNote(held.more ? "the first 200 under this one" : PC_HINT);
}

function pcDraw(id) {
  const st = PC[id];
  const list = document.getElementById(id + "-list");
  list.hidden = false;
  list.innerHTML = st.shown.map((e, i) => `
    <div class="lk-row${i === st.pick ? " on" : ""}"
         onmousedown="event.preventDefault();pcTake('${esc(id)}',${i})">
      ${ico(e.dir ? "folder" : "file")}
      <span class="nm">${esc(e.name)}${e.dir ? "/" : ""}</span>
      <span class="id">#${esc(e.id)}${e.refs > 1 ? ` ×${esc(e.refs)}` : ""}</span>
      <span class="taken">${e.dir ? "" : "name taken"}</span>
    </div>`).join("");
}

// taking one: a directory keeps the path going, so it gets its slash and its
// listing at once; a leaf ends it. The panel is told which node it was.
function pcTake(id, i) {
  const st = PC[id];
  const e = st && st.shown[i];
  const box = document.getElementById(id);
  if (!e || !box) return;
  const cut = box.value.lastIndexOf("/");
  box.value = box.value.slice(0, cut + 1) + e.name + (e.dir ? "/" : "");
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);
  if (st.took) st.took(e, box.value);
  pcComplete(id);
}

function pcKey(id, ev) {
  const st = PC[id];
  if (!st) return;
  if (ev.key === "ArrowDown" || (ev.key === "Tab" && !ev.shiftKey)) {
    if (!st.shown.length) return;
    ev.preventDefault();
    if (ev.key === "Tab" && st.shown.length === 1) return pcTake(id, 0);
    st.pick = (st.pick + 1) % st.shown.length;
    pcDraw(id);
    return;
  }
  if (ev.key === "ArrowUp") {
    if (!st.shown.length) return;
    ev.preventDefault();
    st.pick = (st.pick - 1 + st.shown.length) % st.shown.length;
    pcDraw(id);
    return;
  }
  if (ev.key === "Enter") {
    ev.preventDefault();
    if (st.pick >= 0) return pcTake(id, st.pick);
    if (st.submit) st.submit();
  }
}

// a path from a box, or null with the reason said out loud
function pcWanted(id) {
  const path = (document.getElementById(id).value || "").trim();
  if (!path.startsWith("/")) { pcNote("the path is absolute: it starts at /"); return null; }
  if (path.endsWith("/")) { pcNote("the path needs a name at the end, not just a folder"); return null; }
  return path;
}

// LINK is the one a file store cannot do: a second edge onto a node that is
// already there, so the same content answers at two paths.
//
// Two boxes, because they are two different questions and one box could not
// answer both: walking the destination used to overwrite the id with whatever
// directory was stepped through, so a node picked first was gone by the time
// the path was finished. The top box finds the node - taking a row there fills
// the id in, and offers the same name under the path being browsed - and the
// bottom one says where the new edge goes.
function linkNode(id) {
  const here = gPath === "/" ? "" : gPath;
  show(`<div class="top"><h2>${ico("link")} Link a node</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(current)} · in ${esc(gPath)} · a second edge onto a node that is already there</div>
      <div class="linker">
        ${pathBox("lk-src", "/", "Node to link — find it by its path", "/today")}
        <label>Node id
          <input id="lk-id" autocomplete="off" spellcheck="false" inputmode="numeric"
                 value="${esc(id ? String(id) : "")}" placeholder="the # in the list, e.g. 5"></label>
        ${pathBox("lk-path", here + "/", "Path for the new edge", here + "/name")}
        <div class="row">
          <button class="primary" onclick="doLink()">${ico("link")} Link</button>
          <span class="lk-note" id="pc-note">${PC_HINT} Enter to link.</span>
        </div>
      </div>
    </div>`);
  // the source box fills the id, and proposes the same name under the path
  // being browsed while that box is still just the folder
  pcStart("lk-src", (e, value) => {
    document.getElementById("lk-id").value = e.id;
    const dest = document.getElementById("lk-path");
    if (dest.value === here + "/" || dest.value === "") dest.value = here + "/" + e.name;
    pcNote(`node ${e.id} · from ${value}`);
  }, doLink, !id);
  // the destination box does not touch the id: walking it is navigation
  pcStart("lk-path", null, doLink, !!id);
}

async function doLink() {
  const id = (document.getElementById("lk-id").value || "").trim();
  if (!/^\d+$/.test(id)) return pcNote("a node id is a number — the # column, or pick one above");
  const path = pcWanted("lk-path");
  if (path == null) return;
  if (!await write("graph_link", { id, path })) return;
  shut();
  const cut = path.lastIndexOf("/");
  gPath = cut <= 0 ? "/" : path.slice(0, cut);       // land where the new edge is
  gAt = 0;
  drawGraph();
}

// MV moves one edge. The node does not move - nothing about it changes - which
// is why this is the same box: the destination is a path like any other.
function moveNode(ev, path) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  show(`<div class="top"><h2>${ico("more")} Move</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(current)} · in ${esc(gPath)} · the edge moves, the node stays as it is</div>
      <div class="linker">
        <label>Moving<input value="${esc(path)}" readonly tabindex="-1"></label>
        ${pathBox("mv-to", path, "Move it to", path)}
        <div class="row">
          <button class="primary" onclick="doMove('${esc(enc(path))}')">${ico("more")} Move</button>
          <span class="lk-note" id="pc-note">${PC_HINT} Enter to move.</span>
        </div>
      </div>
    </div>`);
  pcStart("mv-to", e => {
    if (!e.dir) pcNote(`there is already a ${e.name} here — pick another name`);
  }, () => doMove(enc(path)), true);
}

async function doMove(from) {
  from = decodeURIComponent(from);
  const to = pcWanted("mv-to");
  if (to == null) return;
  if (to === from) { shut(); return; }
  if (!await write("graph_mv", { path: from, to })) return;
  shut();
  const cut = to.lastIndexOf("/");
  gPath = cut <= 0 ? "/" : to.slice(0, cut);
  gAt = 0;
  drawGraph();
}

// refs > 1 means the node is somewhere else too, so the honest offer is to take
// this edge away rather than to delete what is behind it.
async function dropNode(ev, path, isDir, refs) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  if (refs > 1) {
    if (!confirm(`${path} is named by ${refs} edges. Take this one away and leave the node?`)) return;
    if (await write("graph_unlink", { path })) drawGraph();
    return;
  }
  if (!confirm(`Delete ${path}${isDir ? " and everything under it" : ""}?`)) return;
  const out = await write("graph_rm", isDir ? { path, recursive: 1 } : { path }, null, true);
  if (out && out.notempty) {
    if (!confirm(`${path} is not empty. Delete it and everything under it?`)) return;
    if (!await write("graph_rm", { path, recursive: 1 })) return;
  } else if (!out) {
    return;
  }
  drawGraph();
}

async function uploadNodes(input) {
  const base = gPath === "/" ? "" : gPath;
  for (const f of input.files) {
    const path = base + "/" + f.name;
    const body = await f.arrayBuffer();
    let out = await write("graph_put", { path, type: f.type || "" }, body, true);
    if (out && out.exists) {
      if (!confirm(`${path} is already there. Replace it?`)) continue;
      out = await write("graph_put", { path, type: f.type || "", overwrite: 1 }, body);
    }
    if (!out) break;
  }
  input.value = "";
  drawGraph();
}

// ---- functions --------------------------------------------------------------
//
// KEYSF lists the stored functions in the space; they are not ordinary keys, so
// the Keys tab never shows them. GETF is the source. Admins SETF / REMF with
// RELOAD so every session picks the change up.

async function drawFunctions() {
  const pane = document.getElementById("pane");
  pane.innerHTML = head("functions") + `
    <div class="filter">
      <input id="fnmatch" placeholder="name glob, e.g. SHOP* or *API" value="${esc(fnMatch)}" autocomplete="off">
      <button onclick="applyFnMatch()">Filter</button>
      ${fnMatch ? `<button onclick="fnMatch='';drawFunctions()">Clear</button>` : ""}
      ${isAdmin ? `<button onclick="newFunction()">${ico("code")} New function</button>` : ""}
    </div>
    <div id="rows"><div class="empty" style="padding:40px 0">Reading…</div></div>`;
  document.getElementById("fnmatch").addEventListener("keydown", e => { if (e.key === "Enter") applyFnMatch(); });
  const out = await loadFunctions();
  if (!out) return;
  if (out.error) {
    document.getElementById("rows").innerHTML = `<div class="notice">${esc(out.error)}</div>`;
    return;
  }
  const rows = Array.isArray(out.functions) ? out.functions : [];
  document.querySelector(".head .count").textContent =
    `${num(out.total || rows.length)} ${(out.total || rows.length) === 1 ? "function" : "functions"}${fnMatch ? ` matching ${fnMatch}` : ""}`;
  document.getElementById("rows").innerHTML = !rows.length
    ? `<div class="empty" style="padding:40px 0">No functions${fnMatch ? " matching that name" : " in this space"}.</div>`
    : `<table class="keys"><tbody>${rows.map(r => `
        <tr onclick="openFunction('${esc(enc(r.name))}')">
          <td class="k" title="${esc(r.name)}">${esc(r.name)}</td>
          <td class="kind">${esc(r.kind || "luau")}</td>
          <td class="sz">${r.size == null ? "" : bytes(r.size)}</td>
          <td class="v">${esc(r.source ?? "")}</td>
        </tr>`).join("")}</tbody></table>`;
}

function applyFnMatch() {
  fnMatch = document.getElementById("fnmatch").value.trim();
  drawFunctions();
}

async function loadFunctions() {
  const q = new URLSearchParams({ space: current });
  if (fnMatch) q.set("match", fnMatch);
  return api("functions?" + q).catch(() => null);
}

function editFunction(name, source, canEdit) {
  const fresh = name == null;
  return `<div class="editor">
    ${fresh ? `<input id="ek" placeholder="function name" autocomplete="off">` : ""}
    <textarea id="ev" class="fn-src" rows="16" spellcheck="false" ${canEdit ? "" : "disabled"}
      placeholder="${canEdit ? "Luau source" : "too large to edit here"}">${esc(source ?? "")}</textarea>
    <div class="row">
      <input type="file" id="ef" accept=".luau,.lua,.txt">
      <span class="fill"></span>
      <button class="primary" onclick="saveFunction(${fresh ? "null" : `'${esc(enc(name))}'`})">Save</button>
      ${fresh ? "" : `<button onclick="removeFunction('${esc(enc(name))}')">Delete</button>`}
    </div>
  </div>`;
}

async function openFunction(name) {
  name = decodeURIComponent(name);
  const out = await api("function?space=" + encodeURIComponent(current) +
                        "&name=" + encodeURIComponent(name)).catch(() => null);
  if (!out) return;
  if (out.error) return alert(out.error);
  show(`<div class="top"><h2>${esc(out.name || name)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(current)} · ${esc(out.kind || "luau")}${out.size != null ? " · " + bytes(out.size) : ""}${out.truncated ? " · truncated" : ""}</div>
      ${isAdmin ? editFunction(out.name || name, out.source ?? "", !out.truncated) : `<pre>${esc(out.source ?? "")}</pre>`}
      <div class="fncall">
        <div class="row">
          <input id="call-args" placeholder="parameters, e.g. key or &quot;two words&quot; 'single quoted'" spellcheck="false" autocomplete="off" aria-label="Call parameters"
                 onkeydown="if(event.key==='Enter')callFunction('${esc(enc(out.name || name))}')">
          <button class="primary" onclick="callFunction('${esc(enc(out.name || name))}')">${ico("play")} Call</button>
        </div>
        <pre class="cons-out" id="call-out" aria-live="polite"><span class="dim">CALLF ${esc(out.name || name)} in ${esc(current)} as the web user.</span></pre>
      </div>
    </div>`);
  tabifyFunctionBody();
}

async function callFunction(name) {
  name = decodeURIComponent(name);
  const box = document.getElementById("call-args"), out = document.getElementById("call-out");
  if (!box || !out) return;
  // Save-before-Call (on by default, toggle in app settings): SETF the
  // editor body first so the call runs what is on screen. Non-admins and
  // truncated sources have no editor; they call the stored copy as-is.
  if (isAdmin && saveBeforeCall()) {
    const ta = document.getElementById("ev");
    if (ta && !ta.disabled) {
      const body = ta.value;
      if (typeof body === "string" && body.trim() && body !== callFunction._lastSaved?.get(name)) {
        // write() alerts on failure; quiet it here so a failed save becomes
        // a yellow toast and the call is skipped, not two stacked dialogs
        const saved = await write("function_put", { name }, body, true).catch(() => null);
        if (!saved) { toast(`Not called — ${name} would not compile`, "warn"); return; }
        toast(`Saved ${name}`, "ok");
        (callFunction._lastSaved ??= new Map()).set(name, body);
      }
    }
  }
  let args;
  try { args = splitArgs(box.value.trim()); } catch (e) { out.innerHTML = `<span class="rerr">(error) ${esc(e.message)}</span>`; return; }
  const quote = a => /[\s"'\\]/.test(a) || a === "" ? JSON.stringify(a) : a;
  const shown = ["CALLF", name, ...args].map(quote).join(" ");
  out.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n…`;
  const r = await fetch("/api/admin/resp?" + new URLSearchParams({ space: current }),
    { method: "POST", body: JSON.stringify({ args: ["CALLF", name, ...args] }) });
  const res = await r.json().catch(() => ({ error: "not JSON — " + r.status }));
  if (!res.ok) {
    // yellow toast for a failed call; the red inline line keeps the detail
    toast(`Call to ${name} failed`, "warn");
    out.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n` +
      `<span class="rerr">(error) ${esc(res.error || "failed")}</span>`;
    return;
  }
  out.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n` + renderReply(res.reply, "");
}

// Tab inside the function body inserts indentation instead of moving focus.
// Shift+Tab removes one level; Esc leaves the textarea. The unit is spaces
// (tabWidth(): 2, 4 or 8, default 4, from app settings) so rendering matches
// insertion whatever the browser default of 8 would do to a real tab.
function tabifyFunctionBody() {
  const ta = document.getElementById("ev");
  if (!ta || ta.disabled || ta.dataset.tabify) { applyTabWidth(); return; }
  ta.dataset.tabify = "1";
  applyTabWidth();
  ta.addEventListener("keydown", e => {
    if (e.key === "Tab") {
      e.preventDefault();
      insertFunctionTab(ta, e.shiftKey);
    } else if (e.key === "Escape") {
      ta.blur();
    }
  });
}

function tabUnit() {
  return " ".repeat(tabWidth());
}

function insertFunctionTab(ta, outdent) {
  const unit = tabUnit();
  const start = ta.selectionStart ?? ta.value.length;
  const end = ta.selectionEnd ?? start;
  if (outdent) {
    // remove one unit (spaces) or one tab at the start of each selected line
    const before = ta.value.slice(0, start);
    const sel = ta.value.slice(start, end);
    const after = ta.value.slice(end);
    const sol = before.lastIndexOf("\n") + 1;
    const head = before.slice(sol);
    const lines = (head + sel).split("\n");
    const fixed = lines.map(l => {
      if (l.startsWith(unit)) return l.slice(unit.length);
      if (l.startsWith("\t")) return l.slice(1);
      return l.replace(/^ {1,8}/, m => m.length >= unit.length ? m.slice(unit.length) : "");
    });
    const joined = fixed.join("\n");
    ta.value = before.slice(0, sol) + joined + after;
    const moved = joined.length - (head + sel).length;
    ta.selectionStart = start + (fixed[0].length - lines[0].length);
    ta.selectionEnd = end + moved;
    return;
  }
  if (start !== end) {
    // indent every selected line by one unit
    const before = ta.value.slice(0, start);
    const sel = ta.value.slice(start, end);
    const after = ta.value.slice(end);
    const sol = before.lastIndexOf("\n") + 1;
    const joined = (before.slice(sol) + sel).split("\n").map(l => unit + l).join("\n");
    ta.value = before.slice(0, sol) + joined + after;
    ta.selectionStart = start + unit.length;
    ta.selectionEnd = start + joined.length - before.slice(sol).length;
    return;
  }
  // no selection: insert one unit at the caret
  ta.setRangeText(unit, start, end, "end");
}

async function saveFunction(name) {
  name = name == null ? document.getElementById("ek").value.trim() : decodeURIComponent(name);
  if (!name) return alert("a function name is required");
  const file = document.getElementById("ef").files[0];
  const body = file || document.getElementById("ev").value;
  if (file && file.size > 512000) return alert("a value is at most 512 kB; that file is " + bytes(file.size));
  if (typeof body === "string" && !body.trim()) return alert("source is required");
  if (!confirm(`SETF ${name} in ${current}? Every connection reloads it.${careful()}`)) return;
  // quiet the alert: success is a green toast, failure a yellow one
  if (await write("function_put", { name }, body, true).catch(() => null)) {
    (callFunction._lastSaved ??= new Map()).set(name, typeof body === "string" ? body : "");
    toast(`Saved ${name}`, "ok");
    shut(); drawFunctions();
  } else {
    toast(`${name} would not compile`, "warn");
  }
}

async function removeFunction(name) {
  name = decodeURIComponent(name);
  if (!confirm(`REMF ${name} from ${current}? This cannot be undone.${careful()}`)) return;
  if (await write("function_rm", { name })) { shut(); drawFunctions(); }
}

function newFunction() {
  const src = "function call()\n    return \"ok\"\nend\n";
  show(`<div class="top"><h2>New function in ${esc(current)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">${editFunction(null, src, true)}</div>`);
  tabifyFunctionBody();
}

// ---- RESP console (admins) --------------------------------------------------
//
// One command at a time, run in the space that is open with `sp:call` on the server -
// barch.call bound to that space, as the route user. The list is app/commands.json,
// written by make_commands.py out of the command reference in docs/index.html.

let COMMANDS = null, consCmd = "GET", consHistory = [];
try { consHistory = JSON.parse(localStorage.getItem("resp-history") || "[]"); } catch (e) {}

async function loadCommands() {
  if (Array.isArray(COMMANDS) && COMMANDS.length) return COMMANDS;
  for (const url of ["/api/admin/commands"]) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const j = await r.json();
      const list = Array.isArray(j) ? j : j.commands;
      if (Array.isArray(list) && list.length) { COMMANDS = list; return COMMANDS; }
    } catch (e) {}
  }
  COMMANDS = [];
  return COMMANDS;
}

// the argument line, split the way a shell would: "two words" and 'two words' are
// one argument, and a backslash escapes the next character (not inside single quotes)
function splitArgs(line) {
  const out = []; let cur = "", q = null, have = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === q) { q = null; continue; }
      if (ch === "\\" && q === '"' && i + 1 < line.length) { cur += line[++i]; continue; }
      cur += ch; continue;
    }
    if (ch === "\\" && i + 1 < line.length) { cur += line[++i]; continue; }
    if (ch === '"' || ch === "'") { q = ch; have = true; continue; }
    if (/\s/.test(ch)) { if (have || cur) out.push(cur); cur = ""; have = false; continue; }
    cur += ch;
  }
  if (q) throw new Error("an unclosed " + q);
  if (have || cur) out.push(cur);
  return out;
}

// the docs' example is a transcript: take the arguments off the first line that runs this command
function exampleArgs(c) {
  const line = (c.example || "").split("\n").find(l => l === c.name || l.startsWith(c.name + " "));
  return line ? line.slice(c.name.length).trim() : "";
}

async function openConsole() {
  const list = await loadCommands();
  const fams = [...new Set(["Stored Procs", ...list.map(c => c.family)])].filter(
    f => list.some(c => c.family === f));
  show(`<div class="top"><h2>${ico("terminal")} RESP console · ${esc(current)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox console">
      <label class="cl">Command
        <select id="cons-cmd" onchange="pickCommand(this.value)">${fams.map(f => `
          <optgroup label="${esc(f)}">${list.filter(c => c.family === f).map(c =>
            `<option value="${esc(c.name)}"${c.name === consCmd ? " selected" : ""}>${esc(c.name)}${c.dangerous ? "  ⚠" : ""}</option>`).join("")}</optgroup>`).join("")}
        </select></label>
      <div class="cons-hint" id="cons-hint"></div>
      <div class="cons-run">
        <input id="cons-args" spellcheck="false" autocomplete="off" aria-label="Arguments"
               onkeydown="if(event.key==='Enter')runCommand()">
        <button class="primary" onclick="runCommand()">${ico("play")} Run</button>
      </div>
      <pre class="cons-out" id="cons-out" aria-live="polite"><span class="dim">Runs in ${esc(current)} as the web user; its grants decide what is allowed. KEYS, RANGE and VALUES cannot run from a script.</span></pre>
      <div class="cons-hist" id="cons-hist"></div>
    </div>`);
  pickCommand(consCmd);
  drawHistory();
  if (!list.length) {
    document.getElementById("cons-hint").innerHTML =
      `<div class="sum">The command list did not load (commands.json). Type a command name in the box, or put commands.json next to the page.</div>`;
  }
  document.getElementById("cons-args").focus();
}

function pickCommand(name) {
  const c = (COMMANDS || []).find(x => x.name === name);
  if (!c) return;
  consCmd = name;
  const ex = exampleArgs(c);
  document.getElementById("cons-hint").innerHTML = `
    <code class="syn">${esc(c.syntax || c.name)}</code>
    ${c.dangerous ? `<span class="warn">⚠ dangerous</span>` : c.write ? `<span class="wr">writes</span>` : ""}
    <div class="sum">${esc(c.summary)}</div>
    ${ex ? `<div class="ex">e.g. <a href="#" onclick="event.preventDefault();useExample()">${esc(c.name)} ${esc(ex)}</a></div>` : ""}`;
  const box = document.getElementById("cons-args");
  box.placeholder = ex ? ex : "arguments, if any";
}

function useExample() {
  const c = COMMANDS.find(x => x.name === consCmd);
  const box = document.getElementById("cons-args");
  box.value = exampleArgs(c); box.focus();
}

async function runCommand(line) {
  const c = COMMANDS.find(x => x.name === consCmd);
  const box = document.getElementById("cons-args"), out = document.getElementById("cons-out");
  if (line != null) box.value = line;
  let args;
  try { args = splitArgs(box.value.trim()); } catch (e) { out.innerHTML = `<span class="rerr">(error) ${esc(e.message)}</span>`; return; }
  // someone who types the command name as well has not asked for it twice
  if (args.length && args[0].toUpperCase() === c.name) args.shift();
  const quote = a => /[\s"'\\]/.test(a) || a === "" ? JSON.stringify(a) : a;
  const argLine = args.map(quote).join(" ");
  const shown = [c.name, ...args].map(quote).join(" ");
  if (c.dangerous && !confirm(`${shown}\n\nThis command is marked dangerous. Run it in ${current}?`)) return;
  if (c.write && current === "configuration" && !confirm(`${shown}${careful()}`)) return;
  out.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n…`;
  const r = await fetch("/api/admin/resp?" + new URLSearchParams({ space: current }),
    { method: "POST", body: JSON.stringify({ args: [c.name, ...args] }) });
  const res = await r.json().catch(() => ({ error: "not JSON — " + r.status }));
  out.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n` +
    (res.ok ? renderReply(res.reply, "") : `<span class="rerr">(error) ${esc(res.error || "failed")}</span>`);
  consHistory = [{ cmd: c.name, args: argLine, space: current },
    ...consHistory.filter(h => !(h.cmd === c.name && h.args === argLine && h.space === current))].slice(0, 12);
  try { localStorage.setItem("resp-history", JSON.stringify(consHistory)); } catch (e) {}
  drawHistory();
}

// redis-cli's way of writing a reply
function renderReply(r, pad) {
  if (!r) return "(nil)";
  switch (r.t) {
    case "nil": return `<span class="dim">(nil)</span>`;
    case "int": return `(integer) ${esc(r.v)}`;
    case "num": return `(double) ${esc(r.v)}`;
    case "bool": return `(${r.v ? "true" : "false"})`;
    case "str": return esc(JSON.stringify(r.v)) + (r.cut ? `<span class="dim"> … (${num(r.len)} bytes, cut)</span>` : "");
    case "bin": return `<span class="dim">(binary, ${num(r.len)} bytes)</span> ${esc(r.v)}${r.len > 512 ? " …" : ""}`;
    case "arr": {
      if (!r.v.length) return `<span class="dim">(empty array)</span>`;
      const w = String(r.v.length).length;
      return r.v.map((x, i) => (i ? pad : "") + `${String(i + 1).padStart(w)}) ` + renderReply(x, pad + " ".repeat(w + 2))).join("\n")
        + (r.len > r.v.length ? `\n${pad}<span class="dim">… ${num(r.len - r.v.length)} more</span>` : "");
    }
    case "map": {
      if (!r.v.length) return `<span class="dim">(empty map)</span>`;
      const w = String(r.v.length).length;
      return r.v.map(([k, x], i) => (i ? pad : "") + `${String(i + 1).padStart(w)}# ${renderReply(k, pad)} => ` + renderReply(x, pad + " ".repeat(w + 2))).join("\n");
    }
  }
  return esc(JSON.stringify(r.v));
}

function drawHistory() {
  const box = document.getElementById("cons-hist");
  if (!box) return;
  box.innerHTML = consHistory.length ? `<div class="hh">Recent</div>` + consHistory.map((h, i) => `
    <a href="#" onclick="event.preventDefault();replay(${i})"><span class="sp">${esc(h.space)}</span> ${esc(h.cmd)} ${esc(h.args)}</a>`).join("") : "";
}

function replay(i) {
  const h = consHistory[i];
  if (!h) return;
  document.getElementById("cons-cmd").value = h.cmd;
  pickCommand(h.cmd);
  document.getElementById("cons-args").value = h.args;
  document.getElementById("cons-args").focus();
}

// ---- configuration --------------------------------------------------------

// Settings that only take a fixed set of values, read out of configuration.cpp. Anything
// not listed is free text or a number and stays a text box; a value the server reports that
// is not in the list (a size for aof_durability, say) is added so it is not lost.
const ONOFF = ["on", "off"];
const EVICTIONS = ["volatile-lru", "allkeys-lru", "volatile-lfu", "allkeys-lfu", "volatile-random", "allkeys-random"];
const CONFIG_ENUMS = {
  eviction_policy: ["none", ...EVICTIONS],
  "maxmemory-policy": ["noeviction", ...EVICTIONS],
  compression: ["none", "zstd"],
  arena_map: ["all", "leaves", "nodes", "off"],
  aof_durability: ["none", "timer", "each"],
  active_defrag: ONOFF, ordered_keys: ONOFF, hybrid_keys: ONOFF,
  static_bloom_filter: ONOFF, traffic_capture: ONOFF, cgroup_memory_control: ONOFF,
};

function configField(g, n) {
  const opts = CONFIG_ENUMS[g.name];
  const go = `onkeydown="if(event.key==='Enter')setConfig('${esc(enc(g.name))}',${n},${g.host ? "true" : "false"})"`;
  if (!opts) return `<input class="cv" id="cv${n}" value="${esc(g.value)}" spellcheck="false" ${go}>`;
  const all = opts.includes(g.value) ? opts : [g.value, ...opts];
  return `<select class="cv" id="cv${n}" aria-label="${esc(g.name)}" ${go}>${all.map(o =>
    `<option value="${esc(o)}"${o === g.value ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}

// The server's own settings (CONFIG GET / SET), in a modal so the key space underneath
// keeps its place. Not tied to the space that is open.
async function openServer() {
  show(`<div class="top"><h2>Server configuration</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox"><div class="empty" style="padding:30px 0">Reading…</div></div>`);
  const out = await api("config").catch(() => null);
  if (!out) return shut();
  document.querySelector("#panel .valuebox").innerHTML = `
    ${out.global_error ? `<div class="notice">${esc(out.global_error)}</div>` : ""}
    ${isAdmin ? `<div class="notice small">These are the server's live settings and take effect at once; some
      only matter after a restart, and a value the server refuses is reported. Where it listens is always
      locked. ${out.here
        ? "You are on the machine itself, so the host directories and files, TLS, traffic capture and git sync can be changed too - carefully."
        : "The host directories and files, TLS, traffic capture and git sync can only be changed from the machine itself (127.0.0.1)."}</div>` : ""}
    <table class="keys cfg"><tbody>${(out.global || []).map((g, n) => `
      <tr>
        <td class="k" title="${esc(g.name)}">${esc(g.name)}</td>
        <td class="v">${isAdmin && !g.locked
          ? configField(g, n)
          : `<span class="${g.locked ? "locked" : ""}" ${g.locked ? `title="${esc(g.why || "locked")}"` : ""}>${esc(g.value)}</span>`}</td>
        ${isAdmin ? `<td class="act">${g.locked ? "" : `<button class="ib" title="Set" aria-label="Set ${esc(g.name)}"
              onclick="setConfig('${esc(enc(g.name))}',${n},${g.host ? "true" : "false"})">${ico("check")}</button>`}</td>` : ""}
      </tr>`).join("")}</tbody></table>`;
}

// The gear beside the count: what is set for this one space. They are keys in the
// `configuration` space named <space>.<option>; here they are shown as <option>, and what
// is not set runs on the server defaults. Read only - to change one, open the
// `configuration` space and edit the key, carefully: shards cannot change once a space
// has data, and fs_source names code the server runs.
async function openSpaceConfig() {
  const out = await api("config").catch(() => null);
  if (!out) return;
  const mine = (out.spaces || {})[current] || {};
  const keys = Object.keys(mine).sort();
  show(`<div class="top"><h2>${esc(current)} configuration</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      ${keys.length
        ? `<table class="keys"><tbody>${keys.map(k => `
            <tr><td class="k" title="${esc(k)}">${esc(k)}</td><td class="v">${esc(mine[k])}</td></tr>`).join("")}</tbody></table>`
        : `<div class="empty" style="padding:20px 0">Nothing is set for this space; it runs on the server defaults.</div>`}
      <div class="meta" style="margin-top:12px">Read only. These are the keys named <code>${esc(current)}.&lt;option&gt;</code> in the
        <b>configuration</b> space, which can be edited there like any other space.</div>
    </div>`);
}

async function setConfig(name, n, host) {
  name = decodeURIComponent(name);
  const box = document.getElementById("cv" + n);
  if (!box) return;
  const warn = host
    ? "\n\nCAREFUL: this is a path or file on the host. The server will read, write or load code from what you give it."
    : "";
  if (!confirm(`CONFIG SET ${name} ${box.value}\n\nThis changes the running server.${warn}`)) return;
  const out = await write("config_set", { name }, box.value);
  if (out) {
    if (box.tagName === "SELECT" && ![...box.options].some(o => o.value === out.value)) box.add(new Option(out.value, out.value));
    box.value = out.value; toast(name + " = " + out.value);
  }
}

// ---- statistics -----------------------------------------------------------

async function drawStats() {
  const pane = document.getElementById("pane");
  pane.innerHTML = head("statistics") + `<div id="rows"><div class="empty" style="padding:40px 0">Reading…</div></div>`;
  const out = await api("stats").catch(() => null);
  if (!out) return;
  const table = rows => `<table class="keys"><tbody>${(rows || []).map(r => `
    <tr><td class="k">${esc(r.name)}</td><td class="v">${esc(r.value)}</td></tr>`).join("")}</tbody></table>`;
  document.getElementById("rows").innerHTML = `
    <h4>Server</h4>${table(out.server)}
    <h4>Shard 0 of <code>${esc(out.shard.space)}</code></h4>
    <div class="notice small">INFO SHARD reads the connection's key space, and the
      route runs in <code>${esc(out.shard.space)}</code> — so this describes that
      space whichever one is selected on the left.</div>
    ${table(out.shard.lines)}
    <h4>Allocator</h4>${table(out.stats)}
    <h4>Operations</h4>${table(out.ops)}`;
}


// ---- sign-in --------------------------------------------------------------
//
// Self-contained: no /shop pages. Sign in or register against
// /api/spaces-user/* (USERS in this space). First account becomes admin.

async function authCall(op, body) {
  const r = await fetch("/api/spaces-user/" + op,
    { method: "POST", body: JSON.stringify(body) });
  return { status: r.status, out: await r.json().catch(() => ({})) };
}

function openAuth(mode) {
  const signin = mode ? mode !== "register" : !needsAdmin;
  show(`<div class="top"><h2>${signin ? "Sign in" : "Create an account"}</h2>`
    + `<button onclick="shut()">Close</button></div>
    <div class="valuebox"><div class="auth-card" style="box-shadow:none;margin:0;max-width:none">
      <p class="sub">${needsAdmin && !signin
        ? "This server has no admin yet — whoever creates the first account becomes it."
        : "The viewer reads every space this server has."}</p>
      <div class="err" id="auth-err" style="display:none"></div>
      <form id="auth-f">
        ${signin ? "" : `<div><label for="auth-name">Name</label>`
          + `<input id="auth-name" name="name" autocomplete="name" placeholder="Your name"></div>`}
        <div><label for="auth-email">Email</label>
          <input id="auth-email" name="email" type="email" required placeholder="you@example.com"></div>
        <div><label for="auth-password">Password</label>
          <input id="auth-password" name="password" type="password" required
            placeholder="${signin ? "Your password" : "At least 6 characters"}"></div>
        <button type="submit">${signin ? "Sign in" : "Create account"}</button>
      </form>
      <div class="foot">${signin
        ? `New here? <a href="#" onclick="event.preventDefault();openAuth('register')">Create an account</a>`
        : needsAdmin
          ? `The account you make is the admin of this server.`
          : `Have one? <a href="#" onclick="event.preventDefault();openAuth('signin')">Sign in</a>`}</div>
    </div></div>`);
  document.getElementById("auth-f").addEventListener("submit", async e => {
    e.preventDefault();
    const err = document.getElementById("auth-err");
    err.style.display = "none";
    const email = document.getElementById("auth-email").value;
    const password = document.getElementById("auth-password").value;
    const nameEl = document.getElementById("auth-name");
    const { status, out } = await authCall(signin ? "signon" : "register",
      signin ? { email, password } : { email, password, name: nameEl ? nameEl.value : "" });
    if (status >= 200 && status < 300 && !out.error && out.ok !== false) {
      shut(); boot();
    } else {
      err.textContent = out.error || "could not sign in";
      err.style.display = "block";
    }
  });
}

// The header shows who is signed in, and the exit door signs out:
// POST /api/spaces-user/signout clears the session server-side, then the
// page reboots into the sign-in form (or the local-admin guest, if no
// admin exists yet).
function setUser(user) {
  const label = document.getElementById("head-user");
  const btn = document.getElementById("signout-btn");
  if (user && user.email) {
    label.textContent = user.email;
    label.hidden = false;
    btn.hidden = false;
    btn.onclick = signout;
  } else {
    label.textContent = "";
    label.hidden = true;
    btn.hidden = true;
    btn.onclick = null;
  }
}

async function signout() {
  await fetch("/api/spaces-user/signout", { method: "POST" }).catch(() => null);
  setUser(null);                       // signed out is signed out, whatever comes next
  await boot();
}


// ---- export and import ------------------------------------------------------
//
// EXPORT writes a key space as the commands that would rebuild it - SET, HSET,
// RPUSH, ZADD - as a RESP stream; IMPORT replays one. The file is on the
// server's filesystem, not this machine's, which is the first thing the panel
// says, and the pair is offered only to a browser on the server itself.
//
// An import merges: keys the stream names are overwritten, keys it does not are
// left alone. That is the right default for a way back from a bad state, and
// the wrong one if a replacement was meant, so the panel says so out loud.

function transferNote(msg, kind) {
  const n = document.getElementById("tr-note");
  if (!n) return;
  n.textContent = msg;
  n.className = "notice small" + (kind === "ok" ? " ok" : kind === "warn" ? " warn" : "");
}

function notLocal() {
  return `<div class="notice small warn">The file is written and read on the machine the
    server runs on, so this is only offered from a browser on that machine (127.0.0.1).
    You are somewhere else.</div>`;
}

function openTransfer(ev, name) {
  ev.preventDefault();
  ev.stopPropagation();
  name = decodeURIComponent(name);
  show(`<div class="top"><h2>${ico("transfer")} Export or import · ${esc(name)}</h2>
      <button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(name)} · a RESP command stream, on the server's filesystem</div>
      ${isHere ? `<div class="linker">
        <label>File, on the server
          <input id="tr-path" autocomplete="off" spellcheck="false"
                 value="${esc(name)}.resp" placeholder="${esc(name)}.resp"></label>
        <div class="row">
          <button class="primary" onclick="doTransfer('export','${esc(enc(name))}')">${ico("transfer")} Export</button>
          <button onclick="doTransfer('import','${esc(enc(name))}')">${ico("transfer")} Import</button>
        </div>
        <div class="notice small" id="tr-note">A relative path lands where the server runs.
          Import merges into what is already there; clear the space first to replace it.</div>
      </div>` : notLocal()}
    </div>`);
  if (isHere) document.getElementById("tr-path").focus();
}

async function doTransfer(op, name) {
  name = decodeURIComponent(name);
  const path = (document.getElementById("tr-path").value || "").trim();
  if (!path) return transferNote("a file path is needed", "warn");
  if (op === "import" && !confirm(
      `Replay ${path} into ${name}?\n\nKeys the file names are overwritten. Keys it does not name are left alone.`))
    return;
  transferNote(op === "export" ? "writing…" : "replaying…");
  const out = await write(op, { space: name, path });
  if (!out) return transferNote("it did not run — see the message above", "warn");
  transferNote(`${num(out.keys)} ${out.keys === 1 ? "key" : "keys"} ${op === "export" ? "written to" : "read from"} ${out.path}`, "ok");
  if (op === "import") {
    const list = await api("spaces").catch(() => null);
    if (list) { spaces = list.spaces || []; drawSpaces(); }
    if (name === current) draw();
  }
}

function openTransferAll(ev) {
  ev.preventDefault();
  show(`<div class="top"><h2>${ico("transfer")} Export or import every space</h2>
      <button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">a file per space, named after it, on the server's filesystem</div>
      ${isHere ? `<div class="linker">
        <label>Directory, on the server
          <input id="tr-path" autocomplete="off" spellcheck="false" value="." placeholder="."></label>
        <div class="row">
          <button class="primary" onclick="doTransferAll('export_all')">${ico("transfer")} Export all</button>
          <button onclick="doTransferAll('import_all')">${ico("transfer")} Import all</button>
        </div>
        <div class="notice small" id="tr-note">Export writes &lt;space&gt;.resp for every space that can be
          opened. Import looks for &lt;space&gt;.resp beside each space it finds and merges it in — a space
          that is gone has to be made first, with the + above.</div>
        <div id="tr-rows"></div>
      </div>` : notLocal()}
    </div>`);
  if (isHere) document.getElementById("tr-path").focus();
}

async function doTransferAll(op) {
  const dir = (document.getElementById("tr-path").value || "").trim();
  if (!dir) return transferNote("a directory is needed", "warn");
  if (op === "import_all" && !confirm(
      `Replay every .resp in ${dir} into the space it is named after?\n\n` +
      `Spaces that are not there are made. Keys the files name are overwritten.`))
    return;
  transferNote(op === "export_all" ? "writing…" : "replaying…");
  document.getElementById("tr-rows").innerHTML = "";
  const out = await write(op, { dir });
  if (!out) return transferNote("it did not run — see the message above", "warn");
  const rows = Array.isArray(out.spaces) ? out.spaces : [];
  const bad = rows.filter(r => r.error).length;
  transferNote(`${num(rows.length)} ${rows.length === 1 ? "space" : "spaces"} in ${esc(out.dir)}`
    + (bad ? `, ${num(bad)} of them refused` : ""), bad ? "warn" : "ok");
  document.getElementById("tr-rows").innerHTML = !rows.length ? "" :
    `<table class="keys"><tbody>${rows.map(r => `
      <tr><td class="k">${esc(r.space)}</td>
          <td class="v">${r.error ? esc(r.error) : num(r.keys) + " keys"}</td></tr>`).join("")}</tbody></table>`;
  if (op === "import_all") {
    const list = await api("spaces").catch(() => null);
    if (list) { spaces = list.spaces || []; drawSpaces(); }
    draw();
  }
}

// ---- shell ----------------------------------------------------------------

function head(what) {
  const gear = current
    ? `<button class="gear" title="Configuration of ${esc(current)}" aria-label="Configuration of ${esc(current)}"
              onclick="openSpaceConfig()">${ico("gear")}</button>` : "";
  return `<div class="head">
    <h1>${esc(current || "—")}</h1>
    <div class="hr"><div class="count">${esc(what)}</div>${gear}</div>
  </div>`;
}

function toast(msg, kind) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  // green for ok, copper/yellow for failure; plain notice when it ran fine
  // and there is nothing to celebrate (a good call shows no toast at all)
  t.className = "notice small" + (kind === "ok" ? " ok" : kind === "warn" ? " warn" : "");
  t.textContent = msg; t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 2500);
}

function show(html) {
  document.getElementById("panel").innerHTML = html;
  document.getElementById("veil").classList.add("on");
}
function shut() { document.getElementById("veil").classList.remove("on"); }
document.getElementById("veil").onclick = e => { if (e.target.id === "veil") shut(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") shut(); });

boot();
</script>
</body>
