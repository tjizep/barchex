    if (!confirm(`${path} is not empty. Delete it and everything inside it? This cannot be undone.`)) return;
    out = await write("dir_rm", { path, recursive: "1" });
  }
  if (out) drawFiles();
}

async function openValue(key) {
  key = decodeURIComponent(key);
  const out = await api("value?space=" + encodeURIComponent(current) +
                        "&key=" + encodeURIComponent(key)).catch(() => null);
  if (!out) return;
  let body = out.value ?? "";
  try { body = JSON.stringify(JSON.parse(body), null, 2); } catch (e) {}
  const editable = isAdmin && out.kind === "key";
  show(`<div class="top"><h2>${esc(key)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox"${editable ? ` data-key="${esc(enc(key))}"` : ""}>
      <div class="meta">${esc(current)} · ${esc(out.kind)}${out.size != null ? " · " + bytes(out.size) : ""}${out.truncated ? " · truncated" : ""}</div>
      ${editable ? editKey(key, out.value ?? "", !out.truncated) : `<pre>${esc(body)}</pre>`}
    </div>`, { id: docId("key", key), icon: "key" });
}

let fsTotal = 0, fsAt = 0, fsTimer = null, fsSeq = 0;

async function drawFiles() {
  if (tab !== "files") return;      // another view is on screen
  const seq = ++drawSeq;
  const pane = document.getElementById("pane");
  const parts = fsPath.split("/").filter(Boolean);
  const crumbs = [`<a href="#" onclick="goPath(event,'%2F')">/</a>`].concat(
    parts.map((p, i) => `<a href="#" onclick="goPath(event,'${esc(enc("/" + parts.slice(0, i + 1).join("/")))}')">${esc(p)}</a>`));
  pane.innerHTML = head("file store") + `
    <div class="crumbs">${crumbs.join(" <span>/</span> ")}</div>
    <div class="filter">
      <input id="fmatch" placeholder="name glob, e.g. *.png or B00*" value="${esc(fsMatch)}" autocomplete="off">
      <button onclick="applyFsMatch()">Filter</button>
      ${fsMatch ? `<button onclick="fsMatch='';drawFiles()">Clear</button>` : ""}
    </div>
    ${isAdmin ? `<div class="filter"><label class="upload">Upload files here <input type="file" multiple onchange="uploadFiles(this)"></label>
        <span class="fill"></span><button onclick="newFile()">${ico("file")} New file</button>
        <button onclick="newFolder()">${ico("folder")} New folder</button></div>` : ""}
    <div class="slider" id="slider" hidden>
      <button onclick="fsSlideBy(-1)" aria-label="Previous page">${ico("back")}</button>
      <input type="range" id="slide" min="0" max="0" value="0" step="1" aria-label="Position in the folder"
             oninput="fsSlideTo(Number(this.value))">
      <button onclick="fsSlideBy(1)" aria-label="Next page" style="transform:scaleX(-1)">${ico("back")}</button>
      <span id="slide-at"></span>
    </div>
    <div id="rows"><div class="empty" style="padding:40px 0">Walking…</div></div>`;
  document.getElementById("fmatch").addEventListener("keydown", e => { if (e.key === "Enter") applyFsMatch(); });
  fsAt = 0;
  const out = await loadFiles();
  if (stale(seq)) return;
  if (!out) return;
  if (!out.files) {
    document.getElementById("rows").innerHTML =
      `<div class="empty" style="padding:40px 0">
         <b>${esc(current)}</b> has no file store — nothing has written one here.</div>`;
    return;
  }
  fsTotal = out.total || 0;
  document.getElementById("slide").max = Math.max(0, Math.ceil(fsTotal / PAGE) - 1);
  document.getElementById("slider").hidden = fsTotal <= PAGE;
  document.querySelector(".head .count").textContent =
    `${num(fsTotal)} ${fsTotal === 1 ? "entry" : "entries"}${out.dirs ? ` · ${num(out.dirs)} folders` : ""}`;
  showFiles(out);
}

function applyFsMatch() { fsMatch = document.getElementById("fmatch").value.trim(); drawFiles(); }

async function loadFiles() {
  const q = new URLSearchParams({ space: current, path: fsPath, limit: PAGE, offset: fsAt * PAGE });
  if (fsMatch) q.set("match", fsMatch);
  const seq = ++fsSeq;
  const out = await api("fs?" + q).catch(() => null);
  return seq === fsSeq ? out : null;           // a later drag has already asked for another window
}

function showFiles(out) {
  const entries = Array.isArray(out.entries) ? out.entries : [];
  const at = e => enc((fsPath === "/" ? "" : fsPath) + "/" + e.name);
  document.getElementById("rows").innerHTML = !entries.length
    ? `<div class="empty" style="padding:30px 0">${fsMatch ? "Nothing here matches that name." : "Empty."}</div>`
    : `<table class="keys"><tbody>${entries.map(e => `
      <tr onclick="${e.dir ? "goPath(event" : "openFile(event"},'${esc(at(e))}')"${e.dir ? "" : ` data-doc="${esc(docId("file", decodeURIComponent(at(e))))}"`}>
        <td class="k" title="${esc(e.name)}">${ico(e.dir ? "folder" : "file")} ${esc(e.name)}${e.dir ? "/" : ""}</td>
        <td class="kind" title="${esc(e.type || "")}">${esc(e.type || (e.dir ? "dir" : ""))}</td>
        <td class="sz">${e.dir ? "" : bytes(e.size)}</td>
        <td class="v">${e.dir ? "" : "v" + esc(e.version ?? "")}</td>
        ${isAdmin ? `<td class="act">
          <button class="ib" title="Rename" aria-label="Rename ${esc(e.name)}"
                  onclick="renameFile(event,'${esc(at(e))}',${e.dir ? "true" : "false"})">${ico("edit")}</button>
          <button class="ib" title="Delete" aria-label="Delete ${esc(e.name)}"
                  onclick="deleteFile(event,'${esc(at(e))}', ${e.dir ? "true" : "false"})">${ico("minus")}</button></td>` : ""}
      </tr>`).join("")}</tbody></table>`;
  const from = fsAt * PAGE + 1;
  document.getElementById("slide-at").textContent =
    entries.length ? `${num(from)}–${num(from + entries.length - 1)} of ${num(fsTotal)}` : "";
  markOpen();
}

// as for the keys: the label follows the thumb at once, the rows a moment later
function fsSlideTo(i) {
  fsAt = i;
  const from = i * PAGE + 1;
  document.getElementById("slide-at").textContent =
    `${num(from)}–${num(Math.min(from + PAGE - 1, fsTotal))} of ${num(fsTotal)}`;
  document.getElementById("slide").value = i;
  clearTimeout(fsTimer);
  const seq = drawSeq;
  fsTimer = setTimeout(async () => { const out = await loadFiles(); if (out && !stale(seq)) showFiles(out); }, 60);
}
function fsSlideBy(n) {
  const r = document.getElementById("slide");
  fsSlideTo(Math.max(0, Math.min(Number(r.max), fsAt + n)));
}

// What to show for a file, from its type column - and from the extension when the
// column is empty, which is how anything loaded without a type arrives.
const EXT_TYPES = { json: "application/json", md: "text/markdown", txt: "text/plain",
  html: "text/html", css: "text/css", js: "text/javascript", luau: "text/x-luau",
  lua: "text/x-luau", py: "text/x-python", sh: "text/x-shellscript", csv: "text/csv",
  xml: "application/xml", svg: "image/svg+xml", png: "image/png", jpg: "image/jpeg",
  jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp" };
const RAW_IMAGES = ["image/jpeg", "image/png", "image/gif", "image/webp"];

async function openFile(ev, path) {
  if (ev) ev.stopPropagation();
  path = decodeURIComponent(path);
  const q = "space=" + encodeURIComponent(current) + "&path=" + encodeURIComponent(path);
  const out = await api("file?" + q).catch(() => null);
  if (!out) return;
  const ext = (path.split(".").pop() || "").toLowerCase();
  const type = out.type || EXT_TYPES[ext] || "";
  let shown;
  if (out.error) {
    shown = `<div class="notice">${esc(out.error)}</div>`;
  } else if (RAW_IMAGES.includes(type)) {
    shown = `<div class="filepic"><img alt="${esc(path)}" src="/api/admin/file?${q}&raw=1"></div>`;
  } else if (out.text != null && isAdmin && !out.truncated && isLuauFile(path, type)) {
    // a module a function can require(":/path.luau"): the prompt bar, the Luau
    // editor, and Run
    shown = `${aiBar()}<div class="editor">
      <div class="fn-body">
        <div class="fn-code">${codeEditor(out.text, `placeholder="Luau source"`)}</div>
        ${fnSide(out.text, true)}
      </div>
      <div class="row"><span class="fill"></span>
        <button class="gear" id="fn-gear" title="Native code, deadline and slice" aria-label="File settings"
                aria-controls="fn-side" aria-expanded="${appSetting("fnSide", "0") === "1"}" onclick="toggleFnSide()">${ico("gear")}</button>
        <button class="primary" id="fe-save" onclick="saveFile()">Save</button></div>
    </div>
    <div class="fncall">
      <div class="row">
        <input id="call-args" placeholder="arguments for call(), e.g. bob or &quot;two words&quot;" spellcheck="false" autocomplete="off"
               aria-label="Arguments" onkeydown="if(event.key==='Enter')runFile()">
        <button class="primary" onclick="runFile()">${ico("play")} Run</button>
      </div>
      <pre class="cons-out" id="call-out" aria-live="polite"><span class="dim">Run calls this file's call() through ${RUNNER} in ${esc(current)}: require(":${esc(path)}", true).</span></pre>
    </div>`;
  } else if (out.text != null && isAdmin && !out.truncated) {
    // editable: the bytes exactly as stored, so a save changes only what was typed
    shown = `<div class="editor">
      <textarea id="ev" rows="14" spellcheck="false" style="${valueHeightStyle()}">${esc(out.text)}</textarea>
      ${hgrip("valueHeight", "Resize the file box")}
      <div class="row"><span class="fill"></span>
        <button class="primary" id="fe-save" onclick="saveFile()">Save</button></div>
    </div>`;
  } else if (out.text != null) {
    let body = out.text;
    if (type.includes("json")) { try { body = JSON.stringify(JSON.parse(body), null, 2); } catch (e) {} }
    const luau = /luau|x-lua\b/.test(type) || ext === "luau" || ext === "lua";
    shown = (out.truncated && isAdmin ? `<div class="notice small">Too large to edit here; upload a file to replace it.</div>` : "")
      + (luau ? `<pre class="code-ro">${luauHighlight(body)}</pre>` : `<pre>${esc(body)}</pre>`);
  } else {
    shown = `<div class="meta">binary — first ${Math.min(512, out.size || 0)} bytes</div><pre>${esc(out.hex || "")}</pre>`;
  }
  show(`<div class="top"><h2>${esc(path)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox" data-file="${esc(enc(path))}" data-type="${esc(type || "")}">
      <div class="meta">${esc(current)} · ${esc(type || "unknown type")}${out.size != null ? " · " + bytes(out.size) : ""}${out.version != null ? " · v" + esc(out.version) : ""}${out.truncated ? " · truncated" : ""}</div>
      ${isAdmin && !out.error ? `<div class="filter"><button onclick="renameFile(null,'${esc(enc(path))}')">${ico("edit")} Rename</button></div>` : ""}
      ${shown}
    </div>`, { id: docId("file", path), icon: "file" });
  const ta = document.getElementById("ev");
  if (ta && ta.closest(".code")) {
    applyTabWidth();
    codeAttach(ta, current + ":" + path);
    ta._code.saved = out.text ?? "";
    codeStatus(ta);
    if (document.getElementById("fn-side")) {
      ta.addEventListener("input", () => fnSideSync(ta));
      fnSideSync(ta);
      if (!document.getElementById("fn-side").hidden) fnSideDefaults();
    }
  }
}

// ---- running a .luau file ------------------------------------------------------
//
// A .luau file in the file store is a module: a function loads it with
// require(":/path.luau") and gets its globals back. Run does exactly that
// through a small stored function, RUNLUAU, which it installs in the space the
// first time it is needed. The file is read fresh on every run, so Run always
// uses what was last saved.

const RUNNER = "RUNLUAU";
const RUNNER_SRC = `-- Runs a .luau file from this space's file store, the way the viewer's Run
-- button does: require(":" .. path, true) reads the file fresh and hands back
-- its globals, and the file's own call() is called with the arguments. Errors
-- pass through as the file raised them, so their line numbers are the file's.
function call(path, ...)
    local loaded, m = pcall(require, ":" .. path, true)
    if not loaded then error(tostring(m), 0) end
    local run = rawget(m, "call")
    if type(run) ~= "function" then error(path .. " has no call() to run", 0) end
    local result = table.pack(pcall(run, ...))
    if not result[1] then error(tostring(result[2]), 0) end
    return table.unpack(result, 2, result.n)
end
`;

const isLuauFile = (path, type) => /\.(luau|lua)$/i.test(path) || /luau|x-lua\b/.test(type || "");

// RUNLUAU as this file wants it: the viewer's runner with the file's own
// --@barch line on top. A call's deadline and slice come from the function
// that is called, not from what it requires, so the file's limits have to be
// on the runner to apply.
function runnerFor(source) {
  const h = luauBarchHeader(source || "");
  const line = h && !h.bad && Object.keys(h.obj).length
    ? "--@barch " + JSON.stringify(h.obj).replace(/":/g, '": ').replace(/,"/g, ', "') + "\n" : "";
  return line + RUNNER_SRC;
}

// RUNLUAU in the space, as `want`: installed when missing, and rewritten when it
// is the viewer's own with other limits. One that is there and isn't the
// viewer's is someone's own, so it is used as it is and left alone.
async function ensureRunner(want) {
  want = want || RUNNER_SRC;
  const out = await api("function?" + new URLSearchParams({ space: current, name: RUNNER })).catch(() => null);
  const have = out && !out.error && out.source != null ? out.source : null;
  if (have === want) return true;
  const ours = have != null && have.replace(/^--@barch[^\n]*\n/, "") === RUNNER_SRC;
  if (have != null && !ours) { toast(`Using this space's own ${RUNNER}; its limits apply`); return true; }
  const put = await putFunction(RUNNER, want).catch(e => ({ error: String(e) }));
  if (put.error) { toast(`${RUNNER} not updated: ${put.error}`, "warn"); return false; }
  if (have == null) {
    toast(`Installed ${RUNNER} in ${current} to run .luau files`, "ok");
    if (tab === "functions") drawFunctions();
  }
  return true;
}

async function runFile() {
  const box = document.querySelector("#panel .valuebox[data-file]");
  if (!box) return;
  const path = decodeURIComponent(box.dataset.file);
  let argsText = document.getElementById("call-args")?.value || "";
  // what is on screen is what runs: save it first, as Call does for a function
  const ta = document.getElementById("ev");
  if (ta && ta.value !== ta.defaultValue && saveBeforeCall()) {
    await saveFile();
    const again = document.getElementById("call-args");
    if (again) again.value = argsText;
  }
  let args;
  try { args = splitArgs(argsText.trim()); } catch (e) { toast(e.message, "warn"); return; }
  if (!await ensureRunner(runnerFor(document.getElementById("ev")?.value))) return;
  const out = document.getElementById("call-out");
  const quote = a => /[\s"'\\]/.test(a) || a === "" ? JSON.stringify(a) : a;
  const shown = ["CALLF", RUNNER, path, ...args].map(quote).join(" ");
  out.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n…`;
  const r = await fetch("/api/admin/resp?" + new URLSearchParams({ space: current }),
    { method: "POST", body: JSON.stringify({ args: ["CALLF", RUNNER, path, ...args] }) });
  const res = await replyOf(r);
  if (!res.ok) {
    out.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n` +
      `<span class="rerr">(error) ${codeErrorHtml(res.error || "failed")}</span>${blocksHint(res.error)}`;
    codeMarkError(res.error);
    return;
  }
  codeClearError();
  out.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n` + renderReply(res.reply, "");
}

function goPath(ev, path) { ev.preventDefault(); fsPath = decodeURIComponent(path || "%2F"); fsMatch = ""; drawFiles(); }


// ---- graph ------------------------------------------------------------------
//
// The same shape as the file store with the paths taken out: {parent, name, id}
// edges over a node table, so one node can hang under several parents and the
// same content answers at more than one path. That is what the id and refs
// columns are for - two rows with the same id are the same node, and refs says
// how many edges name it, so a leaf with refs 3 is in three places at once.
//
// Nothing here can walk key ranges the way Files does, because no path is
// stored: GRAPH LS resolves one level at a time, and it pages by offset with no
// total to slide over, so this has a next and a previous instead of a slider.

let gAt = 0, gSeq = 0, gMore = false, gNode = null;

async function drawGraph() {
  if (tab !== "graph") return;      // another view is on screen
  const seq = ++drawSeq;
  const pane = document.getElementById("pane");
  const parts = gPath.split("/").filter(Boolean);
  const crumbs = [`<a href="#" onclick="goNode(event,'%2F')">/</a>`].concat(
    parts.map((p, i) => `<a href="#" onclick="goNode(event,'${esc(enc("/" + parts.slice(0, i + 1).join("/")))}')">${esc(p)}</a>`));
  pane.innerHTML = head("graph store") + `
    <div class="crumbs">${crumbs.join(" <span>/</span> ")}</div>
    ${isAdmin ? `<div class="filter"><label class="upload">Add nodes here <input type="file" multiple onchange="uploadNodes(this)"></label>
        <span class="fill"></span>
        <button onclick="newNode()">${ico("folder")} New node</button>
        <button onclick="newLeaf()">${ico("file")} New leaf</button>
        <button onclick="linkNode()">${ico("link")} Link a node</button></div>` : ""}
    <div class="slider" id="gslider" hidden>
      <button onclick="gPageBy(-1)" aria-label="Previous page">${ico("back")}</button>
      <button onclick="gPageBy(1)" aria-label="Next page" style="transform:scaleX(-1)">${ico("back")}</button>
      <span id="gslide-at" style="flex:1"></span>
    </div>
    <div id="rows"><div class="empty" style="padding:40px 0">Walking…</div></div>`;
  gAt = 0;
  const out = await loadGraph();
  if (stale(seq)) return;
  if (!out) return;
  if (!out.graph) {
    document.getElementById("rows").innerHTML =
      `<div class="empty" style="padding:40px 0">
         <b>${esc(current)}</b> has no graph — nothing has written one here.</div>`;
    return;
  }
  showGraph(out);
}

async function loadGraph() {
  const q = new URLSearchParams({ space: current, path: gPath, limit: PAGE, offset: gAt * PAGE });
  const seq = ++gSeq;
  const out = await api("graph?" + q).catch(() => null);
  if (out && out.error) { toast(out.error, "warn"); return null; }
  return seq === gSeq ? out : null;          // a later click has already asked for another page
}

function showGraph(out) {
  const entries = Array.isArray(out.entries) ? out.entries : [];
  gMore = !!out.more;
  gNode = out.node || null;
  const at = e => enc((gPath === "/" ? "" : gPath) + "/" + e.name);
  const where = gNode
    ? `node ${num(gNode.id)}${gNode.refs > 1 ? ` · ${num(gNode.refs)} edges in` : ""}`
    : "graph store";
  document.querySelector(".head .count").textContent =
    `${num(entries.length)}${gMore ? "+" : ""} ${entries.length === 1 ? "edge" : "edges"} · ${where}`;
  document.getElementById("rows").innerHTML = !entries.length
    ? `<div class="empty" style="padding:30px 0">Nothing under here.</div>`
    : `<table class="keys"><tbody>${entries.map(e => `
      <tr onclick="${e.dir ? "goNode(event" : "openNode(event"},'${esc(at(e))}')" data-doc="${esc(docId("node", decodeURIComponent(at(e))))}">
        <td class="k" title="${esc(e.name)}">${ico(e.dir ? "folder" : "file")} ${esc(e.name)}${e.dir ? "/" : ""}</td>
        <td class="kind" title="${esc(e.type || "")}">${esc(e.type || (e.dir ? "dir" : ""))}</td>
        <td class="sz">${e.dir ? "" : bytes(e.size)}</td>
        <td class="v" title="node ${esc(e.id)}, edge ${esc(e.edge)}${e.refs > 1 ? `, named by ${esc(e.refs)} edges` : ""}">
          #${esc(e.id)}${e.refs > 1 ? ` <span class="refs">×${esc(e.refs)}</span>` : ""}</td>
        ${isAdmin ? `<td class="act">
          <button class="ib" title="Move or rename" aria-label="Move ${esc(e.name)}"
                  onclick="moveNode(event,'${esc(at(e))}')">${ico("more")}</button>
          <button class="ib" title="${e.refs > 1 ? "Unlink here" : "Delete"}"
                  aria-label="${e.refs > 1 ? "Unlink" : "Delete"} ${esc(e.name)}"
                  onclick="dropNode(event,'${esc(at(e))}',${e.dir ? "true" : "false"},${Number(e.refs) || 1})">${ico("minus")}</button></td>` : ""}
      </tr>`).join("")}</tbody></table>`;
  const from = gAt * PAGE + 1;
  document.getElementById("gslider").hidden = gAt === 0 && !gMore;
  document.getElementById("gslide-at").textContent =
    entries.length ? `${num(from)}–${num(from + entries.length - 1)}${gMore ? "" : " of " + num(from + entries.length - 1)}` : "";
  markOpen();
}

async function gPageBy(n) {
  const to = gAt + n;
  if (to < 0 || (n > 0 && !gMore)) return;
  gAt = to;
  const out = await loadGraph();
  if (out) showGraph(out);
}

function goNode(ev, path) { ev.preventDefault(); gPath = decodeURIComponent(path || "%2F"); gAt = 0; drawGraph(); }

async function openNode(ev, path) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  const q = "space=" + encodeURIComponent(current) + "&path=" + encodeURIComponent(path);
  const out = await api("node?" + q).catch(() => null);
  if (!out) return;
  if (out.error) return toast(out.error, "warn");
  const n = out.node || {};
  const ext = (path.split(".").pop() || "").toLowerCase();
  const type = out.type || EXT_TYPES[ext] || "";
  let shown;
  if (RAW_IMAGES.includes(type)) {
    shown = `<div class="filepic"><img alt="${esc(path)}" src="/api/admin/node?${q}&raw=1"></div>`;
  } else if (out.text != null) {
    let body = out.text;
    if (type.includes("json")) { try { body = JSON.stringify(JSON.parse(body), null, 2); } catch (e) {} }
    const luau = /luau|x-lua\b/.test(type) || ext === "luau" || ext === "lua";
    shown = luau ? `<pre class="code-ro">${luauHighlight(body)}</pre>` : `<pre>${esc(body)}</pre>`;
  } else if (out.hex != null) {
    shown = `<div class="meta">binary — first ${Math.min(512, out.size || 0)} bytes</div><pre>${esc(out.hex || "")}</pre>`;
  } else {
    shown = `<div class="empty" style="padding:20px 0">An interior node — open it from the list to see what hangs under it.</div>`;
  }
  // the node's own line: what a triple store knows that a path does not say
  const ids = `node ${esc(n.id)}${n.edge != null ? ` · edge ${esc(n.edge)}` : ""} · named by ${esc(n.refs)} ${n.refs === 1 ? "edge" : "edges"}`;
  show(`<div class="top"><h2>${esc(path)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(current)} · ${esc(ids)}</div>
      <div class="meta">${esc(type || (out.kind === "dir" ? "interior node" : "unknown type"))}${out.size != null ? " · " + bytes(out.size) : ""}${out.version != null ? " · v" + esc(out.version) : ""}${out.truncated ? " · truncated" : ""}</div>
      ${isAdmin ? `<div class="filter"><button onclick="linkNode(${Number(n.id) || 0})">${ico("link")} Link this node somewhere else</button></div>` : ""}
      ${shown}
    </div>`, { id: docId("node", path), icon: "graph" });
}

// ---- the graph, changed ------------------------------------------------------

async function newNode() {
  const name = ((await ask("Name for the new node (interior), under " + gPath)) || "").trim();
  if (!name) return;
  if (name.includes("/")) return toast("a name has no slashes in it — the path is where it goes", "warn");
  // a fresh key space has neither a graph store nor a file store: MKDIR is
  // what brings the graph into being, so a refusal naming the space means
  // the space itself is gone, not that the path is wrong
  const out = await write("graph_mkdir", { path: (gPath === "/" ? "" : gPath) + "/" + name });
  if (!out) return;                    // the server said why, in an alert
  if (out.ok) return drawGraph();
  toast(out.error || "could not make that node", "warn");
}

// A leaf typed here rather than uploaded: same graph_put the file input uses,
// with a text area for the body. The type comes from the extension when it is a
// text kind, so a .json/.md/.html leaf reads back as one; an image extension is
// ignored because what is being written is text.
function newLeaf() {
  show(`<div class="top"><h2>New leaf in ${esc(current)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">under <code>${esc(gPath)}</code> · no file needed</div>
      <div class="editor">
        <input id="nleaf-name" placeholder="name, e.g. note.txt" autocomplete="off">
        <textarea id="nleaf-body" rows="14" spellcheck="false" placeholder="leaf content"></textarea>
        <div class="row">
          <span class="fill"></span>
          <button class="primary" onclick="saveLeaf()">Create</button>
        </div>
      </div>
    </div>`);
}

async function saveLeaf() {
  const name = (document.getElementById("nleaf-name").value || "").trim();
  if (!name) { toast("a leaf name is required", "warn"); return; }
  if (name.includes("/")) { toast("a name has no slashes in it — the path is where it goes", "warn"); return; }
  const body = document.getElementById("nleaf-body").value;
  const ext = (name.split(".").pop() || "").toLowerCase();
  let type = EXT_TYPES[ext] || "text/plain";
  if (RAW_IMAGES.includes(type)) type = "text/plain";
  const path = (gPath === "/" ? "" : gPath) + "/" + name;
  // quiet: write() reports the failure itself; here we only handle the "exists"
  // answer, which comes back as data rather than an error
  const out = await write("graph_put", { path, type }, body, true);
  if (out && out.exists) {
    if (!confirm(`${path} is already there. Replace it?`)) return;
    if (!await write("graph_put", { path, type, overwrite: 1 }, body)) return;
  } else if (!out) {
    return;
  }
  toast(`Saved ${name}`, "ok");
  shut(); drawGraph();
}

// A path box that completes as it is typed, shared by Link and Move.
//
// Neither operation can be done from memory: Link needs a node to hang and a
// path to hang it at, Move needs a destination. So a box lists what is under
// the parent typed so far, puts the slash on when a directory is taken - and
// the next listing with it - and marks the names already in use, which the
// server would refuse anyway.
//
// One completer per box, each with its own listing cache, because the Link
// panel has two of them and they are looking at different places. A directory
// of more than 200 completes against the first 200 and the note says so.

const PC = {};                       // input id -> what that box is completing

function pathBox(id, value, label, hint) {
  return `<label>${esc(label)}
      <input id="${esc(id)}" autocomplete="off" spellcheck="false"
             value="${esc(value)}" placeholder="${esc(hint || "/teams/core/ada.json")}"></label>
    <div class="lk-list" id="${esc(id)}-list" hidden></div>`;
}

// took(row) is called with the row taken; submit() is what Enter does when no
// row is highlighted.
function pcStart(id, took, submit, focus) {
  PC[id] = { shown: [], pick: -1, seq: 0, cache: new Map(), took, submit };
  const box = document.getElementById(id);
  box.addEventListener("input", () => pcComplete(id));
  box.addEventListener("keydown", ev => pcKey(id, ev));
  box.addEventListener("focus", () => {
    for (const other of Object.keys(PC)) if (other !== id) pcHide(other);
    pcComplete(id);
  });
  if (focus) {
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
    pcComplete(id);
  }
}

function pcNote(msg) {
  const n = document.getElementById("pc-note");
  if (n) n.textContent = msg;
}

function pcHide(id) {
  const list = document.getElementById(id + "-list");
  if (list) list.hidden = true;
  if (PC[id]) PC[id].pick = -1;
}

const PC_HINT = "Tab or ↓ to complete a name.";

async function pcComplete(id) {
  const st = PC[id];
  const box = document.getElementById(id);
  if (!st || !box) return;
  const v = box.value;
  const cut = v.lastIndexOf("/");
  const parent = cut <= 0 ? "/" : v.slice(0, cut);
  const frag = v.slice(cut + 1).toLowerCase();
  if (!st.cache.has(parent)) {
    const seq = ++st.seq;
    const out = await api("graph?" + new URLSearchParams(
      { space: current, path: parent, limit: 200 })).catch(() => null);
    if (seq !== st.seq) return;                      // a later keystroke asked for another one
    st.cache.set(parent, !out || out.error || !out.graph ? null
      : { rows: Array.isArray(out.entries) ? out.entries : [], more: !!out.more });
  }
  const held = st.cache.get(parent);
  if (held === null) {
    pcHide(id);
    return pcNote(`${parent} is not a node in ${current}`);
  }
  st.shown = held.rows.filter(e => e.name.toLowerCase().startsWith(frag)).slice(0, 8);
  st.pick = -1;
  if (!st.shown.length) {
    pcHide(id);
    return pcNote(frag
      ? `nothing under ${parent} starts with that${held.more ? " (of the first 200)" : ""}`
      : `${parent} is empty`);
  }
  pcDraw(id);
  pcNote(held.more ? "the first 200 under this one" : PC_HINT);
}

function pcDraw(id) {
  const st = PC[id];
  const list = document.getElementById(id + "-list");
  list.hidden = false;
  list.innerHTML = st.shown.map((e, i) => `
    <div class="lk-row${i === st.pick ? " on" : ""}"
         onmousedown="event.preventDefault();pcTake('${esc(id)}',${i})">
      ${ico(e.dir ? "folder" : "file")}
      <span class="nm">${esc(e.name)}${e.dir ? "/" : ""}</span>
      <span class="id">#${esc(e.id)}${e.refs > 1 ? ` ×${esc(e.refs)}` : ""}</span>
      <span class="taken">${e.dir ? "" : "name taken"}</span>
    </div>`).join("");
}

// taking one: a directory keeps the path going, so it gets its slash and its
// listing at once; a leaf ends it. The panel is told which node it was.
function pcTake(id, i) {
  const st = PC[id];
  const e = st && st.shown[i];
  const box = document.getElementById(id);
  if (!e || !box) return;
  const cut = box.value.lastIndexOf("/");
  box.value = box.value.slice(0, cut + 1) + e.name + (e.dir ? "/" : "");
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);
  if (st.took) st.took(e, box.value);
  pcComplete(id);
}

function pcKey(id, ev) {
  const st = PC[id];
  if (!st) return;
  if (ev.key === "ArrowDown" || (ev.key === "Tab" && !ev.shiftKey)) {
    if (!st.shown.length) return;
    ev.preventDefault();
    if (ev.key === "Tab" && st.shown.length === 1) return pcTake(id, 0);
    st.pick = (st.pick + 1) % st.shown.length;
    pcDraw(id);
    return;
  }
  if (ev.key === "ArrowUp") {
    if (!st.shown.length) return;
    ev.preventDefault();
    st.pick = (st.pick - 1 + st.shown.length) % st.shown.length;
    pcDraw(id);
    return;
  }
  if (ev.key === "Enter") {
    ev.preventDefault();
    if (st.pick >= 0) return pcTake(id, st.pick);
    if (st.submit) st.submit();
  }
}

// a path from a box, or null with the reason said out loud
function pcWanted(id) {
  const path = (document.getElementById(id).value || "").trim();
  if (!path.startsWith("/")) { pcNote("the path is absolute: it starts at /"); return null; }
  if (path.endsWith("/")) { pcNote("the path needs a name at the end, not just a folder"); return null; }
  return path;
}

// LINK is the one a file store cannot do: a second edge onto a node that is
// already there, so the same content answers at two paths.
//
// Two boxes, because they are two different questions and one box could not
// answer both: walking the destination used to overwrite the id with whatever
// directory was stepped through, so a node picked first was gone by the time
// the path was finished. The top box finds the node - taking a row there fills
// the id in, and offers the same name under the path being browsed - and the
// bottom one says where the new edge goes.
function linkNode(id) {
  const here = gPath === "/" ? "" : gPath;
  show(`<div class="top"><h2>${ico("link")} Link a node</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(current)} · in ${esc(gPath)} · a second edge onto a node that is already there</div>
      <div class="linker">
        ${pathBox("lk-src", "/", "Node to link — find it by its path", "/today")}
        <label>Node id
          <input id="lk-id" autocomplete="off" spellcheck="false" inputmode="numeric"
                 value="${esc(id ? String(id) : "")}" placeholder="the # in the list, e.g. 5"></label>
        ${pathBox("lk-path", here + "/", "Path for the new edge", here + "/name")}
        <div class="row">
          <button class="primary" onclick="doLink()">${ico("link")} Link</button>
          <span class="lk-note" id="pc-note">${PC_HINT} Enter to link.</span>
        </div>
      </div>
    </div>`);
  // the source box fills the id, and proposes the same name under the path
  // being browsed while that box is still just the folder
  pcStart("lk-src", (e, value) => {
    document.getElementById("lk-id").value = e.id;
    const dest = document.getElementById("lk-path");
    if (dest.value === here + "/" || dest.value === "") dest.value = here + "/" + e.name;
    pcNote(`node ${e.id} · from ${value}`);
  }, doLink, !id);
  // the destination box does not touch the id: walking it is navigation
  pcStart("lk-path", null, doLink, !!id);
}

async function doLink() {
  const id = (document.getElementById("lk-id").value || "").trim();
  if (!/^\d+$/.test(id)) return pcNote("a node id is a number — the # column, or pick one above");
  const path = pcWanted("lk-path");
  if (path == null) return;
  if (!await write("graph_link", { id, path })) return;
  shut();
  const cut = path.lastIndexOf("/");
  gPath = cut <= 0 ? "/" : path.slice(0, cut);       // land where the new edge is
  gAt = 0;
  drawGraph();
}

// MV moves one edge. The node does not move - nothing about it changes - which
// is why this is the same box: the destination is a path like any other.
function moveNode(ev, path) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  show(`<div class="top"><h2>${ico("more")} Move</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(current)} · in ${esc(gPath)} · the edge moves, the node stays as it is</div>
      <div class="linker">
        <label>Moving<input value="${esc(path)}" readonly tabindex="-1"></label>
        ${pathBox("mv-to", path, "Move it to", path)}
        <div class="row">
          <button class="primary" onclick="doMove('${esc(enc(path))}')">${ico("more")} Move</button>
          <span class="lk-note" id="pc-note">${PC_HINT} Enter to move.</span>
        </div>
      </div>
    </div>`);
  pcStart("mv-to", e => {
    if (!e.dir) pcNote(`there is already a ${e.name} here — pick another name`);
  }, () => doMove(enc(path)), true);
}

async function doMove(from) {
  from = decodeURIComponent(from);
  const to = pcWanted("mv-to");
  if (to == null) return;
  if (to === from) { shut(); return; }
  if (!await write("graph_mv", { path: from, to })) return;
  shut();
  const cut = to.lastIndexOf("/");
  gPath = cut <= 0 ? "/" : to.slice(0, cut);
  gAt = 0;
  drawGraph();
}

// refs > 1 means the node is somewhere else too, so the honest offer is to take
// this edge away rather than to delete what is behind it.
async function dropNode(ev, path, isDir, refs) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  if (refs > 1) {
    if (!confirm(`${path} is named by ${refs} edges. Take this one away and leave the node?`)) return;
    if (await write("graph_unlink", { path })) drawGraph();
    return;
  }
  if (!confirm(`Delete ${path}${isDir ? " and everything under it" : ""}?`)) return;
  const out = await write("graph_rm", isDir ? { path, recursive: 1 } : { path }, null, true);
  if (out && out.notempty) {
    if (!confirm(`${path} is not empty. Delete it and everything under it?`)) return;
    if (!await write("graph_rm", { path, recursive: 1 })) return;
  } else if (!out) {
    return;
  }
  drawGraph();
}

async function uploadNodes(input) {
  const base = gPath === "/" ? "" : gPath;
  for (const f of input.files) {
    const path = base + "/" + f.name;
    const body = await f.arrayBuffer();
    let out = await write("graph_put", { path, type: f.type || "" }, body, true);
    if (out && out.exists) {
      if (!confirm(`${path} is already there. Replace it?`)) continue;
      out = await write("graph_put", { path, type: f.type || "", overwrite: 1 }, body);
    }
    if (!out) break;
  }
  input.value = "";
  drawGraph();
}

// ---- functions --------------------------------------------------------------
//
// KEYSF lists the stored functions in the space; they are not ordinary keys, so
// the Keys tab never shows them. GETF is the source. Admins SETF / REMF with
// RELOAD so every session picks the change up.

async function drawFunctions() {
  if (tab !== "functions") return;      // another view is on screen
  const seq = ++drawSeq;
  const pane = document.getElementById("pane");
  pane.innerHTML = head("functions") + `
    <div class="filter">
      <input id="fnmatch" placeholder="name glob, e.g. SHOP* or *API" value="${esc(fnMatch)}" autocomplete="off">
      <button onclick="applyFnMatch()">Filter</button>
      ${fnMatch ? `<button onclick="fnMatch='';drawFunctions()">Clear</button>` : ""}
      ${isAdmin ? `<button onclick="newFunction()">${ico("code")} New function</button>
        <button onclick="addService()">${ico("plug")} Add a service…</button>` : ""}
    </div>
    <div id="rows"><div class="empty" style="padding:40px 0">Reading…</div></div>`;
  document.getElementById("fnmatch").addEventListener("keydown", e => { if (e.key === "Enter") applyFnMatch(); });
  const out = await loadFunctions();
  if (stale(seq)) return;
  if (!out) return;
  if (out.error) {
    document.getElementById("rows").innerHTML = `<div class="notice">${esc(out.error)}</div>`;
    return;
  }
  const rows = Array.isArray(out.functions) ? out.functions : [];
  document.querySelector(".head .count").textContent =
    `${num(out.total || rows.length)} ${(out.total || rows.length) === 1 ? "function" : "functions"}${fnMatch ? ` matching ${fnMatch}` : ""}`;
  document.getElementById("rows").innerHTML = !rows.length
    ? `<div class="empty" style="padding:40px 0">No functions${fnMatch ? " matching that name" : " in this space"}.</div>`
    : `<table class="keys"><tbody>${rows.map(r => `
        <tr onclick="openFunction('${esc(enc(r.name))}')" data-doc="${esc(docId("fn", r.name))}">
          <td class="k" title="${esc(r.name)}">${esc(r.name)}</td>
          <td class="kind">${esc(r.kind || "luau")}${r.native ? `<br><span class="native" title="compiled to native code (--!native)">native</span>` : ""}</td>
          <td class="sz">${r.size == null ? "" : bytes(r.size)}</td>
          <td class="v">${esc(r.source ?? "")}</td>
          ${isAdmin ? `<td class="act"><button class="ib" title="Delete ${esc(r.name)}" aria-label="Delete ${esc(r.name)}"
            onclick="dropFunction(event,'${esc(enc(r.name))}')">${ico("minus")}</button></td>` : ""}
        </tr>`).join("")}</tbody></table>`;
  markOpen();
}

function applyFnMatch() {
  fnMatch = document.getElementById("fnmatch").value.trim();
  drawFunctions();
}

async function loadFunctions() {
  const q = new URLSearchParams({ space: current });
  if (fnMatch) q.set("match", fnMatch);
  return api("functions?" + q).catch(() => null);
}

// The settings a function carries in its own source: native code and its
// --@barch limits. A side panel beside the editor, opened by the gear next to
// Save, so the editor stays uncluttered; whether it is open is remembered.
function fnSide(source, forFile) {
  const open = appSetting("fnSide", "0") === "1";
  return `<aside class="fn-side" id="fn-side"${open ? "" : " hidden"} aria-label="Function settings">
    <h5>${forFile ? "File settings" : "Function settings"}</h5>
    <label class="aot" title="Compile to native code on Save. Kept as a --!native line at the top of the source.">
      <input type="checkbox" id="fn-aot" onchange="toggleNative(this.checked)"${luauNativeMarker(source ?? "") ? " checked" : ""}> Native (AOT)</label>
    <label class="lim" title="Running time this function gets. Empty uses the space's deadline.">Deadline
      <input id="fn-deadline" list="fn-deadline-opts" inputmode="numeric" placeholder="default" autocomplete="off"
             onchange="setFnLimit('deadline_ms', this)"> ms</label>
    <datalist id="fn-deadline-opts"></datalist>
    <div class="sub" id="fn-deadline-hint"></div>
    <label class="lim" title="Instructions before the call gives its worker back. Empty uses the space's slice.">Slice
      <input id="fn-slice" list="fn-slice-opts" inputmode="numeric" placeholder="default" autocomplete="off"
             onchange="setFnLimit('slice_insns', this)"> insns</label>
    <datalist id="fn-slice-opts"></datalist>
    <div class="sub" id="fn-slice-hint"></div>
    <div class="sub bad" id="fn-hdr-note" hidden></div>
    <div class="sub">${forFile
      ? "Native applies when the file is loaded. Deadline and slice apply to Run, which copies them onto " + RUNNER + "."
      : ""}</div>
    <div class="sub"><a href="#" onclick="event.preventDefault();openSpaceConfig()">Space limits</a> · applied on Save</div>
  </aside>`;
}

function editFunction(name, source, canEdit) {
  const fresh = name == null;
  return `<div class="editor">
    ${fresh ? `<input id="ek" placeholder="function name" autocomplete="off">` : ""}
    <div class="fn-body">
      <div class="fn-code">${codeEditor(source, canEdit ? `placeholder="Luau source"` : `disabled placeholder="too large to edit here"`)}</div>
      ${canEdit ? fnSide(source) : ""}
    </div>
    <div class="row">
      <input type="file" id="ef" accept=".luau,.lua,.txt" onchange="loadFunctionFile(this)" title="Load a file into the editor">
      <span class="fill"></span>
      ${canEdit ? `<button class="gear" id="fn-gear" title="Function settings: native code, deadline, slice" aria-label="Function settings"
              aria-controls="fn-side" aria-expanded="${appSetting("fnSide", "0") === "1"}" onclick="toggleFnSide()">${ico("gear")}</button>` : ""}
      <button class="primary" id="fn-save" onclick="saveFunction(${fresh ? "null" : `'${esc(enc(name))}'`})">Save</button>
      ${fresh ? "" : `<button id="fn-del" onclick="removeFunction('${esc(enc(name))}')">Delete</button>`}
    </div>
  </div>`;
}

// The Call box and its one-line terminal, shared by a stored function and one
// that is still being written. `e` is the escaped-encoded name, or null for a
// new function, whose name is still in the #ek box.
function callBlock(e, displayName) {
  const fresh = e == null;
  const arg = fresh ? "null" : `'${e}'`;
  return `<div class="fncall">
    <div class="row">
      <input id="call-args" placeholder="parameters, e.g. key or &quot;two words&quot; 'single quoted'" spellcheck="false" autocomplete="off" aria-label="Call parameters"
             onkeydown="if(event.key==='Enter')callFunction(${arg})">
      <button class="primary" onclick="callFunction(${arg})">${ico("play")} Call</button>
    </div>
    <pre class="cons-out" id="call-out" aria-live="polite"><span class="dim">CALLF ${fresh ? "&lt;name&gt;" : esc(displayName)} in ${esc(current)} as the web user.</span></pre>
  </div>`;
}

async function openFunction(name) {
  name = decodeURIComponent(name);
  const out = await api("function?space=" + encodeURIComponent(current) +
                        "&name=" + encodeURIComponent(name)).catch(() => null);
  if (!out) return;
  if (out.error) { toast(out.error, "warn"); return; }
  const shown = out.name || name;
  show(`<div class="top"><h2>${esc(shown)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox" data-fn="${esc(enc(shown))}">
      <div class="meta">${esc(current)} · ${esc(out.kind || "luau")}<span id="fn-native">${out.native ? " · native" : ""}</span>${out.size != null ? " · " + bytes(out.size) : ""}${out.truncated ? " · truncated" : ""}</div>
      ${isAdmin && !out.truncated ? aiBar() : ""}
      ${isAdmin ? editFunction(shown, out.source ?? "", !out.truncated) : `<pre class="code-ro">${luauHighlight(out.source ?? "")}</pre>`}
      ${callBlock(esc(enc(shown)), shown)}
    </div>`, { id: docId("fn", shown), icon: "code" });
  (callFunction._lastSaved ??= new Map()).set(shown, out.source ?? "");
  tabifyFunctionBody(current + "/" + shown);
  const ta = document.getElementById("ev");
  if (ta && ta._code) { ta._code.saved = out.source ?? ""; codeStatus(ta); }
}

// what Save and Call run: SETF with the body in the editor. Answers the
// server's reply; a refusal is shown by the caller, next to the code, rather
// than as a toast that is gone before the line number is read.
async function putFunction(name, body) {
  const q = new URLSearchParams({ space: current, name });
  const r = await fetch("/api/admin/function_put?" + q, { method: "POST", body });
  return replyOf(r);
}

// the save went through: the editor is clean, any old error mark is stale
function functionSaved(name, body) {
  (callFunction._lastSaved ??= new Map()).set(name, body);
  const ta = document.getElementById("ev");
  if (ta) ta.defaultValue = body;
  const ek = document.getElementById("ek");
  if (ek && activeDoc) {
    ek.defaultValue = ek.value;
    activeDoc.id = docId("fn", name);
    activeDoc.title = name;
    const h2 = activeDoc.node.querySelector(".top h2");
    if (h2) h2.textContent = name;
  }
  drawDocTabs();
  drawStatus();
  if (ta && ta._code) {
    ta._code.saved = body;
    if (ta._code.name != null && ta._code.name.endsWith("/")) codeViews.delete(ta._code.name);
    ta._code.name = current + "/" + name;
    ta._code.base = body;
    codeRemember(ta);
    const shown = document.getElementById("fn-native");
    if (shown) shown.textContent = luauNativeMarker(body) ? " · native" : "";
    codeClearError();
    codeStatus(ta);
  }
}

// SETF refused the body: mark the line it names and say why under the editor
function functionRefused(name, error) {
  const out = document.getElementById("call-out");
  const hit = codeMarkError(error);
  if (out) out.innerHTML = `<span class="dim">${esc(current)}&gt; SETF ${esc(name)}</span>\n` +
    `<span class="rerr">(error) ${codeErrorHtml(error)}</span>`;
  toast(hit ? `${name} not saved: line ${hit.line}` : `${name} not saved`, "warn");
}

// A call that outlives the viewer's own request: the function runs inside the
// SPACESAPI route in the `spaces` space, so that space's deadline is the limit.
// The function's writes are in; only its reply is lost.
function blocksHint(error) {
  if (!(/timeout/i.test(error || "") && /\(HTTP 5\d\d\)$/.test(error || ""))) return "";
  return `\n<span class="dim">The viewer stopped waiting; the function may still have finished.</span> ` +
    `<a href="#" onclick="event.preventDefault();openSpaceConfig('spaces')">Raise the viewer's deadline</a>`;
}

async function callFunction(name) {
  const fresh = name == null;
  if (fresh) name = (document.getElementById("ek")?.value || "").trim();
  else name = decodeURIComponent(name);
  if (!name) { toast("name the function first", "warn"); document.getElementById("ek")?.focus(); return; }
  const box = document.getElementById("call-args"), out = document.getElementById("call-out");
  if (!box || !out) return;
  // Save-before-Call (on by default, toggle in app settings): SETF the editor
  // body first so the call runs what is on screen. A function that does not
  // exist yet is always written first - there is nothing to call otherwise.
  // Non-admins and truncated sources have no editor; they call the stored copy.
  if (isAdmin && (fresh || saveBeforeCall())) {
    const ta = document.getElementById("ev");
    if (ta && !ta.disabled) {
      const body = ta.value;
      if (typeof body === "string" && body.trim() && (fresh || body !== callFunction._lastSaved?.get(name))) {
        const saved = await putFunction(name, body).catch(e => ({ error: String(e) }));
        if (saved.error) { functionRefused(name, saved.error); return; }
        functionSaved(name, body);
        drawFunctions();
      } else if (fresh && !body.trim()) {
        toast("source is required", "warn");
        return;
      }
    }
  }
  let args;
  try { args = splitArgs(box.value.trim()); } catch (e) { out.innerHTML = `<span class="rerr">(error) ${esc(e.message)}</span>`; return; }
  const quote = a => /[\s"'\\]/.test(a) || a === "" ? JSON.stringify(a) : a;
  const shown = ["CALLF", name, ...args].map(quote).join(" ");
  out.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n…`;
  const r = await fetch("/api/admin/resp?" + new URLSearchParams({ space: current }),
    { method: "POST", body: JSON.stringify({ args: ["CALLF", name, ...args] }) });
  const res = await replyOf(r);
  if (!res.ok) {
    // the red line keeps the detail and links to the line it names; the
    // editor marks that line too, so a toast would only repeat it
    out.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n` +
      `<span class="rerr">(error) ${codeErrorHtml(res.error || "failed")}</span>${blocksHint(res.error)}`;
    if (!codeMarkError(res.error)) toast(`Call to ${name} failed`, "warn");
    return;
  }
  codeClearError();
  out.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n` + renderReply(res.reply, "");
}

// Wires the editor in an open function dialog: highlighting, the gutter,
// completion, Enter and Tab (see the Luau editor script above). `key` is what
// the caret position is remembered under between openings.
function tabifyFunctionBody(key) {
  const ta = document.getElementById("ev");
  applyTabWidth();
  if (!ta || !ta.closest(".code")) return;
  codeAttach(ta, key ?? null);
  if (document.getElementById("fn-side")) {
    ta.addEventListener("input", () => fnSideSync(ta));
    fnSideSync(ta);                           // a restored draft may differ
    if (!document.getElementById("fn-side").hidden) fnSideDefaults();
  }
  const name = document.getElementById("ek");
  (name && !name.value ? name : ta).focus({ preventScroll: true });
}

function tabUnit() {
  return " ".repeat(tabWidth());
}

// Tab indents: to the next tab stop at the caret, or every selected line by one
// unit. Shift+Tab takes one unit (or a tab) off each line the selection
// touches. The unit is spaces (tabWidth(): 2, 4 or 8, from app settings) so
// rendering matches insertion whatever the browser would do to a real tab.
// Whole lines are replaced through codeInsert so one Ctrl+Z undoes it.
function insertFunctionTab(ta, outdent) {
  const unit = tabUnit();
  const v = ta.value;
  const start = ta.selectionStart ?? v.length;
  const end = ta.selectionEnd ?? start;
  if (!outdent && start === end) {
    const sol = v.lastIndexOf("\n", start - 1) + 1;
    const col = codeCol(v.slice(sol, start));
    codeInsert(ta, " ".repeat(unit.length - (col % unit.length)), start, end);
    return;
  }
  const sol = v.lastIndexOf("\n", start - 1) + 1;
  // a selection that ends at the start of a line does not take that line in
  const last = end > start && v[end - 1] === "\n" ? end - 1 : end;
  const eol = v.indexOf("\n", last) < 0 ? v.length : v.indexOf("\n", last);
  const lines = v.slice(sol, eol).split("\n");
  const fixed = lines.map(l => {
    if (!outdent) return l.trim() ? unit + l : l;
    if (l.startsWith(unit)) return l.slice(unit.length);
    if (l.startsWith("\t")) return l.slice(1);
    return l.replace(/^ +/, m => m.slice(Math.min(m.length, unit.length)));
  });
  const joined = fixed.join("\n");
  if (joined === lines.join("\n")) return;
  const firstShift = fixed[0].length - lines[0].length;
  codeInsert(ta, joined, sol, eol);
  if (start === end) {
    const at = Math.max(sol, start + firstShift);
    ta.setSelectionRange(at, at);
  } else {
    ta.setSelectionRange(Math.max(sol, start + firstShift), end + (joined.length - (eol - sol)));
  }
}

// the panel follows the source: the Native box, the two limits, a note when the
// header can't be edited here, and a dot on the gear when anything is set
function fnSideSync(ta) {
  const src = ta.value;
  const native = !!luauNativeMarker(src);
  const h = luauBarchHeader(src);
  const aot = document.getElementById("fn-aot");
  if (aot) aot.checked = native;
  const note = document.getElementById("fn-hdr-note");
  const locked = !!h && (h.bad || h.block);
  for (const [id, field] of [["fn-deadline", "deadline_ms"], ["fn-slice", "slice_insns"]]) {
    const box = document.getElementById(id);
    if (!box) continue;
    box.disabled = locked;
    // not while it's being typed in; its change event writes the source
    if (document.activeElement !== box) box.value = h && !h.bad && h.obj[field] != null ? String(h.obj[field]) : "";
  }
  if (note) {
    note.hidden = !locked;
    note.textContent = !locked ? "" : h.bad
      ? "The --@barch line isn't a JSON object; SETF will refuse it. Fix it in the source."
      : "The limits are in a --[[@barch … ]] block; edit them there.";
  }
  const gear = document.getElementById("fn-gear");
  if (gear) gear.classList.toggle("set", native || (!!h && !h.bad && Object.keys(h.obj).length > 0));
}

function toggleFnSide() {
  const side = document.getElementById("fn-side"), gear = document.getElementById("fn-gear");
  if (!side) return;
  side.hidden = !side.hidden;
  setAppSetting("fnSide", side.hidden ? "0" : "1");
  if (gear) gear.setAttribute("aria-expanded", String(!side.hidden));
  if (!side.hidden) fnSideDefaults();
}

// what an empty box means, and how far a value may go: the space's own
// deadline and slice, and the server's caps. Asked each time the panel opens,
// since the space may change under it
async function fnSideDefaults() {
  const ask = async args => {
    const r = await fetch("/api/admin/resp?" + new URLSearchParams({ space: current }),
      { method: "POST", body: JSON.stringify({ args }) }).then(r => r.json()).catch(() => null);
    if (!r || !r.ok || !r.reply) return null;
    const x = r.reply.t === "arr" ? r.reply.v?.[1] : r.reply;
    return x && x.v != null && x.t !== "err" ? String(x.v) : null;
  };
  const [dl, sl, dmax, smax, wall] = await Promise.all([
    ask(["KSPACE", "OPTION", "GET", "FUNCTION_DEADLINE"]), ask(["KSPACE", "OPTION", "GET", "FUNCTION_SLICE"]),
    ask(["CONFIG", "GET", "function_deadline_max_ms"]), ask(["CONFIG", "GET", "function_slice_max_insns"]),
    ask(["CONFIG", "GET", "function_wall_factor"])]);
  const num = v => v != null && /^\d+$/.test(v) ? Number(v).toLocaleString() : null;
  const d = document.getElementById("fn-deadline"), s = document.getElementById("fn-slice");
  if (d && num(dl)) d.placeholder = num(dl);
  if (s && num(sl)) s.placeholder = num(sl);
  const dh = document.getElementById("fn-deadline-hint"), sh = document.getElementById("fn-slice-hint");
  if (dh && dl) dh.textContent = `space ${fmtLimit(dl, "ms")}${dmax ? ` · cap ${fmtLimit(dmax, "ms")}` : ""}`;
  if (sh && sl) sh.textContent = `space ${fmtLimit(sl, "insns")}${smax ? ` · cap ${fmtLimit(smax, "insns")}` : ""}`;
  // the choices: round values up to the cap; a header over the cap is refused on Save
  const opts = (id, presets, cap, unit) => {
    const box = document.getElementById(id);
    if (box) box.innerHTML = presets.filter(v => !cap || v <= Number(cap))
      .map(v => `<option value="${v}">${fmtLimit(v, unit)}</option>`).join("");
  };
  opts("fn-deadline-opts", [1000, 5000, 10000, 30000, 60000, 120000, 300000], dmax, "ms");
  opts("fn-slice-opts", [200000, 1000000, 5000000, 10000000, 50000000], smax, "insns");
}

// a limit box changed: write the --@barch line to match, as one undoable edit
// that keeps any other fields in it, and drop the line when nothing is left
function setFnLimit(field, box) {
  const ta = document.getElementById("ev");
  if (!ta || ta.disabled) return;
  const raw = box.value.trim();
  const h = luauBarchHeader(ta.value);
  if (raw !== "" && !/^[1-9]\d*$/.test(raw)) {
    toast("a whole number above 0, or empty for the default", "warn");
    // the sync leaves a focused box alone, so put the source's value back here
    box.value = h && !h.bad && h.obj[field] != null ? String(h.obj[field]) : "";
    return;
  }
  if (h && (h.bad || h.block)) { fnSideSync(ta); return; }
  const obj = { ...(h ? h.obj : {}) };
  if (raw === "") delete obj[field]; else obj[field] = Number(raw);
  const keys = Object.keys(obj);
  const line = keys.length ? "--@barch " + JSON.stringify(obj).replace(/":/g, '": ').replace(/,"/g, ', "') + "\n" : "";
  const s = ta.selectionStart, e = ta.selectionEnd;
  const start = h ? h.start : 0, end = h ? h.end : 0;
  if (line === ta.value.slice(start, end)) return;
  codeInsert(ta, line, start, end);
  const shift = line.length - (end - start);
  const fix = p => p >= end ? p + shift : p > start ? start : p;
  ta.setSelectionRange(fix(s), fix(e));
  codeStatus(ta);
  fnSideSync(ta);
  const what = field === "deadline_ms" ? "Deadline" : "Slice";
  toast(raw === "" ? `${what} back to the default — Save to apply` : `${what} ${Number(raw).toLocaleString()} — Save to apply`);
}

// The Native (AOT) toggle adds or takes away the `--!native` line at the top of
// the body - the source is the record, see luauNativeMarker - as one undoable
// edit, keeping the caret on the text it was on. It takes effect on Save.
function toggleNative(on) {
  const ta = document.getElementById("ev");
  if (!ta || ta.disabled) return;
  const m = luauNativeMarker(ta.value);
  if (!!m === on) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (on) {
    const line = "--!native\n";
    codeInsert(ta, line, 0, 0);
    ta.setSelectionRange(s + line.length, e + line.length);
  } else {
    const len = m.end - m.start;
    codeInsert(ta, "", m.start, m.end);
    const fix = p => p >= m.end ? p - len : p > m.start ? m.start : p;
    ta.setSelectionRange(fix(s), fix(e));
  }
  codeStatus(ta);
  toast(on ? "Native on — Save to compile it" : "Native off — Save to go back to the interpreter");
}

// a file picked under the editor is loaded into it, not sent behind its back
function loadFunctionFile(input) {
  const f = input.files[0];
  input.value = "";
  if (!f) return;
  if (f.size > 512000) { toast("a function is at most 512 kB; that file is " + bytes(f.size), "warn"); return; }
  f.text().then(text => {
    const ta = document.getElementById("ev");
    if (!ta || ta.disabled) return;
    ta.focus();
    codeInsert(ta, text, 0, ta.value.length);
    ta.setSelectionRange(0, 0);
    ta.scrollTop = 0;
    toast(`Loaded ${f.name} — Save to store it`);
  });
}

// Save: SETF and stay in the editor. No confirm - this is the loop of editing
// and running a function, and the stored copy is a Ctrl+Z away in the editor
// until the dialog closes. The configuration space still asks, because a
// function stored there can change what the server runs.
async function saveFunction(name) {
  name = name == null ? document.getElementById("ek").value.trim() : decodeURIComponent(name);
  if (!name) { toast("a function name is required", "warn"); document.getElementById("ek")?.focus(); return; }
  const ta = document.getElementById("ev");
  if (!ta || ta.disabled) return;
  const body = ta.value;
  if (!body.trim()) { toast("source is required", "warn"); return; }
  if (careful() && !armed(document.getElementById("fn-save"), "Really save?", carefulNote())) return;
  const out = await putFunction(name, body).catch(e => ({ error: String(e) }));
  if (out.error) { functionRefused(name, out.error); return; }
  functionSaved(name, body);
  const cons = document.getElementById("call-out");
  if (cons) cons.innerHTML = `<span class="dim">${esc(current)}&gt; SETF ${esc(name)}</span>\nOK`;
  toast(`Saved ${name}`, "ok");
  drawFunctions();
}

// Delete asks with a second click on "Really delete?", not with a dialog
// the − on a row: the first click turns it red and says what the second does.
// An open tab of that function closes with it, whatever it held.
async function dropFunction(ev, name) {
  ev.preventDefault();
  ev.stopPropagation();
  name = decodeURIComponent(name);
  if (!armed(ev.currentTarget, null, `Click − again to delete ${name}${careful() ? " — " + carefulNote() : ""}`)) return;
  if (!await write("function_rm", { name })) return;
  const d = docs.find(x => x.id === docId("fn", name));
  if (d) closeDoc(d, true);
  toast(`Deleted ${name}`, "ok");
  drawFunctions();
}

async function removeFunction(name) {
  if (!armed(document.getElementById("fn-del"), "Really delete?", careful() ? carefulNote() : null)) return;
  name = decodeURIComponent(name);
  if (await write("function_rm", { name })) { toast(`Deleted ${name}`, "ok"); shut(); drawFunctions(); }
}

// A new function's document. `opt` fills it from a service template: the
// source, a suggested name and the space it belongs in.
function newFunction(opt) {
  opt = opt || {};
  if (opt.space && opt.space !== current) pickSpace(null, opt.space);
  const src = opt.src || "function call()\n    return \"ok\"\nend\n";
  const title = opt.title ? `New ${opt.title} in ${current}` : `New function in ${current}`;
  show(`<div class="top"><h2>${esc(title)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox" data-fn="">${aiBar()}${editFunction(null, src, true)}${callBlock(null, null)}</div>`,
    { id: "doc:" + current + ":" + title + ":" + (++docSeq) });
  if (opt.name) {
    const ek = document.getElementById("ek");
    ek.value = opt.name;
    ek.defaultValue = "";              // a suggestion, still unsaved
  }
  const ta = document.getElementById("ev");
  // a new function's draft is kept under "space/" until it is saved
  tabifyFunctionBody(current + "/");
  if (ta && ta._code) ta._code.saved = "";      // nothing is stored yet
  codeStatus(ta);
}

// ---- service templates ---------------------------------------------------------
//
// A function becomes a service by defining service() (transport() is the older
// name and still works). Each kind wants different fields and lives in a
// different place, so "Add a service…" opens a new function with a template for
// the kind that says, in its own comments, how it is started. Queue and cron
// declarations belong in the `configuration` space under queues/ and cron/jobs/,
// so those templates open there; the rest open in the space that is selected.

const SERVICE_KINDS = [
  { kind: "resource", label: "HTTP route", note: "a Luau handler behind a URL", icon: "link",
    name: "HELLOAPI", src: sp => `-- An HTTP route. Mount it by listing HELLOAPI in the keys of this space's
-- kind = "http" service, then start that service with HTTP START.
function call()
    return "HELLOAPI"
end

local function get(req, res)
    local who = req:param("name") or "world"
    res:header("Content-Type", "application/json")
    res.body = simdjson.encode({ hello = who, keys = barch.store.size() })
end

local function post(req, res)
    local doc = simdjson.parse(req.body)
    barch.store.setJson("hello:" .. tostring(doc.name), doc)
    res.code = 201
end

function service()
    return {
        kind = "resource",
        route = "/hello",
        methods = { GET = get, POST = post },
        send = "application/json",
    }
end
` },
  { kind: "http", label: "HTTP server", note: "listens on a port and mounts routes", icon: "plug",
    name: "HTTPCONF", src: sp => `-- An HTTP server for the ${sp} space. List the route functions it serves
-- in keys, then start it with HTTP START HTTPCONF, or with the HTTP starter
-- template (Add a service…), which is a Call away.
function call()
    return "http"
end

function service()
    return {
        kind = "http",
        port = 8080,
        bind = "127.0.0.1",
        user = "web",                 -- the ACL user requests run as
        keys = { "HELLOAPI" },        -- kind = "resource" or "files" functions in ${sp}
        -- ssl = { cert = "/path/cert.pem", key = "/path/key.pem" },
    }
end
` },
  { kind: "start", label: "HTTP starter", note: "starts the HTTP server when you press Call", icon: "play",
    name: "STARTHTTP", src: sp => `-- Starts ${sp}'s HTTP server: press Call. Call with stop or status for the
-- other two. HTTPCONF is the kind = "http" function with the port and routes.
-- To bring the server back after a restart, add a cron job that calls
-- STARTHTTP every minute; it leaves a running server alone.
local CONFIG = "HTTPCONF"

function call(action)
    action = string.lower(action or "start")
    if action == "stop" then
        barch.call("HTTP", "STOP")
        return "stopped"
    end
    local status = barch.call("HTTP", "STATUS")
    if status ~= "stopped" or action == "status" then
        return status                 -- running: what it serves
    end
    return barch.call("HTTP", "START", CONFIG)
end
` },
  { kind: "files", label: "Static files", note: "serves the file store over HTTP", icon: "folder",
    name: "STATIC", src: sp => `-- Serves ${sp}'s file store under /static/*. Mount it by listing STATIC in
-- the keys of the kind = "http" service.
function call()
    return "STATIC"
end

function service()
    return {
        kind = "files",
        route = "/static/*",          -- the part after * is the path under root
        root = "/",
        index = "index.html",         -- what a folder URL serves
        -- space = "images",          -- another space's file store
        -- source = true,             -- fetch a missing file through fs_source
        -- cors = "*",
    }
end
` },
  { kind: "resp", label: "RESP commands", note: "new commands for redis clients", icon: "terminal",
    name: "COUNTER", src: sp => `-- New RESP commands, named after the space: ${sp}.INCR <key> [by] and
-- ${sp}.PEEK <key>. FUNCTIONS COMMANDS lists them. Return {err = "..."} to
-- reply with an error.
function call()
    return "COUNTER"
end

local function incr(key, by)
    if key == nil or key == "" then return { err = "${sp}.INCR <key> [by]" } end
    local n = (tonumber(barch.store.get(key)) or 0) + (tonumber(by) or 1)
    barch.store.set(key, tostring(n))
    return n
end

local function peek(key)
    return tonumber(barch.store.get(key)) or 0
end

function service()
    return {
        kind = "resp",
        methods = { INCR = incr, PEEK = peek },
        categories = { INCR = { "write", "data" }, PEEK = { "read" } },
    }
end
` },
  { kind: "queue", label: "Queue consumer", note: "delivers messages to a function", icon: "package",
    name: "queues/work", space: "configuration", src: sp => `-- A queue declaration. It lives in the configuration space as queues/<name>.
-- Publish with QUEUE PUSH work <message> or barch.queue("work", message);
-- QUEUE STATUS shows how it is doing. Before it runs:
--   CONFIG SET queue_dir /var/lib/barch/queues    (or set dir below)
--   ACL SETUSER worker on +read +write +data +function
-- Each message is handed to the function named by call, in space:
--
--   -- stored in ${sp} as TAKE
--   function call(message, sequence, attempts)
--       -- returning normally acknowledges; an error retries it
--   end
function service()
    return {
        kind = "queue",
        name = "work",
        space = "${sp}",
        call = "TAKE",
        user = "worker",              -- the ACL user the handler runs as
        max_attempts = 5,             -- then the message goes to work.queue.dead
        durability = "each",          -- "each", "none" or a size such as "512kb"
        -- dir = "/var/lib/barch/queues",   -- instead of the server's queue_dir
        enabled = true,
    }
end
` },
  { kind: "cron", label: "Cron job", note: "calls a function on a schedule", icon: "sparkles",
    name: "cron/jobs/compact", space: "configuration", src: sp => `-- A cron declaration. It lives in the configuration space as cron/jobs/<name>.
-- Set exactly one of every or cron. Schedules run in UTC; FUNCTIONS CRON
-- lists the jobs and their last error. Before it runs:
--   ACL SETUSER scheduler on +read +write +data +function
--   a function COMPACT in ${sp} for it to call
function service()
    return {
        kind = "cron",
        space = "${sp}",
        call = "COMPACT",             -- a stored function in ${sp}
        user = "scheduler",           -- the ACL user it runs as
        args = {},                    -- strings passed to call
        every = "5m",                 -- or cron = "0 3 * * *"
        overlap = "skip",             -- "skip" or "allow" while one is still running
        enabled = true,
    }
end
` },
];

function addService() {
  const home = current === "configuration" ? (spaces.find(x => x.openable && x.name !== "configuration") || {}).name || "default" : current;
  qiOpen({
    placeholder: "Pick a service kind",
    hint: `A new function with a service() template. Queue and cron open in configuration; the others in ${current}.`,
    list: text => SERVICE_KINDS.filter(k => !text || (k.label + " " + k.kind + " " + k.note).toLowerCase().includes(text.toLowerCase()))
      .map(k => ({ icon: k.icon, label: k.label, note: `${k.kind} · ${k.note}`,
        run: () => { setView("functions"); newFunction({ src: k.src(home), name: k.name, space: k.space, title: k.label }); } })),
  });
}

// ---- asking a model about a function -----------------------------------------
//
// A prompt bar above the function editor sends the question to OpenRouter's
// chat completions API, together with the context ticked under it: the source
// in the editor, the last Call output, and a sample of keys from the space. The
// browser calls OpenRouter directly with the key the user gives it, so the key
// is kept in this browser only (localStorage, like the other app settings) and
// barch never sees it. A code block in the answer can be put into the editor;
// nothing is saved until Save.

const AI_URL = "https://openrouter.ai/api/v1/chat/completions";
const AI_MODELS_URL = "https://openrouter.ai/api/v1/models";
const AI_FALLBACK_MODEL = "anthropic/claude-sonnet-5";
let aiModels = null;                     // OpenRouter's model ids, newest first, once asked for

const aiKey = () => appSetting("aiKey", "");
const aiModel = () => appSetting("aiModel", "") || aiDefaultModel();

// the newest Claude Sonnet OpenRouter lists, when the list has been read
function aiDefaultModel() {
  const sonnet = (aiModels || []).find(m => /^anthropic\/claude-sonnet[^:]*$/.test(m.id));
  return sonnet ? sonnet.id : AI_FALLBACK_MODEL;
}

async function aiLoadModels() {
  if (aiModels) return aiModels;
  try {
    const r = await fetch(AI_MODELS_URL);
    const j = await r.json();
    aiModels = (j.data || []).map(m => ({ id: m.id, name: m.name || m.id, created: m.created || 0 }))
      .sort((a, b) => b.created - a.created);
  } catch (e) { aiModels = []; }
  const list = document.getElementById("ai-models");
  if (list) list.innerHTML = aiModels.map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("");
  return aiModels;
}

function aiBar() {
  const key = aiKey();
  const ctx = (id, label, on, title) =>
    `<label title="${esc(title)}"><input type="checkbox" id="${id}"${on ? " checked" : ""}> ${esc(label)}</label>`;
  return `<div class="ai" id="ai">
    ${key ? `<div class="ai-row">
      <span class="ai-ico">${ico("sparkles")}</span>
      <textarea id="ai-q" rows="1" spellcheck="true" placeholder="Ask about this code, or describe a change to make"
        aria-label="Question for the model"></textarea>
      <button class="primary" id="ai-go" onclick="aiAsk()">Ask</button>
    </div>
    <div class="ai-ctx">
      <span class="ai-lbl">Sends</span>
      ${ctx("ai-c-src", "source", appSetting("aiCtxSrc", "1") === "1", "The source in the editor, as it is now")}
      ${ctx("ai-c-out", "last output", appSetting("aiCtxOut", "1") === "1", "What the last Call or Save printed below the editor")}
      ${ctx("ai-c-keys", `20 keys from ${current}`, appSetting("aiCtxKeys", "0") === "1", "The first 20 keys of this space with a short value preview. This sends your data to the model.")}
      <span class="fill"></span>
      <span class="ai-model" title="Change the model in App settings">${esc(aiModel())} · openrouter.ai</span>
      <button class="ai-link" onclick="openAppSettings()">settings</button>
    </div>` : `<div class="ai-row ai-setup">
      <span class="ai-ico">${ico("sparkles")}</span>
      <span class="ai-note">Ask a model about this code. Paste an
        <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">OpenRouter API key</a> to turn it on; it is kept in this browser only.</span>
      <span class="ai-keyin"><input type="password" id="ai-key-in" placeholder="sk-or-…" autocomplete="off" spellcheck="false"
        aria-label="OpenRouter API key" onkeydown="if(event.key==='Enter')aiSaveKey(this.value)">
      <button onclick="aiSaveKey(document.getElementById('ai-key-in').value)">Use key</button></span>
    </div>`}
    <div class="ai-out" id="ai-out" hidden aria-live="polite"></div>
  </div>`;
}

function aiSaveKey(v, quiet) {
  v = String(v || "").trim();
  setAppSetting("aiKey", v);
  if (!quiet) toast(v ? "OpenRouter key saved in this browser" : "OpenRouter key removed", "ok");
  // every function document redraws its bar, the one on screen and the parked ones
  for (const d of docs) {
    const bar = d.node.querySelector("#ai");
    if (!bar) continue;
    const out = bar.querySelector("#ai-out"), kept = out && !out.hidden ? out.innerHTML : "";
    const tmp = document.createElement("div");
    tmp.innerHTML = aiBar();
    const fresh = tmp.firstElementChild;
    if (kept) { const o = fresh.querySelector("#ai-out"); o.innerHTML = kept; o.hidden = false; }
    fresh._chat = bar._chat;
    bar.replaceWith(fresh);
    aiWire(fresh);
  }
  document.getElementById("ai-q")?.focus();
}

// the prompt grows with what is typed, and Ctrl+Enter asks from inside it
function aiWire(bar) {
  const q = bar && bar.querySelector("#ai-q");
  if (!q || q._wired) return;
  q._wired = true;
  const fit = () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 180) + "px"; };
  q.addEventListener("input", fit);
  q.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey || !e.shiftKey)) { e.preventDefault(); e.stopPropagation(); aiAsk(); }
  });
  for (const [id, set] of [["ai-c-src", "aiCtxSrc"], ["ai-c-out", "aiCtxOut"], ["ai-c-keys", "aiCtxKeys"]]) {
    const box = bar.querySelector("#" + id);
    if (box) box.addEventListener("change", () => setAppSetting(set, box.checked ? "1" : "0"));
  }
}
new MutationObserver(() => aiWire(document.querySelector("#panel #ai")))
  .observe(document.getElementById("panel"), { childList: true });

// What barch offers a function, out of the editor's own completion list, as
// plain lines: the model writes against the API this server has, not a guess.
function aiApiReference() {
  const plain = h => String(h || "").replace(/<[^>]+>/g, "").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
  const lines = [];
  for (const [type, t] of Object.entries(LUAU_TYPES)) {
    for (const e of Object.values(t.members || {})) {
      if (!e.sig || /^(string|table|math|os|utf8|bit32|buffer|coroutine|debug)\./.test(e.sig)) continue;
      lines.push(`${e.sig} — ${plain(e.doc)}`);
    }
  }
  return [...new Set(lines)].join("\n");
}

function aiSystem() {
  return `You help an admin write stored functions for barch, a key-value server, in Luau.
A function is Luau source stored with SETF under a name. Code can also live as .luau files in a space's file store, loaded with require(":/path.luau") (or require("space:/path.luau") for another space), which returns the file's globals. \`function call(...)\` is the entry point that CALLF runs; its arguments are the CALLF parameters, as strings. An optional \`function service()\` (older name: \`transport()\`) returns a table that makes the function a service: kind = "resource" (an HTTP route with route and methods = {GET = fn(req, res)}), "files" (the file store over HTTP), "http" (a server with port, bind, user and keys listing the routes), "resp" (methods called as <space>.<METHOD>, with categories), "queue" or "cron" (declarations stored in the configuration space under queues/ and cron/jobs/, naming space, call and user). Queue handlers receive (message, sequence, attempts) as separate arguments. A first line \`--!native\` compiles the function to native code. A comment in the header (before the first line of code) sets its limits, and its body must be a JSON object with quoted field names, for example \`--@barch {"deadline_ms": 5000, "slice_insns": 200000}\` or the same JSON in a \`--[[@barch ... ]]\` block. Both fields are optional whole numbers above 0; Lua table syntax such as \`{deadline_ms = 5000}\` is refused.

Answer briefly and concretely. When you change or write code, give the complete updated source in a single \`\`\`luau block, so it can replace the editor's content as a whole. Use only the barch API listed below and standard Luau; say so when something cannot be done with it.

The barch API available to a function:
${aiApiReference()}`;
}

async function aiContext() {
  const fileBox = document.querySelector("#panel .valuebox[data-file]");
  const parts = [`Space: ${current}`];
  if (fileBox) {
    const path = decodeURIComponent(fileBox.dataset.file);
    parts.push(`File: ${path} in the space's file store. It is a module, not a stored function: ` +
      `a function loads it with require(":${path}") and gets its globals back, so what it offers ` +
      `are global functions. The viewer's Run button calls its global call() with the arguments ` +
      `(through a stored helper that does require(":${path}", true)). A value the file returns is ignored.`);
  } else {
    const name = (document.getElementById("ek")?.value || document.querySelector("#panel .valuebox[data-fn]")?.dataset.fn || "");
    parts.push(`Function: ${decodeURIComponent(name) || "(new, not saved yet)"}`);
  }
  if (document.getElementById("ai-c-src")?.checked) {
    const src = document.getElementById("ev")?.value ?? "";
    parts.push("Source in the editor:\n```luau\n" + src.slice(0, 60000) + "\n```");
  }
  if (document.getElementById("ai-c-out")?.checked) {
    // the box starts with a one-line note; only what a Call or Save printed counts
    const box = document.getElementById("call-out");
    const idle = box && box.childElementCount === 1 && box.firstElementChild.classList.contains("dim")
      && box.textContent === box.firstElementChild.textContent;
    const out = idle ? "" : (box?.textContent || "").trim();
    if (out) parts.push("Last output below the editor:\n```\n" + out.slice(0, 6000) + "\n```");
  }
  if (document.getElementById("ai-c-keys")?.checked) {
    const q = new URLSearchParams({ space: current, limit: 20 });
    const out = await api("keys?" + q).catch(() => null);
    const rows = (out && out.keys) || [];
    if (rows.length) parts.push(`First ${rows.length} keys of ${current} (value previews):\n` +
      rows.map(r => `${r.key} [${r.kind}] ${String(r.value ?? "").slice(0, 160)}`).join("\n"));
  }
  return parts.join("\n\n");
}

// The answer, drawn as it arrives: prose as paragraphs, fenced code as
// highlighted blocks with the buttons that put it into the editor.
function aiRender(text, done) {
  const blocks = [];
  const html = text.split(/```/).map((chunk, i) => {
    if (i % 2 === 0) {
      return chunk.trim() ? chunk.trim().split(/\n{2,}/).map(p =>
        `<p>${esc(p).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>")}</p>`).join("") : "";
    }
    const nl = chunk.indexOf("\n");
    const lang = nl < 0 ? "" : chunk.slice(0, nl).trim().toLowerCase();
    const code = (nl < 0 ? chunk : chunk.slice(nl + 1)).replace(/\n$/, "");
    const n = blocks.push(code) - 1;
    const luau = !lang || lang === "luau" || lang === "lua";
    return `<div class="ai-code">
