      <pre class="code-ro">${luau ? luauHighlight(code) : esc(code)}</pre>
      ${done && luau ? `<div class="ai-acts">
        <button class="primary" onclick="aiApply(${n}, this)">Apply to editor</button>
        <button onclick="aiCopy(${n}, this)">Copy</button></div>` : ""}</div>`;
  }).join("");
  return { html, blocks };
}

async function aiAsk() {
  const bar = document.querySelector("#panel #ai");
  const q = document.getElementById("ai-q"), go = document.getElementById("ai-go"), out = document.getElementById("ai-out");
  if (!bar || !q) return;
  if (bar._abort) { bar._abort.abort(); return; }      // the button is Stop while an answer streams
  const question = q.value.trim();
  if (!question) { q.focus(); return; }
  const key = aiKey();
  if (!key) return toast("add an OpenRouter key first", "warn");
  bar._chat = bar._chat || [];
  const context = await aiContext();
  // earlier turns go back as they were asked, without their context: the
  // editor has moved on since, and this turn's context says what it is now
  const messages = [{ role: "system", content: aiSystem() },
    ...bar._chat.flatMap(t => [{ role: "user", content: t.q }, { role: "assistant", content: t.a }]),
    { role: "user", content: context + "\n\nQuestion: " + question }];
  const turn = document.createElement("div");
  turn.className = "ai-turn";
  turn.innerHTML = `<div class="ai-q">${esc(question)}</div><div class="ai-a"><span class="ai-wait">…</span></div>`;
  out.hidden = false;
  out.appendChild(turn);
  const a = turn.querySelector(".ai-a");
  q.value = ""; q.style.height = "";
  const ctl = new AbortController();
  bar._abort = ctl;
  go.textContent = "Stop";
  let text = "", paint = 0;
  const draw = done => {
    const r = aiRender(text, done);
    a.innerHTML = r.html || (done ? `<p class="dim">(no answer)</p>` : `<span class="ai-wait">…</span>`);
    a._blocks = r.blocks;
    out.scrollTop = out.scrollHeight;
  };
  try {
    const r = await fetch(AI_URL, {
      method: "POST", signal: ctl.signal,
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json",
        "HTTP-Referer": location.origin, "X-Title": "Barch spaces" },
      body: JSON.stringify({ model: aiModel(), messages, stream: true }),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      const why = (j.error && (j.error.message || j.error)) || r.statusText;
      throw new Error(r.status === 401 ? "OpenRouter refused the key (401). Check it in App settings." : `${r.status}: ${why}`);
    }
    // server-sent events: `data: {json}` lines, `: comment` keep-alives, `data: [DONE]`
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const j = JSON.parse(data);
          if (j.error) throw new Error(j.error.message || "the model reported an error");
          text += (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || "";
        } catch (e) { if (e.message && !/JSON/.test(e.message)) throw e; }
      }
      if (!paint) paint = requestAnimationFrame(() => { paint = 0; draw(false); });
    }
    cancelAnimationFrame(paint);
    draw(true);
    bar._chat.push({ q: question, a: text });
    if (bar._chat.length > 8) bar._chat.shift();
  } catch (e) {
    cancelAnimationFrame(paint);
    if (e.name === "AbortError") { draw(true); a.insertAdjacentHTML("beforeend", `<p class="dim">(stopped)</p>`); }
    else a.innerHTML = `<p class="ai-err">${esc(e.message || String(e))}</p>`;
  } finally {
    bar._abort = null;
    go.textContent = "Ask";
  }
}

// Put a proposed source into the editor through the browser's own editing, so
// Ctrl+Z takes it back out; Undo apply does the same from the button.
function aiApply(n, btn) {
  const a = btn && btn.closest(".ai-a");
  const code = a && a._blocks ? a._blocks[n] : null;
  const ta = document.getElementById("ev");
  if (code == null || !ta || ta.disabled) return;
  const before = ta.value;
  aiReplace(ta, code);
  const acts = btn.closest(".ai-acts");
  acts.querySelector(".ai-undo")?.remove();
  const undo = document.createElement("button");
  undo.className = "ai-undo";
  undo.textContent = "Undo apply";
  undo.onclick = () => { aiReplace(ta, before); undo.remove(); toast("Editor put back as it was"); };
  acts.appendChild(undo);
  toast("In the editor, not saved yet — Save or Call to store it");
}

function aiReplace(ta, text) {
  ta.focus({ preventScroll: true });
  ta.select();
  if (ta._code) ta._code.quiet = true;
  const ok = document.execCommand && document.execCommand("insertText", false, text);
  if (!ok || ta.value !== text) { ta.value = text; ta.dispatchEvent(new Event("input", { bubbles: true })); }
  if (ta._code) ta._code.quiet = false;
  ta.setSelectionRange(0, 0);
  ta.scrollTop = 0;
  if (ta._code) { ta._code.paint(); codeStatus(ta); }
  drawDocTabs();
}

function aiCopy(n, btn) {
  const a = btn && btn.closest(".ai-a");
  const code = a && a._blocks ? a._blocks[n] : "";
  navigator.clipboard?.writeText(code).then(() => toast("Copied"), () => toast("could not copy", "warn"));
}

// Ctrl+S saves and Ctrl+Enter calls while a function dialog is open, wherever
// the focus is - the editor, the name box, the parameter box, or nowhere
// after Esc - so the browser's own Save page never gets the key.
document.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  if ((e.key === "s" || e.key === "S") && document.querySelector("#panel .valuebox[data-newfile]")) { e.preventDefault(); saveNewFile(); return; }
  if ((e.key === "s" || e.key === "S") && document.querySelector("#panel .valuebox[data-file] #ev")) { e.preventDefault(); saveFile(); return; }
  if (e.key === "Enter" && document.querySelector("#panel .valuebox[data-file] .code")) { e.preventDefault(); runFile(); return; }
  const kb = document.querySelector("#panel .valuebox[data-key]");
  if (kb && (e.key === "s" || e.key === "S")) { e.preventDefault(); saveKey(kb.dataset.key || null); return; }
  const vb = document.querySelector("#panel .valuebox[data-fn]");
  if (!vb) return;
  const fn = vb.dataset.fn ? vb.dataset.fn : null;
  if (e.key === "s" || e.key === "S") { e.preventDefault(); saveFunction(fn); }
  else if (e.key === "Enter") { e.preventDefault(); callFunction(fn); }
});

// ---- RESP console (admins) --------------------------------------------------
//
// One command at a time, run in the space that is open with `sp:call` on the server -
// barch.call bound to that space, as the route user. The list is app/commands.json,
// written by make_commands.py out of the command reference in docs/index.html.

let COMMANDS = null, consCmd = "GET", consHistory = [];
try { consHistory = JSON.parse(localStorage.getItem("resp-history") || "[]"); } catch (e) {}

async function loadCommands() {
  if (Array.isArray(COMMANDS) && COMMANDS.length) return COMMANDS;
  for (const url of ["/api/admin/commands"]) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const j = await r.json();
      const list = Array.isArray(j) ? j : j.commands;
      if (Array.isArray(list) && list.length) { COMMANDS = list; return COMMANDS; }
    } catch (e) {}
  }
  COMMANDS = [];
  return COMMANDS;
}

// the argument line, split the way a shell would: "two words" and 'two words' are
// one argument, and a backslash escapes the next character (not inside single quotes)
function splitArgs(line) {
  const out = []; let cur = "", q = null, have = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === q) { q = null; continue; }
      if (ch === "\\" && q === '"' && i + 1 < line.length) { cur += line[++i]; continue; }
      cur += ch; continue;
    }
    if (ch === "\\" && i + 1 < line.length) { cur += line[++i]; continue; }
    if (ch === '"' || ch === "'") { q = ch; have = true; continue; }
    if (/\s/.test(ch)) { if (have || cur) out.push(cur); cur = ""; have = false; continue; }
    cur += ch;
  }
  if (q) throw new Error("an unclosed " + q);
  if (have || cur) out.push(cur);
  return out;
}

// the docs' example is a transcript: take the arguments off the first line that runs this command
function exampleArgs(c) {
  const line = (c.example || "").split("\n").find(l => l === c.name || l.startsWith(c.name + " "));
  return line ? line.slice(c.name.length).trim() : "";
}

// Docked under the editor and drawn once, so the transcript and the half-typed
// arguments survive hiding it. It always runs in the space selected on the left.
async function openConsole() {
  const body = document.getElementById("dock-body");
  if (body.querySelector(".console")) { document.getElementById("cons-args").focus(); return; }
  const list = await loadCommands();
  const fams = [...new Set(["Stored Procs", ...list.map(c => c.family)])].filter(
    f => list.some(c => c.family === f));
  body.innerHTML = `
    <div class="console">
     <div class="cons-left">
      <label class="cl">Command
        <select id="cons-cmd" onchange="pickCommand(this.value)">${fams.map(f => `
          <optgroup label="${esc(f)}">${list.filter(c => c.family === f).map(c =>
            `<option value="${esc(c.name)}"${c.name === consCmd ? " selected" : ""}>${esc(c.name)}${c.dangerous ? "  ⚠" : ""}</option>`).join("")}</optgroup>`).join("")}
        </select></label>
      <div class="cons-hint" id="cons-hint"></div>
      <div class="cons-run">
        <input id="cons-args" spellcheck="false" autocomplete="off" aria-label="Arguments"
               onkeydown="if(event.key==='Enter')runCommand()">
        <button class="primary" onclick="runCommand()">${ico("play")} Run</button>
      </div>
      <div class="cons-hist" id="cons-hist"></div>
     </div>
     <pre class="cons-out" id="cons-out" aria-live="polite"><span class="dim">Runs in the space selected on the left, as the web user; its grants decide what is allowed. KEYS, RANGE and VALUES cannot run from a script.</span></pre>
    </div>`;
  pickCommand(consCmd);
  drawHistory();
  if (!list.length) {
    document.getElementById("cons-hint").innerHTML =
      `<div class="sum">The command list did not load (commands.json). Type a command name in the box, or put commands.json next to the page.</div>`;
  }
  document.getElementById("cons-args").focus();
}

function pickCommand(name) {
  const c = (COMMANDS || []).find(x => x.name === name);
  if (!c) return;
  consCmd = name;
  const ex = exampleArgs(c);
  document.getElementById("cons-hint").innerHTML = `
    <code class="syn">${esc(c.syntax || c.name)}</code>
    ${c.dangerous ? `<span class="warn">⚠ dangerous</span>` : c.write ? `<span class="wr">writes</span>` : ""}
    <div class="sum">${esc(c.summary)}</div>
    ${ex ? `<div class="ex">e.g. <a href="#" onclick="event.preventDefault();useExample()">${esc(c.name)} ${esc(ex)}</a></div>` : ""}`;
  const box = document.getElementById("cons-args");
  box.placeholder = ex ? ex : "arguments, if any";
}

function useExample() {
  const c = COMMANDS.find(x => x.name === consCmd);
  const box = document.getElementById("cons-args");
  box.value = exampleArgs(c); box.focus();
}

async function runCommand(line) {
  const c = COMMANDS.find(x => x.name === consCmd);
  const box = document.getElementById("cons-args"), out = document.getElementById("cons-out");
  if (line != null) box.value = line;
  let args;
  try { args = splitArgs(box.value.trim()); } catch (e) { toast(e.message, "warn"); return; }
  // someone who types the command name as well has not asked for it twice
  if (args.length && args[0].toUpperCase() === c.name) args.shift();
  const quote = a => /[\s"'\\]/.test(a) || a === "" ? JSON.stringify(a) : a;
  const argLine = args.map(quote).join(" ");
  const shown = [c.name, ...args].map(quote).join(" ");
  if (c.dangerous && !confirm(`${shown}\n\nThis command is marked dangerous. Run it in ${current}?`)) return;
  if (c.write && current === "configuration" && !confirm(`${shown}${careful()}`)) return;
  const ent = document.createElement("div");
  ent.className = "ent";
  ent.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n…`;
  out.appendChild(ent);
  while (out.childElementCount > 60) out.firstElementChild.remove();
  out.scrollTop = out.scrollHeight;
  const r = await fetch("/api/admin/resp?" + new URLSearchParams({ space: current }),
    { method: "POST", body: JSON.stringify({ args: [c.name, ...args] }) });
  const res = await replyOf(r);
  ent.innerHTML = `<span class="dim">${esc(current)}&gt; ${esc(shown)}</span>\n` +
    (res.ok ? renderReply(res.reply, "") : `<span class="rerr">(error) ${esc(res.error || "failed")}</span>${c.name === "CALLF" ? blocksHint(res.error) : ""}`);
  out.scrollTop = out.scrollHeight;
  consHistory = [{ cmd: c.name, args: argLine, space: current },
    ...consHistory.filter(h => !(h.cmd === c.name && h.args === argLine && h.space === current))].slice(0, 12);
  try { localStorage.setItem("resp-history", JSON.stringify(consHistory)); } catch (e) {}
  drawHistory();
}

// redis-cli's way of writing a reply
function renderReply(r, pad) {
  if (!r) return "(nil)";
  switch (r.t) {
    case "nil": return `<span class="dim">(nil)</span>`;
    case "int": return `(integer) ${esc(r.v)}`;
    case "num": return `(double) ${esc(r.v)}`;
    case "bool": return `(${r.v ? "true" : "false"})`;
    case "str": return esc(JSON.stringify(r.v)) + (r.cut ? `<span class="dim"> … (${num(r.len)} bytes, cut)</span>` : "");
    case "bin": return `<span class="dim">(binary, ${num(r.len)} bytes)</span> ${esc(r.v)}${r.len > 512 ? " …" : ""}`;
    case "arr": {
      if (!r.v.length) return `<span class="dim">(empty array)</span>`;
      const w = String(r.v.length).length;
      return r.v.map((x, i) => (i ? pad : "") + `${String(i + 1).padStart(w)}) ` + renderReply(x, pad + " ".repeat(w + 2))).join("\n")
        + (r.len > r.v.length ? `\n${pad}<span class="dim">… ${num(r.len - r.v.length)} more</span>` : "");
    }
    case "map": {
      if (!r.v.length) return `<span class="dim">(empty map)</span>`;
      const w = String(r.v.length).length;
      return r.v.map(([k, x], i) => (i ? pad : "") + `${String(i + 1).padStart(w)}# ${renderReply(k, pad)} => ` + renderReply(x, pad + " ".repeat(w + 2))).join("\n");
    }
  }
  return esc(JSON.stringify(r.v));
}

function drawHistory() {
  const box = document.getElementById("cons-hist");
  if (!box) return;
  box.innerHTML = consHistory.length ? `<div class="hh">Recent</div>` + consHistory.map((h, i) => `
    <a href="#" onclick="event.preventDefault();replay(${i})"><span class="sp">${esc(h.space)}</span> ${esc(h.cmd)} ${esc(h.args)}</a>`).join("") : "";
}

function replay(i) {
  const h = consHistory[i];
  if (!h) return;
  document.getElementById("cons-cmd").value = h.cmd;
  pickCommand(h.cmd);
  document.getElementById("cons-args").value = h.args;
  document.getElementById("cons-args").focus();
}

// ---- configuration --------------------------------------------------------

// Settings that only take a fixed set of values, read out of configuration.cpp. Anything
// not listed is free text or a number and stays a text box; a value the server reports that
// is not in the list (a size for aof_durability, say) is added so it is not lost.
const ONOFF = ["on", "off"];
const EVICTIONS = ["volatile-lru", "allkeys-lru", "volatile-lfu", "allkeys-lfu", "volatile-random", "allkeys-random"];
const CONFIG_ENUMS = {
  eviction_policy: ["none", ...EVICTIONS],
  "maxmemory-policy": ["noeviction", ...EVICTIONS],
  compression: ["none", "zstd"],
  arena_map: ["all", "leaves", "nodes", "off"],
  aof_durability: ["none", "timer", "each"],
  active_defrag: ONOFF, ordered_keys: ONOFF, hybrid_keys: ONOFF,
  static_bloom_filter: ONOFF, traffic_capture: ONOFF, cgroup_memory_control: ONOFF,
};

function configField(g, n) {
  const opts = CONFIG_ENUMS[g.name];
  const go = `onkeydown="if(event.key==='Enter')setConfig('${esc(enc(g.name))}',${n},${g.host ? "true" : "false"})"`;
  if (!opts) return `<input class="cv" id="cv${n}" value="${esc(g.value)}" spellcheck="false" ${go}>`;
  const all = opts.includes(g.value) ? opts : [g.value, ...opts];
  return `<select class="cv" id="cv${n}" aria-label="${esc(g.name)}" ${go}>${all.map(o =>
    `<option value="${esc(o)}"${o === g.value ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
}

// The server's own settings (CONFIG GET / SET), in a modal so the key space underneath
// keeps its place. Not tied to the space that is open.
async function openServer() {
  const node = show(`<div class="top"><h2>Server configuration</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox"><div class="empty" style="padding:30px 0">Reading…</div></div>`,
    { space: null, id: "server-config", icon: "sliders" });
  const out = await api("config").catch(() => null);
  const d = docs.find(x => x.node === node);
  if (!out) { if (d) closeDoc(d, true); return; }
  node.querySelector(".valuebox").innerHTML = `
    ${out.global_error ? `<div class="notice">${esc(out.global_error)}</div>` : ""}
    ${isAdmin ? `<div class="notice small">These are the server's live settings and take effect at once; some
      only matter after a restart, and a value the server refuses is reported. Where it listens is always
      locked. ${out.here
        ? "You are on the machine itself, so the host directories and files, TLS, traffic capture and git sync can be changed too - carefully."
        : "The host directories and files, TLS, traffic capture and git sync can only be changed from the machine itself (127.0.0.1)."}</div>` : ""}
    <table class="keys cfg"><tbody>${(out.global || []).map((g, n) => `
      <tr>
        <td class="k" title="${esc(g.name)}">${esc(g.name)}</td>
        <td class="v">${isAdmin && !g.locked
          ? configField(g, n)
          : `<span class="${g.locked ? "locked" : ""}" ${g.locked ? `title="${esc(g.why || "locked")}"` : ""}>${esc(g.value)}</span>`}</td>
        ${isAdmin ? `<td class="act">${g.locked ? "" : `<button class="ib" title="Set" aria-label="Set ${esc(g.name)}"
              onclick="setConfig('${esc(enc(g.name))}',${n},${g.host ? "true" : "false"})">${ico("check")}</button>`}</td>` : ""}
      </tr>`).join("")}</tbody></table>`;
}

// ---- a space's own settings ---------------------------------------------------
//
// A space's settings are keys named <space>.<option> in the `configuration` space.
// The function limits get a dropdown each: the server default, a few round
// values, and whatever is set now. barch reads them when the space loads, so a
// change is marked as waiting for the next load; the other settings are listed
// as they are and are edited in the `configuration` space itself.

const LIMITS = [
  { key: "function_deadline_ms", label: "Deadline", unit: "ms", server: "function_deadline_ms", cap: "function_deadline_max_ms",
    presets: [1000, 5000, 10000, 30000, 60000, 120000, 300000],
    tip: "Running time a stored function gets. Time spent waiting on the network doesn't count." },
  { key: "function_deadline_max_ms", label: "Deadline cap", unit: "ms", server: "function_deadline_max_ms",
    presets: [30000, 60000, 120000, 300000, 600000],
    tip: "The most a function may ask for in its own --@barch header." },
  { key: "function_slice_insns", label: "Slice", unit: "insns", server: "function_slice_insns", cap: "function_slice_max_insns",
    presets: [200000, 1000000, 5000000, 10000000],
    tip: "Instructions a function runs before it gives its worker back to others." },
  { key: "function_slice_max_insns", label: "Slice cap", unit: "insns", server: "function_slice_max_insns",
    presets: [10000000, 50000000, 100000000],
    tip: "The most a function may ask for in its own --@barch header." },
];

const fmtLimit = (n, unit) => {
  n = Number(n);
  if (unit === "ms") return n % 60000 === 0 && n >= 60000 ? `${n / 60000} min` : n % 1000 === 0 ? `${n / 1000} s` : `${n.toLocaleString()} ms`;
  return n >= 1e6 && n % 1e6 === 0 ? `${n / 1e6}M` : n >= 1e3 && n % 1e3 === 0 ? `${n / 1e3}k` : n.toLocaleString();
};

// the server's own values for the four limits, from the global settings
function serverLimits(out) {
  const g = {};
  for (const x of (out && out.global) || []) g[x.name] = x.value;
  return g;
}

// one dropdown: "server default (1 s)", the presets, and the value set now
function limitSelect(L, set, server, capNow, id) {
  const vals = new Set(L.presets);
  if (set) vals.add(Number(set));
  const opts = [...vals].sort((a, b) => a - b);
  return `<select id="${id}" data-key="${L.key}">
    <option value=""${set ? "" : " selected"}>default · ${server ? fmtLimit(server, L.unit) : "server"}</option>
    ${opts.map(v => `<option value="${v}"${String(v) === String(set) ? " selected" : ""}${capNow && v > capNow ? " disabled" : ""}>${fmtLimit(v, L.unit)}${capNow && v > capNow ? " · over cap" : ""}</option>`).join("")}
  </select>`;
}

async function openSpaceConfig(space) {
  space = space || current;
  const out = await api("config").catch(() => null);
  if (!out) return;
  const mine = (out.spaces || {})[space] || {};
  const server = serverLimits(out);
  const other = Object.keys(mine).filter(k => !LIMITS.some(L => L.key === k)).sort();
  const capOf = L => L.cap ? Number(mine[L.cap] || server[L.cap]) || 0 : 0;
  const node = show(`<div class="top"><h2>${esc(space)} configuration</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox spacecfg" data-space="${esc(space)}">
      <h4>Function limits</h4>
      <div class="limits">${LIMITS.map((L, i) => `
        <label class="lim-row" title="${esc(L.tip)}">
          <span class="lim-name">${esc(L.label)} <i class="tip">${ico("more")}</i></span>
          ${isAdmin ? limitSelect(L, mine[L.key], server[L.server], capOf(L), "lim" + i)
            : `<span class="lim-val">${mine[L.key] ? fmtLimit(mine[L.key], L.unit) : "default · " + fmtLimit(server[L.server] || 0, L.unit)}</span>`}
          <span class="lim-now" id="lim-now${i}"></span>
        </label>`).join("")}
      </div>
      <div class="lim-foot" id="lim-foot">Saved as <code>${esc(space)}.&lt;setting&gt;</code> in <b>configuration</b>. Takes effect when ${esc(space)} next loads.</div>
      ${other.length ? `<h4>Other settings</h4>
        <table class="keys"><tbody>${other.map(k => `
          <tr><td class="k" title="${esc(k)}">${esc(k)}</td><td class="v">${esc(mine[k])}</td></tr>`).join("")}</tbody></table>
        <div class="lim-foot"><a href="#" onclick="event.preventDefault();pickSpace(null,'configuration');keyPrefix='${esc(space)}.';setView('keys')">Edit in configuration</a></div>` : ""}
    </div>`, { space, id: "space-config:" + space, icon: "gear" });
  node.querySelectorAll(".limits select").forEach(sel => sel.addEventListener("change", () => setSpaceLimit(space, sel)));
  spaceLimitsNow(space, node);
}

// what the space runs with at this moment, beside each dropdown
async function spaceLimitsNow(space, node) {
  const ask = async args => {
    const r = await fetch("/api/admin/resp?" + new URLSearchParams({ space }),
      { method: "POST", body: JSON.stringify({ args }) }).then(replyOf).catch(() => null);
    const x = r && r.ok && r.reply ? (r.reply.t === "arr" ? r.reply.v?.[1] : r.reply) : null;
    return x && x.v != null && x.t !== "err" ? String(x.v) : null;
  };
  const [dl, sl] = await Promise.all([ask(["KSPACE", "OPTION", "GET", "FUNCTION_DEADLINE"]), ask(["KSPACE", "OPTION", "GET", "FUNCTION_SLICE"])]);
  const put = (i, v, unit) => { const el = node.querySelector("#lim-now" + i); if (el && v) el.textContent = "now " + fmtLimit(v, unit); };
  put(0, dl, "ms"); put(2, sl, "insns");
}

async function setSpaceLimit(space, sel) {
  const key = space + "." + sel.dataset.key;
  const v = sel.value;
  const ok = v ? await write("key_put", { space: "configuration", key }, v) : await write("key_rm", { space: "configuration", key }, null, true);
  if (!ok && v) return;
  sel.closest(".lim-row").classList.add("pending");
  const foot = document.getElementById("lim-foot");
  if (foot) foot.innerHTML = `<b class="pend">Saved</b> — ${esc(space)} picks it up when it next loads (a server restart).`;
  toast(`${key} = ${v ? fmtLimit(v, sel.dataset.key.endsWith("_ms") ? "ms" : "insns") : "server default"}`, "ok");
}

// ---- a new space ----------------------------------------------------------------
//
// A small form rather than a prompt: the name, and the deadline and slice it
// starts with. The two limits are written as settings before the space is made,
// so it loads with them and they are there to find and raise later.
async function newSpace(ev) {
  if (ev) ev.preventDefault();
  const out = await api("config").catch(() => null);
  const server = serverLimits(out);
  const dl = LIMITS[0], sl = LIMITS[2];
  const pick = (L, id, dflt) => `<select id="${id}">${[...new Set([...L.presets, Number(dflt) || 0])].filter(Boolean).sort((a, b) => a - b)
    .map(v => `<option value="${v}"${v === Number(dflt) ? " selected" : ""}>${fmtLimit(v, L.unit)}${v === Number(dflt) ? " · server default" : ""}</option>`).join("")}</select>`;
  show(`<div class="top"><h2>New key space</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox spacecfg">
      <div class="limits">
        <label class="lim-row"><span class="lim-name">Name</span>
          <input id="ns-name" placeholder="letters, digits, _" autocomplete="off" spellcheck="false"></label>
        <label class="lim-row" title="${esc(dl.tip)}"><span class="lim-name">Function deadline <i class="tip">${ico("more")}</i></span>${pick(dl, "ns-deadline", server[dl.server] || 1000)}</label>
        <label class="lim-row" title="${esc(sl.tip)}"><span class="lim-name">Function slice <i class="tip">${ico("more")}</i></span>${pick(sl, "ns-slice", server[sl.server] || 1000000)}</label>
      </div>
      <div class="row"><button class="primary" onclick="createSpace()">Create</button></div>
      <div class="lim-foot">Change these later with the ${ico("gear")} next to the space's name.</div>
    </div>`, { space: null, id: "new-space", icon: "plus" });
  const name = document.getElementById("ns-name");
  name.focus();
  name.addEventListener("keydown", e => { if (e.key === "Enter") createSpace(); });
}

async function createSpace() {
  const name = (document.getElementById("ns-name")?.value || "").trim();
  if (!name) return document.getElementById("ns-name")?.focus();
  if (!/^[A-Za-z0-9_]+$/.test(name)) return toast("a space name is letters, digits and underscores", "warn");
  if (spaces.some(s => s.name === name)) return toast(`${name} already exists`, "warn");
  // the limits first: the space reads them when it is built
  for (const [id, opt] of [["ns-deadline", "function_deadline_ms"], ["ns-slice", "function_slice_insns"]]) {
    const v = document.getElementById(id)?.value;
    if (v && !await write("key_put", { space: "configuration", key: name + "." + opt }, v)) return;
  }
  if (!await write("space_add", { name })) return;
  shut();
  const out = await api("spaces").catch(() => null);
  if (out) spaces = out.spaces || [];
  current = name;
  resetPlace();
  drawSpaces();
  docsFollowSpace();
  draw();
  drawStatus();
  toast(`Created ${name}`, "ok");
}

async function setConfig(name, n, host) {
  name = decodeURIComponent(name);
  const box = document.getElementById("cv" + n);
  if (!box) return;
  const warn = host
    ? "\n\nCAREFUL: this is a path or file on the host. The server will read, write or load code from what you give it."
    : "";
  if (!confirm(`CONFIG SET ${name} ${box.value}\n\nThis changes the running server.${warn}`)) return;
  const out = await write("config_set", { name }, box.value);
  if (out) {
    if (box.tagName === "SELECT" && ![...box.options].some(o => o.value === out.value)) box.add(new Option(out.value, out.value));
    box.value = out.value; toast(name + " = " + out.value);
  }
}

// ---- statistics -----------------------------------------------------------

async function drawStats() {
  if (tab !== "stats") return;      // another view is on screen
  const seq = ++drawSeq;
  const pane = document.getElementById("pane");
  pane.innerHTML = head("statistics") + `<div id="rows"><div class="empty" style="padding:40px 0">Reading…</div></div>`;
  const out = await api("stats").catch(() => null);
  if (stale(seq)) return;
  if (!out) return;
  // every category reads in alphabetical order, so a name is found by looking
  // where it belongs rather than where the server happened to list it
  const table = rows => `<table class="keys"><tbody>${(rows || [])
    .slice().sort((a, b) => a.name.localeCompare(b.name))
    .map(r => `
    <tr><td class="k">${esc(r.name)}</td><td class="v">${esc(r.value)}</td></tr>`).join("")}</tbody></table>`;
  document.getElementById("rows").innerHTML = `
    <h4>Server</h4>${table(out.server)}
    <h4>Shard 0 of <code>${esc(out.shard.space)}</code></h4>
    <div class="notice small">INFO SHARD reads the connection's key space, and the
      route runs in <code>${esc(out.shard.space)}</code> — so this describes that
      space whichever one is selected on the left.</div>
    ${table(out.shard.lines)}
    <h4>Allocator</h4>${table(out.stats)}
    <h4>Operations</h4>${table(out.ops)}
    <h4>Errors</h4>${table(out.errors)}`;
}


// ---- sign-in --------------------------------------------------------------
//
// Self-contained: no /shop pages. Sign in or register against
// /api/spaces-user/* (USERS in this space). First account becomes admin.

async function authCall(op, body) {
  const r = await fetch("/api/spaces-user/" + op,
    { method: "POST", body: JSON.stringify(body) });
  return { status: r.status, out: await r.json().catch(() => ({})) };
}

function openAuth(mode) {
  const signin = mode ? mode !== "register" : !needsAdmin;
  modal(`<div class="top"><h2>${signin ? "Sign in" : "Create an account"}</h2>`
    + `<button onclick="unmodal()">Close</button></div>
    <div class="valuebox"><div class="auth-card" style="box-shadow:none;margin:0;max-width:none">
      <p class="sub">${needsAdmin && !signin
        ? "This server has no admin yet — whoever creates the first account becomes it."
        : "The viewer reads every space this server has."}</p>
      <div class="err" id="auth-err" style="display:none"></div>
      <form id="auth-f">
        ${signin ? "" : `<div><label for="auth-name">Name</label>`
          + `<input id="auth-name" name="name" autocomplete="name" placeholder="Your name"></div>`}
        <div><label for="auth-email">Email</label>
          <input id="auth-email" name="email" type="email" required placeholder="you@example.com"></div>
        <div><label for="auth-password">Password</label>
          <input id="auth-password" name="password" type="password" required
            placeholder="${signin ? "Your password" : "At least 6 characters"}"></div>
        <button type="submit">${signin ? "Sign in" : "Create account"}</button>
      </form>
      <div class="foot">${signin
        ? `New here? <a href="#" onclick="event.preventDefault();openAuth('register')">Create an account</a>`
        : needsAdmin
          ? `The account you make is the admin of this server.`
          : `Have one? <a href="#" onclick="event.preventDefault();openAuth('signin')">Sign in</a>`}</div>
    </div></div>`);
  document.getElementById("auth-f").addEventListener("submit", async e => {
    e.preventDefault();
    const err = document.getElementById("auth-err");
    err.style.display = "none";
    const email = document.getElementById("auth-email").value;
    const password = document.getElementById("auth-password").value;
    const nameEl = document.getElementById("auth-name");
    const { status, out } = await authCall(signin ? "signon" : "register",
      signin ? { email, password } : { email, password, name: nameEl ? nameEl.value : "" });
    if (status >= 200 && status < 300 && !out.error && out.ok !== false) {
      unmodal(); boot();
    } else {
      err.textContent = out.error || "could not sign in";
      err.style.display = "block";
    }
  });
}

// The header shows who is signed in, and the exit door signs out:
// POST /api/spaces-user/signout clears the session server-side, then the
// page reboots into the sign-in form (or the local-admin guest, if no
// admin exists yet).
function setUser(user) {
  const label = document.getElementById("head-user");
  const btn = document.getElementById("signout-btn");
  if (user && user.email) {
    label.textContent = user.email;
    label.hidden = false;
    btn.hidden = false;
    btn.onclick = signout;
  } else {
    label.textContent = "";
    label.hidden = true;
    btn.hidden = true;
    btn.onclick = null;
  }
}

async function signout() {
  await fetch("/api/spaces-user/signout", { method: "POST" }).catch(() => null);
  setUser(null);                       // signed out is signed out, whatever comes next
  await boot();
}


// ---- export and import ------------------------------------------------------
//
// EXPORT writes a key space as the commands that would rebuild it - SET, HSET,
// RPUSH, ZADD - as a RESP stream; IMPORT replays one. The file is on the
// server's filesystem, not this machine's, which is the first thing the panel
// says, and the pair is offered only to a browser on the server itself.
//
// An import merges: keys the stream names are overwritten, keys it does not are
// left alone. That is the right default for a way back from a bad state, and
// the wrong one if a replacement was meant, so the panel says so out loud.

function transferNote(msg, kind) {
  const n = document.getElementById("tr-note");
  if (!n) return;
  n.textContent = msg;
  n.className = "notice small" + (kind === "ok" ? " ok" : kind === "warn" ? " warn" : "");
}

function notLocal() {
  return `<div class="notice small warn">The file is written and read on the machine the
    server runs on, so this is only offered from a browser on that machine (127.0.0.1).
    You are somewhere else.</div>`;
}

function openTransfer(ev, name) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  name = decodeURIComponent(name);
  show(`<div class="top"><h2>${ico("transfer")} Export or import · ${esc(name)}</h2>
      <button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">${esc(name)} · a RESP command stream, on the server's filesystem</div>
      ${isHere ? `<div class="linker">
        <label>File, on the server
          <input id="tr-path" autocomplete="off" spellcheck="false"
                 value="${esc(name)}.resp" placeholder="${esc(name)}.resp"></label>
        <div class="row">
          <button class="primary" onclick="doTransfer('export','${esc(enc(name))}')">${ico("transfer")} Export</button>
          <button onclick="doTransfer('import','${esc(enc(name))}')">${ico("transfer")} Import</button>
        </div>
        <div class="notice small" id="tr-note">A relative path lands where the server runs.
          Import merges into what is already there; clear the space first to replace it.</div>
      </div>` : notLocal()}
    </div>`, { space: name, id: "transfer:" + name, icon: "transfer" });
  if (isHere) document.getElementById("tr-path").focus();
}

async function doTransfer(op, name) {
  name = decodeURIComponent(name);
  const path = (document.getElementById("tr-path").value || "").trim();
  if (!path) return transferNote("a file path is needed", "warn");
  if (op === "import" && !confirm(
      `Replay ${path} into ${name}?\n\nKeys the file names are overwritten. Keys it does not name are left alone.`))
    return;
  transferNote(op === "export" ? "writing…" : "replaying…");
  const out = await write(op, { space: name, path });
  if (!out) return transferNote("it did not run — see the message above", "warn");
  transferNote(`${num(out.keys)} ${out.keys === 1 ? "key" : "keys"} ${op === "export" ? "written to" : "read from"} ${out.path}`, "ok");
  if (op === "import") {
    const list = await api("spaces").catch(() => null);
    if (list) { spaces = list.spaces || []; drawSpaces(); }
    if (name === current) draw();
  }
}

function openTransferAll(ev) {
  ev.preventDefault();
  show(`<div class="top"><h2>${ico("transfer")} Export or import every space</h2>
      <button onclick="shut()">Close</button></div>
    <div class="valuebox">
      <div class="meta">a file per space, named after it, on the server's filesystem</div>
      ${isHere ? `<div class="linker">
        <label>Directory, on the server
          <input id="tr-path" autocomplete="off" spellcheck="false" value="." placeholder="."></label>
        <div class="row">
          <button class="primary" onclick="doTransferAll('export_all')">${ico("transfer")} Export all</button>
          <button onclick="doTransferAll('import_all')">${ico("transfer")} Import all</button>
        </div>
        <div class="notice small" id="tr-note">Export writes &lt;space&gt;.resp for every space that can be
          opened. Import looks for &lt;space&gt;.resp beside each space it finds and merges it in — a space
          that is gone has to be made first, with the + above.</div>
        <div id="tr-rows"></div>
      </div>` : notLocal()}
    </div>`, { space: null, id: "transfer-all", icon: "transfer" });
  if (isHere) document.getElementById("tr-path").focus();
}

async function doTransferAll(op) {
  const dir = (document.getElementById("tr-path").value || "").trim();
  if (!dir) return transferNote("a directory is needed", "warn");
  if (op === "import_all" && !confirm(
      `Replay every .resp in ${dir} into the space it is named after?\n\n` +
      `Spaces that are not there are made. Keys the files name are overwritten.`))
    return;
  transferNote(op === "export_all" ? "writing…" : "replaying…");
  document.getElementById("tr-rows").innerHTML = "";
  const out = await write(op, { dir });
  if (!out) return transferNote("it did not run — see the message above", "warn");
  const rows = Array.isArray(out.spaces) ? out.spaces : [];
  const bad = rows.filter(r => r.error).length;
  transferNote(`${num(rows.length)} ${rows.length === 1 ? "space" : "spaces"} in ${esc(out.dir)}`
    + (bad ? `, ${num(bad)} of them refused` : ""), bad ? "warn" : "ok");
  document.getElementById("tr-rows").innerHTML = !rows.length ? "" :
    `<table class="keys"><tbody>${rows.map(r => `
      <tr><td class="k">${esc(r.space)}</td>
          <td class="v">${r.error ? esc(r.error) : num(r.keys) + " keys"}</td></tr>`).join("")}</tbody></table>`;
  if (op === "import_all") {
    const list = await api("spaces").catch(() => null);
    if (list) { spaces = list.spaces || []; drawSpaces(); }
    draw();
  }
}

// ---- shell ----------------------------------------------------------------

function head(what) {
  const gear = current
    ? `<button class="gear" title="Configuration of ${esc(current)}" aria-label="Configuration of ${esc(current)}"
              onclick="openSpaceConfig()">${ico("gear")}</button>` : "";
  return `<div class="head">
    <h1>${esc(current || "—")}</h1>
    <div class="hr"><div class="count">${esc(what)}</div>${gear}</div>
  </div>`;
}

function toast(msg, kind) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  // green for ok, copper/yellow for failure; plain notice when it ran fine
  // and there is nothing to celebrate (a good call shows no toast at all)
  t.className = "notice small" + (kind === "ok" ? " ok" : kind === "warn" ? " warn" : "");
  t.textContent = msg; t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 2500);
}

// Two clicks instead of a confirm(): the first arms the button for four
// seconds - relabelled (when `label` is given) and turned red, with `note` in a
// toast - and only a click while it is armed answers true. A shortcut that
// arrives while armed counts as the second click too.
function armed(btn, label, note) {
  if (!btn) return true;
  if (btn.dataset.armed) { disarm(btn); return true; }
  btn.dataset.armed = "1";
  btn._before = btn.innerHTML;
  if (label != null) btn.textContent = label;
  btn.classList.add("warn", "armed");
  if (note) toast(note, "warn");
  btn._arm = setTimeout(() => disarm(btn), 4000);
  return false;
}

function disarm(btn) {
  clearTimeout(btn._arm);
  delete btn.dataset.armed;
  if (btn._before != null) btn.innerHTML = btn._before;
  btn.classList.remove("warn", "armed");
}

// ---- the workbench: documents open as tabs beside the list -----------------
//
// What used to be a dialog - a value, a file, a function, the server's settings -
// opens as a document in the editor area, and several stay open at once. Only
// the active document is in the page; the others are kept, with their unsaved
// edits, as detached nodes. That keeps every getElementById in the editors
// pointing at the document on screen.
//
// A document belongs to the space it was opened in, and its Save and Delete
// write to `current`. So activating a document selects its space, and picking
// another space puts away a document that belongs to a different one. A
// document with no space (settings, server configuration) goes with any.

const docs = [];
let activeDoc = null, docSeq = 0;

// unsaved: a value or a source that differs from what was loaded or saved
function docDirty(d) {
  return [...d.node.querySelectorAll("textarea:not([disabled]):not(#ai-q), #ek, #nleaf-name")]
    .some(el => el.value !== el.defaultValue);
}

// Open `html` as a document and show it. `opt.id` names it, so opening the same
// key again returns to its tab; when that tab has unsaved edits it is shown as
// it is, otherwise it is filled with the fresh copy. Returns the document node.
function show(html, opt) {
  opt = opt || {};
  const space = opt.space !== undefined ? opt.space : current;
  const node = document.createElement("div");
  node.className = "doc";
  node.innerHTML = html;
  const h2 = node.querySelector(".top h2");
  const title = opt.title || (h2 ? h2.textContent.trim() : "Untitled");
  const id = opt.id || ("doc:" + (space || "") + ":" + title);
  let d = docs.find(x => x.id === id);
  if (d && docDirty(d)) { activateDoc(d); return d.node; }
  if (d) d.node = node;
  else {
    d = { id, seq: ++docSeq, title, space, icon: opt.icon || "file", node };
    const at = activeDoc ? docs.indexOf(activeDoc) + 1 : docs.length;
    docs.splice(at, 0, d);
  }
  d.title = title;
  node.addEventListener("input", () => drawDocTabs());
  activateDoc(d, true);
  return node;
}

// Close the document on screen: a Delete that went through, a form that is done.
function shut() { if (activeDoc) closeDoc(activeDoc, true); }

function activateDoc(d, fresh) {
  if (d.space && d.space !== current && spaces.some(s => s.name === d.space && s.openable)) {
    current = d.space;
    resetPlace();
    activeDoc = d;
    drawSpaces();
    draw();
  }
  activeDoc = d;
  d.used = ++docSeq;
  const panel = document.getElementById("panel");
  if (panel.firstChild !== d.node) panel.replaceChildren(d.node);
  document.getElementById("wb").classList.remove("solo", "browse");
  drawDocTabs();
  markOpen();
  drawStatus();
  if (!fresh) d.node.querySelector("textarea:not([disabled])")?.focus({ preventScroll: true });
}

function closeDoc(d, force) {
  if (!force && docDirty(d) && !confirm(`${d.title} has changes that are not saved. Close it anyway?`)) return;
  const i = docs.indexOf(d);
  if (i < 0) return;
  docs.splice(i, 1);
  if (activeDoc === d) {
    activeDoc = null;
    // the last one used in this space (or one with no space); never a jump to
    // another space just because a tab closed
    const next = docs.filter(x => !x.space || x.space === current).sort((a, b) => b.used - a.used)[0];
    if (next) activateDoc(next);
    else showNoDoc();
  }
  drawDocTabs();
}

function showNoDoc() {
  activeDoc = null;
  document.getElementById("panel").replaceChildren();
  document.getElementById("wb").classList.toggle("solo", true);
  drawDocTabs();
  markOpen();
  drawStatus();
}

// the space changed under the documents: keep the one on screen only if it goes with it
function docsFollowSpace() {
  if (activeDoc && (!activeDoc.space || activeDoc.space === current)) return drawDocTabs();
  const next = docs.filter(x => x.space === current).sort((a, b) => b.used - a.used)[0];
  if (next) activateDoc(next); else showNoDoc();
}

function drawDocTabs() {
  const bar = document.getElementById("doc-tabs");
  bar.innerHTML = docs.map((d, i) => {
    const dirty = docDirty(d), other = d.space && d.space !== current;
    return `<div class="dtab${d === activeDoc ? " on" : ""}${other ? " other" : ""}" role="tab"
        aria-selected="${d === activeDoc}" title="${esc((d.space ? d.space + " · " : "") + d.title)}"
        onclick="activateDoc(docs[${i}])" onauxclick="if(event.button===1)closeDoc(docs[${i}])">
      ${other ? `<span class="dsp">${esc(d.space)}</span>` : ""}<span class="dt">${esc(d.title)}</span>
      <button class="dx${dirty ? " dirty" : ""}" aria-label="Close ${esc(d.title)}"
        onclick="event.stopPropagation();closeDoc(docs[${i}])">${dirty ? "●" : "×"}</button>
    </div>`;
  }).join("");
  bar.querySelector(".dtab.on")?.scrollIntoView({ block: "nearest", inline: "nearest" });
}

// the row of the open document is marked in the list, like an IDE's explorer
function markOpen() {
  document.querySelectorAll("#pane [data-doc]").forEach(el =>
    el.classList.toggle("sel", !!activeDoc && el.dataset.doc === activeDoc.id));
}
const docId = (kind, name) => kind + ":" + current + ":" + name;   // a space name has no colon

function resetPlace() {
  fsPath = "/"; gPath = "/"; keyPrefix = ""; keyMatch = ""; fsMatch = ""; fnMatch = "";
}

// ---- the list's width, and the console's height --------------------------

function dragSplit(handle, onMove, onEnd) {
  handle.addEventListener("pointerdown", e => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    handle.classList.add("on");
    const move = ev => onMove(ev);
    const up = () => {
      handle.classList.remove("on");
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      onEnd && onEnd();
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
  });
}
(function () {
  const wb = document.getElementById("wb");
  const w = parseInt(appSetting("listWidth", ""), 10);
  if (w >= 260) wb.style.setProperty("--exw", w + "px");
  const h = parseInt(appSetting("dockHeight", ""), 10);
  if (h >= 120) wb.style.setProperty("--dockh", h + "px");
  const pane = document.getElementById("pane");
  dragSplit(document.getElementById("split-x"), ev => {
    const x = ev.clientX - pane.getBoundingClientRect().left;
    wb.style.setProperty("--exw", Math.max(260, Math.min(x, window.innerWidth - 420)) + "px");
  }, () => setAppSetting("listWidth", String(parseInt(getComputedStyle(wb).getPropertyValue("--exw"), 10) || "")));
  document.getElementById("split-x").addEventListener("keydown", e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const now = pane.getBoundingClientRect().width + (e.key === "ArrowLeft" ? -24 : 24);
    wb.style.setProperty("--exw", Math.max(260, now) + "px");
    setAppSetting("listWidth", String(Math.round(Math.max(260, now))));
  });
  dragSplit(document.getElementById("split-y"), ev => {
    const h = window.innerHeight - ev.clientY - 24;
    wb.style.setProperty("--dockh", Math.max(120, Math.min(h, window.innerHeight - 220)) + "px");
  }, () => setAppSetting("dockHeight", String(parseInt(getComputedStyle(wb).getPropertyValue("--dockh"), 10) || "")));
})();

// ---- the console, docked under the editor ---------------------------------

function toggleDock(on) {
  const dock = document.getElementById("dock");
  on = on == null ? dock.hidden : on;
  if (on && !isAdmin) return;
  dock.hidden = !on;
  document.getElementById("wb").classList.toggle("docked", on);
  document.getElementById("tab-console").classList.toggle("on", on);
  if (on) openConsole();
}

function drawDockTitle() {
  const t = document.getElementById("dock-title");
  if (t) t.innerHTML = `${ico("terminal")} Console <span class="dim">· runs in</span> <b>${esc(current || "—")}</b>`;
}

// ---- the status line and the breadcrumb ------------------------------------

const VIEW_NAMES = { keys: "Keys", files: "Files", graph: "Graph", functions: "Functions", stats: "Statistics" };

function drawStatus() {
  const s = spaces.find(x => x.name === current);
  const crumb = document.getElementById("crumb");
  if (crumb) crumb.innerHTML = current
    ? `<a href="#" onclick="event.preventDefault();openPalette('space ')">${esc(current)}</a>
       <span class="sep">›</span><span>${esc(VIEW_NAMES[tab] || tab)}</span>
       ${activeDoc ? `<span class="sep">›</span><span class="doc-name">${esc(activeDoc.title)}</span>` : ""}`
    : `<span class="dim">Key spaces</span>`;
  const st = document.getElementById("status");
  if (!st) return;
  st.innerHTML = `
    <span class="st-i"><span class="led"></span>${esc(location.host)}${isHere ? " · local" : ""}</span>
    ${current ? `<span class="st-i">${ico(s && s.files ? "folder" : "database")} ${esc(current)}</span>` : ""}
    ${s ? `<span class="st-i">${num(s.keys)} keys</span>` : ""}
    ${current === "configuration" ? `<span class="st-i st-warn">configuration space — writes change the server</span>` : ""}
    <span class="fill"></span>
    ${docs.length ? `<span class="st-i">${docs.length} open</span>` : ""}
    ${isAdmin ? `<a href="#" class="st-i" onclick="event.preventDefault();toggleDock()">${ico("terminal")} Console</a>` : ""}
    <a href="#" class="st-i" onclick="event.preventDefault();openPalette()"><kbd>Ctrl K</kbd> Go to</a>`;
  drawDockTitle();
}

// ---- quick input: the Go to list, and the one-line questions ---------------
//
// One box under the top bar answers both: Ctrl+K lists spaces, views, open
// documents and actions, and a typed key name can be opened directly. ask()
// uses the same box for a single line of text - a folder name, a new path -
// where the page used to pop up a browser prompt.

let qi = null;

function qiClose(value) {
  const box = document.getElementById("qi");
  if (box.hidden) return;
  box.hidden = true;
  const q = qi; qi = null;
  if (q && q.resolve) q.resolve(value ?? null);
  q?.back?.focus?.({ preventScroll: true });
}

function qiOpen(conf) {
  if (qi) qiClose(null);
  qi = { ...conf, at: 0, items: [], back: document.activeElement };
  const box = document.getElementById("qi"), inp = document.getElementById("qi-in");
  box.hidden = false;
  inp.value = conf.value || "";
  inp.placeholder = conf.placeholder || "";
  document.getElementById("qi-hint").textContent = conf.hint || "";
  qiDraw();
  inp.focus();
  if (conf.select) inp.setSelectionRange(conf.select[0], conf.select[1]);
}

function qiDraw() {
  if (!qi) return;
  const text = document.getElementById("qi-in").value;
  qi.items = qi.list ? qi.list(text) : [];
  qi.at = Math.min(qi.at, Math.max(0, qi.items.length - 1));
  document.getElementById("qi-list").innerHTML = qi.items.map((it, i) => `
    <div class="qi-it${i === qi.at ? " on" : ""}" role="option" aria-selected="${i === qi.at}"
         onmousedown="event.preventDefault();qiTake(${i})" onmousemove="qiHover(${i})">
      ${ico(it.icon || "tag")}<span class="n">${it.html || esc(it.label)}</span>
      ${it.note ? `<span class="s">${esc(it.note)}</span>` : ""}</div>`).join("");
  document.querySelector("#qi-list .qi-it.on")?.scrollIntoView({ block: "nearest" });
}
function qiHover(i) { if (qi && qi.at !== i) { qi.at = i; qiDraw(); } }

function qiTake(i) {
  if (!qi) return;
  const text = document.getElementById("qi-in").value;
  if (!qi.list) return qiClose(text);          // ask(): the line is the answer
  const it = qi.items[i];
  if (!it) return;
  qiClose(null);
  it.run(text);
}

document.getElementById("qi-in").addEventListener("input", () => { if (qi) { qi.at = 0; qiDraw(); } });
document.getElementById("qi-in").addEventListener("keydown", e => {
  if (!qi) return;
  if (e.key === "Escape") { e.preventDefault(); qiClose(null); }
  else if (e.key === "Enter") { e.preventDefault(); qiTake(qi.at); }
  else if (e.key === "ArrowDown" && qi.items.length) { e.preventDefault(); qi.at = (qi.at + 1) % qi.items.length; qiDraw(); }
  else if (e.key === "ArrowUp" && qi.items.length) { e.preventDefault(); qi.at = (qi.at - 1 + qi.items.length) % qi.items.length; qiDraw(); }
});
document.getElementById("qi").addEventListener("mousedown", e => { if (e.target.id === "qi") qiClose(null); });

// one line of text, or null when it is dismissed
function ask(question, value, hint, select) {
  return new Promise(resolve => qiOpen({ placeholder: question, value: value || "", hint: hint || question + " — Enter to accept, Esc to cancel", resolve,
    select: select || (value ? [value.length, value.length] : null) }));
}

function paletteItems(text) {
  const t = text.trim(), low = t.toLowerCase();
  const spaceOnly = low.startsWith("space ");
  const q = spaceOnly ? low.slice(6).trim() : low;
  const hit = s => !q || s.toLowerCase().includes(q);
  const out = [];
  for (const s of spaces.filter(x => x.openable && hit("space " + x.name)))
    out.push({ icon: s.files ? "folder" : "database", label: s.name, note: `space · ${num(s.keys)} keys`,
      run: () => pickSpace(null, s.name) });
  if (spaceOnly) return out;
  for (const d of docs.filter(x => hit(x.title) || hit("tab " + x.title)))
    out.push({ icon: "file", label: d.title, note: `open tab${d.space ? " · " + d.space : ""}`, run: () => activateDoc(d) });
  const views = [["keys", "key", "Keys"], ["files", "folder", "Files"], ["graph", "graph", "Graph"],
    ["functions", "code", "Functions"], ["stats", "chart", "Statistics"]];
  for (const [v, i, name] of views) if (hit("view " + name))
    out.push({ icon: i, label: name, note: "view", run: () => setView(v) });
  const acts = [
    isAdmin && ["key", "New key", () => { setView("keys"); newKey(); }],
    isAdmin && ["code", "New function", () => { setView("functions"); newFunction(); }],
    isAdmin && ["plug", "Add a service…", () => addService()],
    isAdmin && ["plus", "New space", () => newSpace()],
    isAdmin && ["terminal", "Toggle console", () => toggleDock()],
    ["sliders", "Server configuration", () => openServer()],
    current && ["gear", `Configuration of ${current}`, () => openSpaceConfig()],
    isAdmin && current && ["transfer", `Export or import ${current}`, () => openTransfer(null, enc(current))],
    ["gear", "App settings", () => openAppSettings()],
    ["contrast", "Toggle dark mode", () => document.getElementById("theme-btn").click()],
    activeDoc && ["minus", `Close ${activeDoc.title}`, () => closeDoc(activeDoc)],
  ].filter(Boolean);
  for (const [i, label, run] of acts) if (hit(label)) out.push({ icon: i, label, note: "action", run });
  // a typed name is taken as a key in the open space: open it, or list what starts with it
  if (t && current && !spaceOnly) {
    out.push({ icon: "key", html: `Open key <b>${esc(t)}</b>`, note: current, run: () => openValue(enc(t)) });
    out.push({ icon: "search", html: `List keys starting with <b>${esc(t)}</b>`, note: current,
      run: () => { keyPrefix = t; keyMatch = ""; setView("keys"); } });
  }
  return out;
}

function openPalette(text) {
  qiOpen({ placeholder: "Type a space, a view, an action, or a key name", value: text || "", list: paletteItems,
    hint: "↑↓ to move · Enter to go · Esc to close · a typed name can be opened as a key in " + (current || "the open space") });
}

function setView(v) {
  tab = v;
  [...document.querySelectorAll("#tabs a[data-tab]")].forEach(x =>
    x.classList.toggle("on", x.dataset.tab === v || (x.dataset.tab === "console" && !document.getElementById("dock").hidden)));
  draw();
  drawStatus();
}

document.getElementById("palette-btn").onclick = () => openPalette();
document.getElementById("spaces-btn").onclick = () => document.getElementById("wb").classList.toggle("show-spaces");

// ---- the one dialog left: signing in ----------------------------------------

function modal(html) {
  document.getElementById("modal").innerHTML = html;
  document.getElementById("veil").classList.add("on");
}
function unmodal() { document.getElementById("veil").classList.remove("on"); }
document.getElementById("veil").onclick = e => { if (e.target.id === "veil") unmodal(); };

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!document.getElementById("qi").hidden) return; unmodal(); return; }
  const mod = (e.ctrlKey || e.metaKey) && !e.altKey;
  if (!mod) return;
  if (e.key === "k" || e.key === "K" || (e.shiftKey && (e.key === "p" || e.key === "P"))) {
    e.preventDefault(); openPalette(); return;
  }
  if (e.key === "`") { e.preventDefault(); toggleDock(); return; }
});
window.addEventListener("beforeunload", e => {
  if (docs.some(docDirty)) { e.preventDefault(); e.returnValue = ""; }
});

boot();
</script>
