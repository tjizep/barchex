.ai-code pre { margin: 0; background: var(--code-bg); color: #dce6df; border-radius: var(--r-sm); padding: 10px 12px;
  font-family: var(--mono); font-size: 12px; line-height: 1.5; overflow: auto; max-height: 40vh; white-space: pre; }
.ai-acts { display: flex; gap: 8px; margin-top: 6px; }
.ai-acts button { padding: 5px 12px; font-size: 12.5px; min-height: 0; }
.ai-err { color: var(--flag); }
.ai-wait { display: inline-block; color: var(--ink-3); animation: aiPulse 1s ease-in-out infinite; }
@keyframes aiPulse { 50% { opacity: .3; } }
.appsettings .asrow input { flex: 0 1 300px; min-width: 0; font-family: var(--mono); font-size: 12.5px; padding: 6px 10px;
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-sm); }

/* a space's settings: one row per limit, a dropdown and what runs now */
.spacecfg h4 { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); margin: 6px 0 10px; }
.spacecfg .limits { display: grid; gap: 8px; max-width: 560px; }
.lim-row { display: grid; grid-template-columns: 150px minmax(0, 220px) auto; gap: 12px; align-items: center; }
.lim-name { font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; cursor: help; }
.lim-name .tip { display: inline-flex; color: var(--ink-3); opacity: .6; }
.lim-name .tip .ico { width: 12px; height: 12px; }
.lim-row select, .lim-row input { height: 32px; padding: 0 10px; font-family: var(--mono); font-size: 12.5px;
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-sm); min-width: 0; }
.lim-row.pending select { border-color: var(--l2); box-shadow: 0 0 0 2px var(--l2-soft); }
.lim-now, .lim-val { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.lim-foot { margin-top: 12px; font-size: 12px; color: var(--ink-3); }
.lim-foot .pend { color: var(--l2); }
.lim-foot .ico { width: 12px; height: 12px; }
.spacecfg .row { margin-top: 14px; }
@media (max-width: 560px) { .lim-row { grid-template-columns: 1fr; gap: 4px; } }


/* ============ the ledger ============
 * The workbench is a ledger sheet: green rules between rows, entries in
 * blue-black, a red double rule for the margin between a key and its value.
 * Labels are set in sentence case in the page's own face; mono is kept for
 * what is literally bytes - keys, values, code, paths. */
body { font-size: 14px; line-height: 1.5; }
.logo b, .wb-top .logo b {
  font-family: var(--sans); font-weight: 800; font-size: 18px;
  letter-spacing: -.02em; text-transform: none;
}
.logo b em { color: var(--l2); }

nav h3, .wb-spaces .spaces-head h3, main.viewer h4, .wb-explorer h4, .spacecfg h4,
.editor .fn-side h5, .account h3, .related h3, .reviews h3 {
  font-family: var(--sans); font-size: 12.5px; font-weight: 600;
  letter-spacing: 0; text-transform: none; color: var(--ink-2);
}
.count, .crumbs, .wb-crumb .dim, .valuebox .meta, .dock-title, .cons-hist .hh,
.ai-ctx .ai-lbl, .viewer-title, .badge, .state, .checkout label, .auth-card label,
.ship-head, .steps .step, .hits button small, .order-head .when {
  letter-spacing: 0; text-transform: none;
}
.count, .wb-crumb .dim, .dock-title, .cons-hist .hh, .ai-ctx .ai-lbl,
.auth-card label, .checkout label {
  font-family: var(--sans); font-size: 12px;
}
.valuebox .meta { font-size: 11.5px; }
.dock-title { font-weight: 600; }
.kt, table.keys td.kind { letter-spacing: 0; text-transform: none; font-size: 11px; }
table.keys td.kind .native { letter-spacing: 0; text-transform: none; }
.wb-explorer .head h1 { font-family: var(--sans); font-weight: 700; font-size: 19px; letter-spacing: -.015em; }
.doc > .top h2 { font-weight: 500; }

/* the sheet itself */
table.keys td { border-bottom-color: var(--line-2); }
table.keys td.k { border-right: 3px double color-mix(in srgb, var(--l2) 50%, transparent); }
table.keys td.k:last-child { border-right: 0; }
table.keys tr[onclick]:hover td { background: color-mix(in srgb, var(--l1-soft) 70%, var(--panel)); }
.wb-explorer table.keys tr.sel td { background: var(--l1-soft); }

/* a key that shares the row above's prefix shows only what differs in full
 * ink: the list reads as the radix tree it came out of */
table.keys td.k .pre { color: var(--ink-3); }
table.keys td.k .tail { color: var(--ink); font-weight: 600; }
.wb-explorer table.keys tr.sel td.k .pre { color: color-mix(in srgb, var(--l1) 55%, var(--panel)); }
.wb-explorer table.keys tr.sel td.k .tail { color: var(--l1); }

/* with the value column hidden there is no margin to draw */
@container (max-width: 330px) { table.keys td.k { border-right: 0; } }

.wb-act a { font-size: 10.5px; letter-spacing: 0; }
.wb-status { background: var(--st-bg); }
.wb-status .led { background: #6cc28e; box-shadow: 0 0 0 3px rgba(108, 194, 142, .2); }

</style>

<script>
// theme: saved choice wins, otherwise the system setting (handled in CSS)
(function () {
  const root = document.documentElement;
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
  applyTabWidth();
  document.addEventListener("DOMContentLoaded", () => {
    const b = document.getElementById("theme-btn");
    if (b) b.onclick = () => {
      const dark = root.dataset.theme ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    };
  });
})();

// ---- app settings ---------------------------------------------------------
//
// Per-browser viewer preferences in localStorage (no server round trip, so
// they work signed out and differ per machine):
//   tabWidth: how wide a tab renders AND how many spaces Tab inserts in the
//     function editor (2, 4 or 8; default 4)
//   saveBeforeCall: "1" to SETF the editor body before CALLF when Call is
//     pressed (default), "0" to call the stored copy as-is
//   editorHeight: the function editor's height in px, set by dragging its
//     corner; unset means the default (48% of the window)
function appSetting(key, dflt) {
  try {
    const v = localStorage.getItem("appsettings:" + key);
    return v == null ? dflt : v;
  } catch (e) { return dflt; }
}

function setAppSetting(key, value) {
  try { localStorage.setItem("appsettings:" + key, value); } catch (e) {}
}

function tabWidth() {
  const n = parseInt(appSetting("tabWidth", "4"), 10);
  return [2, 4, 8].includes(n) ? n : 4;
}

// tab rendering follows the setting live: the editor textarea gets
// tab-size, and Tab inserts that many spaces (real tabs would render at
// the browser default of 8 whatever we set here)
function applyTabWidth() {
  const ta = document.getElementById("ev");
  if (ta) ta.style.tabSize = String(tabWidth());
  document.querySelectorAll(".code").forEach(b => b.style.setProperty("--tab", String(tabWidth())));
}

function openAppSettings() {
  const w = tabWidth();
  const save = saveBeforeCall();
  show(`<div class="top"><h2>${ico("gear")} App settings</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox"><div class="appsettings">
      <div class="asrow">
        <label for="as-tabwidth">Tab width</label>
        <select id="as-tabwidth" onchange="setTabWidth(this.value)">
          ${[2, 4, 8].map(n => `<option value="${n}"${n === w ? " selected" : ""}>${n}</option>`).join("")}
        </select>
      </div>
      <div class="asrow">
        <label for="as-savecall">Save before Call</label>
        <select id="as-savecall" onchange="setSaveBeforeCall(this.value)">
          <option value="1"${save ? " selected" : ""}>On</option>
          <option value="0"${save ? "" : " selected"}>Off</option>
        </select>
      </div>
      <div class="asrow">
        <label>Editor height</label>
        <span class="asval" id="as-edheight">${editorHeight() || valueHeight()
          ? [editorHeight() && "code " + editorHeight() + " px", valueHeight() && "value " + valueHeight() + " px"].filter(Boolean).join(" · ")
          : "default"}</span>
        <button onclick="resetEditorHeight()"${editorHeight() || valueHeight() ? "" : " disabled"}>Reset</button>
      </div>
      <div class="asrow">
        <label for="as-aikey">OpenRouter key</label>
        <input type="password" id="as-aikey" autocomplete="off" spellcheck="false" placeholder="sk-or-…"
               value="${esc(aiKey())}" onchange="aiSaveKey(this.value)">
        <button onclick="document.getElementById('as-aikey').value='';aiSaveKey('')"${aiKey() ? "" : " disabled"}>Forget</button>
      </div>
      <div class="asrow">
        <label for="as-aimodel">Model</label>
        <input id="as-aimodel" list="ai-models" autocomplete="off" spellcheck="false" value="${esc(aiModel())}"
               onchange="setAppSetting('aiModel', this.value.trim()); toast('Model = ' + aiModel())">
        <datalist id="ai-models"></datalist>
      </div>
      <div class="ashint">The prompt bar above the function editor asks this model through
        <a href="https://openrouter.ai" target="_blank" rel="noopener">OpenRouter</a>. The browser sends the question and
        the ticked context straight to openrouter.ai; the key stays in this browser and is not sent to barch.</div>

  aiLoadModels().then(() => {

}

// the function editor's height, as the user last dragged it: px, or 0 for
// the default. Clamped on the way in so a height saved on a big screen
// still fits a small one.
function editorHeight() {
  const n = parseInt(appSetting("editorHeight", ""), 10);
  return Number.isFinite(n) && n >= 120 ? n : 0;
}

function editorHeightStyle() {
  const h = editorHeight();
  return h ? `height:min(${h}px, calc(100vh - 160px))` : "";
}

// The key value box, as the user last dragged it; 0 for the default.
function valueHeight() {
  const n = parseInt(appSetting("valueHeight", ""), 10);
  return Number.isFinite(n) && n >= 80 ? n : 0;
}

function valueHeightStyle() {
  const h = valueHeight();
  return h ? `height:min(${h}px, calc(100vh - 160px))` : "";
}

// A bar under an editor that changes its height only; the width follows the
// split between the list and the editor. What it resizes is the element it
// sits in (the function editor) or the one just before it (the value box).
// The height is saved under `setting` when a drag or an arrow key ends, never
// for a window resize.
function hgrip(setting, label) {
  return `<div class="hgrip" role="separator" aria-orientation="horizontal" tabindex="0"
    aria-label="${esc(label)}" title="Drag to change the height" data-setting="${esc(setting)}"></div>`;
}

function hgripTarget(g) {
  return g.parentElement.classList.contains("code") ? g.parentElement : g.previousElementSibling;
}

document.addEventListener("pointerdown", e => {
  const g = e.target.closest?.(".hgrip");
  if (!g) return;
  e.preventDefault();
  const box = hgripTarget(g), y0 = e.clientY, h0 = box.offsetHeight, min = g.dataset.setting === "editorHeight" ? 120 : 80;
  g.setPointerCapture(e.pointerId);
  g.classList.add("on");
  const move = ev => { box.style.height = Math.max(min, Math.round(h0 + ev.clientY - y0)) + "px"; };
  const up = () => {
    g.classList.remove("on");
    g.removeEventListener("pointermove", move);
    g.removeEventListener("pointerup", up);
    const h = Math.round(box.offsetHeight);
    if (h !== h0) setAppSetting(g.dataset.setting, String(h));
  };
  g.addEventListener("pointermove", move);
  g.addEventListener("pointerup", up);
});
document.addEventListener("keydown", e => {
  const g = e.target.closest?.(".hgrip");
  if (!g || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
  e.preventDefault();
  const box = hgripTarget(g), min = g.dataset.setting === "editorHeight" ? 120 : 80;
  const h = Math.max(min, box.offsetHeight + (e.key === "ArrowUp" ? -24 : 24));
  box.style.height = h + "px";
  setAppSetting(g.dataset.setting, String(h));
});

function resetEditorHeight() {
  try { localStorage.removeItem("appsettings:editorHeight"); } catch (e) {}
  try { localStorage.removeItem("appsettings:valueHeight"); } catch (e) {}
  document.querySelectorAll(".code, .editor textarea#ev:not(.fn-src)").forEach(b => { b.style.height = ""; });
  const v = document.getElementById("as-edheight");
  if (v) { v.textContent = "default"; v.nextElementSibling.disabled = true; }
  toast("Editor height = default");
}

function setTabWidth(value) {
  const n = parseInt(value, 10);
  if (![2, 4, 8].includes(n)) return;
  setAppSetting("tabWidth", String(n));
  applyTabWidth();
  toast("Tab width = " + n);
}

function saveBeforeCall() {
  return appSetting("saveBeforeCall", "1") !== "0";
}

function setSaveBeforeCall(value) {
  setAppSetting("saveBeforeCall", value === "0" ? "0" : "1");
  toast("Save before Call = " + (saveBeforeCall() ? "on" : "off"));
}

// ---- lexing and painting ----

// [kind, start, end] triples. Long strings and comments ([[ ]], [==[ ]==])
// run across lines, which is why the whole body is lexed on every change.
function luauLex(src) {
  const out = [], n = src.length;
  const longOpen = p => {
    if (src[p] !== "[") return -1;
    let q = p + 1;
    while (src[q] === "=") q++;
    return src[q] === "[" ? q - p - 1 : -1;
  };
  const longClose = (p, lvl) => {
    const e = src.indexOf("]" + "=".repeat(lvl) + "]", p);
    return e < 0 ? n : e + lvl + 2;
  };
  let i = 0;
  while (i < n) {
    const c = src[i];
    if (c === " " || c === "\t" || c === "\n" || c === "\r") {
      let j = i + 1;
      while (j < n && (src[j] === " " || src[j] === "\t" || src[j] === "\n" || src[j] === "\r")) j++;
      out.push(["ws", i, j]); i = j; continue;
    }
    if (c === "-" && src[i + 1] === "-") {
      const lvl = longOpen(i + 2);
      let j;
      if (lvl >= 0) j = longClose(i + lvl + 4, lvl);
      else { j = src.indexOf("\n", i); if (j < 0) j = n; }
      out.push([lvl < 0 && src[i + 2] === "!" ? "hot" : "com", i, j]); i = j; continue;
    }
    if (c === "[") {
      const lvl = longOpen(i);
      if (lvl >= 0) { const j = longClose(i + lvl + 2, lvl); out.push(["str", i, j]); i = j; continue; }
    }
    if (c === '"' || c === "'" || c === "`") {
      let j = i + 1;
      while (j < n && src[j] !== c && src[j] !== "\n") j += src[j] === "\\" ? 2 : 1;
      if (src[j] === c) j++;
      out.push(["str", i, Math.min(j, n)]); i = Math.min(j, n); continue;
    }
    const d = c.charCodeAt(0);
    if ((d >= 48 && d <= 57) || (c === "." && /\d/.test(src[i + 1] || ""))) {
      const mt = /^(?:0[xX][\da-fA-F_]+|0[bB][01_]+|(?:\d[\d_]*\.?[\d_]*|\.\d[\d_]*)(?:[eE][+-]?\d+)?)/.exec(src.slice(i, i + 64));
      const j = i + (mt ? mt[0].length : 1);
      out.push(["num", i, j]); i = j; continue;
    }
    if (c === "_" || (d >= 65 && d <= 90) || (d >= 97 && d <= 122)) {
      let j = i + 1;
      while (j < n && /\w/.test(src[j])) j++;
      out.push([LUAU_KW.has(src.slice(i, j)) ? "kw" : "id", i, j]); i = j; continue;
    }
    // `..` and `...` stay one token so a member dot is never confused with them
    if (c === "." && src[i + 1] === ".") {
      const j = src[i + 2] === "." ? i + 3 : i + 2;
      out.push(["op", i, j]); i = j; continue;
    }
    out.push(["op", i, i + 1]); i++;
  }
  return out;
}

const luauEsc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// the entry a name has in a type, dynamic members (the space list) included
function luauMember(type, name) {
  if (!type) return null;
  if (Object.prototype.hasOwnProperty.call(type.members, name)) return type.members[name];
  if (type.dyn) { const hit = type.dyn().find(([n]) => n === name); if (hit) return hit[1]; }
  if (type.any) return { kind: "mod", sig: name, doc: "", type: type.any };
  return null;
}

// Colour: keywords, strings, numbers, comments, operators; a name the barch
// API knows (followed through dots, colons and calls) in the API colour; a
// library in its own; a function name where it is defined or called.
function luauHighlight(src, locals) {
  const toks = luauLex(src);
  let html = "", ctx = null, prev = null, pending = null;
  const stack = [];                          // what the call being closed gives back
  for (let k = 0; k < toks.length; k++) {
    const [kind, s, e] = toks[k];
    const text = src.slice(s, e);
    if (kind === "ws") { html += text; continue; }
    let cls = kind;
    if (kind === "id") {
      const after = prev && prev[0] === "op" && (prev[3] === "." || prev[3] === ":");
      let entry = null;
      if (after) entry = luauMember(ctx, text);
      else if (!(prev && prev[3] === "local")) {
        entry = LUAU_TYPES._G.members[text] || null;
        if (entry && entry.hook) entry = null;
        if (!entry && locals && locals[text]) entry = { kind: "val", type: locals[text] };
      }
      let next = k + 1;
      while (next < toks.length && toks[next][0] === "ws") next++;
      const nextText = next < toks.length ? src.slice(toks[next][1], toks[next][2]) : "";
      if (text === "self") cls = "self";
      else if (entry && entry.lib && !after) cls = "lib";
      else if (entry && (entry.sig || after)) cls = "api";
      else if (prev && prev[3] === "function") cls = "fn";
      else if (nextText === "(" || nextText === "{" || (nextText && nextText[0] === '"')) cls = "fn";
      else cls = "";
      ctx = entry ? (entry.type ? LUAU_TYPES[entry.type] : null) : null;
      pending = entry && entry.ret ? LUAU_TYPES[entry.ret] : null;
    } else if (kind === "op") {
      if (text === "(") { stack.push(pending); ctx = null; }
      else if (text === ")") { ctx = stack.pop() || null; }
      else if (text === "." || text === ":") { /* keep ctx for the member */ }
      else if (text === "[") { stack.push(ctx && ctx.any ? LUAU_TYPES[ctx.any] : null); ctx = null; }
      else if (text === "]") { ctx = stack.pop() || null; }
      else ctx = null;
      if (text !== "(") pending = null;
    } else { ctx = null; pending = null; }
    prev = [kind, s, e, text];
    html += cls ? `<span class="${cls}">${luauEsc(text)}</span>` : luauEsc(text);
  }
  return html;
}

// `local x = barch.space.users` and friends: which locals hold something the
// completion knows the members of. req/res are the HTTP handler's arguments.
function luauLocals(src) {
  const out = { req: "request", res: "response" };
  const re = /\blocal\s+([A-Za-z_]\w*)\s*=\s*([^\n;]+)/g;
  let mt;
  while ((mt = re.exec(src))) {
    const ty = luauTypeOf(luauChain(mt[2].trim(), true), out);
    if (ty) out[mt[1]] = ty.name;
  }
  const fr = /\bfor\s+([A-Za-z_]\w*)\s+in\s+([^\n]+?)\s+do\b/g;
  while ((mt = fr.exec(src))) {
    const ty = luauTypeOf(luauChain(mt[2].trim(), true), out);
    if (ty && ty.name === "space") out[mt[1]] = "row";
  }
  return out;
}
for (const [k, v] of Object.entries(LUAU_TYPES)) v.name = k;

// A chain of names, dots, colons, calls and indexes, as segments. Read from
// the end of `text` (what is before the caret), or from its start (`fromStart`,
// for the right-hand side of an assignment).
function luauChain(text, fromStart) {
  if (fromStart) {
    const mt = /^[A-Za-z_]\w*(?:\s*(?:[.:]\s*[A-Za-z_]\w*|\((?:[^()]|\([^()]*\))*\)|\[[^\]]*\]|"[^"]*"|\{[^}]*\}))*/.exec(text);
    return mt ? luauChain(mt[0], false) : null;
  }
  const segs = [];
  let i = text.length;
  const skipWs = () => { while (i > 0 && /\s/.test(text[i - 1])) i--; };
  const matchBack = (open, close) => {
    let depth = 0;
    while (i > 0) {
      const c = text[--i];
      if (c === close) depth++;
      else if (c === open && --depth === 0) return true;
    }
    return false;
  };
  for (;;) {
    skipWs();
    if (i === 0) break;
    const c = text[i - 1];
    if (c === ")") { if (!matchBack("(", ")")) return null; segs.unshift({ call: true }); continue; }
    if (c === "]") { if (!matchBack("[", "]")) return null; segs.unshift({ index: true }); continue; }
    if (c === '"' && segs.length) {            // f"x" / f{…} call sugar: treat as a call
      const q = text.lastIndexOf('"', i - 2);
      if (q < 0) return null;
      i = q; segs.unshift({ call: true }); continue;
    }
    const mt = /[A-Za-z_]\w*$/.exec(text.slice(0, i));
    if (!mt) break;
    i -= mt[0].length;
    segs.unshift({ name: mt[0] });
    skipWs();
    if (i > 0 && (text[i - 1] === "." || text[i - 1] === ":") && text[i - 2] !== ".") { i--; continue; }
    break;
  }
  if (!segs.length || !segs[0].name) return null;
  if (LUAU_KW.has(segs[0].name)) return null;
  return segs;
}

// the type a chain ends on, or null past the first name it doesn't know
function luauTypeOf(segs, locals) {
  if (!segs) return null;
  let entry = null, type = null;
  for (let k = 0; k < segs.length; k++) {
    const sg = segs[k];
    if (k === 0) {
      entry = LUAU_TYPES._G.members[sg.name];
      if (entry && entry.hook) entry = null;
      if (!entry && locals && locals[sg.name]) entry = { kind: "val", type: locals[sg.name] };
      if (!entry) return null;
      type = entry.type ? LUAU_TYPES[entry.type] : null;
    } else if (sg.name) {
      entry = luauMember(type, sg.name);
      if (!entry) return null;
      type = entry.type ? LUAU_TYPES[entry.type] : null;
    } else if (sg.call) {
      type = entry && entry.ret ? LUAU_TYPES[entry.ret] : null;
      entry = null;
    } else if (sg.index) {
      type = type && type.any ? LUAU_TYPES[type.any] : null;
      entry = null;
    }
  }
  return type;
}

// the entry a chain names (its last segment), for the status line hint
function luauEntryOf(segs, locals) {
  if (!segs || !segs.length || !segs[segs.length - 1].name) return null;
  if (segs.length === 1) {
    const e = LUAU_TYPES._G.members[segs[0].name];
    return e && !e.hook ? e : null;
  }
  return luauMember(luauTypeOf(segs.slice(0, -1), locals), segs[segs.length - 1].name);
}

// ---- the editor itself ----

// "space/NAME" -> {start, end, top, base, text}: where the caret was, and any
// edits not yet saved over the source they started from. Closing the dialog
// (Esc, the backdrop, Close) keeps them for this page's life, so there is
// no "discard changes?" to answer; reopening puts them back.
const codeViews = new Map();

// The markup for the editor. `id` stays "ev" for the function body because
// saveFunction/callFunction/applyTabWidth read it by that id.
function codeEditor(source, attrs) {
  return `<div class="code" style="--tab:${tabWidth()};${editorHeightStyle()}">
    <div class="code-gutter" aria-hidden="true"><div class="gl"></div></div>
    <div class="code-main">
      <div class="code-marks"><div class="cur"></div><div class="bad" hidden></div></div>
      <pre class="code-hl" aria-hidden="true"></pre>
      <textarea id="ev" class="fn-src" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" ${attrs || ""}>${esc(source ?? "")}</textarea>
    </div>
    <div class="code-ac" hidden><div class="list" role="listbox"></div><div class="doc"></div></div>
    ${hgrip("editorHeight", "Resize the editor")}
  </div>
  <div class="code-status">
    <span class="pos">Ln 1, Col 1</span><span class="hint"></span><span class="mod"></span>
    <span class="keys"><kbd>Ctrl</kbd>+<kbd>S</kbd> save · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> call · <kbd>Ctrl</kbd>+<kbd>Space</kbd> complete</span>
  </div>`;
}

function codeParts(ta) {
  const box = ta.closest(".code");
  return {
    box, hl: box.querySelector(".code-hl"), gl: box.querySelector(".gl"),
    cur: box.querySelector(".code-marks .cur"), err: box.querySelector(".code-marks .bad"),
    ac: box.querySelector(".code-ac"), status: box.nextElementSibling,
  };
}

// wire an editor rendered by codeEditor(); `name` keys the remembered caret
function codeAttach(ta, name) {
  if (!ta || ta._code) return;
  const P = codeParts(ta);
  ta._code = { P, name, saved: ta.value, errLine: 0, errMsg: "", lines: 0, raf: 0, ac: null, dedent: null, locals: {} };
  const paint = () => {
    ta._code.raf = 0;
    ta._code.locals = luauLocals(ta.value);
    P.hl.innerHTML = luauHighlight(ta.value, ta._code.locals) + "\n ";
    codeGutter(ta);
    codeScroll(ta);
    codeStatus(ta);
  };
  // at once while typing, so the colours never trail the caret (a 1300 line
  // body is a few ms); only a very large one waits for the next frame
  ta._code.paint = () => {
    if (ta.value.length < 200000) { cancelAnimationFrame(ta._code.raf); paint(); }
    else if (!ta._code.raf) ta._code.raf = requestAnimationFrame(paint);
  };
  paint();
  ta.addEventListener("input", e => { ta._code.paint(); if (!ta.disabled) codeTyped(ta, e); codeRemember(ta); });
  ta.addEventListener("scroll", () => { codeScroll(ta); codeAcPlace(ta); });
  for (const ev of ["keyup", "click", "focus"]) ta.addEventListener(ev, () => { codeStatus(ta); codeRemember(ta); });
  ta.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== ta) codeAcClose(ta); }, 120));
  P.gl.addEventListener("mousedown", e => {
    const row = e.target.closest(".gl > div");
    if (!row) return;
    e.preventDefault();
    codeGoto(ta, [...P.gl.children].indexOf(row) + 1);
  });
  P.ac.addEventListener("mousedown", e => {
    const it = e.target.closest(".it");
    e.preventDefault();
    if (it) { ta._code.ac.at = +it.dataset.i; codeAcAccept(ta); }
  });
  new ResizeObserver(() => codeScroll(ta)).observe(ta);
  if (!ta.disabled) ta.addEventListener("keydown", e => codeKey(ta, e));
  const view = name != null && codeViews.get(name);
  const base = ta.value;
  if (view && !ta.disabled && view.base === base && view.text !== base) {
    // unsaved edits over the same stored source: put them back, undoably
    codeInsert(ta, view.text, 0, base.length);
    toast("Unsaved edits restored — Ctrl+Z goes back to the stored copy");
  }
  ta._code.base = base;
  if (view) {
    ta.setSelectionRange(Math.min(view.start, ta.value.length), Math.min(view.end, ta.value.length));
    ta.scrollTop = view.top;
  }
}

function codeRemember(ta) {
  const c = ta._code;
  if (c.name == null || c.base == null) return;
  codeViews.set(c.name, { start: ta.selectionStart, end: ta.selectionEnd, top: ta.scrollTop,
                          base: c.base, text: ta.value });
}

function codeLineOf(v, pos) {
  let line = 1;
  for (let i = v.indexOf("\n"); i >= 0 && i < pos; i = v.indexOf("\n", i + 1)) line++;
  return line;
}

function codeGutter(ta) {
  const { P } = ta._code;
  const count = ta.value.split("\n").length;
  if (count !== ta._code.lines) {
    const rows = [];
    for (let i = 1; i <= count; i++) rows.push(`<div>${i}</div>`);
    P.gl.innerHTML = rows.join("");
    P.gl.parentElement.style.minWidth = `calc(${String(count).length + 3}ch)`;
    ta._code.lines = count;
    ta._code.curRow = null;
  }
  const line = codeLineOf(ta.value, ta.selectionStart);
  const row = P.gl.children[line - 1];
  if (ta._code.curRow !== row) {
    if (ta._code.curRow) ta._code.curRow.classList.remove("cur");
    if (row) row.classList.add("cur");
    ta._code.curRow = row;
  }
  [...P.gl.querySelectorAll(".bad")].forEach(r => { r.classList.remove("bad"); r.title = ""; });
  const er = ta._code.errLine && P.gl.children[ta._code.errLine - 1];
  if (er) { er.classList.add("bad"); er.title = ta._code.errMsg; }
}

function codeScroll(ta) {
  const { P } = ta._code;
  const x = ta.scrollLeft, y = ta.scrollTop;
  const lh = parseFloat(getComputedStyle(P.box).getPropertyValue("--lh")) || 19;
  const pad = parseFloat(getComputedStyle(P.box).getPropertyValue("--pad")) || 10;
  ta._code.lh = lh; ta._code.pad = pad;
  P.hl.style.transform = `translate(${-x}px, ${-y}px)`;
  P.gl.style.transform = `translateY(${-y}px)`;
  const line = codeLineOf(ta.value, ta.selectionStart);
  P.cur.style.top = (pad + (line - 1) * lh - y) + "px";
  P.cur.hidden = document.activeElement !== ta && ta.selectionStart === 0;
  P.err.hidden = !ta._code.errLine;
  if (ta._code.errLine) P.err.style.top = (pad + (ta._code.errLine - 1) * lh - y) + "px";
}

// the status line: position, what the name at the caret is, saved or not
function codeStatus(ta) {
  const c = ta._code;
  if (!c) return;
  const v = ta.value, s = ta.selectionStart;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const line = codeLineOf(v, s);
  const col = codeCol(v.slice(sol, s)) + 1;
  const st = c.P.status;
  st.querySelector(".pos").textContent = `Ln ${line}, Col ${col}` +
    (ta.selectionEnd > s ? ` (${ta.selectionEnd - s} selected)` : "");
  const hint = st.querySelector(".hint");
  if (c.errLine) {
    hint.className = "hint bad";
    hint.textContent = `line ${c.errLine}: ${c.errMsg}`;
  } else {
    hint.className = "hint";
    const e = codeHintAt(ta);
    hint.innerHTML = e ? `<b>${luauEsc(e.sig)}</b>${e.doc ? " — " + e.doc.replace(/<(?!\/?code>)[^>]*>/g, "") : ""}` : "";
    hint.title = hint.textContent;
  }
  st.querySelector(".mod").textContent = ta.disabled ? "read only" : v !== c.saved ? "● modified" : "";
  codeGutter(ta);
  codeScroll(ta);
}

// visual column, tabs expanded to the tab width
function codeCol(text) {
  const tw = tabWidth();
  let col = 0;
  for (const ch of text) col = ch === "\t" ? col + tw - (col % tw) : col + 1;
  return col;
}

// the call the caret is inside, or the name it is on, if the API knows it
function codeHintAt(ta) {
  const v = ta.value, s = ta.selectionStart;
  if (codeInStrOrCom(v, s)) return null;
  const locals = ta._code.locals;
  // the name under the caret first: barch.store.get|
  const word = /[A-Za-z_]\w*$/.exec(v.slice(Math.max(0, s - 200), s));
  const tail = /^\w*/.exec(v.slice(s, s + 100))[0];
  if (word || tail) {
    const upto = v.slice(Math.max(0, s - 400), s) + tail;
    const e = luauEntryOf(luauChain(upto), locals);
    if (e && e.sig) return e;
  }
  // otherwise the innermost open call: barch.store.range("a", |
  let depth = 0;
  for (let i = s - 1, lim = Math.max(0, s - 2000); i >= lim; i--) {
    const c = v[i];
    if (c === ")") depth++;
    else if (c === "(") {
      if (depth === 0) {
        const e = luauEntryOf(luauChain(v.slice(Math.max(0, i - 400), i)), locals);
        return e && e.sig ? e : null;
      }
      depth--;
    }
  }
  return null;
}

// is pos inside a string or a comment? Lexes the text before it.
function codeInStrOrCom(v, pos) {
  const toks = luauLex(v.slice(0, pos));
  const last = toks[toks.length - 1];
  if (!last || last[2] !== pos) return false;
  if (last[0] === "com" || last[0] === "hot") return !/\n$/.test(v.slice(last[1], pos));
  if (last[0] !== "str") return false;
  const t = v.slice(last[1], pos);
  // a closed short string ends at its quote; the caret after it is outside
  if (/^["'`]/.test(t)) return t.length < 2 || t[t.length - 1] !== t[0] || t[t.length - 2] === "\\";
  return !/\]=*\]$/.test(t);
}

// Replace [start, end) with text through the browser's own editing, so undo
// keeps it. setRangeText is the fallback where insertText is not supported.
function codeInsert(ta, text, start, end) {
  // execCommand edits whatever has focus, and only an edit it makes is undoable
  if (document.activeElement !== ta) ta.focus({ preventScroll: true });
  if (start != null) ta.setSelectionRange(start, end ?? start);
  ta._code.quiet = true;
  let done = false;
  // an empty insertText is not a reliable delete everywhere; "delete" is
  try { done = text ? document.execCommand("insertText", false, text)
                    : ta.selectionStart === ta.selectionEnd || document.execCommand("delete"); } catch (e) {}
  if (!done) {
    ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end");
    ta.dispatchEvent(new Event("input"));
  }
  ta._code.quiet = false;
}

// ---- keys ----

function codeKey(ta, e) {
  const c = ta._code, mod = e.ctrlKey || e.metaKey;
  if (c.ac) {
    const n = c.ac.items.length;
    if (e.key === "ArrowDown") { e.preventDefault(); c.ac.at = (c.ac.at + 1) % n; codeAcDraw(ta); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); c.ac.at = (c.ac.at - 1 + n) % n; codeAcDraw(ta); return; }
    if (e.key === "PageDown") { e.preventDefault(); c.ac.at = Math.min(n - 1, c.ac.at + 8); codeAcDraw(ta); return; }
    if (e.key === "PageUp") { e.preventDefault(); c.ac.at = Math.max(0, c.ac.at - 8); codeAcDraw(ta); return; }
    if ((e.key === "Enter" && !mod) || e.key === "Tab") { e.preventDefault(); codeAcAccept(ta); return; }
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); codeAcClose(ta); return; }
  }
  if (e.key === "Escape") {
    // one Esc leaves the editor, the next closes the dialog; never both at once
    e.stopPropagation();
    ta.blur();
    return;
  }
  if (mod && (e.key === " " || e.code === "Space")) { e.preventDefault(); codeAcOpen(ta, true); return; }
  if (e.key === "Tab" && !mod && !e.altKey) { e.preventDefault(); insertFunctionTab(ta, e.shiftKey); return; }
  if (e.key === "Backspace" && !mod && !e.altKey && !e.shiftKey && codeBackIndent(ta)) { e.preventDefault(); return; }
  if (e.key === "Enter" && !mod && !e.shiftKey && !e.altKey && !e.isComposing) { e.preventDefault(); codeEnter(ta); return; }
}

// what a line does to the indent of the one after it
function codeOpens(line) {
  const t = line.replace(/--.*$/, "")
    .replace(/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`/g, '""').trim();
  if (!t) return false;
  if (/^(else|elseif\b.*\bthen|repeat)$/.test(t) || /^elseif\b.*\bthen$/.test(t)) return true;
  let net = 0;
  for (const w of t.match(/\b(function|then|do|repeat|end|until)\b|[{}()]/g) || []) {
    if (w === "function" || w === "then" || w === "do" || w === "repeat" || w === "{" || w === "(") net++;
    else net--;
  }
  // `while x do` / `for … do` count do once; `elseif … then` starts dedented
  if (/^(elseif|else)\b/.test(t)) net++;
  return net > 0;
}

// Enter: the new line starts under the text of the line it came from, one step
// further in after a line that opens a block. A line left holding nothing but
// its indent is emptied rather than kept as trailing spaces.
function codeEnter(ta) {
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const eol = v.indexOf("\n", e) < 0 ? v.length : v.indexOf("\n", e);
  const before = v.slice(sol, s), after = v.slice(e, eol);
  const base = /^[ \t]*/.exec(before)[0];
  const indent = base + (codeOpens(before) ? tabUnit() : "");
  if (/[{(\[]\s*$/.test(before) && /^\s*[})\]]/.test(after)) {
    // between a bracket and its closer: the closer goes on a line of its own
    codeInsert(ta, "\n" + indent + "\n" + base, s, e);
    const at = ta.selectionStart - 1 - base.length;
    ta.setSelectionRange(at, at);
  } else {
    codeInsert(ta, "\n" + indent, before.trim() === "" ? sol : s, e);
  }
  codeScrollCaret(ta);
}

// Backspace with the caret in a line's leading spaces takes it back to the
// previous tab stop, one indent level, rather than one space at a time.
// Anything else - a selection, text before the caret - is the browser's.
function codeBackIndent(ta) {
  const v = ta.value, s = ta.selectionStart;
  if (s !== ta.selectionEnd || s === 0) return false;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const before = v.slice(sol, s);
  if (!before || !/^ +$/.test(before)) return false;
  const unit = tabUnit().length;
  const drop = before.length % unit || unit;
  codeInsert(ta, "", s - Math.min(drop, before.length), s);
  return true;
}

// keep the caret in view after an edit made from script
function codeScrollCaret(ta) {
  const c = ta._code, lh = c.lh || 19, pad = c.pad || 10;
  const y = pad + (codeLineOf(ta.value, ta.selectionStart) - 1) * lh;
  if (y < ta.scrollTop) ta.scrollTop = y - pad;
  else if (y + lh > ta.scrollTop + ta.clientHeight) ta.scrollTop = y + lh + pad - ta.clientHeight;
}

// After a keystroke: pull a closing word back to its block's indent, and open
// or refresh completion.
function codeTyped(ta, e) {
  const c = ta._code;
  if (c.quiet) return;
  const v = ta.value, s = ta.selectionStart;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const eol = v.indexOf("\n", s) < 0 ? v.length : v.indexOf("\n", s);
  const line = v.slice(sol, eol);
  if (e.inputType === "insertText" && e.data) {
    // `ending` after `end` was dedented: give the indent back
    if (c.dedent && c.dedent.sol === sol && /^\s*(end|else|until)\w/.test(line) && !/^\s*elseif\b/.test(line)) {
      const d = c.dedent; c.dedent = null;
      codeInsert(ta, d.removed, sol, sol);
      return;
    }
    if (!codeMaybeDedent(ta, e.data) && !(c.dedent && c.dedent.sol === sol)) c.dedent = null;
  }
  const typedWord = e.inputType === "insertText" && e.data && /[\w.:]$/.test(e.data);
  if (typedWord || (c.ac && /^delete/.test(e.inputType || ""))) codeAcOpen(ta, false);
  else codeAcClose(ta);
}

// the line so far is just a closing word (or bracket) that was finished by
// `last`: pull it back to its block's indent
function codeMaybeDedent(ta, last) {
  const v = ta.value, s = ta.selectionStart;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const eol = v.indexOf("\n", s) < 0 ? v.length : v.indexOf("\n", s);
  const mt = /^([ \t]*)(end|else|elseif|until|\}|\))$/.exec(v.slice(sol, s));
  if (!mt || v.slice(s, eol).trim() !== "" || (last && !mt[2].endsWith(last))) return false;
  codeDedent(ta, sol, mt[1]);
  return true;
}

function codeDedent(ta, sol, have) {
  const v = ta.value;
  // the nearest line above with something on it
  let p = sol - 1, prevLine = "";
  while (p > 0) {
    const ps = v.lastIndexOf("\n", p - 1) + 1;
    prevLine = v.slice(ps, p);
    if (prevLine.trim()) break;
    p = ps - 1;
  }
  const pi = /^[ \t]*/.exec(prevLine)[0];
  const unit = tabUnit();
  let want = codeOpens(prevLine) ? pi : pi.endsWith(unit) ? pi.slice(0, -unit.length) : pi.replace(/(\t| {1,8})$/, "");
  if (codeCol(have) <= codeCol(want)) return;
  const s = ta.selectionStart, e2 = ta.selectionEnd;
  codeInsert(ta, want, sol, sol + have.length);
  const shift = have.length - want.length;
  ta.setSelectionRange(s - shift, e2 - shift);
  ta._code.dedent = { sol, removed: have.slice(want.length) };
}

// ---- completion ----

function codeAcOpen(ta, forced) {
  const c = ta._code, v = ta.value, s = ta.selectionStart;
  if (ta.selectionEnd !== s || codeInStrOrCom(v, s)) { codeAcClose(ta); return; }
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const before = v.slice(Math.max(sol - 400, 0), s);
  const prefix = /[A-Za-z_]\w*$/.exec(before)?.[0] || "";
  const head = before.slice(0, before.length - prefix.length);
  const sep = /([.:])\s*$/.exec(head);
  let pool = [];
  if (sep && !/\.\.\s*$/.test(head)) {
    const segs = luauChain(head.slice(0, head.length - sep[0].length));
    const type = luauTypeOf(segs, c.locals);
    if (!type) { codeAcClose(ta); return; }
    const all = Object.entries(type.members).concat(type.dyn ? type.dyn() : []);
    const colon = sep[1] === ":";
    pool = all.filter(([, e]) => !!e.method === colon);
    if (!pool.length) pool = all;
    if (!pool.length) { codeAcClose(ta); return; }
  } else {
    if (!forced && prefix.length < 2) { codeAcClose(ta); return; }
    // a name straight after `local` or `function` is being made up, not looked up
    if (!forced && /\b(local|function)\s+$/.test(head)) { codeAcClose(ta); return; }
    const seen = new Set();
    for (const [n, e] of Object.entries(LUAU_TYPES._G.members)) { pool.push([n, e]); seen.add(n); }
    for (const k of LUAU_KW) { pool.push([k, { kind: "kw", sig: "" }]); seen.add(k); }
    // names already in the body
    const words = new Set(v.match(/\b[A-Za-z_]\w+\b/g) || []);
    for (const w of words) if (!seen.has(w) && w !== prefix)
      pool.push([w, { kind: "word", sig: c.locals[w] ? w + " : " + c.locals[w] : "" }]);
  }
  const lp = prefix.toLowerCase();
  const items = pool
    .filter(([n]) => n !== prefix || forced)
    .map(([n, e]) => {
      const ln = n.toLowerCase();
      const score = n.startsWith(prefix) ? 0 : ln.startsWith(lp) ? 1 : lp && ln.includes(lp) ? 2 : -1;
      return { n, e, score };
    })
    .filter(it => it.score >= 0)
    .sort((a, b) => a.score - b.score || (a.e.kind === "word") - (b.e.kind === "word") ||
                    (a.e.kind === "kw") - (b.e.kind === "kw") || a.n.localeCompare(b.n))
    .slice(0, 60);
  if (!items.length) { codeAcClose(ta); return; }
  const keep = c.ac && c.ac.items[c.ac.at] && items.findIndex(it => it.n === c.ac.items[c.ac.at].n);
  c.ac = { items, at: keep > 0 ? keep : 0, from: s - prefix.length, prefix };
  codeAcDraw(ta);
}

function codeAcDraw(ta) {
  const { P, ac } = ta._code;
  const K = { fn: ["ƒ", "fn"], mod: ["▣", "mod"], val: ["◆", "val"], kw: ["k", "kw"], word: ["·", ""] };
  const list = P.ac.querySelector(".list");
  list.innerHTML = ac.items.map((it, i) => {
    const [glyph, cls] = K[it.e.kind] || K.word;
    const pre = it.n.slice(0, ac.prefix.length), rest = it.n.slice(ac.prefix.length);
    const name = it.score === 0 && pre ? `<b>${luauEsc(pre)}</b>${luauEsc(rest)}` : luauEsc(it.n);
    const sig = it.e.sig && it.e.sig !== it.n ? (it.e.sig.includes("(") ? it.e.sig.slice(it.e.sig.indexOf("(")) : "") : "";
    return `<div class="it${i === ac.at ? " on" : ""}" data-i="${i}" role="option"><span class="k ${cls}">${glyph}</span>` +
           `<span class="n">${name}</span><span class="s">${luauEsc(sig)}</span></div>`;
  }).join("");
  const cur = ac.items[ac.at];
  const doc = P.ac.querySelector(".doc");
  doc.innerHTML = cur && cur.e.sig ? `<code>${luauEsc(cur.e.sig)}</code>${cur.e.doc ? "<br>" + cur.e.doc : ""}` : "";
  doc.hidden = !doc.innerHTML;
  P.ac.hidden = false;
  const on = list.children[ac.at];
  if (on) on.scrollIntoView({ block: "nearest" });
  codeAcPlace(ta);
}

function codeAcPlace(ta) {
  const c = ta._code;
  if (!c.ac) return;
  const { P } = c;
  const v = ta.value, s = c.ac.from;
  const sol = v.lastIndexOf("\n", s - 1) + 1;
  const line = codeLineOf(v, s);
  const cw = c.cw || (c.cw = codeCharWidth(P.hl));
  const gutter = P.gl.parentElement.offsetWidth;
  const padX = parseFloat(getComputedStyle(ta).paddingLeft) || 14;
  const lh = c.lh || 19, pad = c.pad || 10;
  let x = gutter + padX + codeCol(v.slice(sol, s)) * cw - ta.scrollLeft - 24;
  let y = pad + line * lh - ta.scrollTop + 2;
  const boxH = P.box.clientHeight, boxW = P.box.clientWidth;
  const h = P.ac.offsetHeight;
  if (y + h > boxH && y - lh - h - 4 > 0) y = y - lh - h - 4;
  x = Math.max(4, Math.min(x, boxW - P.ac.offsetWidth - 4));
  P.ac.style.left = x + "px";
  P.ac.style.top = y + "px";
}

function codeCharWidth(pre) {
  const span = document.createElement("span");
  span.textContent = "x".repeat(100);
  span.style.visibility = "hidden";
  pre.appendChild(span);
  const w = span.getBoundingClientRect().width / 100;
  span.remove();
  return w || 7.5;
}

function codeAcAccept(ta) {
  const c = ta._code;
  if (!c.ac) return;
  const it = c.ac.items[c.ac.at];
  const from = c.ac.from, to = ta.selectionStart;
  const tail = /^\w*/.exec(ta.value.slice(to))[0];   // finishing a word mid-way replaces all of it
  codeAcClose(ta);
  if (it) { codeInsert(ta, it.n, from, to + tail.length); codeMaybeDedent(ta); }
  codeStatus(ta);
}

function codeAcClose(ta) {
  const c = ta._code;
  if (!c || !c.ac) return;
  c.ac = null;
  c.P.ac.hidden = true;
}

// ---- the --@barch header ----

// The function's own limits, `--@barch {"deadline_ms": 5000, "slice_insns": 200000}`,
// from the comments before the first token - the walk barch's read_function_meta
// makes (barch TODO 434). Answers null when there is none, or
// { start, end, obj, bad, block }: the line's range (with its newline), the
// parsed object, `bad` when it isn't a JSON object, and `block` for the
// --[[@barch ... ]] form, which the panel shows but leaves to the source.
function luauBarchHeader(src) {
  const n = src.length;
  let i = 0;
  const parse = (json, start, end, block) => {
    let obj = null;
    try { obj = JSON.parse(json); } catch (e) {}
    const bad = !obj || typeof obj !== "object" || Array.isArray(obj);
    return { start, end, obj: bad ? {} : obj, bad, block };
  };
  while (i < n) {
    const c = src[i];
    if (c === " " || c === "\t" || c === "\r" || c === "\n") { i++; continue; }
    if (!src.startsWith("--", i)) return null;
    const block = /^--\[(=*)\[/.exec(src.slice(i, i + 64));
    if (block) {
      const close = "]" + block[1] + "]";
      const e = src.indexOf(close, i + block[0].length);
      if (e < 0) return null;
      const body = src.slice(i + block[0].length, e);
      const at = /^\s*@barch/.exec(body);
      if (at) return parse(body.slice(at[0].length), i, e + close.length, true);
      i = e + close.length;
      continue;
    }
    let eol = src.indexOf("\n", i);
    if (eol < 0) eol = n;
    if (src.startsWith("--@barch", i)) {
      const sol = src.lastIndexOf("\n", i - 1) + 1;
      return parse(src.slice(i + 8, eol), /^[ \t]*$/.test(src.slice(sol, i)) ? sol : i,
                   eol < n ? eol + 1 : eol, false);
    }
    i = eol;
  }
  return null;
}

// ---- native code ----

// Where the `--!native` hot comment is, or null. Luau reads a hot comment only in
// the header - the comments before the first token - so this walks whitespace,
// line comments and --[[ block ]] comments from the top and stops at the first
// token. Same rule as wants_native in spacesapi.luau and in barch's
// compile_into (barch TODO 413), which is what makes the line the AOT switch.
function luauNativeMarker(src) {
  const n = src.length;
  let i = 0;
  while (i < n) {
    const c = src[i];
    if (c === " " || c === "\t" || c === "\r" || c === "\n") { i++; continue; }
    if (!src.startsWith("--", i)) return null;
    const block = /^--\[(=*)\[/.exec(src.slice(i, i + 64));
    if (block) {
      const close = "]" + block[1] + "]";
      const e = src.indexOf(close, i + block[0].length);
      if (e < 0) return null;
      i = e + close.length;
      continue;
    }
    let eol = src.indexOf("\n", i);
    if (eol < 0) eol = n;
    if (/^--!native[ \t\r]*$/.test(src.slice(i, eol))) {
      const sol = src.lastIndexOf("\n", i - 1) + 1;
      return { start: /^[ \t]*$/.test(src.slice(sol, i)) ? sol : i, end: eol < n ? eol + 1 : eol };
    }
    i = eol;
  }
  return null;
}

// ---- errors ----

// "ERR spaces:3: attempt to index nil" - the chunk is named after the space,
// so that prefix is what marks a line of this body rather than of a module it
// required. Anything with the shape is taken when the space name doesn't match.
function codeErrorLine(msg) {
  const text = String(msg || "");
  const re = /(?:^|[\s"'(\[])([\w.\-]*):(\d+):\s*/g;
  let mt, first = null;
  while ((mt = re.exec(text))) {
    const hit = { line: +mt[2], chunk: mt[1], msg: text.slice(mt.index + mt[0].length).trim() };
    if (typeof current !== "undefined" && hit.chunk === (current || "")) return hit;
    if (!first) first = hit;
  }
  return first;
}

function codeMarkError(msg) {
  const ta = document.getElementById("ev");
  if (!ta || !ta._code) return null;
  const hit = codeErrorLine(msg);
  if (!hit || hit.line < 1 || hit.line > ta.value.split("\n").length) { codeClearError(); return null; }
  ta._code.errLine = hit.line;
  ta._code.errMsg = hit.msg;
  codeStatus(ta);
  codeGoto(ta, hit.line, true);
  return hit;
}

function codeClearError() {
  const ta = document.getElementById("ev");
  if (!ta || !ta._code || !ta._code.errLine) return;
  ta._code.errLine = 0; ta._code.errMsg = "";
  codeStatus(ta);
}

// caret to the start of a line's text, scrolled into the middle if it was out
function codeGoto(ta, line, keepFocus) {
  if (typeof ta === "number") { line = ta; ta = document.getElementById("ev"); }
  if (!ta || !ta._code) return;
  const v = ta.value;
  let pos = 0;
  for (let i = 1; i < line; i++) { const nl = v.indexOf("\n", pos); if (nl < 0) break; pos = nl + 1; }
  pos += /^[ \t]*/.exec(v.slice(pos))[0].length;
  const c = ta._code, lh = c.lh || 19, pad = c.pad || 10;
  const y = pad + (line - 1) * lh;
  if (y < ta.scrollTop || y + lh > ta.scrollTop + ta.clientHeight)
    ta.scrollTop = Math.max(0, y - ta.clientHeight / 2);
  if (!keepFocus || document.activeElement === ta || !ta.disabled) {
    ta.focus({ preventScroll: true });
    ta.setSelectionRange(pos, pos);
  }
  codeStatus(ta);
}

// an error message with its line reference made into a link to that line
function codeErrorHtml(msg) {
  return esc(msg).replace(/(^|[\s(\[])([\w.\-]*:(\d+)):/, (all, lead, ref, n) =>
    `${lead}<a class="errline" onclick="codeGoto(${+n})" title="Go to line ${+n}">${ref}</a>:`);
}
</script>
<script>
// A read-only look at every key space, out of /api/admin/*. Everything here is a
// GET: the viewer never writes, which is why there is no confirm anywhere in it.
let spaces = [], current = null, tab = "keys";
let fsPath = "/", keyPrefix = "", keyMatch = "", fsMatch = "", fnMatch = "";
let gPath = "/";                       // where the graph tab is looking

// for a name that goes inside onclick='...': encodeURIComponent leaves ' alone
const enc = s => encodeURIComponent(s).replace(/'/g, "%27");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bytes = n => n == null ? "" :
  n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " kB" :
  (n / 1048576).toFixed(1) + " MB";
const num = n => (n ?? 0).toLocaleString();

// A reply from /api/admin/*. SPACESAPI answers in JSON; when the route itself
// fails (its deadline ran out, say) barch answers with the reason as plain text
// and a 500, and that text is the error to show.
async function replyOf(r) {
  const text = await r.text().catch(() => "");
  try { return JSON.parse(text); } catch (e) {}
  const why = text.trim().slice(0, 400);
  return { error: why ? `${why} (HTTP ${r.status})` : `HTTP ${r.status}, no reply body` };
}

async function api(path) {
  const r = await fetch("/api/admin/" + path);
  const out = await replyOf(r);
  if (r.status === 401) { openAuth(); throw new Error("unauthorized"); }
  return out;
}

async function boot() {
  // /api/admin/me answers for any signed-in user AND the local-admin guest
  // (no admin yet): it is the only /api/admin/* endpoint that does not
  // need a real session. Admins see the full viewer; everyone else gets
  // their name in the header plus the exit door, instead of a blank page.
  // me goes first: /spaces 401s for non-admins, and reading it first used
  // to throw boot() out before setUser() ever ran.
  const me = await api("me").catch(() => null);
  // what was open belonged to the last session; a signed-out page keeps none of it
  if (!me || me.needs_admin || !me.admin) {
    docs.length = 0;
    showNoDoc();
    toggleDock(false);
    const dock = document.getElementById("dock-body");
    if (dock) dock.innerHTML = "";
  }
  // Nobody is the admin yet. There is no guest and no way in, and the one
  // thing that helps is making the account - the first one made here becomes
  // the admin - so the form goes up at once rather than a refusal.
  if (me && me.needs_admin) {
    needsAdmin = true;
    isHere = !!me.here;
    setUser(null);
    spaces = []; current = null;
    document.getElementById("spaces").innerHTML = "";
    document.getElementById("pane").innerHTML =
      `<div class="notice">This server has no admin account yet.
       The first account made here becomes the admin.</div>`;
    openAuth("register");
    return;
  }
  needsAdmin = false;
  if (!me) {
    // not signed in: the sign-in panel is already up (api() opens it on a 401),
    // and what is behind it is not this browser's to look at any more
    setUser(null);
    spaces = []; current = null;
    document.getElementById("spaces").innerHTML = "";
    document.getElementById("pane").innerHTML =
      `<div class="empty" style="padding:60px 0">Signed out.</div>`;
    return;
  }
  isAdmin = !!me.admin;
  isHere = !!me.here;          // the browser is on the machine the server runs on
  document.getElementById("tab-console").hidden = !isAdmin;
  setUser(me.user);
  if (!isAdmin) {
    document.getElementById("pane").innerHTML =
      `<div class="notice">Signed in as ${esc((me.user || {}).email || "unknown")} — `
      + `an admin can promote this account from the Console tab:<br><code>SET admin/`
      + `${esc((me.user || {}).email || "you")} 1</code> in the <code>spaces</code> space.</div>`;
    return;
  }
  const out = await api("spaces").catch(() => null);
  if (!out) return;
  spaces = out.spaces || [];
  drawSpaces();
  // the biggest openable space, not the first non-empty one: landing on
  // `configuration` and its four keys is a poor first look at a server
  const open = spaces.filter(s => s.openable);
  current = (open.sort((a, b) => b.keys - a.keys)[0] || spaces[0]).name;
  open.sort((a, b) => spaces.indexOf(a) - spaces.indexOf(b));
  drawSpaces();
  draw();
  drawStatus();
}

// `configuration` holds every space's settings and the server's own; SPACESAPI
// refuses to drop it (space_rm), so it gets no minus to press
const UNDROPPABLE = ["configuration"];

function drawSpaces() {
  document.getElementById("spaces").innerHTML =
    `<div class="spaces-head">
      <h3>Spaces</h3>
      ${isAdmin ? `<button class="gear" title="Export or import every space"
        aria-label="Export or import every space"
        onclick="openTransferAll(event)">${ico("transfer")}</button>
      <button class="gear" title="Add a key space" aria-label="Add a key space"
        onclick="newSpace(event)">${ico("plus")}</button>` : ""}
    </div>` + spaces.map(s => `
      <a href="#" class="${s.name === current ? "on" : ""}${s.openable ? "" : " off"}"
         onclick="pickSpace(event, '${esc(s.name)}')">
        <span class="icon">${ico(s.files ? "folder" : "key")}</span>
        <span class="sname">${esc(s.name)}</span>
        <span class="count">${num(s.keys)}</span>
        ${isAdmin && s.openable ? `<button class="ib" title="Export or import ${esc(s.name)}"
          aria-label="Export or import ${esc(s.name)}"
          onclick="openTransfer(event,'${esc(enc(s.name))}')">${ico("transfer")}</button>
        ${UNDROPPABLE.includes(s.name) ? "" : `<button class="ib" title="Delete ${esc(s.name)}"
          aria-label="Delete ${esc(s.name)}"
          onclick="dropSpace(event,'${esc(enc(s.name))}')">${ico("minus")}</button>`}` : ""}
      </a>`).join("");
}

async function dropSpace(ev, name) {
  ev.preventDefault();
  ev.stopPropagation();
  name = decodeURIComponent(name);
  if (!armed(ev.currentTarget, null, `Click − again to drop ${name}. This deletes the space and cannot be undone.`)) return;
  if (!await write("space_rm", { name })) return;
  docs.filter(d => d.space === name).forEach(d => closeDoc(d, true));
  const out = await api("spaces").catch(() => null);
  if (out) spaces = out.spaces || [];
  if (current === name) {
    const open = spaces.filter(s => s.openable);
    current = (open[0] || spaces[0] || {}).name || null;
    resetPlace();
    docsFollowSpace();
  }
  drawSpaces();
  if (current) draw();
  drawStatus();
}

function pickSpace(ev, name) {
  if (ev) ev.preventDefault();
  const s = spaces.find(x => x.name === name);
  if (!s || !s.openable) return;
  document.getElementById("wb").classList.remove("show-spaces");
  if (name === current) return;
  current = name;
  resetPlace();
  drawSpaces();
  docsFollowSpace();
  draw();
  drawStatus();
}

document.getElementById("tabs").onclick = ev => {
  const a = ev.target.closest("a[data-tab]");
  if (!a) return;
  ev.preventDefault();
  // these open beside the list, which keeps its place
  if (a.dataset.tab === "config") return openServer();
  if (a.dataset.tab === "settings") return openAppSettings();
  if (a.dataset.tab === "console") return toggleDock();
  document.getElementById("wb").classList.remove("show-spaces");
  document.getElementById("wb").classList.add("browse");
  setView(a.dataset.tab);
};

// Each draw of the list takes a number. A reply that comes back after another
// draw has started (the view or the space changed meanwhile) is for a list
// that is no longer on screen, and is dropped rather than written into it.
let drawSeq = 0;
const stale = n => n !== drawSeq;

function draw() {
  if (tab === "keys") return drawKeys();
  if (tab === "files") return drawFiles();
  if (tab === "graph") return drawGraph();
  if (tab === "functions") return drawFunctions();
  if (tab === "stats") return drawStats();
}

// ---- keys -----------------------------------------------------------------
//
// A window of PAGE keys at `offset`, and a slider over the whole range. The server
// jumps to the offset (`sp:range(lo, hi, limit, offset)`), so any position costs the
// same and the slider can be dragged rather than clicked through. The pane is built
// once and only the rows change, so the slider is never torn down under the thumb.

const PAGE = 25;
let isAdmin = false;     // the server decides; this only decides what to draw
let isHere = false;      // the browser is on the machine the server runs on
let needsAdmin = false;  // no admin account on this server yet, so make one
let keyTotal = 0, keyAt = 0, keyTimer = null, keySeq = 0;

async function drawKeys() {
  if (tab !== "keys") return;      // another view is on screen
  const seq = ++drawSeq;
  const pane = document.getElementById("pane");
  pane.innerHTML = head("keys") + `
    <div class="filter">
      <input id="prefix" placeholder="key prefix, e.g. street:LONG"
             value="${esc(keyPrefix)}" autocomplete="off">
      <input id="vmatch" placeholder="value glob, e.g. *sale* or ?ok"
             value="${esc(keyMatch)}" autocomplete="off">
      <button onclick="applyPrefix()">Filter</button>
      ${keyPrefix || keyMatch ? `<button onclick="keyPrefix='';keyMatch='';drawKeys()">Clear</button>` : ""}
      ${isAdmin ? `<button onclick="newKey()">${ico("key")} New key</button>` : ""}
    </div>
    <div class="slider" id="slider">
      <button onclick="slideBy(-1)" aria-label="Previous page">${ico("back")}</button>
      <input type="range" id="slide" min="0" max="0" value="0" step="1" aria-label="Position in the keys"
             oninput="slideTo(Number(this.value))">
      <button onclick="slideBy(1)" aria-label="Next page" style="transform:scaleX(-1)">${ico("back")}</button>
      <span id="slide-at"></span>
    </div>
    <div id="rows"><div class="empty" style="padding:40px 0">Walking…</div></div>`;
  for (const id of ["prefix", "vmatch"])
    document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") applyPrefix(); });
  keyAt = 0;
  const out = await loadKeys(true);
  if (stale(seq)) return;
  if (!out) return;
  if (out.total == null && Array.isArray(out.keys) && out.keys.length) {
    document.getElementById("rows").innerHTML = `<div class="notice">This barchd ignores the range offset, so the
      slider cannot jump. Install the newer one and restart.</div>`;
    document.getElementById("slider").hidden = true;
    return;
  }
  keyTotal = out.total || 0;
  const r = document.getElementById("slide");
  r.max = Math.max(0, Math.ceil(keyTotal / PAGE) - 1);
  document.querySelector(".head .count").textContent =
    `${num(keyTotal)} keys${keyPrefix ? " under that prefix" : ""}${keyMatch ? ` with a value matching ${keyMatch}` : ""}${out.capped ? " (first 200,000 searched)" : ""}`;
  document.getElementById("slider").hidden = keyTotal <= PAGE;
  showKeys(out);
}

// one window; `first` also asks for the total
async function loadKeys(first) {
  const q = new URLSearchParams({ space: current, prefix: keyPrefix, limit: PAGE, offset: keyAt * PAGE });
  if (keyMatch) q.set("match", keyMatch);
  if (first) q.set("count", "1");
  const seq = ++keySeq;
  const out = await api("keys?" + q).catch(() => null);
  return seq === keySeq ? out : null;          // a later drag has already asked for another window
}

// a key with the prefix it shares with the key above dimmed, so a sorted page
// shows where each key branches off its neighbour
function keyCell(key, prev) {
  key = String(key);
  let n = 0;
  if (prev != null) { prev = String(prev); while (n < key.length && key[n] === prev[n]) n++; }
  if (n === key.length) n = 0;                // nothing left to show in full ink
  return n ? `<span class="pre">${esc(key.slice(0, n))}</span><span class="tail">${esc(key.slice(n))}</span>`
           : esc(key);
}

function showKeys(out) {
  const rows = Array.isArray(out.keys) ? out.keys : [];
  document.getElementById("rows").innerHTML = !rows.length
    ? `<div class="empty" style="padding:40px 0">No keys${keyPrefix ? " under that prefix" : ""}${keyMatch ? " matching that value" : ""}.</div>`
    : `<table class="keys"><tbody>${rows.map((r, i) => `
        <tr onclick="openValue('${esc(enc(r.key))}')" data-doc="${esc(docId("key", r.key))}">
          <td class="k" title="${esc(r.key)}">${keyCell(r.key, i ? rows[i - 1].key : null)}</td>
          <td class="kind">${keyBadge(r)}</td>
          <td class="sz">${r.size == null ? "" : bytes(r.size)}</td>
          <td class="v">${esc(r.value ?? "")}</td>
          ${isAdmin ? `<td class="act">${String(r.key).startsWith("fs:") ? "" : `<button class="ib" title="Delete ${esc(r.key)}"
            aria-label="Delete ${esc(r.key)}"
            onclick="dropKey(event,'${esc(enc(r.key))}')">${ico("minus")}</button>`}</td>` : ""}
        </tr>`).join("")}</tbody></table>`;
  const from = keyAt * PAGE + 1;
  document.getElementById("slide-at").textContent =
    rows.length ? `${num(from)}–${num(from + rows.length - 1)} of ${num(keyTotal)}` : "";
  markOpen();
}

// ---- what a key belongs to ---------------------------------------------------
//
// The file store and the graph store keep their records as ordinary keys, so the
// Keys list shows them too. Each row gets a badge saying what the key is part
// of, and the badge goes there: to the file or folder in Files, or to the node
// in Graph. The ids inside the key names are 16-hex; a path is found from them
// the way the stores themselves find it:
//
//   fs:n:<path>                 the file or folder itself
//   fs:i:<id>, fs:c:<id>:<n>    a file's bytes: the fs:n record whose "id" is
//                               <id>, or else the graph leaf whose "inode" is
//   fs:lru:<stamp>:<path>, fs:miss:<path>   the fetch cache's notes on <path>
//   graph:n:<id>, graph:r:<id>:<edge>       node <id>
//   graph:e:<parent>:<edge>     the edge; its value names the node
//   graph:x:<parent>:<hash>:<edge>          the name index; its value is the node
//   fs:layout, ids:fs, graph:layout, ids:graph   the store as a whole

function keyType(key, kind) {
  let m;
  if (kind !== "key") return { t: kind || "key" };
  if ((m = /^fs:n:(.*)$/.exec(key))) return { t: m[1].endsWith("/") ? "folder" : "file", path: m[1] };
  if ((m = /^fs:(?:i|c):([0-9a-f]{16})(?::|$)/.exec(key))) return { t: "file", inode: parseInt(m[1], 16), part: key[3] === "c" ? "chunk" : "inode" };
  if ((m = /^fs:lru:[0-9a-f]+:(.*)$/.exec(key)) || (m = /^fs:miss:(.*)$/.exec(key))) return { t: "file", path: m[1], part: "cache" };
  if (key === "fs:layout" || key === "ids:fs" || key === "fs:cache") return { t: "files" };
  if ((m = /^graph:(?:n|r):([0-9a-f]{16})(?::|$)/.exec(key))) return { t: "node", node: parseInt(m[1], 16) };
  if (/^graph:(?:e|x):/.test(key)) return { t: "node", fromValue: true };
  if (key === "graph:layout" || key === "ids:graph") return { t: "graph" };
  return { t: "key" };
}

const KEY_BADGES = {
  file: ["file", "Files"], folder: ["folder", "Files"], files: ["folder", "Files"],
  node: ["graph", "Graph"], graph: ["graph", "Graph"],
};

function keyBadge(r) {
  const k = keyType(r.key, r.kind), b = KEY_BADGES[k.t];
  if (!b) return `<span class="kt kt-${esc(k.t)}">${esc(k.t)}</span>`;
  const label = k.t === "files" ? "files" : k.t;
  const title = k.inode != null ? `Show the file or graph leaf whose ${k.part} this is`
    : `Show in ${b[1]}${k.path ? " " + k.path : k.node != null ? " node #" + k.node : ""}${k.part ? ` (this is its ${k.part})` : ""}`;
  return `<button class="kt kt-${esc(k.t)}" title="${esc(title)}"
    onclick="event.stopPropagation();goKeyType('${esc(enc(r.key))}','${esc(r.kind)}')">${ico(b[0])}${esc(label)}</button>`;
}

const hex16 = n => Number(n).toString(16).padStart(16, "0");

async function keyValue(key) {
  const out = await api("value?space=" + encodeURIComponent(current) + "&key=" + encodeURIComponent(key)).catch(() => null);
  return out && !out.error ? out.value : null;
}

// the first key under `prefix` whose value matches the glob, or null
async function firstMatch(prefix, glob) {
  const q = new URLSearchParams({ space: current, prefix, match: glob, limit: 1 });
  const out = await api("keys?" + q).catch(() => null);
  const row = out && Array.isArray(out.keys) ? out.keys[0] : null;
  return row ? row.key : null;
}

// A node's path, walked up to the root one parent at a time through graph:r.
// A node under several parents answers with the path through its first edge.
async function graphPathOf(node) {
  const names = [], seen = new Set();
  let n = node;
  while (n !== 0) {
    if (seen.has(n) || names.length > 64) return null;
    seen.add(n);
    const q = new URLSearchParams({ space: current, prefix: "graph:r:" + hex16(n) + ":", limit: 1 });
    const out = await api("keys?" + q).catch(() => null);
    const row = out && Array.isArray(out.keys) ? out.keys[0] : null;
    if (!row || row.value == null) return null;               // no edge names it: unreachable
    const parent = parseInt(row.value, 16), edge = row.key.split(":").pop();
    let rec = null;
    try { rec = JSON.parse(await keyValue("graph:e:" + hex16(parent) + ":" + edge)); } catch (e) {}
    if (!rec || rec.name == null) return null;
    names.unshift(rec.name);
    n = parent;
  }
  return "/" + names.join("/");
}

async function nodeIsDir(node) {
  try { return JSON.parse(await keyValue("graph:n:" + hex16(node))).kind === "dir"; } catch (e) { return false; }
}

const noEvent = { preventDefault() {}, stopPropagation() {} };
const parentOf = p => { const cut = p.replace(/\/$/, "").lastIndexOf("/"); return cut <= 0 ? "/" : p.slice(0, cut); };

async function goKeyType(key, kind) {
  key = decodeURIComponent(key);
  const k = keyType(key, kind);
  if (k.t === "files") { fsPath = "/"; fsMatch = ""; return setView("files"); }
  if (k.t === "graph") { gPath = "/"; return setView("graph"); }
  if (k.t === "folder") { fsPath = k.path.replace(/\/$/, "") || "/"; fsMatch = ""; return setView("files"); }
  if (k.t === "file") {
    let path = k.path, node = null;
    if (path == null) {
      // the bytes are a file's, or a graph leaf's: the name record says which
      const named = await firstMatch("fs:n:", `*"id":${k.inode},*`) || await firstMatch("fs:n:", `*"id":${k.inode}}*`);
      if (named) path = named.slice(5);
      else {
        const leaf = await firstMatch("graph:n:", `*"inode":${k.inode},*`) || await firstMatch("graph:n:", `*"inode":${k.inode}}*`);
        if (leaf) node = parseInt(leaf.slice(8), 16);
      }
    }
    if (node != null) return goNode2(node);
    if (path == null) return toast(`nothing names file ${k.inode} any more`, "warn");
    fsPath = parentOf(path); fsMatch = "";
    setView("files");
    return openFile(noEvent, enc(path));
  }
  if (k.t === "node") {
    let node = k.node;
    if (k.fromValue) {
      // an edge's value is {node, name}; the name index's is the node, 16-hex
      const v = String(await keyValue(key) ?? "").trim();
      if (/^[0-9a-f]{16}$/.test(v)) node = parseInt(v, 16);
      else try { node = JSON.parse(v).node; } catch (e) {}
    }
    if (!Number.isFinite(node)) return toast("could not tell which node that is", "warn");
    return goNode2(node);
  }
}

// open node `node` in Graph: a folder is listed, a leaf is listed beside its parent and opened
async function goNode2(node) {
  if (node === 0) { gPath = "/"; return setView("graph"); }
  const path = await graphPathOf(node);
  if (path == null) return toast(`node ${node} has no path from the root`, "warn");
  if (await nodeIsDir(node)) { gPath = path; return setView("graph"); }
  gPath = parentOf(path);
  setView("graph");
  return openNode(noEvent, enc(path));
}

// While the thumb moves the label follows at once and the rows follow a moment
// later, so a fast drag asks for the windows it stops on, not every one it passes.
function slideTo(i) {
  keyAt = i;
  const from = i * PAGE + 1;
  document.getElementById("slide-at").textContent =
    `${num(from)}–${num(Math.min(from + PAGE - 1, keyTotal))} of ${num(keyTotal)}`;
  document.getElementById("slide").value = i;
  clearTimeout(keyTimer);
  const seq = drawSeq;
  keyTimer = setTimeout(async () => { const out = await loadKeys(false); if (out && !stale(seq)) showKeys(out); }, 60);
}
function slideBy(n) {
  const r = document.getElementById("slide");
  slideTo(Math.max(0, Math.min(Number(r.max), keyAt + n)));
}

function applyPrefix() {
  keyPrefix = document.getElementById("prefix").value.trim();
  keyMatch = document.getElementById("vmatch").value.trim();
  drawKeys();
}

// ---- writing (admins only; the server checks, this only decides what to draw) --

async function write(op, params, body, quiet) {
  const q = new URLSearchParams({ space: current, ...params });
  const r = await fetch("/api/admin/" + op + "?" + q, { method: "POST", body: body ?? "" });
  const out = await replyOf(r);
  if (out.error && !(quiet && (out.exists || out.notempty))) { toast(out.error, "warn"); return null; }
  return out;
}

// the value editor: new key, or an existing one. The file picker fills the text
// box from a text file, or is sent as the value as it is when it is not text.
function editKey(key, value, canEdit) {
  const fresh = key == null;
  return `<div class="editor">
    ${fresh ? `<input id="ek" placeholder="key name" autocomplete="off">` : ""}
    <textarea id="ev" rows="8" spellcheck="false" ${canEdit ? "" : "disabled"} style="${valueHeightStyle()}"
      placeholder="${canEdit ? "value" : "too large to edit here — upload a file to replace it"}">${esc(value ?? "")}</textarea>
    ${hgrip("valueHeight", "Resize the value box")}
    <div class="row">
      <input type="file" id="ef">
      <span class="fill"></span>
      <button class="primary" id="key-save" onclick="saveKey(${fresh ? "null" : `'${esc(enc(key))}'`})">Save</button>
      ${fresh ? "" : `<button id="key-del" onclick="removeKey('${esc(enc(key))}')">Delete</button>`}
    </div>
  </div>`;
}

// the `configuration` space is where every space's settings live, and an option
// changed on a space that already has data can make it unloadable
const careful = () => current === "configuration"
  ? "\n\nCAREFUL: this is the configuration space. A wrong value can stop a space from loading or change what the server runs." : "";
const carefulNote = () => careful().trim();

// Save writes and stays open, like the function editor: a write is undone by
// writing again, so it needs no confirm. The configuration space is the
// exception - a wrong value there can stop a space from loading - so Save
// asks for a second click there instead of a dialog.
async function saveKey(key) {
  key = key == null ? document.getElementById("ek").value.trim() : decodeURIComponent(key);
  if (!key) { toast("a key name is required", "warn"); document.getElementById("ek")?.focus(); return; }
  const file = document.getElementById("ef").files[0];
  const body = file || document.getElementById("ev").value;
  if (file && file.size > 512000) { toast("a value is at most 512 kB; that file is " + bytes(file.size), "warn"); return; }
  if (careful() && !armed(document.getElementById("key-save"), "Really set?", carefulNote())) return;
  if (await write("key_put", { key }, body)) {
    toast(`Saved ${key}`, "ok");
    document.getElementById("ef").value = "";
    const ev = document.getElementById("ev");
    if (ev) ev.defaultValue = ev.value;
    const ek = document.getElementById("ek");
    if (ek && activeDoc) { shut(); openValue(enc(key)); }
    else drawDocTabs();
    drawKeys();
  }
}

// Delete asks with a second click, not a dialog
async function removeKey(key) {
  key = decodeURIComponent(key);
  if (!armed(document.getElementById("key-del"), "Really delete?", careful() ? carefulNote() : null)) return;
  if (await write("key_rm", { key })) { toast(`Deleted ${key}`, "ok"); shut(); drawKeys(); }
}

// the − on a row: the first click turns it red and says what the second does
async function dropKey(ev, key) {
  ev.preventDefault();
  ev.stopPropagation();
  key = decodeURIComponent(key);
  if (!armed(ev.currentTarget, null, `Click − again to delete ${key}${careful() ? " — " + carefulNote() : ""}`)) return;
  if (await write("key_rm", { key })) { toast(`Deleted ${key}`, "ok"); drawKeys(); }
}

function newKey() {
  show(`<div class="top"><h2>New key in ${esc(current)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox" data-key="">${editKey(null, "", true)}</div>`);
  document.getElementById("ek")?.focus();
}

async function uploadFiles(input) {
  const base = fsPath === "/" ? "" : fsPath;
  for (const f of input.files) {
    const path = base + "/" + f.name, params = { path, type: f.type || "" };
    // written if the name is free; if it is not, the server says so and only then is
    // the person asked - the warning is for a file that is really there
    let out = await write("file_put", params, f, true);
    if (out && out.exists) {
      if (!confirm(`${path} already exists in ${current}. Replace it with this ${bytes(f.size)} file?`)) continue;
      out = await write("file_put", { ...params, overwrite: "1" }, f);
    }
    if (!out) break;
  }
  input.value = "";
  drawFiles();
}

// A file typed here rather than uploaded, into the folder the list is in. The
// type comes from the extension when it is a text kind, so a .json or .md
// reads back as one; anything else is stored as text/plain.
function newFile() {
  const dir = fsPath;
  const node = show(`<div class="top"><h2>New file in ${esc(current)}</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox" data-newfile="${esc(enc(dir))}">
      <div class="meta">in <code>${esc(dir)}</code></div>
      <div class="editor">
        <input id="ek" placeholder="name, e.g. notes.md" autocomplete="off" spellcheck="false">
        <textarea id="nf-body" rows="14" spellcheck="false" placeholder="content"></textarea>
        <div class="row">
          <span class="fill"></span>
          <button class="primary" id="nf-save" onclick="saveNewFile()">Create</button>
        </div>
      </div>
    </div>`, { id: "new-file:" + current + ":" + (++docSeq), icon: "file" });
  const name = node.querySelector("#ek");
  name.focus();
  name.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); node.querySelector("#nf-body").focus(); } });
}

async function saveNewFile() {
  const box = document.querySelector("#panel .valuebox[data-newfile]");
  if (!box) return;
  const dir = decodeURIComponent(box.dataset.newfile);
  const name = (document.getElementById("ek").value || "").trim();
  if (!name) { toast("a file name is required", "warn"); document.getElementById("ek").focus(); return; }
  if (name.includes("/")) { toast("a name has no slashes in it — the folder is where it goes", "warn"); return; }
  let body = document.getElementById("nf-body").value;
  const ext = (name.split(".").pop() || "").toLowerCase();
  if ((ext === "luau" || ext === "lua") && !body.trim())
    body = "-- Run calls call() with the arguments; another function can use this file\n-- with require(\":" + ((dir === "/" ? "" : dir) + "/" + name) + "\").\nfunction call(name)\n    return \"hello \" .. tostring(name)\nend\n";
  let type = EXT_TYPES[ext] || "text/plain";
  if (RAW_IMAGES.includes(type)) type = "text/plain";
  const path = (dir === "/" ? "" : dir) + "/" + name;
  // the name is taken only if it is free; if it is not, ask before replacing
  let out = await write("file_put", { path, type }, body, true);
  if (out && out.exists) {
    if (!armed(document.getElementById("nf-save"), "Replace?", `${path} already exists — click Replace? to overwrite it`)) return;
    out = await write("file_put", { path, type, overwrite: "1" }, body);
  }
  if (!out) return;
  toast(`Saved ${path}`, "ok");
  shut();
  if (fsPath === dir) drawFiles();
  openFile({ stopPropagation() {} }, enc(path));
}

// Save an open text file: the same file_put that made it, over the top, with
// the type it already has. The tab reopens so its version and size are current.
async function saveFile() {
  const box = document.querySelector("#panel .valuebox[data-file]");
  const ta = document.getElementById("ev");
  if (!box || !ta) return;
  const path = decodeURIComponent(box.dataset.file);
  if (careful() && !armed(document.getElementById("fe-save"), "Really save?", carefulNote())) return;
  const out = await write("file_put", { path, type: box.dataset.type || "text/plain", overwrite: "1" }, ta.value);
  if (!out) return;
  ta.defaultValue = ta.value;
  toast(`Saved ${path}`, "ok");
  const at = [ta.selectionStart, ta.selectionEnd, ta.scrollTop];
  await openFile(null, enc(path));
  const fresh = document.getElementById("ev");
  if (fresh) {
    fresh.setSelectionRange(at[0], at[1]); fresh.scrollTop = at[2]; fresh.focus({ preventScroll: true });
    if (fresh._code) { codeScroll(fresh); codeStatus(fresh); }
  }
  drawFiles();
}

async function newFolder() {
  const name = await ask("New folder name (inside " + fsPath + ")");
  if (!name) return;
  if (name.includes("/")) return toast("a folder name cannot contain /", "warn");
  if (await write("dir_mk", { path: (fsPath === "/" ? "" : fsPath) + "/" + name })) drawFiles();
}

// the same call renames a file or a folder; the server moves name records only
// Rename asks for the new name with the old one selected up to its extension,
// and keeps it in the same folder. A name with a / in it is a path, which moves
// the file or folder there (that folder must exist). Tabs open on what moved
// follow it to its new path.
async function renameFile(ev, path, isDir) {
  if (ev) { ev.preventDefault?.(); ev.stopPropagation(); }
  path = decodeURIComponent(path);
  isDir = !!isDir || path.endsWith("/");
  const clean = path.replace(/\/$/, "");
  const cut = clean.lastIndexOf("/");
  const dir = cut <= 0 ? "" : clean.slice(0, cut), name = clean.slice(cut + 1);
  const dot = name.lastIndexOf(".");
  const typed = await ask(`Rename ${name}`, name,
    "A new name keeps it in " + (dir || "/") + "; a path starting with / moves it. Enter to rename, Esc to cancel.",
    [0, dot > 0 && !isDir ? dot : name.length]);
  const next = (typed || "").trim();
  if (!next || next === name) return;
  const to = next.startsWith("/") ? next : dir + "/" + next;
  if (!await write("file_mv", { path: clean, to })) return;
  toast(`Renamed to ${to}`, "ok");
  // open tabs on the file, or on anything under the folder, follow the move
  for (const d of docs.filter(x => x.id === docId("file", clean) || x.id.startsWith(docId("file", clean + "/")))) {
    const moved = to + d.id.slice(docId("file", clean).length);
    const wasActive = d === activeDoc;
    closeDoc(d, true);
    if (wasActive) await openFile(null, enc(moved));
  }
  drawFiles();
}

async function deleteFile(ev, path, isDir) {
  ev.stopPropagation();
  path = decodeURIComponent(path);
  if (!isDir) {
    if (!confirm(`Delete ${path} from ${current}? This cannot be undone.`)) return;
    if (await write("file_rm", { path })) drawFiles();
    return;
  }
  // a folder goes only if it is empty; when it is not, say so and ask again
  if (!confirm(`Delete the folder ${path} from ${current}?`)) return;
  let out = await write("dir_rm", { path }, null, true);
  if (out && out.notempty) {
