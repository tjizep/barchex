<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key spaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* The storefront's looks, shared by index.html, register.html and signon.html.
 *
 * Colours and type come from docs/index.html so the shop and the documentation
 * read as one project: ink and paper greys, cobalt for the thing you click,
 * copper for the accent, IBM Plex Sans with Archivo for display and JetBrains
 * Mono for the small uppercase labels. The layout and the spacing come from a
 * grocery storefront mock - a white two row header over a grey ground, a
 * sidebar card, flat product cards with a hairline instead of a shadow, and a
 * full width dark button at the bottom of each one.
 *
 * Loaded into the file store with everything else under app/, and served by the
 * SHOPUI files route, which reads the content type off the extension. */

:root {
  --ink: #141a22;          /* primary text */
  --ink-2: #3d4854;        /* secondary text */
  --ink-3: #6b7683;        /* muted */
  --paper: #f2f4f6;        /* page */
  --panel: #ffffff;        /* cards */
  --line: #d7dde3;         /* hairlines */
  --line-2: #eaeef2;       /* the quieter half of a hairline */
  --l1: #2450d6;           /* cobalt: links and the primary action */
  --l1-soft: #e6ecfb;
  --l2: #b05c2a;           /* copper: sale, stars, accents */
  --l2-soft: #f6ebe2;
  --ok: #1a7a4a;
  --ok-soft: #e4f2ea;
  --flag: #7a1f3d;         /* the docs' lock chip, used here for the wishlist */
  --flag-soft: #faeef2;
  --night: #0e1420;        /* the docs sidebar, used for the banner */
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --disp: 'Archivo', var(--sans);
  --on-ink: #fff; --on-l1: #fff;
  --ink-hover: #26313f; --line-3: #b9c3cd; --surface-2: #f8fafc; --disabled: #aeb8c2;
  color-scheme: light;
  --r: 8px;
  --r-sm: 6px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--l1); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--l1); outline-offset: 2px; }

/* The small uppercase label - mono, wide tracking, muted - is the docs' signature
 * and it is what makes these two look related. It is not a class: every place
 * that wants it is already a named thing (.count, .crumbs, .brand, nav h3, the
 * section heads) and spelling it out there beats adding a second class to the
 * markup for each one. */

/* ---------- the wordmark ---------- */

.logo { line-height: 1.05; white-space: nowrap; }
.logo b {
  display: block;
  font-family: var(--disp);
  font-weight: 800;
  font-size: 21px;
  letter-spacing: .02em;
  text-transform: uppercase;
  color: var(--ink);
}
.logo b em { font-style: normal; color: var(--l2); }
.logo small {
  display: block;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 3px;
}

/* ---------- buttons and fields ---------- */

button {
  font: inherit;
  cursor: pointer;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  padding: 8px 14px;
  transition: background .12s ease, border-color .12s ease, color .12s ease;
}
button:hover { border-color: var(--line-3); background: var(--surface-2); }

.primary {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--on-ink);
  font-weight: 600;
}
.primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
.primary[disabled] { background: var(--disabled); border-color: var(--disabled); cursor: not-allowed; }

input, select, textarea {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 9px 12px;
}
input::placeholder, textarea::placeholder { color: var(--ink-3); }
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--l1);
  outline-offset: -1px;
  border-color: var(--l1);
}

/* ---------- header ---------- */

header { position: sticky; top: 0; z-index: 20; background: var(--panel); }
.bar {
  display: flex;
  align-items: center;
  gap: 20px;
  max-width: 1260px;
  margin: 0;
  padding: 14px 24px;
}

.search { flex: 1; display: flex; max-width: 620px; position: relative; }
.search input {
  width: 100%;
  padding: 10px 46px 10px 16px;
  border-radius: 999px;
  background: var(--paper);
}
.search input:focus { background: var(--panel); }
.search .go {
  position: absolute; right: 4px; top: 4px;
  width: 34px; height: 34px; padding: 0;
  border-radius: 50%;
  background: var(--ink); color: var(--on-ink); border: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.search .go:hover { background: var(--ink-hover); }

.head-btn {
  position: relative;
  white-space: nowrap;
  background: var(--paper);
  display: flex; align-items: center; gap: 7px;
  font-size: 13.5px;
}
.pill {
  background: var(--l1); color: var(--on-l1);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px; font-weight: 700;
  padding: 1px 7px;
}
.pill.wish { background: var(--flag); }

/* the second row: the same hairline the docs put under a block header */
.subbar { border-bottom: 1px solid var(--line); background: var(--panel); }
.subbar .bar { padding: 0 24px; gap: 0; }
.subbar a {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 22px;
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.subbar a:first-child { padding-left: 0; }
.subbar a:hover { color: var(--ink); text-decoration: none; border-bottom-color: var(--line); }
.subbar .fill { flex: 1; }
.subbar .basket {
  background: var(--paper);
  border-radius: var(--r-sm);
  margin: 6px 0;
  padding: 7px 14px;
  font-weight: 600;
  color: var(--ink);
  border-bottom: none;
}
.subbar .basket:hover { background: var(--line-2); border-bottom-color: transparent; }

/* ---------- shell ---------- */

main {
  max-width: 1260px;
  margin: 0;
  padding: 22px 24px 60px;
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 22px;
  align-items: start;
}

/* ---------- sidebar ---------- */

/* The sidebar needs a height of its own, and neither obvious answer gives it one.
 * `align-items: stretch` hands it the results row, so picking a category with a
 * screenful less in it shrinks the category list to match - the list collapsing
 * when you click Electronics. `align-items: start` is worse: the scrolling list
 * inside is absolutely positioned and contributes no height at all, so the card
 * ends up at its min-height, three rows tall. So it is told the height directly.
 * The card is the viewport, the list inside scrolls, and how many products came
 * back has nothing to do with it. */
nav {
  position: sticky; top: 96px;
  height: calc(100vh - 116px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 8px;
  display: flex; flex-direction: column;
}
nav h3 {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 8px 0 6px 10px;
}
.spaces-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin: 8px 4px 6px 0; padding-right: 2px;
}
.spaces-head h3 { margin: 0 0 0 10px; }
.spaces-head .gear { flex: none; }
nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border-radius: var(--r-sm);
  color: var(--ink-2);
  font-size: 15.5px;
  border-left: 2px solid transparent;
}
nav a:hover { background: var(--paper); color: var(--ink); text-decoration: none; }
nav a.on {
  background: var(--l1-soft);
  color: var(--l1);
  border-left-color: var(--l1);
  font-weight: 600;
}
nav a.special { font-weight: 600; color: var(--ink); }
nav .sub { padding-left: 28px; font-size: 15px; }
nav .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
nav .icon { width: 18px; text-align: center; flex: none; font-size: 14px; }
nav hr { border: none; border-top: 1px solid var(--line-2); margin: 8px 6px; }

.nav-cats-wrap { position: relative; flex: 1; min-height: 120px; }
.nav-cats {
  position: absolute; inset: 0;
  overflow-y: auto; overscroll-behavior: contain;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
.nav-cats::-webkit-scrollbar { width: 6px; }
.nav-cats::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.nav-fade {
  position: absolute; left: 2px; right: 2px; height: 26px;
  pointer-events: none; transition: opacity .15s; z-index: 2; opacity: 0;
}
.nav-fade-top { top: 0; background: linear-gradient(to bottom, var(--panel), rgba(255,255,255,0)); }
.nav-fade-bottom { bottom: 0; background: linear-gradient(to top, var(--panel), rgba(255,255,255,0)); }

/* ---------- banner ---------- */

.banner {
  position: relative;
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 22px;
  min-height: 176px;
  display: flex; align-items: center;
  padding: 30px 36px 38px;
  background: var(--night);
  color: #fff;
}
.banner::after {
  /* a copper wash off the right edge, so the panel is not a flat rectangle */
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(120% 150% at 100% 0%, rgba(176, 92, 42, .42), transparent 58%);
  pointer-events: none;
}
.banner .kicker {
  font-family: var(--mono);
  font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase;
  color: #8ba0bb;
  margin-bottom: 10px;
}
.banner h2 {
  font-family: var(--disp);
  font-weight: 800;
  font-size: 28px;
  line-height: 1.15;
  letter-spacing: -.01em;
  margin: 0;
  max-width: 26ch;
}
.banner p { margin: 8px 0 0; color: #b9c6d6; font-size: 14px; max-width: 46ch; }
.banner .dots {
  position: absolute; left: 36px; bottom: 16px;
  display: flex; gap: 6px; z-index: 1;
}
.banner .dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.28); }
.banner .dots span:first-child { background: var(--l2); }

/* ---------- section head ---------- */

.head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin-bottom: 14px;
}
.head h1 {
  font-family: var(--disp);
  font-weight: 700;
  font-size: 21px;
  letter-spacing: -.005em;
  margin: 0;
}
.count {
  font-family: var(--mono);
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3);
}

.recent { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 16px; }
.recent:empty { display: none; }
.recent .r-card { flex: none; width: 92px; text-align: center; cursor: pointer; }
.recent .r-card .shot {
  width: 92px; height: 92px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
}
.recent .r-card .t {
  font-size: 11px; color: var(--ink-3); margin-top: 5px; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* ---------- filters ---------- */

.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
}
.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink-2);
}
.chip:hover { border-color: var(--line-3); background: var(--panel); }
.chip.on { background: var(--l1-soft); border-color: var(--l1); color: var(--l1); }
#chip-sale.on { background: var(--l2-soft); border-color: var(--l2); color: var(--l2); }
#sort { padding: 7px 11px; font-size: 13.5px; }

/* ---------- product grid ---------- */

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(206px, 1fr)); gap: 16px; }
.card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  display: flex; flex-direction: column;
  cursor: pointer;
  transition: border-color .12s ease, box-shadow .12s ease;
}
.card:hover { border-color: var(--line-3); box-shadow: 0 6px 18px rgba(20, 26, 34, .07); }
.shot {
  position: relative;
  aspect-ratio: 1;
  background: var(--panel);
  display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid var(--line-2);
}
.shot img { max-width: 86%; max-height: 86%; object-fit: contain; }

/* the discount flag: a copper bar down the left of a soft copper pill, which is
 * the shape the mock uses and the colour the docs already has */
.ribbon {
  position: absolute; top: 10px; left: 0;
  background: var(--l2-soft);
  color: var(--l2);
  border-left: 3px solid var(--l2);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-family: var(--mono);
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
  padding: 3px 9px 3px 7px;
}
.heart {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; padding: 0;
  border-radius: 50%;
  background: var(--panel);
  color: var(--ink-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.heart.on { color: var(--flag); border-color: #d9a4b6; background: var(--flag-soft); }

.body { padding: 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
.brand {
  font-family: var(--mono);
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3);
}
.name {
  font-size: 13.5px; line-height: 1.4; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.stars { font-size: 12px; color: var(--l2); letter-spacing: .04em; }
.stars small { color: var(--ink-3); font-family: var(--mono); font-size: 10.5px; }
.price {
  font-family: var(--disp);
  font-weight: 700; font-size: 17px;
  margin-top: auto; padding-top: 4px;
  color: var(--ink);
}
.price s { color: var(--ink-3); font-weight: 400; font-size: 13px; margin-left: 7px; }
.price .off {
  font-family: var(--mono);
  color: var(--l2); font-weight: 700; font-size: 11px; margin-left: 7px;
}
.add-btn {
  width: 100%;
  margin-top: 10px;
  background: var(--ink);
  color: var(--on-ink);
  border-color: var(--ink);
  border-radius: var(--r-sm);
  padding: 9px 0;
  font-size: 13px;
  font-weight: 600;
}
.add-btn:hover { background: var(--ink-hover); border-color: var(--ink-hover); }

.more { text-align: center; padding: 26px 0; }
.empty { color: var(--ink-3); padding: 44px 0; text-align: center; }

/* ---------- the product and basket panel ---------- */

.veil {
  position: fixed; inset: 0;
  background: rgba(14, 20, 32, .55);
  display: none; align-items: flex-start; justify-content: center;
  padding: 34px 16px; overflow-y: auto; z-index: 40;
}
.veil.on { display: flex; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  max-width: 860px; width: 100%;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(14, 20, 32, .28);
}
.panel:has(.console) { overflow: visible; }
.panel .top {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.panel .top h2 {
  font-family: var(--disp); font-weight: 700; font-size: 15px; margin: 0;
}

.detail { display: grid; grid-template-columns: 320px 1fr; gap: 24px; padding: 20px 18px; }
.detail .shot { border: 1px solid var(--line); border-radius: var(--r); aspect-ratio: 1; }
.detail h2 {
  font-family: var(--disp); font-weight: 700;
  font-size: 20px; line-height: 1.25; margin: 0 0 6px;
}
.crumbs {
  font-family: var(--mono);
  font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 10px;
}
.desc {
  color: var(--ink-2); font-size: 14px; white-space: pre-wrap; margin: 12px 0 16px;
}
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.badge {
  font-family: var(--mono);
  font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px; border: 1px solid;
}
.badge.good { background: var(--ok-soft); color: var(--ok); border-color: #a9d3bf; }
.badge.warn { background: var(--l2-soft); color: var(--l2); border-color: #ddb493; }
.seller { font-size: 12.5px; color: var(--ink-3); }
.wish-toggle { display: flex; align-items: center; gap: 7px; }
.wish-toggle.on { color: var(--flag); border-color: #d9a4b6; background: var(--flag-soft); }

.related, .reviews {
  margin: 0 18px 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.related h3, .reviews h3 {
  font-family: var(--mono);
  font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 12px;
}
.related .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.related .rcard {
  cursor: pointer;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  overflow: hidden;
  transition: border-color .12s ease;
}
.related .rcard:hover { border-color: var(--line-3); }
.related .rcard .shot { aspect-ratio: 1; height: auto; }
.related .rcard .t {
  font-size: 11.5px; line-height: 1.35; padding: 7px 8px 0; color: var(--ink-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.related .rcard .p {
  font-family: var(--disp); font-weight: 700;
  font-size: 12.5px; padding: 4px 8px 8px;
}

.reviews-sum { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
.reviews-sum .avg { font-family: var(--disp); font-weight: 800; font-size: 24px; }
.reviews-sum .stars { color: var(--l2); font-size: 15px; }
.reviews-sum .count {
  font-family: var(--mono);
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3);
}
.rate-form {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 14px;
  margin-bottom: 16px;
}
.rate-form > div:first-child { font-size: 13px; font-weight: 600; }
.rate-form .stars-in { font-size: 22px; color: var(--disabled); cursor: pointer; user-select: none; margin: 4px 0; }
.rate-form .stars-in span.on { color: var(--l2); }
.rate-form textarea { width: 100%; margin: 6px 0 8px; min-height: 62px; resize: vertical; font-size: 13.5px; }
.rate-form .signin-hint { color: var(--ink-3); font-size: 13.5px; }

.review { padding: 11px 0; border-top: 1px solid var(--line-2); }
.review:first-child { border-top: none; }
.review .who { font-weight: 600; font-size: 13.5px; }
.review .stars { color: var(--l2); font-size: 13px; }
.review .comment { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; white-space: pre-wrap; }

.lines { padding: 8px 18px 18px; }
.line {
  display: grid; grid-template-columns: 56px 1fr auto auto;
  gap: 14px; align-items: center;
  padding: 11px 0; border-bottom: 1px solid var(--line-2);
}
.line img { width: 56px; height: 56px; object-fit: contain; }
.line .t { font-size: 13.5px; line-height: 1.4; }
.qty { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 12.5px; }
.qty button { padding: 2px 9px; border-radius: var(--r-sm); }
.total {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--disp); font-weight: 700; font-size: 17px;
  padding: 14px 0 4px;
  border-top: 2px solid var(--ink);
  margin-top: 4px;
}

/* the checkout form under the basket lines. It had no rule of its own before and
 * the fields simply ran inline, which is not a form anybody wants to fill in */
.checkout { display: grid; gap: 10px; padding: 4px 18px 20px; }
.checkout textarea { resize: vertical; min-height: 58px; }
.checkout button[type="submit"] { margin-top: 2px; padding: 10px 0; }
.checkout .note { text-align: center; }

/* ---------- the account ---------- */

.account { padding: 16px 18px 20px; }
.account .who {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 14px;
}
.account .who b { display: block; font-size: 14.5px; }
.account .who small { display: block; color: var(--ink-3); font-size: 12.5px; }
.account h3 {
  font-family: var(--mono);
  font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3);
  margin: 22px 0 10px;
}

.order {
  border: 1px solid var(--line);
  border-radius: var(--r);
  margin-bottom: 10px;
  overflow: hidden;
}
.order-head {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 13px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
}
.order-head .oid {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
}
.order-head .when {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3);
  margin-left: auto;
}
.order-head .amt { font-family: var(--disp); font-weight: 700; font-size: 14px; }

/* the state is the one thing on this screen somebody is actually looking for */
.state {
  font-family: var(--mono);
  font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--ink-3); background: var(--panel);
}
.state.pending { color: var(--l2); border-color: #ddb493; background: var(--l2-soft); }
.state.shipped, .state.delivered { color: var(--ok); border-color: #a9d3bf; background: var(--ok-soft); }
.state.cancelled { color: var(--flag); border-color: #d9a4b6; background: var(--flag-soft); }

.order-body { padding: 10px 13px 11px; }
.order-line {
  display: flex; align-items: baseline; gap: 10px;
  font-size: 13.5px; line-height: 1.5;
}
.order-line .q { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); min-width: 26px; }
.order-line .t { flex: 1; }
.order-line .p { color: var(--ink-2); }
.order-foot {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin-top: 9px; padding-top: 9px;
  border-top: 1px solid var(--line-2);
  font-size: 12.5px; color: var(--ink-3);
}

/* ---------- the ordering flow ---------- */

/* the step strip under the panel header. A finished step is clickable and says
 * so; the one ahead of you is not, because you cannot pay for an address you
 * have not given */
.steps {
  display: flex; gap: 6px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line-2);
  background: var(--surface-2);
}
.steps .step {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 12px 5px 6px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-3);
}
.steps .step b {
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--line); color: var(--panel);
  font-size: 10px; font-weight: 700;
}
.steps .step.on { background: var(--l1-soft); color: var(--l1); }
.steps .step.on b { background: var(--l1); }
.steps .step.done { color: var(--ok); cursor: pointer; }
.steps .step.done b { background: var(--ok); }
.steps .step.done:hover { background: var(--ok-soft); }

/* The footer carries the one thing on the screen somebody is trying to hit, so
 * the forward button is the size of a target rather than the size of its label.
 * Both buttons get the page's own font explicitly: they sit inside a form whose
 * labels are mono and uppercase, and inheriting that is what made this one look
 * squashed. */
.step-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px;
}
.checkout .step-foot { padding: 16px 0 2px; }
.step-foot button {
  font-family: var(--sans);
  font-size: 14px; letter-spacing: normal; text-transform: none;
  padding: 11px 20px;
}
.step-foot .primary {
  font-size: 15px;
  font-weight: 600;
  padding: 13px 30px;
  min-width: 200px;
}

.checkout label { display: block; font-size: 13px; }
.checkout label > input, .checkout label > select, .checkout label > textarea { margin-top: 4px; }
.checkout label, .checkout .two > label {
  font-family: var(--mono);
  font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3);
}
.checkout label input, .checkout label select, .checkout label textarea {
  font-family: var(--sans);
  font-size: 14px; letter-spacing: normal; text-transform: none;
  color: var(--ink);
  width: 100%;
}
.checkout .opt { text-transform: none; letter-spacing: 0; font-style: italic; }
/* end, not stretch: a label that wraps - "Apt / unit optional" does, in a narrow
 * column - would otherwise push its own input down and leave the pair sitting at
 * two different heights. Aligning on the bottom of the box puts the inputs on one
 * line whatever the labels above them do. */
.two {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  align-items: end;
}
.two.narrow-first { grid-template-columns: 152px 1fr; }

/* the type-ahead. The list is absolutely placed so the form does not jump about
 * underneath the field somebody is typing in */
.lookup { position: relative; display: block; }
.hits {
  display: none;
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  box-shadow: 0 12px 28px rgba(14, 20, 32, .14);
  max-height: 244px; overflow-y: auto;
}
.hits.on { display: block; }
.hits button {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  width: 100%; text-align: left;
  border: 0; border-radius: 0;
  border-bottom: 1px solid var(--line-2);
  padding: 8px 11px;
  font-family: var(--sans); font-size: 13.5px; text-transform: none; letter-spacing: normal;
}
.hits button:last-child { border-bottom: 0; }
.hits button:hover { background: var(--l1-soft); }
.hits button small {
  font-family: var(--mono);
  font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-3); white-space: nowrap;
}
.hits .miss {
  padding: 9px 11px; font-size: 13px; color: var(--ink-3);
}

.pay { padding: 4px 18px 18px; }
.ship-card {
  border: 1px solid var(--line);
  border-radius: var(--r);
  margin: 12px 0 16px;
  overflow: hidden;
}
.ship-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3);
}
.ship-head button { padding: 3px 10px; font-size: 12px; }
.ship-body { padding: 11px 12px; font-size: 13.5px; line-height: 1.5; }
.ship-body .note { margin-top: 6px; font-style: italic; }

.methods { display: grid; gap: 9px; }
.method {
  display: flex; align-items: flex-start; gap: 11px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 13px;
  cursor: pointer;
}
.method:hover { border-color: var(--line-3); }
.method:has(input:checked) { border-color: var(--l1); background: var(--l1-soft); }
.method input { margin-top: 3px; accent-color: var(--l1); }
.method span { display: block; }
.method b { display: block; font-size: 13.5px; font-weight: 600; }
.method small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.pay .total { margin: 16px 0 0; }
.pay .note { margin-top: 10px; text-align: center; }

.done { padding: 30px 18px 34px; text-align: center; }
.done .tick { font-size: 32px; color: var(--ok); }
.done h2 { font-family: var(--disp); font-weight: 700; }
.note { color: var(--ink-3); font-size: 12.5px; }

/* ---------- toasts ---------- */

.toasts { position: fixed; bottom: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 16px;
  border-radius: var(--r-sm);
  color: #fff;
  font-size: 13.5px;
  background: var(--ink);
  box-shadow: 0 10px 28px rgba(14, 20, 32, .22);
  transition: opacity .2s ease, transform .2s ease;
}
.toast.success { background: var(--ok); }
.toast.error { background: var(--flag); }
.toast.wish { background: var(--flag); }
.toast.out { opacity: 0; transform: translateY(8px); }

/* ---------- the sign-in and register pages ---------- */

body.auth {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.auth-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  max-width: 384px; width: 100%;
  padding: 28px 28px 26px;
  box-shadow: 0 14px 40px rgba(14, 20, 32, .08);
}
.auth-card .logo { margin-bottom: 18px; }
.auth-card h1 {
  font-family: var(--disp); font-weight: 700;
  font-size: 19px; margin: 0 0 4px;
}
.auth-card .sub { color: var(--ink-3); font-size: 13.5px; margin: 0 0 18px; }
.auth-card form { display: grid; gap: 13px; }
.auth-card label {
  display: block; margin-bottom: 5px;
  font-family: var(--mono);
  font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3);
}
.auth-card input { width: 100%; }
.auth-card button[type="submit"] {
  background: var(--ink); border-color: var(--ink); color: var(--on-ink);
  padding: 10px 0; font-weight: 600; margin-top: 3px;
}
.auth-card button[type="submit"]:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
.auth-card button[disabled] { background: var(--disabled); border-color: var(--disabled); cursor: not-allowed; }
.err {
  background: var(--flag-soft);
  border: 1px solid #d9a4b6;
  color: var(--flag);
  border-radius: var(--r-sm);
  padding: 8px 11px;
  font-size: 13px;
  margin-bottom: 14px;
  display: none;
}
.foot { margin-top: 18px; font-size: 13px; color: var(--ink-3); text-align: center; }

/* ---------- narrow ---------- */

@media (max-width: 880px) {
  main { grid-template-columns: 1fr; padding: 18px 16px 48px; }
  nav { position: static; height: auto; }
  /* stacked, the list is not competing with anything for the screen */
  .nav-cats-wrap { min-height: 0; }
  .nav-cats { position: static; max-height: 60vh; }
  .nav-fade { display: none; }
  .detail { grid-template-columns: 1fr; }
  .bar { gap: 12px; padding: 12px 16px; flex-wrap: wrap; }
  .subbar .bar { padding: 0 16px; overflow-x: auto; }
  .banner { padding: 24px 22px 34px; }
  .banner h2 { font-size: 24px; }
  .banner .dots { left: 22px; }
}

/* ---------- the key space viewer ---------- */

.viewer-title {
  font-family: var(--mono);
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3);
  padding-left: 16px; margin-left: 4px;
  border-left: 1px solid var(--line);
}
.bar .fill { flex: 1; }
a.head-btn { text-decoration: none; }
a.head-btn:hover { text-decoration: none; }

main.viewer { grid-template-columns: 260px 1fr; }
main.viewer nav a {
  display: grid; grid-template-columns: 18px 1fr auto 26px 26px; gap: 8px;
  align-items: center;
}
main.viewer nav a .ib {
  width: 26px; height: 26px; min-height: 0; padding: 0; margin: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; color: var(--ink-3); background: transparent;
}
main.viewer nav a .ib:hover { color: var(--flag); border-color: var(--flag); }
main.viewer nav a .ib .ico { width: 14px; height: 14px; }
main.viewer nav a .sname { font-family: var(--mono); font-size: 12.5px; }
main.viewer nav a .count {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
}
main.viewer nav a.on .count { color: var(--l1); }
main.viewer nav a.off { opacity: .45; cursor: default; }
main.viewer nav a.off:hover { background: none; }

main.viewer section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px 18px 20px;
  min-width: 0;
}
main.viewer .head { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
main.viewer h4 {
  font-family: var(--mono);
  font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3);
  margin: 20px 0 8px;
}

.filter { display: flex; gap: 8px; margin: 14px 0 10px; }
.filter input { flex: 1; font-family: var(--mono); font-size: 12.5px; }

/* the key table: monospace for anything that is a key, because a key is a
 * string of bytes and proportional type hides the difference between two of them */
table.keys { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
table.keys td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.keys tr:last-child td { border-bottom: 0; }
table.keys tr[onclick] { cursor: pointer; }
table.keys tr[onclick]:hover td { background: var(--l1-soft); }
table.keys td.k {
  font-family: var(--mono); font-size: 12px; color: var(--ink);
  width: 42%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;   /* the full name is in the title */
}
table.keys td.kind {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3); width: 92px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
table.keys td.sz {
  font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  width: 88px; text-align: right; white-space: nowrap;
}
table.keys td.v {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
  overflow-wrap: anywhere;
}

.pager { display: flex; justify-content: space-between; padding-top: 14px; }

.viewer .crumbs { margin: 12px 0 10px; }
.viewer .crumbs a { font-family: var(--mono); font-size: 12px; }
.viewer .crumbs span { color: var(--ink-3); margin: 0 2px; }

.notice {
  background: var(--l2-soft);
  border: 1px solid var(--line-3);
  color: var(--ink-2);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  font-size: 13px;
  margin: 10px 0;
}
.notice.small { font-size: 12.5px; }
.notice a { color: var(--l1); }
.notice.ok { background: var(--ok-soft); border-color: #a9d3bf; color: var(--ok); }
.notice.warn { background: var(--l2-soft); border-color: #ddb493; color: var(--l2); }

.valuebox { padding: 14px 18px 18px; }
.valuebox .meta {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px;
}
.valuebox pre {
  background: #10151c; color: #dbe3ec;
  border-radius: var(--r-sm);
  padding: 12px 14px;
  font-family: var(--mono); font-size: 12px; line-height: 1.55;
  overflow: auto; max-height: 62vh;
  white-space: pre-wrap; overflow-wrap: anywhere;
}

@media (max-width: 880px) {
  main.viewer { grid-template-columns: 1fr; }
  table.keys td.kind, table.keys td.sz { display: none; }
  table.keys td.k { width: 50%; }
}

/* Respect the reader's motion preference */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ---------- dark theme: follows the system, or the header toggle ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --ink: #e6ebf1; --ink-2: #b4bfcb; --ink-3: #8a96a3;
  --paper: #0f141b; --panel: #171e27; --line: #2a3441; --line-2: #222b36;
  --l1: #6c93ff; --l1-soft: #1c2a4d; --l2: #e0894f; --l2-soft: #33231a;
  --ok: #4cc38a; --ok-soft: #15291f; --flag: #e07a9d; --flag-soft: #3a1f2b;
  --on-ink: #0e1420; --on-l1: #0e1420;
  --ink-hover: #ffffff; --line-3: #3a4757; --surface-2: #1c2530; --disabled: #3a4552;
  color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e6ebf1; --ink-2: #b4bfcb; --ink-3: #8a96a3;
  --paper: #0f141b; --panel: #171e27; --line: #2a3441; --line-2: #222b36;
  --l1: #6c93ff; --l1-soft: #1c2a4d; --l2: #e0894f; --l2-soft: #33231a;
  --ok: #4cc38a; --ok-soft: #15291f; --flag: #e07a9d; --flag-soft: #3a1f2b;
  --on-ink: #0e1420; --on-l1: #0e1420;
  --ink-hover: #ffffff; --line-3: #3a4757; --surface-2: #1c2530; --disabled: #3a4552;
  color-scheme: dark;
}

/* ---------- skeleton loading ---------- */
@keyframes shimmer { to { background-position: -200% 0; } }
.card.skel { pointer-events: none; cursor: default; }
.skel .shot, .skel .ln {
  background: linear-gradient(90deg, var(--line-2) 25%, var(--surface-2) 50%, var(--line-2) 75%);
  background-size: 200% 100%; animation: shimmer 1.3s linear infinite;
}
.skel .ln { height: 12px; border-radius: 4px; margin-top: 10px; }
.skel .ln.s { width: 55%; }

/* ---------- empty state ---------- */
.empty .big { font-size: 34px; display: block; margin-bottom: 6px; }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.empty button { margin-top: 12px; }

/* ---------- keyboard: cards ---------- */
.card:focus-visible, .r-card:focus-visible, .rcard:focus-visible { outline: 2px solid var(--l1); outline-offset: 2px; }

/* ---------- touch targets and phones ---------- */
@media (pointer: coarse) {
  button, select, .chip, .head-btn { min-height: 40px; }
  .heart { min-width: 40px; min-height: 40px; }
}
@media (max-width: 880px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .search { order: 3; flex: 1 1 100%; }
  .toolbar { flex-wrap: wrap; gap: 10px; }
  .chips { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
  .chip { white-space: nowrap; }
}
@media (max-width: 520px) {
  body { font-size: 14px; }
  .head-btn { padding-inline: 10px; font-size: 13px; }
  .logo small { display: none; }
  .banner { padding: 18px 16px 26px; }
  .banner h2 { font-size: 20px; }
  .detail, .line { gap: 12px; }
  .foot { padding: 0 8px; }
}

/* ---------- line icons: one weight, one colour (currentColor) ---------- */
.ico { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.6;
       stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
i[data-ico] { display: inline-flex; font-style: normal; }
.heart .ico, .wish-toggle .ico { width: 15px; height: 15px; }
.heart.on .ico, .wish-toggle.on .ico { fill: currentColor; }
nav .icon { color: var(--ink-3); }
nav .icon .ico { width: 18px; height: 18px; stroke-width: 1.4; }
nav a.on .icon, nav a:hover .icon { color: var(--ink); }
.search .go .ico { width: 16px; height: 16px; }
.empty .big .ico { width: 36px; height: 36px; stroke-width: 1.2; color: var(--ink-3); }
.add-btn .ico { margin-right: 4px; }

/* counts stay neutral so the icons carry the header */
.pill, .pill.wish { background: var(--ink); color: var(--on-ink); }

/* delivery address, right of the sub-bar */
.where { display: flex; align-items: center; gap: 9px; color: var(--ink-2); padding: 6px 0; max-width: 46vw; }
.where .ico { width: 20px; height: 20px; }
.where span { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.where small { font-size: 11px; color: var(--ink-3); }
.where b { font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* key spaces: same chrome as the shop */
a.head-btn { color: var(--ink); }
.viewer-title .ico { margin-right: 4px; }
main.viewer nav a .icon .ico { width: 16px; height: 16px; }
.subbar a .ico, .head-btn .ico { margin-right: 2px; }

/* page slider above the key list */
.slider { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.slider input[type=range] { flex: 1; accent-color: var(--ink); padding: 0; border: 0; background: none; min-width: 0; }
.slider button { padding: 4px 8px; }
.slider span { font-family: var(--mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; min-width: 8.5em; text-align: right; }

.slider input[type=range] { height: 28px; }
.slider span { min-width: 12em; }

/* a node the graph names more than once: the same content at several paths */
table.keys td .refs { color: var(--ink-3); }

/* the link panel: two boxes and the completion list under the second */
.linker label { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 10px; }
.linker input {
  box-sizing: border-box; width: 100%; height: 34px; margin-top: 5px; padding: 0 10px;
  font-family: var(--mono); font-size: 12.5px;
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-sm);
}
.linker .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.linker input[readonly] { color: var(--ink-3); background: var(--surface-2); }
.lk-note { font-size: 12px; color: var(--ink-3); }
.lk-list {
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--paper); max-height: 260px; overflow: auto; margin: -4px 0 4px;
}
.lk-row {
  display: grid; grid-template-columns: 18px 1fr auto auto; gap: 10px; align-items: center;
  padding: 7px 10px; cursor: pointer; font-family: var(--mono); font-size: 12.5px;
  border-bottom: 1px solid var(--line-2);
}
.lk-row:last-child { border-bottom: 0; }
.lk-row:hover, .lk-row.on { background: var(--surface-2); }
.lk-row .id, .lk-row .taken { color: var(--ink-3); font-size: 11px; }

.filepic { display: flex; justify-content: center; padding: 8px; background: var(--surface-2); border-radius: var(--r-sm); }
.filepic img { max-width: 100%; max-height: 62vh; object-fit: contain; }

/* writing */
.editor textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; }
.editor textarea.fn-src { min-height: 42vh; }
.editor .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.editor #ek { width: 100%; margin-bottom: 8px; font-family: var(--mono); }
.upload { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
table.keys td.act { width: 92px; white-space: nowrap; text-align: right; padding-right: 8px; }
table.keys td.act .ib { width: 30px; height: 30px; min-height: 0; padding: 0; margin-left: 10px;
  display: inline-flex; align-items: center; justify-content: center; border-radius: 50%;
  color: var(--ink-2); }
table.keys td.act .ib:first-child { margin-left: 0; }
table.keys td.act .ib:hover { color: var(--ink); border-color: var(--line-3); }
table.keys td.act .ib:last-child:hover { color: var(--flag); border-color: var(--flag); }
table.keys td.act .ib.armed, table.keys td.act .ib.armed:hover { color: #fff; background: var(--flag); border-color: var(--flag); }
table.keys td.act .ico { width: 16px; height: 16px; }

/* calling a function: parameter box plus Call, output below */
.fncall { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.fncall .row { display: flex; gap: 8px; align-items: center; }
.fncall input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12.5px; }
.fncall button { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.fncall .cons-out { margin: 8px 0 0; }

.filter input + input { min-width: 0; }

/* the page slider: a thin muted track and a small quiet thumb */
.slider input[type=range] {
  -webkit-appearance: none; appearance: none;
  height: 16px; background: transparent; accent-color: var(--ink-3);
}
.slider input[type=range]::-webkit-slider-runnable-track {
  height: 3px; border-radius: 2px; background: var(--line);
}
.slider input[type=range]::-moz-range-track {
  height: 3px; border-radius: 2px; background: var(--line);
}
.slider input[type=range]::-moz-range-progress {
  height: 3px; border-radius: 2px; background: var(--line-3);
}
.slider input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 11px; height: 11px; margin-top: -4px; border-radius: 50%;
  background: var(--ink-3); border: 0;
}
.slider input[type=range]::-moz-range-thumb {
  width: 11px; height: 11px; border-radius: 50%; background: var(--ink-3); border: 0;
}
.slider input[type=range]:hover::-webkit-slider-thumb,
.slider input[type=range]:focus-visible::-webkit-slider-thumb { background: var(--ink-2); }
.slider input[type=range]:hover::-moz-range-thumb,
.slider input[type=range]:focus-visible::-moz-range-thumb { background: var(--ink-2); }
.slider input[type=range]:focus-visible { outline: 2px solid var(--line-3); outline-offset: 2px; border-radius: 4px; }
.slider button { min-height: 0; padding: 2px 6px; }

/* the global settings editor */
table.cfg td.v { overflow: visible; }
table.cfg .cv { width: 100%; font-family: var(--mono); font-size: 11.5px; padding: 4px 8px; }
table.cfg .locked { color: var(--ink-3); }
table.cfg td.act { width: 52px; }
#toast { position: fixed; right: 18px; bottom: 18px; z-index: 60; max-width: 60ch; }
#toast.ok { background: var(--ok-soft); border-color: #a9d3bf; color: var(--ok); }
#toast.warn { background: var(--l2-soft); border-color: #ddb493; color: var(--l2); }

table.cfg select.cv { width: 100%; font-family: var(--mono); font-size: 11.5px; padding: 3px 6px; }

/* the gear beside the count */
.hr { display: flex; align-items: center; gap: 8px; }
.gear { width: 26px; height: 26px; min-height: 0; padding: 0; display: inline-flex; align-items: center;
  justify-content: center; border-radius: 50%; color: var(--ink-3); background: transparent; }
.gear:hover { color: var(--ink); border-color: var(--line-3); }
.gear .ico { width: 15px; height: 15px; }

/* app settings dialog: label/value rows, same chrome as the config editor */
.appsettings { display: grid; gap: 10px; }
.appsettings .asrow { display: flex; align-items: center; gap: 10px; }
.appsettings .asrow label { flex: 1; font-size: 13px; color: var(--ink-2); }
.appsettings .asrow select { font-family: var(--mono); font-size: 12.5px; padding: 6px 10px;
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-sm); }
.appsettings .asrow select:focus { outline: none; border-color: var(--l1); box-shadow: 0 0 0 2px var(--l1-soft); }
.appsettings .ashint { font-size: 12px; color: var(--ink-3); }
.appsettings .asval { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
.appsettings .asrow button { padding: 6px 10px; font-size: 12.5px; }

/* `hidden` has to win over the display these rules set (.subbar a, .slider) */
[hidden] { display: none !important; }

/* server config editor: one height for every field and button, all on the row's centre line */
table.cfg td { vertical-align: middle; }
table.cfg td.k { padding-top: 6px; padding-bottom: 6px; }
table.cfg .cv, table.cfg select.cv {
  box-sizing: border-box; height: 30px; min-height: 30px; margin: 0;
  padding: 0 10px; line-height: 28px; font-size: 12px; border-radius: var(--r-sm);
  background: var(--paper); color: var(--ink); border: 1px solid var(--line);
}
table.cfg select.cv { padding-right: 28px; cursor: pointer; }
table.cfg .cv:hover { border-color: var(--line-3); }
table.cfg .cv:focus { outline: none; border-color: var(--l1); box-shadow: 0 0 0 2px var(--l1-soft); }
table.cfg td.v > span { display: inline-block; line-height: 30px; padding: 0 11px; }
table.cfg td.act .ib { width: 30px; height: 30px; }

/* RESP console */
.panel .top h2 .ico { vertical-align: -.15em; margin-right: 4px; }
.console .cl { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); }
.console select, .console .cons-run input {
  box-sizing: border-box; height: 34px; font-family: var(--mono); font-size: 12.5px;
  background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-sm);
}
.console select { flex: 1; padding: 0 10px; }
.cons-hint { margin: 10px 0; padding: 10px 12px; border-left: 3px solid var(--line-3);
  background: var(--surface-2); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.cons-hint .syn { font-family: var(--mono); font-size: 12.5px; color: var(--ink); word-break: break-word; }
.cons-hint .sum { margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }
.cons-hint .ex { margin-top: 6px; font-size: 12px; color: var(--ink-3); }
.cons-hint .ex a { font-family: var(--mono); }
.cons-hint .warn, .cons-hint .wr { margin-left: 8px; font-size: 11px; padding: 1px 7px; border-radius: 999px; }
.cons-hint .warn { color: var(--flag); background: var(--flag-soft); }
.cons-hint .wr { color: var(--l2); background: var(--l2-soft); }
.cons-run { display: flex; gap: 8px; }
.cons-run input { flex: 1; min-width: 0; padding: 0 10px; }
.cons-run input:focus, .console select:focus { outline: none; border-color: var(--l1); box-shadow: 0 0 0 2px var(--l1-soft); }
.cons-run button { height: 34px; min-height: 0; display: inline-flex; align-items: center; gap: 6px; }
.cons-out { margin: 12px 0 0; min-height: 70px; max-height: 44vh; }
.cons-out .dim { color: var(--ink-3); }
.cons-out .rerr { color: var(--flag); }
.cons-hist { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.cons-hist .hh { width: 100%; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.cons-hist a { font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border: 1px solid var(--line);
  border-radius: 999px; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cons-hist a .sp { color: var(--ink-3); }

/* ---------- the Luau editor ----------
 * The textarea sits on top with transparent text, so the caret, selection and
 * undo stay the browser's own; the highlighted copy is drawn underneath and
 * moved with the textarea's scroll. Both must share every metric that moves a
 * glyph - font, size, line height, padding, tab size - or the caret drifts off
 * the letters. Dark in both themes, like every other code block on the page. */
.panel:has(.code) { max-width: 1120px; }
.code {
  --lh: 19px; --pad: 10px; --tab: 4;
  --c-bg: #10151c; --c-ink: #dbe3ec; --c-dim: #5d6b7b; --c-line: #1a212b;
  --c-kw: #c792ea; --c-str: #a5d68a; --c-num: #f3a86b; --c-com: #6f7d8c;
  --c-api: #7fb0ff; --c-lib: #6fd3e0; --c-fn: #e8c268; --c-op: #97a6b6; --c-self: #f07f9e;
  position: relative; display: grid; grid-template-columns: auto 1fr;
  height: 48vh; min-height: 180px; resize: vertical; overflow: hidden;
  background: var(--c-bg); color: var(--c-ink);
  border: 1px solid var(--line); border-radius: var(--r-sm);
  font-family: var(--mono); font-size: 12.5px; line-height: var(--lh);
}
.code:focus-within { border-color: var(--l1); box-shadow: 0 0 0 1px var(--l1); }
.code-gutter {
  position: relative; overflow: hidden; user-select: none; text-align: right;
  color: var(--c-dim); background: #0c1016; border-right: 1px solid #1e2631;
}
.code-gutter .gl { position: absolute; left: 0; right: 0; top: var(--pad); }
.code-gutter .gl div { height: var(--lh); padding: 0 10px 0 14px; cursor: pointer; }
.code-gutter .gl div.cur { color: var(--c-ink); }
.code-gutter .gl div.bad { color: #fff; background: #8a2338; }
.code-main { position: relative; overflow: hidden; min-width: 0; }
.code-marks { position: absolute; inset: 0; pointer-events: none; }
.code-marks div { position: absolute; left: 0; right: 0; height: var(--lh); }
.code-marks .cur { background: var(--c-line); }
.code-marks .bad { background: rgba(224, 70, 100, .16); border-bottom: 1px dashed #e0466a; }
.valuebox .code pre.code-hl, .code-hl {
  position: absolute; top: 0; left: 0; margin: 0; border: 0; border-radius: 0;
  padding: var(--pad) 14px; background: transparent; color: var(--c-ink);
  font: inherit; line-height: var(--lh); tab-size: var(--tab);
  white-space: pre; overflow: visible; max-height: none; overflow-wrap: normal;
  pointer-events: none; will-change: transform;
}
.editor .code textarea, .code textarea {
  position: relative; display: block; width: 100%; height: 100%; min-height: 0;
  margin: 0; border: 0; border-radius: 0; outline: none; resize: none;
  padding: var(--pad) 14px; background: transparent;
  color: transparent; caret-color: #f5f7fa; -webkit-text-fill-color: transparent;
  font: inherit; line-height: var(--lh); tab-size: var(--tab);
  white-space: pre; overflow: auto;
}
.code textarea:focus { outline: none; border: 0; }
.code textarea::selection { background: rgba(108, 147, 255, .35); }
.code textarea::placeholder { color: var(--c-dim); -webkit-text-fill-color: var(--c-dim); }
.code textarea[disabled] { cursor: default; }
.code-hl .kw, .code-ro .kw { color: var(--c-kw); }
.code-hl .str, .code-ro .str { color: var(--c-str); }
.code-hl .num, .code-ro .num { color: var(--c-num); }
.code-hl .com, .code-ro .com { color: var(--c-com); font-style: italic; }
.code-hl .hot, .code-ro .hot { color: var(--c-kw); }
.code-hl .api, .code-ro .api { color: var(--c-api); }
.code-hl .lib, .code-ro .lib { color: var(--c-lib); }
.code-hl .fn, .code-ro .fn { color: var(--c-fn); }
.code-hl .op, .code-ro .op { color: var(--c-op); }
.code-hl .self, .code-ro .self { color: var(--c-self); }
.code-ro { --c-kw: #c792ea; --c-str: #a5d68a; --c-num: #f3a86b; --c-com: #6f7d8c; --c-api: #7fb0ff;
  --c-lib: #6fd3e0; --c-fn: #e8c268; --c-op: #97a6b6; --c-self: #f07f9e; }
.valuebox pre.code-ro { white-space: pre; overflow-wrap: normal; }

/* under the editor: where the caret is, what the name there is, saved or not */
.code-status {
  display: flex; gap: 14px; align-items: baseline; margin-top: 6px; min-height: 18px;
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
}
.code-status .pos { white-space: nowrap; }
.code-status .hint { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.code-status .hint b { color: var(--l1); font-weight: 600; }
.code-status .hint.bad { color: var(--flag); }
.code-status .mod { white-space: nowrap; color: var(--l2); }
.code-status .keys { white-space: nowrap; }
.code-status kbd { font: inherit; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; }

/* completion list, placed at the caret */
.code-ac {
  position: absolute; z-index: 5; min-width: 240px; max-width: min(560px, 90%);
  background: #182029; color: var(--c-ink); border: 1px solid #2d3a49; border-radius: 6px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .45); font-size: 12px; overflow: hidden;
}
.code-ac .list { max-height: calc(var(--lh) * 9); overflow-y: auto; }
.code-ac .it { display: flex; gap: 8px; align-items: baseline; padding: 0 10px; line-height: var(--lh); cursor: pointer; white-space: nowrap; }
.code-ac .it.on { background: #27405f; }
.code-ac .it .k { width: 14px; flex: none; text-align: center; font-size: 10.5px; color: var(--c-dim); }
.code-ac .it .k.fn { color: var(--c-fn); } .code-ac .it .k.mod { color: var(--c-api); }
.code-ac .it .k.val { color: var(--c-lib); } .code-ac .it .k.kw { color: var(--c-kw); }
.code-ac .it .n b { color: #fff; }
.code-ac .it .s { color: var(--c-dim); overflow: hidden; text-overflow: ellipsis; }
.code-ac .doc { padding: 6px 10px; border-top: 1px solid #2d3a49; color: #aab6c3; white-space: normal; line-height: 1.45; }
.code-ac .doc code { color: var(--c-api); font: inherit; }
.editor button.warn { color: var(--flag); border-color: var(--flag); }
.editor label.aot { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.editor label.aot input { margin: 0; accent-color: var(--l1); }
/* the function's own settings, beside the editor behind the gear next to Save */
.editor .fn-body { display: flex; gap: 12px; align-items: flex-start; }
.editor .fn-code { flex: 1; min-width: 0; }
.editor .fn-side { flex: none; width: 230px; box-sizing: border-box; padding: 10px 12px; font-size: 13px;
  border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
.editor .fn-side h5 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.editor .fn-side label.lim { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--ink-2); white-space: nowrap; }
.editor .fn-side label.lim input { width: 0; flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; padding: 3px 6px; }
.editor .fn-side .sub { font-size: 11.5px; line-height: 1.4; color: var(--ink-3); }
.editor .fn-side .sub.bad { color: var(--flag); }
.editor .fn-side code { font-family: var(--mono); font-size: 11px; }
.editor .gear#fn-gear { position: relative; }
.editor .gear#fn-gear[aria-expanded="true"] { color: var(--l1); border-color: var(--l1); }
.editor .gear#fn-gear.set::after { content: ""; position: absolute; top: 2px; right: 2px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--l1); }
@media (max-width: 760px) {
  .editor .fn-body { flex-direction: column; align-items: stretch; }
  .editor .fn-side { width: auto; }
}
table.keys td.kind .native { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--l1); }
.editor button.primary.warn { color: #fff; background: var(--flag); }
.cons-out a.errline { color: inherit; text-decoration: underline dotted; cursor: pointer; }

</style>
</head>

<header>

    <span class="head-user" id="head-user" hidden style="font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw"></span>
    <button class="head-btn" id="settings-btn" aria-label="App settings" title="App settings"><i data-ico="gear"></i></button>

</header>
<div class="subbar">

</div>

</main>

<script>
// theme: saved choice wins, otherwise the system setting (handled in CSS)
(function () {
  const root = document.documentElement;
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
  applyTabWidth();
  document.addEventListener("DOMContentLoaded", () => {
    const b = document.getElementById("theme-btn");
    if (b) b.onclick = () => {
      const dark = root.dataset.theme ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    };
    const s = document.getElementById("settings-btn");
    if (s) s.onclick = openAppSettings;
  });
})();

// ---- app settings ---------------------------------------------------------
//
// Per-browser viewer preferences in localStorage (no server round trip, so
// they work signed out and differ per machine):
//   tabWidth: how wide a tab renders AND how many spaces Tab inserts in the
//     function editor (2, 4 or 8; default 4)
//   saveBeforeCall: "1" to SETF the editor body before CALLF when Call is
//     pressed (default), "0" to call the stored copy as-is
//   editorHeight: the function editor's height in px, set by dragging its
//     corner; unset means the default (48% of the window)
function appSetting(key, dflt) {
  try {
    const v = localStorage.getItem("appsettings:" + key);
    return v == null ? dflt : v;
  } catch (e) { return dflt; }
}

function setAppSetting(key, value) {
  try { localStorage.setItem("appsettings:" + key, value); } catch (e) {}
}

function tabWidth() {
  const n = parseInt(appSetting("tabWidth", "4"), 10);
  return [2, 4, 8].includes(n) ? n : 4;
}

// tab rendering follows the setting live: the editor textarea gets
// tab-size, and Tab inserts that many spaces (real tabs would render at
// the browser default of 8 whatever we set here)
function applyTabWidth() {
  const ta = document.getElementById("ev");
  if (ta) ta.style.tabSize = String(tabWidth());
  document.querySelectorAll(".code").forEach(b => b.style.setProperty("--tab", String(tabWidth())));
}

function openAppSettings() {
  const w = tabWidth();
  const save = saveBeforeCall();
  show(`<div class="top"><h2>${ico("gear")} App settings</h2><button onclick="shut()">Close</button></div>
    <div class="valuebox"><div class="appsettings">
      <div class="asrow">
        <label for="as-tabwidth">Tab width</label>
        <select id="as-tabwidth" onchange="setTabWidth(this.value)">
          ${[2, 4, 8].map(n => `<option value="${n}"${n === w ? " selected" : ""}>${n}</option>`).join("")}
        </select>
      </div>
      <div class="asrow">
        <label for="as-savecall">Save before Call</label>
        <select id="as-savecall" onchange="setSaveBeforeCall(this.value)">
          <option value="1"${save ? " selected" : ""}>On</option>
          <option value="0"${save ? "" : " selected"}>Off</option>
        </select>
      </div>
      <div class="asrow">
        <label>Editor height</label>
        <span class="asval" id="as-edheight">${editorHeight() ? editorHeight() + " px" : "default"}</span>
        <button onclick="resetEditorHeight()"${editorHeight() ? "" : " disabled"}>Reset</button>
      </div>
      <div class="ashint">Tab width applies to the function editor: how wide tabs render, how many spaces the Tab key inserts, and how far Enter indents after a line that opens a block. Save before Call SETFs the editor body first when Call is pressed, so the call runs what you see. Editor height is kept when you drag the editor's bottom-right corner. Stored in this browser only.</div>
    </div></div>`);
}

// the function editor's height, as the user last dragged it: px, or 0 for
// the default. Clamped on the way in so a height saved on a big screen
// still fits a small one.
function editorHeight() {
  const n = parseInt(appSetting("editorHeight", ""), 10);
  return Number.isFinite(n) && n >= 120 ? n : 0;
}

function editorHeightStyle() {
  const h = editorHeight();
  return h ? `height:min(${h}px, calc(100vh - 160px))` : "";
}

function resetEditorHeight() {
  try { localStorage.removeItem("appsettings:editorHeight"); } catch (e) {}
  document.querySelectorAll(".code").forEach(b => { b.style.height = ""; });
  const v = document.getElementById("as-edheight");
  if (v) { v.textContent = "default"; v.nextElementSibling.disabled = true; }
  toast("Editor height = default");
}

function setTabWidth(value) {
  const n = parseInt(value, 10);
  if (![2, 4, 8].includes(n)) return;
  setAppSetting("tabWidth", String(n));
  applyTabWidth();
  toast("Tab width = " + n);
}

function saveBeforeCall() {
  return appSetting("saveBeforeCall", "1") !== "0";
}

function setSaveBeforeCall(value) {
  setAppSetting("saveBeforeCall", value === "0" ? "0" : "1");
  toast("Save before Call = " + (saveBeforeCall() ? "on" : "off"));
}
</script>
<script>
// ---- the Luau editor --------------------------------------------------------
//
// The function body is still the <textarea id="ev"> that Save and Call read, so
// the caret, selection, undo and IME stay the browser's own. Its text is made
// transparent and a highlighted copy is drawn underneath, with a line number
// gutter beside it and a status line below. Edits made from here (Tab, Enter,
// completion) go through insertText so Ctrl+Z undoes them like typing.
//
// Completion is a list of what luau_driver.cpp puts in reach of a stored
// function (open_safe and state_for): the barch table, simdjson, http, mail,
// resp, sql, nk, the Luau libraries, and req/res in an HTTP handler. It follows
// a chain as far as it knows the types - barch.current():get, a local assigned
// from barch.space.x, http.request(u):timeout(5):get() - and gives up quietly
// past that. It is a list, not a type checker.

const LUAU_KW = new Set(("and break continue do else elseif end false for function if in " +
  "local nil not or repeat return then true until while").split(" "));

// entries: fn = called with a dot, m = a method (colon), v = a value, t = a table
// of more names. `ret` is the type a call gives back, `type` what indexing gives.
const LUAU_TYPES = (() => {
  const fn = (sig, doc, ret) => ({ kind: "fn", sig, doc, ret });
  const m = (sig, doc, ret) => ({ kind: "fn", sig, doc, ret, method: true });
  const v = (sig, doc, type) => ({ kind: "val", sig, doc, type });
  const t = (sig, doc, type) => ({ kind: "mod", sig, doc, type });
  const lib = (name, names, doc) => {
    const out = {};
    for (const n of names.split(" ")) out[n] = fn(`${name}.${n}(…)`, doc);
    return out;
  };
  const T = {};
  T.barch = { members: {
    call: fn("barch.call(cmd, …)", "Runs a command in this function's space with the caller's rights and returns the reply. Integer replies arrive as the <code>integer</code> type: use <code>integer.tonumber</code>, not tonumber."),
    queue: fn("barch.queue(name, message)", "Publishes to a queue and returns the sequence number. Raises on failure. Refused inside <code>barch.store.locked</code>."),
    config: fn("barch.config()", "This space's own settings, as a table."),
    tomb: v("barch.tomb", "A cached source miss. It isn't nil, so compare with <code>v == barch.tomb</code>."),
    store: t("barch.store", "Point reads and writes of the space the call is running in.", "store"),
    space: t("barch.space[name]", "A key space as a value: <code>sp[k]</code> reads, <code>sp[k] = v</code> writes, <code>for row in sp</code> walks it. An unknown name is refused.", "spaces"),
    current: fn("barch.current()", "The space this call runs against, as a space handle.", "space"),
    running: fn("barch.running()", "The name of the running space, or an empty string for the default one."),
    art: fn("barch.art()", "A private, unsaved one-shard space for a working set, with min/max/range/popmin/popmax.", "space"),
    auth: fn("barch.auth(user, secret)", "true when that user and secret would pass AUTH."),
    user: fn("barch.user()", "The user this call runs as."),
    fs: t("barch.fs", "The space's file store, addressed by path.", "fs"),
    graph: t("barch.graph", "The space's GRAPH store, addressed by path.", "graph"),
  } };
  T.spaces = { members: {}, any: "space",
    dyn: () => (typeof spaces !== "undefined" && Array.isArray(spaces) ? spaces : [])
      .filter(s => s && s.name && /^[A-Za-z_]\w*$/.test(s.name))
      .map(s => [s.name, t(`barch.space.${s.name}`, "The " + s.name + " key space, as a handle.", "space")]) };
  T.store = { members: {
    get: fn("barch.store.get(k)", "The value, nil when nothing is there, or <code>barch.tomb</code>. Reads the cache and never fetches."),
    fetch: fn("barch.store.fetch(k)", "Like get, but fills from the space's foreign source on a miss. Returns the value, or nil and the reason."),
    set: fn("barch.store.set(k, v)", "Writes a key. <code>set(k, nil)</code> removes it."),
    remove: fn("barch.store.remove(k)", "Removes a key."),
    exists: fn("barch.store.exists(k)", "Whether the key is there."),
    count: fn("barch.store.count()", "How many keys the space holds."),
    getJson: fn("barch.store.getJson(k)", "The value parsed as JSON. nil when missing, or nil and the parser's reason when it isn't JSON."),
    setJson: fn("barch.store.setJson(k, t)", "Stores t as JSON. Raises when it can't be encoded. <code>setJson(k, nil)</code> removes."),
    parseJson: fn("barch.store.parseJson(k, name, …)", "Only the named top-level fields, one value per name. Cheaper than getJson on a big document."),
    range: fn("barch.store.range(lo, hi, n [, offset])", "Keys in [lo, hi), at most n (capped at 10000), after skipping offset. This is how a script pages."),
    min: fn("barch.store.min()", "The lowest key in the space."),
    max: fn("barch.store.max()", "The highest key in the space."),
    locked: fn("barch.store.locked(k, fn)", "Runs fn with k's shard write-locked, or every shard when k is nil. No barch.call, sql or mail inside, and no nesting."),
    shardNumber: fn("barch.store.shardNumber(k)", "Which shard k routes to. Two keys with the same number can be locked together."),
    hasLock: fn("barch.store.hasLock(k)", "Whether this call already holds k's shard."),
    getBufferAt: fn("barch.store.getBufferAt(k, offset, len)", "Bytes of a value, as a buffer."),
    setBufferAt: fn("barch.store.setBufferAt(k, offset, buf)", "Writes bytes into a value at offset."),
    getInt32At: fn("barch.store.getInt32At(k, offset)", "A 32 bit integer read out of a value."),

// ---- lexing and painting ----

// [kind, start, end] triples. Long strings and comments ([[ ]], [==[ ]==])
// run across lines, which is why the whole body is lexed on every change.
function luauLex(src) {
  const out = [], n = src.length;
  const longOpen = p => {
    if (src[p] !== "[") return -1;
    let q = p + 1;
    while (src[q] === "=") q++;
    return src[q] === "[" ? q - p - 1 : -1;
  };
  const longClose = (p, lvl) => {
    const e = src.indexOf("]" + "=".repeat(lvl) + "]", p);
    return e < 0 ? n : e + lvl + 2;
  };
  let i = 0;
  while (i < n) {
    const c = src[i];
    if (c === " " || c === "\t" || c === "\n" || c === "\r") {
      let j = i + 1;
      while (j < n && (src[j] === " " || src[j] === "\t" || src[j] === "\n" || src[j] === "\r")) j++;
      out.push(["ws", i, j]); i = j; continue;
    }
    if (c === "-" && src[i + 1] === "-") {
      const lvl = longOpen(i + 2);
      let j;
      if (lvl >= 0) j = longClose(i + lvl + 4, lvl);
      else { j = src.indexOf("\n", i); if (j < 0) j = n; }
      out.push([lvl < 0 && src[i + 2] === "!" ? "hot" : "com", i, j]); i = j; continue;
    }
    if (c === "[") {
      const lvl = longOpen(i);
      if (lvl >= 0) { const j = longClose(i + lvl + 2, lvl); out.push(["str", i, j]); i = j; continue; }
    }
    if (c === '"' || c === "'" || c === "`") {
      let j = i + 1;
      while (j < n && src[j] !== c && src[j] !== "\n") j += src[j] === "\\" ? 2 : 1;
      if (src[j] === c) j++;
      out.push(["str", i, Math.min(j, n)]); i = Math.min(j, n); continue;
    }
    const d = c.charCodeAt(0);
    if ((d >= 48 && d <= 57) || (c === "." && /\d/.test(src[i + 1] || ""))) {
      const mt = /^(?:0[xX][\da-fA-F_]+|0[bB][01_]+|(?:\d[\d_]*\.?[\d_]*|\.\d[\d_]*)(?:[eE][+-]?\d+)?)/.exec(src.slice(i, i + 64));
      const j = i + (mt ? mt[0].length : 1);
      out.push(["num", i, j]); i = j; continue;
    }
    if (c === "_" || (d >= 65 && d <= 90) || (d >= 97 && d <= 122)) {
      let j = i + 1;
      while (j < n && /\w/.test(src[j])) j++;
      out.push([LUAU_KW.has(src.slice(i, j)) ? "kw" : "id", i, j]); i = j; continue;
    }
    // `..` and `...` stay one token so a member dot is never confused with them
    if (c === "." && src[i + 1] === ".") {
      const j = src[i + 2] === "." ? i + 3 : i + 2;
      out.push(["op", i, j]); i = j; continue;
    }
    out.push(["op", i, i + 1]); i++;
  }
  return out;
}

const luauEsc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// the entry a name has in a type, dynamic members (the space list) included
function luauMember(type, name) {
  if (!type) return null;
  if (Object.prototype.hasOwnProperty.call(type.members, name)) return type.members[name];
  if (type.dyn) { const hit = type.dyn().find(([n]) => n === name); if (hit) return hit[1]; }
  if (type.any) return { kind: "mod", sig: name, doc: "", type: type.any };
  return null;
}

// Colour: keywords, strings, numbers, comments, operators; a name the barch
// API knows (followed through dots, colons and calls) in the API colour; a
// library in its own; a function name where it is defined or called.
function luauHighlight(src, locals) {
  const toks = luauLex(src);
  let html = "", ctx = null, prev = null, pending = null;
  const stack = [];                          // what the call being closed gives back
  for (let k = 0; k < toks.length; k++) {
    const [kind, s, e] = toks[k];
    const text = src.slice(s, e);
    if (kind === "ws") { html += text; continue; }
    let cls = kind;
    if (kind === "id") {
      const after = prev && prev[0] === "op" && (prev[3] === "." || prev[3] === ":");
      let entry = null;
      if (after) entry = luauMember(ctx, text);
      else if (!(prev && prev[3] === "local")) {
        entry = LUAU_TYPES._G.members[text] || null;
        if (entry && entry.hook) entry = null;
        if (!entry && locals && locals[text]) entry = { kind: "val", type: locals[text] };
      }
      let next = k + 1;
      while (next < toks.length && toks[next][0] === "ws") next++;
      const nextText = next < toks.length ? src.slice(toks[next][1], toks[next][2]) : "";
      if (text === "self") cls = "self";
      else if (entry && entry.lib && !after) cls = "lib";
      else if (entry && (entry.sig || after)) cls = "api";
      else if (prev && prev[3] === "function") cls = "fn";
      else if (nextText === "(" || nextText === "{" || (nextText && nextText[0] === '"')) cls = "fn";
      else cls = "";
      ctx = entry ? (entry.type ? LUAU_TYPES[entry.type] : null) : null;
      pending = entry && entry.ret ? LUAU_TYPES[entry.ret] : null;
    } else if (kind === "op") {
      if (text === "(") { stack.push(pending); ctx = null; }
      else if (text === ")") { ctx = stack.pop() || null; }
      else if (text === "." || text === ":") { /* keep ctx for the member */ }
      else if (text === "[") { stack.push(ctx && ctx.any ? LUAU_TYPES[ctx.any] : null); ctx = null; }
      else if (text === "]") { ctx = stack.pop() || null; }
      else ctx = null;
      if (text !== "(") pending = null;
    } else { ctx = null; pending = null; }
    prev = [kind, s, e, text];
    html += cls ? `<span class="${cls}">${luauEsc(text)}</span>` : luauEsc(text);
  }
  return html;
}

// `local x = barch.space.users` and friends: which locals hold something the
// completion knows the members of. req/res are the HTTP handler's arguments.
function luauLocals(src) {
  const out = { req: "request", res: "response" };
  const re = /\blocal\s+([A-Za-z_]\w*)\s*=\s*([^\n;]+)/g;
  let mt;
  while ((mt = re.exec(src))) {
    const ty = luauTypeOf(luauChain(mt[2].trim(), true), out);
    if (ty) out[mt[1]] = ty.name;
  }
  const fr = /\bfor\s+([A-Za-z_]\w*)\s+in\s+([^\n]+?)\s+do\b/g;
  while ((mt = fr.exec(src))) {
    const ty = luauTypeOf(luauChain(mt[2].trim(), true), out);
    if (ty && ty.name === "space") out[mt[1]] = "row";
  }
  return out;
}
for (const [k, v] of Object.entries(LUAU_TYPES)) v.name = k;

// A chain of names, dots, colons, calls and indexes, as segments. Read from
// the end of `text` (what is before the caret), or from its start (`fromStart`,
// for the right-hand side of an assignment).
function luauChain(text, fromStart) {
  if (fromStart) {
    const mt = /^[A-Za-z_]\w*(?:\s*(?:[.:]\s*[A-Za-z_]\w*|\((?:[^()]|\([^()]*\))*\)|\[[^\]]*\]|"[^"]*"|\{[^}]*\}))*/.exec(text);
    return mt ? luauChain(mt[0], false) : null;
  }
  const segs = [];
  let i = text.length;
  const skipWs = () => { while (i > 0 && /\s/.test(text[i - 1])) i--; };
  const matchBack = (open, close) => {
    let depth = 0;
    while (i > 0) {
      const c = text[--i];
      if (c === close) depth++;
      else if (c === open && --depth === 0) return true;
    }
    return false;
  };
  for (;;) {
    skipWs();
    if (i === 0) break;
    const c = text[i - 1];
    if (c === ")") { if (!matchBack("(", ")")) return null; segs.unshift({ call: true }); continue; }
    if (c === "]") { if (!matchBack("[", "]")) return null; segs.unshift({ index: true }); continue; }
    if (c === '"' && segs.length) {            // f"x" / f{…} call sugar: treat as a call
      const q = text.lastIndexOf('"', i - 2);
      if (q < 0) return null;
      i = q; segs.unshift({ call: true }); continue;
    }
    const mt = /[A-Za-z_]\w*$/.exec(text.slice(0, i));
    if (!mt) break;
    i -= mt[0].length;
    segs.unshift({ name: mt[0] });
    skipWs();
    if (i > 0 && (text[i - 1] === "." || text[i - 1] === ":") && text[i - 2] !== ".") { i--; continue; }
    break;
  }
  if (!segs.length || !segs[0].name) return null;
  if (LUAU_KW.has(segs[0].name)) return null;
  return segs;
}

// the type a chain ends on, or null past the first name it doesn't know
function luauTypeOf(segs, locals) {
  if (!segs) return null;
  let entry = null, type = null;
  for (let k = 0; k < segs.length; k++) {
    const sg = segs[k];
    if (k === 0) {
      entry = LUAU_TYPES._G.members[sg.name];
      if (entry && entry.hook) entry = null;
      if (!entry && locals && locals[sg.name]) entry = { kind: "val", type: locals[sg.name] };
      if (!entry) return null;
      type = entry.type ? LUAU_TYPES[entry.type] : null;
    } else if (sg.name) {
      entry = luauMember(type, sg.name);
      if (!entry) return null;
      type = entry.type ? LUAU_TYPES[entry.type] : null;
    } else if (sg.call) {
      type = entry && entry.ret ? LUAU_TYPES[entry.ret] : null;
      entry = null;
    } else if (sg.index) {
      type = type && type.any ? LUAU_TYPES[type.any] : null;
      entry = null;
    }
  }
  return type;
}

// the entry a chain names (its last segment), for the status line hint
function luauEntryOf(segs, locals) {
  if (!segs || !segs.length || !segs[segs.length - 1].name) return null;
  if (segs.length === 1) {
    const e = LUAU_TYPES._G.members[segs[0].name];
    return e && !e.hook ? e : null;
  }
  return luauMember(luauTypeOf(segs.slice(0, -1), locals), segs[segs.length - 1].name);
}

// ---- the editor itself ----

// "space/NAME" -> {start, end, top, base, text}: where the caret was, and any
// edits not yet saved over the source they started from. Closing the dialog
// (Esc, the backdrop, Close) keeps them for this page's life, so there is
// no "discard changes?" to answer; reopening puts them back.
const codeViews = new Map();

// The markup for the editor. `id` stays "ev" for the function body because
// saveFunction/callFunction/applyTabWidth read it by that id.
function codeEditor(source, attrs) {
  return `<div class="code" style="--tab:${tabWidth()};${editorHeightStyle()}">
    <div class="code-gutter" aria-hidden="true"><div class="gl"></div></div>
    <div class="code-main">
      <div class="code-marks"><div class="cur"></div><div class="bad" hidden></div></div>
      <pre class="code-hl" aria-hidden="true"></pre>
      <textarea id="ev" class="fn-src" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" ${attrs || ""}>${esc(source ?? "")}</textarea>
    </div>
    <div class="code-ac" hidden><div class="list" role="listbox"></div><div class="doc"></div></div>
  </div>
  <div class="code-status">
    <span class="pos">Ln 1, Col 1</span><span class="hint"></span><span class="mod"></span>
    <span class="keys"><kbd>Ctrl</kbd>+<kbd>S</kbd> save · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> call · <kbd>Ctrl</kbd>+<kbd>Space</kbd> complete</span>
  </div>`;
}

function codeParts(ta) {
  const box = ta.closest(".code");
  return {
    box, hl: box.querySelector(".code-hl"), gl: box.querySelector(".gl"),
    cur: box.querySelector(".code-marks .cur"), err: box.querySelector(".code-marks .bad"),
    ac: box.querySelector(".code-ac"), status: box.nextElementSibling,
  };
}

// wire an editor rendered by codeEditor(); `name` keys the remembered caret
function codeAttach(ta, name) {
  if (!ta || ta._code) return;
  const P = codeParts(ta);
  ta._code = { P, name, saved: ta.value, errLine: 0, errMsg: "", lines: 0, raf: 0, ac: null, dedent: null, locals: {} };
  const paint = () => {
    ta._code.raf = 0;
    ta._code.locals = luauLocals(ta.value);
    P.hl.innerHTML = luauHighlight(ta.value, ta._code.locals) + "\n ";
    codeGutter(ta);
    codeScroll(ta);
    codeStatus(ta);
  };
  // at once while typing, so the colours never trail the caret (a 1300 line
  // body is a few ms); only a very large one waits for the next frame
  ta._code.paint = () => {
    if (ta.value.length < 200000) { cancelAnimationFrame(ta._code.raf); paint(); }
    else if (!ta._code.raf) ta._code.raf = requestAnimationFrame(paint);
  };
  paint();
